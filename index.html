<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>練習小站</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2328;--muted:#6a6f76;--line:#e4e0d6;--au:#c2410c;--hw:#1d4ed8;--sh:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1f2226;--ink:#eceae5;--muted:#9aa0a6;--line:#30343a;--au:#fb923c;--hw:#60a5fa;--sh:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:880px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:28px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px}
.kids{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.kid{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:16px;font-size:22px;font-weight:700;cursor:pointer;color:var(--ink)}
.kid[aria-pressed=true]{border-color:var(--c);color:var(--c)}
section{margin-bottom:22px}
h2{font-size:19px;margin:0 0 10px;color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
a.card{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:12px 14px}
a.card:active{transform:scale(.98)}
.t{font-weight:700}.m{color:var(--muted);font-size:14px}
.new{display:inline-block;font-size:12px;background:var(--c);color:var(--card);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.shared a.card{--c:var(--sh)}
.dept{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 4px;margin-bottom:18px}
.dept>h2{font-size:21px;color:var(--ink);margin:0 0 10px}
.term{font-size:16px;font-weight:700;color:var(--c);margin:4px 0 8px}
details.old{margin:10px 0 12px}
details.old>summary{cursor:pointer;color:var(--muted);font-size:15px;padding:6px 0;list-style:none}
details.old>summary::-webkit-details-marker{display:none}
details.old>summary::before{content:"▸ ";}details.old[open]>summary::before{content:"▾ ";}
details.old .term{color:var(--muted)}
.pcard{background:var(--card);border:2px solid var(--c);border-radius:16px;padding:14px;margin-bottom:18px}
.pcard .top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.pcard .big{font-size:28px;font-weight:800;color:var(--c)}
.pcard .sm{color:var(--muted);font-size:14px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bd{font-size:13px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);opacity:.35;filter:grayscale(1)}
.bd.on{opacity:1;filter:none;border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.dexbox summary{cursor:pointer;font-weight:700}.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}.dx{text-align:center;border:1px solid var(--line);border-radius:12px;padding:6px 4px;opacity:.55}.dx.on{opacity:1;background:var(--card)}.dxp{width:64px;height:64px;margin:0 auto}.dxn{font-size:13px;font-weight:700}.dxr{font-size:11px;color:var(--muted)}
.dx.on{cursor:pointer}.dx.on:active{transform:scale(.96)}.dx.myth{border-color:#db2777}
.goal{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}.goal .bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}.goal .bar i{display:block;height:100%;background:var(--c)}.goal.done{font-weight:700}
.dxh{font-size:15px;font-weight:800;margin:14px 0 2px}
.hm-mask{position:fixed;inset:0;z-index:9500;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:14px}
.hm-card{background:var(--card);color:var(--ink);border-radius:20px;padding:16px;max-width:420px;width:100%;max-height:90vh;overflow:auto;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.hm-card h3{margin:0 0 2px;font-size:21px}.hm-card button{font:inherit;min-height:48px;border-radius:12px;border:0;padding:10px 18px;margin:6px 4px;cursor:pointer;background:var(--c,#c2410c);color:#fff;font-weight:700}
.evo{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:2px;margin:10px 0}.evo .st{border:1px solid var(--line);border-radius:12px;padding:4px}.evo .st.lock{opacity:.45}.evo .ar{font-size:18px;color:var(--muted)}
.evo .pic,.forms .pic{width:100%;aspect-ratio:1}.evo .lb,.forms .lb{font-size:12px;color:var(--muted)}
.forms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}.forms>div{border:1px solid var(--line);border-radius:12px;padding:4px}.forms .lock{opacity:.45}
.gacha .machine{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:8px 0}.gacha .ball{font-size:54px;line-height:1}
.rw-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}.rw-it{border:2px solid var(--line,#e5e0d8);border-radius:14px;padding:10px;text-align:center;background:#fff}.rw-it .em{font-size:36px;line-height:1.2}.rw-it .nm{font-weight:700;margin:4px 0}.rw-it button{font:inherit;font-weight:800;min-height:44px;width:100%;border:0;border-radius:12px;background:var(--c);color:#fff;cursor:pointer}.rw-it button[disabled]{opacity:.4;cursor:default}.rw-log{width:100%;border-collapse:collapse;font-size:14px}.rw-log td{border-top:1px solid var(--line,#e5e0d8);padding:6px 4px}.rw-in{font:inherit;font-size:20px;padding:8px 10px;border:2px solid var(--line,#ccc);border-radius:10px;width:100%;box-sizing:border-box;margin:6px 0}.rw-ed{display:grid;grid-template-columns:52px 1fr 80px 40px;gap:6px;align-items:center;margin:4px 0}.rw-ed input{font:inherit;padding:6px;border:1px solid #ccc;border-radius:8px;min-width:0}.rw-b2{font:inherit;font-weight:700;min-height:44px;border:0;border-radius:12px;padding:8px 14px;margin:4px;cursor:pointer;background:#eee}.rw-b2.pri{background:var(--c,#555);color:#fff}.hm-card .rw-b2{background:#ececec;color:#333;font-weight:700;padding:8px 14px}.hm-card .rw-b2.pri{background:var(--c,#c2410c);color:#fff}.hm-card .rw-ed .rw-b2{padding:0;margin:0;min-height:40px}
.gbtn{font:inherit;font-weight:800;min-height:52px;border:0;border-radius:14px;padding:10px 18px;background:var(--c);color:#fff;cursor:pointer}.gbtn[disabled]{opacity:.45;cursor:default}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tabs button{font:inherit;font-size:14px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:4px 12px;cursor:pointer}.tabs button[aria-pressed=true]{border-color:var(--c);color:var(--c);font-weight:700}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gc{border-radius:12px;padding:8px 4px;text-align:center;border:2px solid var(--line);background:var(--card)}.gc .em{font-size:38px;line-height:1.2}.gc .nm{font-size:13px;font-weight:700}.gc .rr{font-size:11px;color:var(--muted)}.gc.off{opacity:.35}.gc.off .em{filter:grayscale(1) brightness(.4)}
.gc.R{border-color:#2563eb}.gc.SR{border-color:#d97706;background:linear-gradient(135deg,#fef3c7,#fde68a)}.gc.SR .nm,.gc.SR .rr{color:#78350f}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(720deg)}}.spin{animation:spin .9s ease-in-out}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}.pop{animation:pop .5s}
</style>
</head>
<body>
<main>
<h1>練習小站 📚</h1>
<p class="sub">選一個名字，再點要練習的科目。每個練習左下角的「📚 小站」可以回到這裡。</p>
<div class="kids" role="group">
  <button class="kid" style="--c:var(--au)" data-kid="au">Audrey</button>
  <button class="kid" style="--c:var(--hw)" data-kid="hw">Howard</button>
</div>
<div id="pts"></div>
<div id="dex"></div>
<div id="gacha"></div>
<div id="reward"></div>
<div id="list"></div>
<section class="shared">
  <h2 style="--c:var(--sh)">一起練</h2>
  <div class="grid"><a class="card" href="shadowing/"><div class="t">🎤 跟讀小教練</div><div class="m">單字發音・英中互譯・遊戲集點</div></a></div>
</section>
</main>
<script>
/* 新增練習：在對應孩子的陣列加一行即可（順序不拘，首頁會自動依學期排序、分英文部／中文部）。 */
var SUBJ={reading:"📖 Reading",science:"🔬 Science",grammar:"✏️ Grammar",social:"🌍 Social Studies",chinese:"🀄 國語","zh-science":"🌱 自然","zh-social":"🗺️ 社會",math:"🔢 數學",logic:"🧠 數理邏輯"};
var TNAME={gaoqiao:"高僑 私中模擬考"};
var TERM=function(t){if(TNAME[t])return TNAME[t];var m=t.match(/^(\d{3})(\d)-(mid|final)$/);return m?m[1]+"-"+m[2]+(m[3]=="mid"?" 期中":" 期末"):t};
var CATALOG={
  au:[
    {s:"chinese",t:"1151-final"},
    {s:"math",t:"1151-final"},
    {s:"zh-social",t:"1151-final"},
    {s:"zh-science",t:"1151-final"},
    {s:"reading",t:"1151-final"},
    {s:"grammar",t:"1151-final"},
    {s:"science",t:"1151-final"},
    {s:"zh-social",t:"1151-mid"},
    {s:"math",t:"1151-mid"},
    {s:"zh-science",t:"1151-mid"},
    {s:"reading",t:"1151-mid",extra:[["oral.html","🗣 口說練習"]]},
    {s:"science",t:"1151-mid",extra:[["listening.html","🎧 聽力播放"]]},
    {s:"grammar",t:"1151-mid"},
    {s:"chinese",t:"1151-mid"}
  ],
  hw:[
    {s:"logic",t:"gaoqiao",extra:[["review.html","五科・81 題類題＋錯題本","🔁 考前錯題重做"],["memory.html","五科・口訣與圖解","📝 錯題記憶圖卡"]]},
    {s:"math",t:"1151-final"},
    {s:"zh-social",t:"1151-final"},
    {s:"zh-science",t:"1151-final"},
    {s:"reading",t:"1151-final"},
    {s:"science",t:"1151-final"},
    {s:"chinese",t:"1151-final"},
    {s:"chinese",t:"1151-mid"},
    {s:"math",t:"1151-mid"},
    {s:"zh-social",t:"1151-mid"},
    {s:"zh-science",t:"1151-mid"},
    {s:"reading",t:"1151-mid",extra:[["oral.html","🗣 口說練習"]]},
    {s:"science",t:"1151-mid"},
    {s:"grammar",t:"1151-mid"}
  ]
};
/* 分部：英文部 / 中文部（新增科目時把代碼加進對應的陣列） */
var DEPTS=[{name:"🌏 英文部",subj:["reading","grammar","science","social"]},
           {name:"🀄 中文部",subj:["chinese","zh-science","zh-social","math"]},
           {name:"🏫 私中準備",subj:["logic"]}];
function termKey(t){var m=t.match(/^(\d{3})(\d)-(mid|final)$/);return m?(+m[1])*100+(+m[2])*10+(m[3]=="final"?1:0):0}
function cards(kid,list){
  var h='<div class="grid">';
  list.forEach(function(i){
    var base=kid+"/"+i.s+"/"+i.t+"/";
    h+='<a class="card" href="'+base+'"><div class="t">'+SUBJ[i.s]+'</div><div class="m">練習 App</div></a>';
    (i.extra||[]).forEach(function(e){h+='<a class="card" href="'+base+e[0]+'"><div class="t">'+(e[2]||SUBJ[i.s])+'</div><div class="m">'+e[1]+'</div></a>'});
  });
  return h+'</div>';
}
/* 集點卡：讀取各練習 App 存在這台裝置的點數（與 template/site-home.js 的 BADGES 相同） */
var BADGES=[["first","🌱","第一次答對"],["perfect","💯","第一次滿分"],["streak10","🔥","連對 10 題"],["streak20","🚀","連對 20 題"],
  ["days3","📅","連續練習 3 天"],["days7","🗓️","連續練習 7 天"],["lit1","🧩","第一組素養題全對"],["lit10","🎓","素養題達人"],
  ["p500","⭐","500 點"],["p2000","🌟","2000 點"],["p5000","🏆","5000 點"]];
function showPoints(kid,c){
  var d=null;try{d=JSON.parse(localStorage.getItem("kp-points-"+kid)||"null")}catch(e){}
  d=d||{points:0,todayPts:0,today:"",days:[],badges:{}};
  var t=new Date(),ts=t.getFullYear()+"-"+("0"+(t.getMonth()+1)).slice(-2)+"-"+("0"+t.getDate()).slice(-2);
  var days=(d.days||[]).slice().sort(),streak=0;
  if(days.length){var last=days[days.length-1];if(Math.round((new Date(ts)-new Date(last))/864e5)<=1){streak=1;for(var i=days.length-1;i>0;i--){if(Math.round((new Date(days[i])-new Date(days[i-1]))/864e5)===1)streak++;else break}}}
  var got=0;BADGES.forEach(function(b){if(d.badges&&d.badges[b[0]])got++});
  document.getElementById("pts").innerHTML='<div class="pcard" style="--c:'+c+'"><div class="top"><div>🎟 集點卡 <span class="big">⭐ '+d.points+'</span> 點</div>'+
    '<div class="sm">今天 +'+(d.today===ts?d.todayPts:0)+' 點・連續練習 '+streak+' 天・徽章 '+got+'/'+BADGES.length+'</div></div>'+
    '<div class="badges">'+BADGES.map(function(b){return '<span class="bd'+(d.badges&&d.badges[b[0]]?' on':'')+'" title="'+b[2]+'">'+b[1]+' '+b[2]+'</span>'}).join("")+'</div>'+
    (function(){var Q=(window.SitePoints&&SitePoints.quests)||[];var q=(d.q&&d.q.day===ts)?d.q:{correct:0,rounds:0,streak:0,done:{}};return Q.length?'<div class="sm" style="margin-top:8px">🎯 今天的任務（每項＋50 點）：'+Q.map(function(x){var v=Math.min(x.goal,q[x.f]||0);return '<span class="bd'+(q.done&&q.done[x.id]?' on':'')+'">'+x.icon+' '+x.name+' '+v+'/'+x.goal+'</span>'}).join(' ')+'</div>':''})()+(d.points?'':'<div class="sm" style="margin-top:8px">做練習答對就會集點，點數只存在這台裝置。</div>')+'</div>';
}
function hmModal(html){var m=document.createElement("div");m.className="hm-mask";m.innerHTML='<div class="hm-card" role="dialog" aria-modal="true">'+html+'<div><button type="button" class="hm-x">關閉</button></div></div>';m.addEventListener("click",function(e){if(e.target===m||e.target.classList.contains("hm-x"))m.remove()});document.body.appendChild(m);return m}
function dxDetail(kid,id){
  var D=window.SiteDex,x=D.list.filter(function(y){return y[0]===id})[0],dx=D.read(kid),h=dx[id];if(!h)return;
  var st=D.stage(h.n),need=[0,3,6],cols=['★','★★','★★★'],names=['幼年','進化','完全體'];
  var evo=[1,2,3].map(function(k){var got=st>=k;return '<div class="st'+(got?'':' lock')+'"><div class="pic">'+D.svg(id,!got,{stage:k})+'</div><div class="lb">'+cols[k-1]+' '+names[k-1]+'<br>'+(got?'✅ 已解鎖':'🔒 抓到 '+need[k-1]+' 隻')+'</div></div>'}).join('<div class="ar">➜</div>');
  var forms='<div class="'+(h.s?'':'lock')+'"><div class="pic">'+D.svg(id,!h.s,{stage:st,shiny:true})+'</div><div class="lb">✨ 閃亮版 '+(h.s?'×'+h.s:'🔒 還沒遇到')+'</div></div>'+
    '<div class="'+(h.g?'':'lock')+'"><div class="pic">'+D.svg(id,!h.g,{stage:st,giant:true})+'</div><div class="lb">🌟 巨大化 '+(h.g?'×'+h.g:'🔒 100 分時可能出現')+'</div></div>';
  var tip=st<3?'再抓 '+(need[st]-h.n)+' 隻就會進化成 '+cols[st]+'！':'已經是完全體了！'+(!h.s||!h.g?'再去找找 '+(!h.s?'✨閃亮版':'')+(!h.s&&!h.g?'和':'')+(!h.g?'🌟巨大化':'')+'吧！':'這隻全部收集完成 🏅');
  hmModal('<p style="margin:0;font-weight:800;color:'+D.rareColor[x[2]]+'">'+D.rarity[x[2]]+'</p><h3>'+x[1]+'</h3><p class="sm" style="margin:2px 0 0">一共抓到 '+h.n+' 隻・第一次抓到：'+(h.d||'')+'</p>'+
    '<div class="dxh">進化過程</div><div class="evo">'+evo+'</div><div class="dxh">特別型態</div><div class="forms">'+forms+'</div><p>'+tip+'</p>');
}
function showDex(kid,c){
  var D=window.SiteDex;if(!D){return}
  var dx=D.read(kid),base=D.base?D.base():D.list,myth=D.list.filter(function(x){return x[2]===3});
  var got=0,full=0,sh=0,gi=0,my=0;base.forEach(function(x){var h=dx[x[0]];if(h){got++;if(D.stage(h.n)===3)full++;if(h.s)sh++;if(h.g)gi++}});myth.forEach(function(x){if(dx[x[0]])my++});
  var open=D.mythOpen?D.mythOpen(kid):false,N=base.length;
  function tile(x){var h=dx[x[0]],st=h?D.stage(h.n):1;return '<div class="dx'+(h?' on':'')+(x[2]===3?' myth':'')+'"'+(h?' data-id="'+x[0]+'" role="button" tabindex="0"':'')+'><div class="dxp">'+D.svg(x[0],!h,{stage:st})+'</div><div class="dxn">'+(h?x[1]:'？？？')+'</div><div class="dxr">'+D.rarity[x[2]]+(h?' '+'★★★'.slice(0,st)+' ×'+h.n:'')+(h&&h.s?' ✨':'')+(h&&h.g?' 🌟':'')+'</div></div>'}
  function goal(icon,name,v,max){return '<div class="goal'+(v>=max?' done':'')+'"><span>'+icon+' '+name+'</span><span class="bar"><i style="width:'+Math.round(v/max*100)+'%"></i></span><span>'+v+'/'+max+(v>=max?' 🏅':'')+'</span></div>'}
  document.getElementById("dex").innerHTML='<details class="pcard dexbox" style="--c:'+c+'"><summary>🎒 我的圖鑑 <b>'+got+' / '+N+'</b>　<span class="sm">完全體 '+full+'・✨閃亮 '+sh+'・🌟巨大化 '+gi+(my?'・🌈神話 '+my:'')+'</span></summary>'+
    '<div class="sm" style="margin:8px 0 0">點一下抓到的夥伴，可以看牠的進化過程和特別型態。同一隻抓到 3 隻進化成 ★★、6 隻變完全體 ★★★。</div>'+
    '<div class="dxh">🏆 收集挑戰</div>'+goal('🎒','抓到全部種類',got,N)+goal('👑','全部變完全體',full,N)+goal('✨','閃亮版',sh,N)+goal('🌟','巨大化',gi,N)+goal('🌈','神話夥伴',my,myth.length)+
    '<div class="dexgrid">'+base.map(tile).join('')+'</div>'+
    '<div class="dxh">🌈 神話夥伴</div><div class="sm">'+(open?'封印解開了！100 分的回合有機會遇到神話夥伴，牠們很難抓喔。':'🔒 封印中：'+N+' 種夥伴全部變成完全體 ★★★（目前 '+full+'/'+N+'）後，100 分的回合才會出現。')+'</div>'+
    '<div class="dexgrid">'+myth.map(tile).join('')+'</div></details>';
  document.querySelectorAll("#dex .dx.on").forEach(function(t){t.addEventListener("click",function(){dxDetail(kid,t.dataset.id)})});
}
/* 🎰 扭蛋機與卡冊：用集點卡的點數扭蛋（扣的是「可用點數」，集點卡總點數和徽章不受影響）。存在 kp-gacha-<kid>。所有卡片都是原創的圖示卡。 */
var GACHA_COST=100;
var ALBUMS=[
  {id:"dino",name:"🦖 恐龍世界",cards:[["🦖","暴龍","N"],["🦕","腕龍","N"],["🥚","恐龍蛋","N"],["🦴","化石","N"],["🌋","火山","N"],["🌿","蕨類","N"],["🪶","始祖鳥羽毛","R"],["🦷","暴龍牙","R"],["☄️","大隕石","SR"]]},

function gLoad(kid){var g=null;try{g=JSON.parse(localStorage.getItem("kp-gacha-"+kid)||"null")}catch(e){}return g||{spent:0,c:{},album:"dino"}}
function gSave(kid,g){try{localStorage.setItem("kp-gacha-"+kid,JSON.stringify(g))}catch(e){}}
function gPoints(kid){var d=null;try{d=JSON.parse(localStorage.getItem("kp-points-"+kid)||"null")}catch(e){}return (d&&d.points)||0}
function gDraw(a){var r=Math.random(),rar=r<0.06?"SR":r<0.3?"R":"N",pool=a.cards.filter(function(x){return x[2]===rar});var c=pool[Math.floor(Math.random()*pool.length)];return {a:a,c:c,id:a.id+":"+c[1]}}
function showGacha(kid,c){
  var g=gLoad(kid),avail=Math.max(0,gPoints(kid)-g.spent),cur=ALBUMS.filter(function(a){return a.id===g.album})[0]||ALBUMS[0];
  var total=0,have=0;ALBUMS.forEach(function(a){a.cards.forEach(function(x){total++;if(g.c[a.id+":"+x[1]])have++})});
  function cnt(a){return a.cards.filter(function(x){return g.c[a.id+":"+x[1]]}).length}
  var doneAl=ALBUMS.filter(function(a){return cnt(a)===a.cards.length}).length;
  var dup=0;cur.cards.forEach(function(x){var n=g.c[cur.id+":"+x[1]]||0;if(n>1)dup+=n-1});var miss=cur.cards.length-cnt(cur);

    '<div class="machine"><div class="ball" id="gball">🎁</div><div><button type="button" class="gbtn" id="gspin"'+(avail<GACHA_COST?' disabled':'')+'>扭「'+cur.name+'」（'+GACHA_COST+' 點）</button>'+
    '<div class="sm">'+(avail<GACHA_COST?'再集 '+(GACHA_COST-avail)+' 點就可以扭蛋！':'先在下面選一本卡冊，扭蛋就會抽那一本的卡片')+'</div><div class="sm">機率：一般 N 70%・稀有 R 24%・超稀有 SR 6%。扭蛋不會減少集點卡的總點數和徽章。</div></div></div>'+
    '<p class="sm" style="margin:4px 0 0">📚 完成的卡冊：<b>'+doneAl+' / '+ALBUMS.length+'</b>（共 '+ALBUMS.length+' 本，每本 9 張）</p><div class="tabs">'+ALBUMS.map(function(a){var n=cnt(a);return '<button type="button" data-al="'+a.id+'" aria-pressed="'+(a.id===cur.id)+'">'+a.name+' '+n+'/'+a.cards.length+(n===a.cards.length?' 🏅':'')+'</button>'}).join('')+'</div>'+
    '<div class="album">'+cur.cards.map(function(x){var n=g.c[cur.id+":"+x[1]]||0;return '<div class="gc '+x[2]+(n?'':' off')+'"><div class="em">'+(n?x[0]:'❔')+'</div><div class="nm">'+(n?x[1]:'？？？')+'</div><div class="rr">'+x[2]+(n>1?' ×'+n:'')+'</div></div>'}).join('')+'</div>'+
    (miss===0?'<p class="sm">🏅 這本卡冊收集完成了！</p>':'<div style="margin-top:10px"><button type="button" class="gbtn" id="gtrade"'+(dup>=3?'':' disabled')+'>🔁 3 張重複卡換 1 張沒有的</button><div class="sm">這本的重複卡：'+dup+' 張'+(dup>=3?'':'（集到 3 張就能換）')+'</div></div>')+'</details>';
  var det=el.querySelector("details");det.addEventListener("toggle",function(){el.dataset.open=det.open?"1":""});
  el.querySelectorAll("[data-al]").forEach(function(b){b.addEventListener("click",function(){var g2=gLoad(kid);g2.album=b.dataset.al;gSave(kid,g2);showGacha(kid,c)})});
  var tr=document.getElementById("gtrade");if(tr)tr.addEventListener("click",function(){
    var g2=gLoad(kid),left=3,got=cur.cards.filter(function(x){return !g2.c[cur.id+":"+x[1]]});if(!got.length)return;
    cur.cards.slice().sort(function(a,b){return "SRN".indexOf(b[2])-"SRN".indexOf(a[2])}).forEach(function(x){var k=cur.id+":"+x[1];while(left>0&&(g2.c[k]||0)>1){g2.c[k]--;left--}});
    if(left>0)return;var c2=got[Math.floor(Math.random()*got.length)];g2.c[cur.id+":"+c2[1]]=1;gSave(kid,g2);el.dataset.open="1";showGacha(kid,c);
    var done=cur.cards.every(function(x){return g2.c[cur.id+":"+x[1]]});
    hmModal('<p style="margin:0;font-weight:800">🔁 交換成功！</p><div class="gc '+c2[2]+' pop" style="max-width:180px;margin:10px auto"><div class="em" style="font-size:72px">'+c2[0]+'</div><div class="nm" style="font-size:18px">'+c2[1]+'</div><div class="rr">'+c2[2]+'</div></div>'+(done?'<p>🏅 <b>'+cur.name+' 卡冊收集完成！</b></p>':''));
  });
  var sp=document.getElementById("gspin");if(sp)sp.addEventListener("click",function(){
    var g2=gLoad(kid);if(gPoints(kid)-g2.spent<GACHA_COST)return;
    sp.disabled=true;var ball=document.getElementById("gball");ball.className="ball spin";
    setTimeout(function(){
      var r=gDraw(ALBUMS.filter(function(a){return a.id===g2.album})[0]||ALBUMS[0]),first=!g2.c[r.id];g2.spent+=GACHA_COST;g2.c[r.id]=(g2.c[r.id]||0)+1;g2.album=r.a.id;gSave(kid,g2);
      var done=r.a.cards.every(function(x){return g2.c[r.a.id+":"+x[1]]});
      el.dataset.open="1";showGacha(kid,c);
      hmModal('<p style="margin:0;font-weight:800">'+r.a.name+'</p><div class="gc '+r.c[2]+' pop" style="max-width:180px;margin:10px auto"><div class="em" style="font-size:72px">'+r.c[0]+'</div><div class="nm" style="font-size:18px">'+r.c[1]+'</div><div class="rr">'+({N:"一般 N",R:"稀有 R",SR:"超稀有 SR ✨"})[r.c[2]]+'</div></div>'+
        '<p>'+(first?'🎉 新卡片！放進卡冊了':'又抽到一張（這張有 '+g2.c[r.id]+' 張）')+(done&&first?'<br>🏅 <b>'+r.a.name+' 卡冊收集完成！</b>':'')+'</p>');
    },900);
  });
}

var RW_DEFAULT=[["🍦","小點心一份",150],["📺","多看 20 分鐘卡通",200],["🎮","多玩 20 分鐘遊戲",200],["🍽️","選一次晚餐",300],["✏️","新文具一樣",400],["📚","新書一本",600],["🎢","週末出遊選地點",1000],["🧸","小玩具一個",1500]];
function rwList(kid){var r=null;try{r=JSON.parse(localStorage.getItem("kp-rewards-"+kid)||"null")}catch(e){}return (r&&r.length)?r:RW_DEFAULT.map(function(x){return x.slice()})}
function rwSaveList(kid,r){try{localStorage.setItem("kp-rewards-"+kid,JSON.stringify(r))}catch(e){}}
function rwPin(){try{return localStorage.getItem("kp-parent-pin")||""}catch(e){return ""}}
function rwEsc(t){return String(t).replace(/[&<>"]/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]})}
function rwDate(t){var d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate()+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function rwModal(html,onOk,okText){
  var m=document.createElement("div");m.className="hm-mask";m.style.setProperty("--c",getComputedStyle(document.getElementById("reward").querySelector(".pcard")||document.body).getPropertyValue("--c")||"#c2410c");

  document.body.appendChild(m);
  var close=function(){m.remove()};
  m.querySelector("[data-x]").addEventListener("click",close);
  m.addEventListener("click",function(e){if(e.target===m)close()});
  if(onOk)m.querySelector("[data-ok]").addEventListener("click",function(){var err=onOk(m);if(err){m.querySelector("#rwMsg").textContent=err}else close()});

/* 需要家長密碼才能做的事：第一次使用時先設定 4 位數密碼 */

  if(!pin){
    rwModal('<p style="margin:0;font-weight:800">🔐 先設定家長密碼</p><p class="sm">兌換獎勵和修改清單都要輸入這組密碼，請家長設定 4 位數字。</p><input class="rw-in" id="rp1" type="password" inputmode="numeric" maxlength="8" placeholder="輸入 4 位數字"><input class="rw-in" id="rp2" type="password" inputmode="numeric" maxlength="8" placeholder="再輸入一次">',function(m){

      try{localStorage.setItem("kp-parent-pin",a)}catch(e){}setTimeout(then,0);return "";

  }

function show(kid){
  document.querySelectorAll(".kid").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.kid==kid)});
  var c=kid=="au"?"var(--au)":"var(--hw)",html="";
  DEPTS.forEach(function(d){
    var items=CATALOG[kid].filter(function(i){return d.subj.indexOf(i.s)>=0});
    if(!items.length)return;
    var terms=[];items.forEach(function(i){if(terms.indexOf(i.t)<0)terms.push(i.t)});
    terms.sort(function(x,y){return termKey(y)-termKey(x)});
    var order=function(t){return items.filter(function(i){return i.t==t}).sort(function(x,y){return d.subj.indexOf(x.s)-d.subj.indexOf(y.s)})};
    html+='<section class="dept" style="--c:'+c+'"><h2>'+d.name+'</h2>';
    html+='<div class="term">'+TERM(terms[0])+'<span class="new">最新</span></div>'+cards(kid,order(terms[0]));

    m.innerHTML = '<div class="sd-card" role="dialog" aria-modal="true"><p class="sd-tag" style="color:' + RARE_C[d[2]] + '">✨ ' + RARE[d[2]] + (giant ? "・🌟 巨大化" : "") + (shiny ? "・閃亮" : "") + '</p>' +
      '<h3>' + (giant ? "巨大化的" : "野生的") + "「" + label + '」出現了！</h3><div class="sd-pic sd-bob">' + dxSvg(d[0], false, { stage: st0, shiny: shiny, giant: giant }) + '</div><p class="sd-msg">' + (giant ? "巨大化的夥伴比較難抓！" : "答得好！") + '快丟星星瓶抓住牠（還有 <b>3</b> 次機會）</p>' +
      '<button type="button" class="sd-throw">🫙 丟星星瓶</button><button type="button" class="sd-skip">先不要</button></div>';
    document.body.appendChild(m);
    var pic = m.querySelector(".sd-pic"), msg = m.querySelector(".sd-msg"), th = m.querySelector(".sd-throw"), sk = m.querySelector(".sd-skip");
    function close() { m.remove(); }
    sk.onclick = close;
    th.onclick = function () {
      th.disabled = true; pic.className = "sd-pic sd-shake";
      setTimeout(function () {
        tries--;
        if (Math.random() < rate) {
          var dx = dxLoad(kid), r = dx[d[0]] || { n: 0, d: today(), s: 0, g: 0 }, first = !dx[d[0]], before = dxStage(r.n);
          r.n++; if (shiny) r.s = (r.s || 0) + 1; if (giant) r.g = (r.g || 0) + 1; dx[d[0]] = r; dxSave(kid, dx);
          var after = dxStage(r.n), have = dxBase().filter(function (x) { return dx[x[0]]; }).length, myth = d[2] === 3;
          var evo = after > before;
          pic.innerHTML = dxSvg(d[0], false, { stage: after, shiny: shiny, giant: giant });
          pic.className = "sd-pic sd-got";
          msg.innerHTML = "🎉 抓到了！" + (first ? "新夥伴加入圖鑑" : "又抓到一隻（第 " + r.n + " 隻）") +
            (evo ? "<br>✨ <b>" + d[1] + " 進化了！</b>現在是 " + "★★★".slice(0, after) + (after === 3 ? "（完全體）" : "") : (after < 3 ? "<br>再抓 " + ((after === 1 ? 3 : 6) - r.n) + " 隻就會進化" : "")) +
            (shiny ? "<br>✨ 閃亮版收集 +1" : "") + (giant ? "<br>🌟 巨大化收集 +1" : "") +
            (myth ? "<br>🌈 神話夥伴收集 <b>" + DEX.filter(function (x) { return x[2] === 3 && dx[x[0]]; }).length + " / 6</b>" : "<br>圖鑑 <b>" + have + " / " + dxBase().length + "</b>") + "（回小站首頁可以看進化過程）";
          th.remove(); sk.textContent = "好耶，繼續練習";
        } else if (tries > 0) {
          pic.className = "sd-pic sd-bob"; th.disabled = false;
          msg.innerHTML = "差一點！牠跳出來了，再試一次（還有 <b>" + tries + "</b> 次機會）";
        } else {
          pic.className = "sd-pic sd-run"; th.remove(); sk.textContent = "下次再來";
          msg.innerHTML = "牠跑走了… 下一輪答得好，還有機會再遇到！";
        }
      }, 900);
    };
  }
  var SiteDex = {
    list: DEX, rarity: RARE, rareColor: RARE_C, svg: dxSvg, stage: dxStage, read: function (k) { return dxLoad(k || kid); },
    base: dxBase, mythOpen: function (k) { return dxMythOpen(dxLoad(k || kid)); },
    maybe: function (pct, n) {
      if (!kid || n === 0 || pct < 70) return;
      var now = Date.now(); if (now - dxLast < 5000) return; dxLast = now;
      var p = pct >= 100 ? 1 : pct >= 90 ? 0.6 : 0.35;
      if (Math.random() < p) setTimeout(function () { dxEncounter(pct); }, 1800);
    }
  };
  window.SiteDex = SiteDex;
  var oRE = SitePoints.roundEnd;
  SitePoints.roundEnd = function (pct, noPerfect, n) { oRE(pct, noPerfect); try { SiteDex.maybe(pct, n); } catch (e) {} };
  if (typeof window.rtEnd === "function" && !window.rtEnd.__sd) {
    var oEnd = window.rtEnd;
    window.rtEnd = function () {
      try { var r = window.rt || (typeof rt !== "undefined" ? rt : null); if (r && !r.done && r.n >= 1) SitePoints.roundEnd(Math.round(r.ok / r.n * 100), true, r.n >= 5 ? r.n : 0); } catch (e) {}
      return oEnd.apply(this, arguments);
    };
    window.rtEnd.__sd = true;
  }

  /* ---------------- styles ---------------- */
  var css = document.createElement("style");
  css.textContent =
    "#sh-btn{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:9000;" +
    "height:44px;padding:0 14px 0 10px;border-radius:999px;border:2px solid rgba(255,255,255,.9);background:#334155;color:#fff;font:700 16px/1 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;" +
    "box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;opacity:.9;touch-action:manipulation;white-space:nowrap}" +
    "#sh-btn:active{transform:scale(.94)}" +
    "#sh-mask{position:fixed;inset:0;z-index:9001;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px}" +
    "#sh-card{background:#fff;color:#0f172a;border-radius:18px;padding:20px 18px;max-width:340px;width:100%;text-align:center;" +
    "font:17px/1.5 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.3)}" +
    "#sh-card h3{margin:0 0 6px;font-size:20px}#sh-card p{margin:0 0 16px;color:#475569;font-size:15px}" +
    "#sh-card button{font:inherit;min-height:48px;border-radius:12px;border:0;padding:10px 16px;margin:4px;cursor:pointer}" +
    "#sh-go{background:#0284c7;color:#fff;font-weight:700}#sh-stay{background:#e2e8f0;color:#0f172a}" +
    "@media (prefers-color-scheme:dark){#sh-card{background:#1e293b;color:#e2e8f0}#sh-card p{color:#94a3b8}#sh-stay{background:#334155;color:#e2e8f0}}" +
    ".sp-say{font:14px/1 sans-serif;border:1px solid rgba(100,116,139,.45);background:transparent;border-radius:999px;padding:3px 7px;margin-left:6px;cursor:pointer;vertical-align:middle;color:inherit}" +
    ".sd-mask{position:fixed;inset:0;z-index:9003;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px}" +
    ".sd-card{background:#fff;color:#0f172a;border-radius:20px;padding:18px;max-width:340px;width:100%;text-align:center;font:16px/1.5 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.35)}" +
    ".sd-card h3{margin:0 0 4px;font-size:20px}.sd-tag{margin:0;font-weight:800}.sd-msg{color:#475569;margin:6px 0 12px}" +
    ".sd-pic{width:150px;height:150px;margin:6px auto}.sd-bob{animation:sdb 1.1s ease-in-out infinite}.sd-shake{animation:sds .3s linear 3}.sd-got{animation:sdg .6s ease-out}.sd-run{animation:sdr .8s ease-in forwards}" +
    "@keyframes sdb{50%{transform:translateY(-10px)}}@keyframes sds{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}@keyframes sdg{0%{transform:scale(.6)}70%{transform:scale(1.15)}}@keyframes sdr{to{transform:translateX(220px);opacity:0}}" +
    ".sd-card button{font:inherit;min-height:48px;border-radius:12px;border:0;padding:10px 16px;margin:4px;cursor:pointer}.sd-throw{background:#7c3aed;color:#fff;font-weight:800}.sd-skip{background:#e2e8f0;color:#0f172a}" +
    "@media (prefers-color-scheme:dark){.sd-card{background:#1e293b;color:#e2e8f0}.sd-msg{color:#94a3b8}.sd-skip{background:#334155;color:#e2e8f0}}" +
    "body{padding-bottom:max(76px,calc(64px + env(safe-area-inset-bottom)))!important}" +
    ".sp-toast{position:fixed;left:max(84px,calc(72px + env(safe-area-inset-left)));bottom:max(18px,calc(6px + env(safe-area-inset-bottom)));z-index:9002;" +
    "background:#f59e0b;color:#1f2937;font:800 16px/1.3 -apple-system,'PingFang TC',sans-serif;padding:8px 12px;border-radius:999px;" +
    "box-shadow:0 4px 12px rgba(0,0,0,.25);pointer-events:none;transition:opacity .4s,transform .4s}" +
    ".sp-toast.sp-big{left:50%;bottom:auto;top:30%;transform:translateX(-50%);text-align:center;font-size:18px;padding:14px 22px;border-radius:18px}" +
    ".sp-toast.sp-out{opacity:0;transform:translateY(-14px)}.sp-toast.sp-big.sp-out{transform:translate(-50%,-14px)}";
  document.head.appendChild(css);

  function qHtml() {
    var d = load(kid); qDay(d);
    return '<p style="text-align:left;font-size:14px;margin:-8px 0 14px">🎯 今天的任務：<br>' + QUESTS.map(function (q) {
      var v = Math.min(q.goal, d.q[q.f] || 0); return (d.q.done[q.id] ? "✅ " : "⬜ ") + q.name + "（" + v + "/" + q.goal + "）";
    }).join("<br>") + "</p>";
  }
  /* ---------------- 📚 小站 button ---------------- */
  if (!document.body || window.__siteHomeNoBtn) return;
  var b = document.createElement("button");
  b.id = "sh-btn"; b.type = "button";
  b.setAttribute("aria-label", "回到練習小站"); b.title = "回到練習小站";
  b.textContent = "📚 小站";
  b.addEventListener("click", function () {
    if (document.getElementById("sh-mask")) return;
    var m = document.createElement("div"); m.id = "sh-mask";
    var pts = kid ? "<p>目前集點：⭐ " + load(kid).points + " 點・🎒 圖鑑 " + dxBase().filter(function (x) { return dxLoad(kid)[x[0]]; }).length + " / " + dxBase().length + "</p><p>🎒 圖鑑的進化過程、🎰 扭蛋機和卡冊都在小站首頁。</p>" + qHtml() : "";
    m.innerHTML = '<div id="sh-card" role="dialog" aria-modal="true"><h3>📚 回到練習小站？</h3>' +
      '<p>這一輪的作答不會保留（點數和最高分紀錄會留著）。</p>' + pts +
      '<button id="sh-go" type="button">回到練習小站</button><button id="sh-stay" type="button">繼續練習</button></div>';
    document.body.appendChild(m);
    function close() { m.remove(); }
    m.addEventListener("click", function (e) { if (e.target === m) close(); });
    document.getElementById("sh-stay").addEventListener("click", close);
    document.getElementById("sh-go").addEventListener("click", function () {
      try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
