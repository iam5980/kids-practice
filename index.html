<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>練習小站</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2328;--muted:#6a6f76;--line:#e4e0d6;--au:#c2410c;--hw:#1d4ed8;--sh:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1f2226;--ink:#eceae5;--muted:#9aa0a6;--line:#30343a;--au:#fb923c;--hw:#60a5fa;--sh:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:880px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:28px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px}
.kids{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.kid{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:16px;font-size:22px;font-weight:700;cursor:pointer;color:var(--ink)}
.kid[aria-pressed=true]{border-color:var(--c);color:var(--c)}
section{margin-bottom:22px}
h2{font-size:19px;margin:0 0 10px;color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
a.card{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:12px 14px}
a.card:active{transform:scale(.98)}
.t{font-weight:700}.m{color:var(--muted);font-size:14px}
.new{display:inline-block;font-size:12px;background:var(--c);color:var(--card);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.shared a.card{--c:var(--sh)}
.dept{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 4px;margin-bottom:18px}
.dept>h2{font-size:21px;color:var(--ink);margin:0 0 10px}
.term{font-size:16px;font-weight:700;color:var(--c);margin:4px 0 8px}
details.old{margin:10px 0 12px}
details.old>summary{cursor:pointer;color:var(--muted);font-size:15px;padding:6px 0;list-style:none}
details.old>summary::-webkit-details-marker{display:none}
details.old>summary::before{content:"▸ ";}details.old[open]>summary::before{content:"▾ ";}
details.old .term{color:var(--muted)}
.pcard{background:var(--card);border:2px solid var(--c);border-radius:16px;padding:14px;margin-bottom:18px}
.pcard .top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.pcard .big{font-size:28px;font-weight:800;color:var(--c)}
.pcard .sm{color:var(--muted);font-size:14px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bd{font-size:13px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);opacity:.35;filter:grayscale(1)}
.bd.on{opacity:1;filter:none;border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.dexbox summary{cursor:pointer;font-weight:700}.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}.dx{text-align:center;border:1px solid var(--line);border-radius:12px;padding:6px 4px;opacity:.55}.dx.on{opacity:1;background:var(--card)}.dxp{width:64px;height:64px;margin:0 auto}.dxn{font-size:13px;font-weight:700}.dxr{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>練習小站 📚</h1>
<p class="sub">選一個名字，再點要練習的科目。每個練習左下角的「📚 小站」可以回到這裡。</p>
<div class="kids" role="group">
  <button class="kid" style="--c:var(--au)" data-kid="au">Audrey</button>
  <button class="kid" style="--c:var(--hw)" data-kid="hw">Howard</button>
</div>
<div id="pts"></div>
<div id="dex"></div>
<div id="list"></div>
<section class="shared">
  <h2 style="--c:var(--sh)">一起練</h2>
  <div class="grid"><a class="card" href="shadowing/"><div class="t">🎤 跟讀小教練</div><div class="m">單字發音・句子跟讀</div></a></div>
</section>
</main>
<script>
/* 新增練習：在對應孩子的陣列加一行即可（順序不拘，首頁會自動依學期排序、分英文部／中文部）。 */
var SUBJ={reading:"📖 Reading",science:"🔬 Science",grammar:"✏️ Grammar",social:"🌍 Social Studies",chinese:"🀄 國語","zh-science":"🌱 自然","zh-social":"🗺️ 社會",math:"🔢 數學"};
var TERM=function(t){var m=t.match(/^(\d{3})(\d)-(mid|final)$/);return m?m[1]+"-"+m[2]+(m[3]=="mid"?" 期中":" 期末"):t};
var CATALOG={
  au:[
    {s:"science",t:"1151-final"},
    {s:"zh-social",t:"1151-mid"},
    {s:"math",t:"1151-mid"},
    {s:"zh-science",t:"1151-mid"},
    {s:"reading",t:"1151-mid",extra:[["oral.html","🗣 口說練習"]]},
    {s:"science",t:"1151-mid",extra:[["listening.html","🎧 聽力播放"]]},
    {s:"grammar",t:"1151-mid"},
    {s:"chinese",t:"1151-mid"}
  ],
  hw:[
    {s:"science",t:"1151-final"},
    {s:"chinese",t:"1151-final"},
    {s:"chinese",t:"1151-mid"},
    {s:"math",t:"1151-mid"},
    {s:"zh-social",t:"1151-mid"},
    {s:"zh-science",t:"1151-mid"},
    {s:"reading",t:"1151-mid",extra:[["oral.html","🗣 口說練習"]]},
    {s:"science",t:"1151-mid"},
    {s:"grammar",t:"1151-mid"}
  ]
};
/* 分部：英文部 / 中文部（新增科目時把代碼加進對應的陣列） */
var DEPTS=[{name:"🌏 英文部",subj:["reading","grammar","science","social"]},
           {name:"🀄 中文部",subj:["chinese","zh-science","zh-social","math"]}];
function termKey(t){var m=t.match(/^(\d{3})(\d)-(mid|final)$/);return m?(+m[1])*100+(+m[2])*10+(m[3]=="final"?1:0):0}
function cards(kid,list){
  var h='<div class="grid">';
  list.forEach(function(i){
    var base=kid+"/"+i.s+"/"+i.t+"/";
    h+='<a class="card" href="'+base+'"><div class="t">'+SUBJ[i.s]+'</div><div class="m">練習 App</div></a>';
    (i.extra||[]).forEach(function(e){h+='<a class="card" href="'+base+e[0]+'"><div class="t">'+SUBJ[i.s]+'</div><div class="m">'+e[1]+'</div></a>'});
  });
  return h+'</div>';
}
/* 集點卡：讀取各練習 App 存在這台裝置的點數（與 template/site-home.js 的 BADGES 相同） */
var BADGES=[["first","🌱","第一次答對"],["perfect","💯","第一次滿分"],["streak10","🔥","連對 10 題"],["streak20","🚀","連對 20 題"],
  ["days3","📅","連續練習 3 天"],["days7","🗓️","連續練習 7 天"],["lit1","🧩","第一組素養題全對"],["lit10","🎓","素養題達人"],
  ["p500","⭐","500 點"],["p2000","🌟","2000 點"],["p5000","🏆","5000 點"]];
function showPoints(kid,c){
  var d=null;try{d=JSON.parse(localStorage.getItem("kp-points-"+kid)||"null")}catch(e){}
  d=d||{points:0,todayPts:0,today:"",days:[],badges:{}};
  var t=new Date(),ts=t.getFullYear()+"-"+("0"+(t.getMonth()+1)).slice(-2)+"-"+("0"+t.getDate()).slice(-2);
  var days=(d.days||[]).slice().sort(),streak=0;
  if(days.length){var last=days[days.length-1];if(Math.round((new Date(ts)-new Date(last))/864e5)<=1){streak=1;for(var i=days.length-1;i>0;i--){if(Math.round((new Date(days[i])-new Date(days[i-1]))/864e5)===1)streak++;else break}}}
  var got=0;BADGES.forEach(function(b){if(d.badges&&d.badges[b[0]])got++});
  document.getElementById("pts").innerHTML='<div class="pcard" style="--c:'+c+'"><div class="top"><div>🎟 集點卡 <span class="big">⭐ '+d.points+'</span> 點</div>'+
    '<div class="sm">今天 +'+(d.today===ts?d.todayPts:0)+' 點・連續練習 '+streak+' 天・徽章 '+got+'/'+BADGES.length+'</div></div>'+
    '<div class="badges">'+BADGES.map(function(b){return '<span class="bd'+(d.badges&&d.badges[b[0]]?' on':'')+'" title="'+b[2]+'">'+b[1]+' '+b[2]+'</span>'}).join("")+'</div>'+
    (function(){var Q=(window.SitePoints&&SitePoints.quests)||[];var q=(d.q&&d.q.day===ts)?d.q:{correct:0,rounds:0,streak:0,done:{}};return Q.length?'<div class="sm" style="margin-top:8px">🎯 今天的任務（每項＋50 點）：'+Q.map(function(x){var v=Math.min(x.goal,q[x.f]||0);return '<span class="bd'+(q.done&&q.done[x.id]?' on':'')+'">'+x.icon+' '+x.name+' '+v+'/'+x.goal+'</span>'}).join(' ')+'</div>':''})()+(d.points?'':'<div class="sm" style="margin-top:8px">做練習答對就會集點，點數只存在這台裝置。</div>')+'</div>';
}
function showDex(kid,c){
  var D=window.SiteDex;if(!D){return}
  var dx={};try{dx=JSON.parse(localStorage.getItem("kp-dex-"+kid)||"{}")||{}}catch(e){}
  var got=0,full=0,sh=0,gi=0;D.list.forEach(function(x){var h=dx[x[0]];if(h){got++;if(D.stage(h.n)===3)full++;if(h.s)sh++;if(h.g)gi++}});
  document.getElementById("dex").innerHTML='<details class="pcard dexbox" style="--c:'+c+'"><summary>🎒 我的圖鑑 <b>'+got+' / '+D.list.length+'</b>　<span class="sm">完全體 '+full+'・✨閃亮 '+sh+'・🌟巨大化 '+gi+'</span></summary>'+
    '<div class="sm" style="margin:8px 0 0">同一隻抓到 3 隻會進化成 ★★、6 隻變完全體 ★★★；偶爾會遇到 ✨ 閃亮版；100 分時已進化的夥伴可能 🌟 巨大化出現。全部收集：24 種 × 完全體 × 閃亮 × 巨大化！</div><div class="dexgrid">'+
    D.list.map(function(x){var h=dx[x[0]],st=h?D.stage(h.n):1;return '<div class="dx'+(h?' on':'')+'"><div class="dxp">'+D.svg(x[0],!h,{stage:st})+'</div><div class="dxn">'+(h?x[1]:'？？？')+'</div><div class="dxr">'+D.rarity[x[2]]+(h?' '+'★★★'.slice(0,st)+' ×'+h.n:'')+(h&&h.s?' ✨':'')+(h&&h.g?' 🌟':'')+'</div></div>'}).join('')+'</div></details>';
}
function show(kid){
  document.querySelectorAll(".kid").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.kid==kid)});
  var c=kid=="au"?"var(--au)":"var(--hw)",html="";
  DEPTS.forEach(function(d){
    var items=CATALOG[kid].filter(function(i){return d.subj.indexOf(i.s)>=0});
    if(!items.length)return;
    var terms=[];items.forEach(function(i){if(terms.indexOf(i.t)<0)terms.push(i.t)});
    terms.sort(function(x,y){return termKey(y)-termKey(x)});
    var order=function(t){return items.filter(function(i){return i.t==t}).sort(function(x,y){return d.subj.indexOf(x.s)-d.subj.indexOf(y.s)})};
    html+='<section class="dept" style="--c:'+c+'"><h2>'+d.name+'</h2>';
    html+='<div class="term">'+TERM(terms[0])+'<span class="new">最新</span></div>'+cards(kid,order(terms[0]));
    if(terms.length>1){
      html+='<details class="old"><summary>📁 以前的練習（'+(terms.length-1)+'）</summary>';
      terms.slice(1).forEach(function(t){html+='<div class="term">'+TERM(t)+'</div>'+cards(kid,order(t))});
      html+='</details>';
    }
    html+='</section>';
  });
  showPoints(kid,c);showDex(kid,c);
  document.getElementById("list").innerHTML=html||'<p class="sub">目前還沒有練習。</p>';
  try{localStorage.setItem("kid",kid)}catch(e){}
}
document.querySelectorAll(".kid").forEach(function(b){b.addEventListener("click",function(){show(b.dataset.kid)})});
var k="au";try{k=localStorage.getItem("kid")||"au"}catch(e){}
show(k);
</script>
<script>window.__siteHomeNoBtn=true;</script>
<script>
/* =====================================================================
   site-home.js — 📚 小站 button + 全站集點 (site-wide points & badges)
   Canonical copy: github.com/iam5980/kids-practice/template/site-home.js
   Version: 2026-11-08c（🔊 念解釋、🎒 抓寶＋進化／閃亮／巨大化、🎯 每日任務）

   HOW TO USE: paste this whole file in its own <script> block just before
   </body> of EVERY page published to kids-practice (English and 中文部,
   apps, oral pages, listening players). Nothing else is required.

   1) "📚 小站" pill, bottom-left → in-page confirm card → site home.
   2) SitePoints — points and badges per kid, shared by every app on the
      site (same origin), shown on the home page 集點卡. Kept only on
      this device (localStorage).
        SitePoints.answer(ok)       after every judged answer
        SitePoints.roundEnd(pct)    when a round / drill ends (0–100)
        SitePoints.literacy(allOk)  when a 素養題組 is finished
      Points: correct +10, streak bonus +2 per answer in a row (max +10).
      No speed bonus — accuracy only.
   3) Auto-hooks, so older apps need no code changes:
        中文部 engine:  rtAns(right) → answer;  celebrate() → perfect round
        AppCore apps:   AppCore calls SitePoints itself (app-core ≥ 2026-10-25)
   ===================================================================== */
(function () {
  "use strict";
  if (window.__siteHome) return;
  window.__siteHome = true;
  var LIVE = "https://iam5980.github.io/kids-practice/";
  function homeUrl() {
    var p = location.pathname, i = p.indexOf("/kids-practice/");
    if (location.protocol.indexOf("http") === 0 && i >= 0) return location.origin + p.slice(0, i) + "/kids-practice/";
    return LIVE;
  }

  /* ---------------- SitePoints ---------------- */
  var BADGES = [
    { id: "first",   icon: "🌱", name: "第一次答對" },
    { id: "perfect", icon: "💯", name: "第一次滿分" },
    { id: "streak10",icon: "🔥", name: "連對 10 題" },
    { id: "streak20",icon: "🚀", name: "連對 20 題" },
    { id: "days3",   icon: "📅", name: "連續練習 3 天" },
    { id: "days7",   icon: "🗓️", name: "連續練習 7 天" },
    { id: "lit1",    icon: "🧩", name: "第一組素養題全對" },
    { id: "lit10",   icon: "🎓", name: "素養題達人（10 組全對）" },
    { id: "p500",    icon: "⭐", name: "累積 500 點" },
    { id: "p2000",   icon: "🌟", name: "累積 2000 點" },
    { id: "p5000",   icon: "🏆", name: "累積 5000 點" }
  ];
  function kidFromPath() {
    var m = location.pathname.match(/\/kids-practice\/([a-z0-9]+)\//i);
    return m && m[1] !== "template" && m[1] !== "shadowing" ? m[1] : null;
  }
  function today() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function dayDiff(a, b) { return Math.round((new Date(b) - new Date(a)) / 864e5); }
  function load(kid) {
    var d = null;
    try { d = JSON.parse(localStorage.getItem("kp-points-" + kid) || "null"); } catch (e) {}
    return d || { points: 0, today: "", todayPts: 0, days: [], badges: {}, correct: 0, perfects: 0, lit: 0, bestStreak: 0 };
  }
  function save(kid, d) { try { localStorage.setItem("kp-points-" + kid, JSON.stringify(d)); } catch (e) {} }
  function dayStreak(days) {
    if (!days.length) return 0;
    var s = days.slice().sort(), n = 1;
    if (dayDiff(s[s.length - 1], today()) > 1) return 0;
    for (var i = s.length - 1; i > 0; i--) { if (dayDiff(s[i - 1], s[i]) === 1) n++; else break; }
    return n;
  }
  var kid = kidFromPath(), streak = 0;
  function toast(html, big) {
    var t = document.createElement("div");
    t.className = "sp-toast" + (big ? " sp-big" : "");
    t.innerHTML = html;
    document.body.appendChild(t);
    setTimeout(function () { t.classList.add("sp-out"); }, big ? 2200 : 900);
    setTimeout(function () { t.remove(); }, big ? 2700 : 1300);
  }
  function grant(d, id) {
    if (d.badges[id]) return;
    d.badges[id] = today();
    var b = BADGES.filter(function (x) { return x.id === id; })[0];
    if (b) toast("🏅 獲得徽章<br><b>" + b.icon + " " + b.name + "</b>", true);
  }
  function update(fn) {
    if (!kid) return;
    var d = load(kid), t = today();
    if (d.today !== t) { d.today = t; d.todayPts = 0; }
    if (d.days.indexOf(t) < 0) { d.days.push(t); if (d.days.length > 60) d.days = d.days.slice(-60); }
    fn(d);
    var ds = dayStreak(d.days);
    if (ds >= 3) grant(d, "days3");
    if (ds >= 7) grant(d, "days7");
    if (d.points >= 500) grant(d, "p500");
    if (d.points >= 2000) grant(d, "p2000");
    if (d.points >= 5000) grant(d, "p5000");
    save(kid, d);
  }
  /* 🎯 每日任務 — reset every day; each one gives +50 once */
  var QUESTS = [
    { id: "c20", icon: "✅", name: "今天答對 20 題", goal: 20, f: "correct" },
    { id: "r3",  icon: "🔁", name: "今天完成 3 輪練習", goal: 3, f: "rounds" },
    { id: "s10", icon: "🔥", name: "今天連對 10 題", goal: 10, f: "streak" }
  ];
  function qDay(d) { var t = today(); if (!d.q || d.q.day !== t) d.q = { day: t, correct: 0, rounds: 0, streak: 0, done: {} }; }
  function qCheck(d) {
    QUESTS.forEach(function (q) {
      if (!d.q.done[q.id] && d.q[q.f] >= q.goal) {
        d.q.done[q.id] = 1; d.points += 50; d.todayPts += 50;
        toast("🎯 每日任務完成<br><b>" + q.icon + " " + q.name + "</b><br>＋50 點", true);
      }
    });
  }
  var SitePoints = {
    kid: kid,
    badges: BADGES,
    read: function (k) { var d = load(k || kid); d.dayStreak = dayStreak(d.days); return d; },
    answer: function (ok) {
      update(function (d) {
        if (ok) {
          streak++;
          var pts = 10 + Math.min(10, (streak - 1) * 2);
          d.points += pts; d.todayPts += pts; d.correct++;
          qDay(d); d.q.correct++; d.q.streak = Math.max(d.q.streak, streak); qCheck(d);
          d.bestStreak = Math.max(d.bestStreak, streak);
          grant(d, "first");
          if (streak >= 10) grant(d, "streak10");
          if (streak >= 20) grant(d, "streak20");
          toast("+" + pts);
        } else { streak = 0; }
      });
    },
    quests: QUESTS,
    roundEnd: function (pct, noPerfect) {
      update(function (d) { qDay(d); d.q.rounds++; qCheck(d); });
      if (pct >= 100 && !noPerfect) update(function (d) { d.perfects++; grant(d, "perfect"); });
    },
    perfect: function () {
      update(function (d) { d.perfects++; grant(d, "perfect"); });
    },
    literacy: function (allOk) {
      if (allOk) update(function (d) { d.lit++; grant(d, "lit1"); if (d.lit >= 10) grant(d, "lit10"); });
    }
  };
  window.SitePoints = SitePoints;

  /* auto-hooks for the 中文部 engine (global rtAns / celebrate) */
  if (typeof window.rtAns === "function" && !window.rtAns.__sp) {
    var oAns = window.rtAns;
    window.rtAns = function (right) { try { SitePoints.answer(!!right); } catch (e) {} return oAns.apply(this, arguments); };
    window.rtAns.__sp = true;
  }
  if (typeof window.celebrate === "function" && !window.celebrate.__sp) {
    var oCel = window.celebrate;
    window.celebrate = function () { try { SitePoints.perfect(); } catch (e) {} return oCel.apply(this, arguments); };
    window.celebrate.__sp = true;
  }


  /* ---------------- 🔊 念解釋（ReadAloud）----------------
     Every explanation / definition box on every app gets a small 🔊 button:
     .fb .ac-fb .ac-exp .ac-ans td.hint .qmean .why .explain .sp-read
     Chinese text → zh-TW voice; otherwise en-US. */
  var RA_SEL = ".fb,.ac-fb,.ac-exp,.ac-ans,td.hint,.qmean,.why,.explain,.sp-read";
  function raText(el) {
    var c = el.cloneNode(true);
    Array.prototype.forEach.call(c.querySelectorAll("button,.sp-say,script,style"), function (x) { x.remove(); });
    return (c.textContent || "").replace(/\s+/g, " ").trim();
  }
  function raSpeak(t) {
    if (!window.speechSynthesis || !t) return;
    try {
      speechSynthesis.cancel();
      var zh = /[一-鿿]/.test(t), u = new SpeechSynthesisUtterance(t);
      u.lang = zh ? "zh-TW" : "en-US"; u.rate = zh ? 0.95 : 0.9;
