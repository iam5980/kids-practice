<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="跟讀小教練">
<title>跟讀小教練</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2933;--muted:#6b7280;--line:#e5e1d8;--accent:#2563eb;--accent-ink:#fff;
--good:#15803d;--goodbg:#dcfce7;--warn:#a16207;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;}
@media (prefers-color-scheme: dark){:root{--bg:#15171a;--card:#1f2226;--ink:#e8e6e1;--muted:#9aa0a6;--line:#33373c;--accent:#60a5fa;--accent-ink:#0b1220;
--good:#4ade80;--goodbg:#14361f;--warn:#fbbf24;--warnbg:#3a2f12;--bad:#f87171;--badbg:#3b1717;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:1.25rem;margin:0 0 8px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:1rem}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:12px 16px 40px}
.hidden{display:none!important}
select,textarea{width:100%;font-size:1rem;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{font-family:inherit;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.meta span{display:flex;gap:12px;flex-wrap:wrap}.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem;gap:8px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:6px}
.sentence{font-size:1.7rem;line-height:1.6;margin:14px 0;font-family:Georgia,"Times New Roman",serif}
.sentence span{display:inline-block;padding:0 3px;margin:1px 0;border-radius:6px;cursor:pointer}
.sentence span.ok{background:var(--goodbg);color:var(--good)}
.sentence span.close{background:var(--warnbg);color:var(--warn)}
.sentence span.bad{background:var(--badbg);color:var(--bad);text-decoration:underline wavy}
.word{font-size:2.6rem;text-align:center;margin:18px 0;font-family:Georgia,"Times New Roman",serif}
.btns,.nav{display:flex;gap:10px}
.btns button,.nav button,.result button,.primary{flex:1;padding:12px;font-size:1.05rem;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.nav{margin-top:14px}
.primary{width:100%;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mic{width:100%;margin-top:12px;padding:16px;font-size:1.3rem;border-radius:14px;border:none;background:var(--accent);color:var(--accent-ink)}
.mic.listening{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.status{min-height:1.4em;margin-top:10px;color:var(--muted);font-size:.95rem}
.result{margin-top:10px;border-top:1px dashed var(--line);padding-top:12px}
.score{font-size:1.5rem;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stars{color:#f59e0b;letter-spacing:2px}
.cheer{font-size:1rem;font-weight:400;color:var(--muted)}
.heard{color:var(--muted);margin:6px 0 10px;font-size:.95rem}
.miss-title{margin:12px 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:1rem}
.chip.bad{border-color:var(--bad)}.chip.close{border-color:var(--warn)}.chip.ok{border-color:var(--good);background:var(--goodbg)}
.chip button{border:none;background:transparent;font-size:1.1rem;padding:4px;color:var(--ink)}
.chip.cur{outline:2px solid var(--accent)}
.wresult{text-align:center;font-size:1.15rem;margin-top:8px;min-height:1.6em}
.big{font-size:3.4rem;font-weight:800;line-height:1.1}.big small{font-size:1.1rem;font-weight:600}
.big.ok{color:var(--good)}.big.close{color:var(--warn)}.big.bad{color:var(--bad)}
.hist{text-align:center;color:var(--muted);font-size:.9rem;margin-top:6px;min-height:1.2em}
.auto{justify-content:center;margin-top:12px;color:var(--muted);font-weight:400}
.badge{font-size:.8rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--line)}
.mic:disabled{opacity:.6}
.kidsX{display:none}.kidsX button{flex:1;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem}
.kidsX button.on{border-color:var(--accent);outline:2px solid var(--accent)}
.sels{display:flex;gap:8px}.sels select{flex:1;min-width:0}
.cefr{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;padding-bottom:2px}
.cefr button{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.9rem}
.cefr button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cefr button small{opacity:.75;margin-left:4px;font-size:.75rem}
.modes{display:flex;gap:6px;margin-top:10px}
.modes button{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem}
.modes button.on{border-color:var(--accent);outline:2px solid var(--accent);font-weight:700}
.zh{text-align:center;color:var(--muted);font-size:1.05rem;margin:-8px 0 12px;min-height:1.2em}
.word.zhq{font-family:inherit;font-size:1.6rem;line-height:1.5}
.ans{text-align:center;font-size:1.4rem;margin-top:6px;min-height:1.2em;font-family:Georgia,"Times New Roman",serif}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opts button{padding:14px 8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.05rem;min-height:3.4em}
.opts button.good{background:var(--goodbg);border-color:var(--good);color:var(--good);font-weight:700}
.opts button.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.tally{text-align:center;color:var(--muted);font-size:.9rem;margin-top:8px;min-height:1.1em}
.lvlnote{color:var(--muted);font-size:.85rem;margin-top:6px;min-height:1em}
.notice{background:var(--warnbg);color:var(--warn);padding:12px;border-radius:12px;margin-top:8px}
label{font-weight:600}
.tips{color:var(--muted);font-size:.85rem;line-height:1.6;margin-top:18px}
</style>
</head>
<body>
<header>
  <h1>跟讀小教練</h1>
  <nav class="tabs">
    <button data-tab="sent" class="on">句子跟讀</button>
    <button data-tab="word">單字練習</button>
    <button data-tab="custom">自己貼</button>
  </nav>
</header>
<main>
  <div id="support" class="notice hidden"></div>

  <section id="tab-sent">
    <select id="setSel1"></select>
    <div class="card">
      <div class="meta"><span id="sPos"></span>
        <label class="toggle"><input type="checkbox" id="recToggle" checked> 錄下我的聲音</label></div>
      <p id="sText" class="sentence"></p>
      <div class="btns"><button id="sSay">🔊 示範</button><button id="sSlow">🐢 慢速</button></div>
      <button id="sMic" class="mic">🎤 開始跟讀</button>
      <div id="sStatus" class="status"></div>
      <div id="sResult"></div>
      <div class="nav"><button id="sPrev">◀ 上一句</button><button id="sNext">下一句 ▶</button></div>
    </div>
  </section>

  <section id="tab-word" class="hidden">
    <div class="cefr" id="cefrBar" aria-label="依難度選擇"></div>
    <div class="sels"><select id="lvlSel" aria-label="程度"></select><select id="packSel" aria-label="分包"></select></div>
    <div id="lvlNote" class="lvlnote"></div>
    <div class="modes" id="modeBar"><button data-mode="say">🗣 跟讀發音</button><button data-mode="e2c">英翻中</button><button data-mode="c2e">中翻英（用說的）</button></div>
    <div class="card">
      <div class="meta"><span id="wPos"></span>
        <span><label class="toggle" id="zhToggle"><input type="checkbox" id="wShowZh" checked> 顯示中文</label>
        <label class="toggle"><input type="checkbox" id="wRec" checked> 錄音</label></span></div>
      <p id="wText" class="word"></p>
      <p id="wZh" class="zh"></p>
      <div class="btns"><button id="wSay">🔊 示範</button><button id="wSlow">🐢 慢速</button></div>
      <button id="wMic" class="mic">▶ 先聽再念</button>
      <div id="wOpts" class="opts hidden"></div>
      <div id="wStatus" class="status"></div>
      <div id="wResult" class="wresult"></div>
      <div id="wAns" class="ans"></div>
      <div id="wHist" class="hist"></div>
      <div id="wPlay" class="btns hidden" style="margin-top:10px"><button id="wMine">🎧 聽我的錄音</button><button id="wAgain">🔊 再聽示範</button></div>
      <div id="wTally" class="tally"></div>
      <label class="toggle auto"><input type="checkbox" id="wAuto" checked> 答對或拿到 100 分自動跳下一個</label>
      <div class="nav"><button id="wPrev">◀ 上一個</button><button id="wNext">下一個 ▶</button></div>
    </div>
    <div class="card"><div class="chips" id="wList"></div></div>
  </section>

  <section id="tab-custom" class="hidden">
    <div class="card">
      <label for="cSent">句子（可整段貼上，會依句號、問號、驚嘆號或換行自動分句）</label>
      <textarea id="cSent" rows="6" placeholder="I like apples. Do you like bananas?"></textarea>
      <label for="cWord">單字（每行一個；留白會自動從句子挑選）</label>
      <textarea id="cWord" rows="4" placeholder="apple&#10;banana"></textarea>
      <button id="cGo" class="primary">開始練習</button>
    </div>
  </section>

  <p class="tips">使用小提醒：第一次使用請允許麥克風。iPad／iPhone 需開啟「設定 › 一般 › 鍵盤 › 啟用聽寫」，並保持網路連線。戴有麥克風的耳機、在安靜的地方念，辨識會更準。點句子裡任何一個字，可以單獨聽那個字。單字分數是依語音辨識結果換算，用來鼓勵反覆練習，不等同專業音素評測。</p>
</main>

<script src="words.js"></script>
<script>
/* ===== 內建題庫：依全民英檢／劍橋英檢程度與主題挑選常考字，例句為自編。新增一組照格式加入即可（level 決定選單分類） ===== */
const BANK = [
  {"level": "劍橋 Pre A1 Starters", "title": "劍橋 Pre A1 Starters｜Animals & Colours", "sentences": ["The cat is sleeping on the chair.", "I can see a big blue bird.", "My dog likes to play in the garden.", "The frog is small and green.", "How many ducks are there?"], "words": ["cat", "dog", "fish", "bird", "horse", "cow", "duck", "sheep", "frog", "monkey", "elephant", "giraffe", "tiger", "snake", "lizard", "red", "blue", "green", "yellow", "purple", "orange", "brown"]},
  {"level": "劍橋 Pre A1 Starters", "title": "劍橋 Pre A1 Starters｜Home & Family", "sentences": ["This is my grandmother.", "My brother is in the kitchen.", "There is a clock on the wall.", "Please open the window.", "We watch TV on the sofa."], "words": ["mother", "father", "brother", "sister", "grandmother", "grandfather", "baby", "bedroom", "kitchen", "bathroom", "table", "chair", "window", "door", "sofa", "clock", "mirror", "garden"]},
  {"level": "劍橋 A1 Movers", "title": "劍橋 A1 Movers｜Daily Life & School", "sentences": ["I usually have breakfast at seven.", "We play football in the playground after lunch.", "Our teacher gives us homework every day.", "The library is next to the classroom.", "What do you do on Saturday afternoon?"], "words": ["breakfast", "lunch", "dinner", "homework", "classroom", "teacher", "library", "playground", "dictionary", "morning", "afternoon", "evening", "Saturday", "Sunday", "usually", "always", "never", "sometimes"]},
  {"level": "劍橋 A1 Movers", "title": "劍橋 A1 Movers｜Weather & Places", "sentences": ["It is windy and cloudy today.", "We swam in the river last summer.", "There is a market in the village.", "The hospital is near the bus station.", "Let's climb the mountain tomorrow."], "words": ["weather", "sunny", "cloudy", "windy", "rainy", "snow", "river", "mountain", "island", "village", "city", "market", "hospital", "station", "bridge", "park", "sea", "forest"]},
  {"level": "劍橋 A2 Flyers", "title": "劍橋 A2 Flyers｜Jobs & Hobbies", "sentences": ["My aunt is a dentist in the city.", "He wants to be a pilot when he grows up.", "I collect stamps from different countries.", "She is learning to play the violin.", "Our class won the singing competition."], "words": ["dentist", "engineer", "journalist", "photographer", "pilot", "scientist", "firefighter", "mechanic", "actor", "artist", "hobby", "collect", "instrument", "guitar", "violin", "competition", "practise", "museum"]},
  {"level": "全民英檢 初級", "title": "全民英檢 初級｜Food & Drinks", "sentences": ["I would like a chicken sandwich, please.", "These dumplings are really delicious.", "Can I see the menu?", "I am thirsty. Let's get some juice.", "Vegetables are good for your health."], "words": ["hamburger", "sandwich", "noodles", "vegetable", "chicken", "beef", "pork", "dumpling", "dessert", "juice", "coffee", "menu", "restaurant", "delicious", "hungry", "thirsty", "cookie", "fruit", "bread", "salad"]},
  {"level": "全民英檢 初級", "title": "全民英檢 初級｜Shopping", "sentences": ["How much is this jacket?", "These shoes are too expensive for me.", "Everything in the store is on sale today.", "Can I try it on?", "Do you have a smaller size?"], "words": ["price", "cheap", "expensive", "sale", "customer", "store", "wallet", "dollar", "size", "jacket", "shoes", "pants", "skirt", "cash", "card", "gift", "shopping", "supermarket"]},
  {"level": "全民英檢 初級", "title": "全民英檢 初級｜Transportation", "sentences": ["I take the MRT to school every day.", "The train will leave in ten minutes.", "Please wait at the bus stop.", "The traffic is very heavy this morning.", "My father rides a scooter to work."], "words": ["bus", "train", "taxi", "subway", "airport", "ticket", "passenger", "traffic", "motorcycle", "bicycle", "scooter", "station", "driver", "corner", "straight", "left", "right", "crosswalk"]},
  {"level": "劍橋 A2 Key", "title": "劍橋 A2 Key｜Travel & Holidays", "sentences": ["Don't forget to bring your passport.", "We stayed at a hotel near the beach.", "The flight to Tokyo takes three hours.", "I bought some souvenirs for my friends.", "Have you ever been camping?"], "words": ["holiday", "passport", "luggage", "hotel", "journey", "tourist", "beach", "camping", "map", "souvenir", "guide", "abroad", "flight", "trip", "suitcase", "postcard", "sightseeing", "backpack"]},
  {"level": "劍橋 A2 Key", "title": "劍橋 A2 Key｜Health & Body", "sentences": ["I have a headache and a fever.", "You should take this medicine after meals.", "Regular exercise keeps you healthy.", "I have an appointment with the doctor.", "She went to bed early because she was tired."], "words": ["headache", "stomachache", "toothache", "fever", "medicine", "doctor", "healthy", "exercise", "tired", "appointment", "temperature", "nurse", "shoulder", "knee", "throat", "cough", "rest", "sleep"]},
  {"level": "全民英檢 中級", "title": "全民英檢 中級｜Feelings & Personality", "sentences": ["She felt nervous before the speech contest.", "He is patient and always listens carefully.", "I was disappointed with the result.", "It is important to be honest with your friends.", "The children were curious about the robot."], "words": ["confident", "nervous", "patient", "generous", "embarrassed", "disappointed", "curious", "responsible", "honest", "polite", "friendly", "jealous", "proud", "lonely", "anxious", "cheerful", "selfish", "brave"]},
  {"level": "劍橋 B1 Preliminary", "title": "劍橋 B1 Preliminary｜Environment", "sentences": ["We should recycle plastic bottles.", "Air pollution is a serious problem in big cities.", "Turn off the lights to save energy.", "Many people are working to protect wildlife.", "Climate change affects everyone on the planet."], "words": ["environment", "pollution", "recycle", "plastic", "rubbish", "energy", "climate", "protect", "wildlife", "waste", "electricity", "planet", "global", "natural", "rainforest", "temperature", "disappear", "solution"]},
  {"level": "劍橋 B1 Preliminary", "title": "劍橋 B1 Preliminary｜Technology & Media", "sentences": ["I forgot my password again.", "You can download the app for free.", "The battery on my phone is almost empty.", "She posted a video online last night.", "Technology has changed the way we learn."], "words": ["technology", "website", "download", "upload", "password", "screen", "keyboard", "battery", "message", "online", "digital", "advertisement", "program", "device", "account", "search", "connect", "information"]}
];

/* ===== 文字正規化與比對 ===== */
const CONTR={"i'm":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","that's":"that is","there's":"there is","what's":"what is","where's":"where is","who's":"who is","let's":"let us","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","haven't":"have not","hasn't":"has not","i've":"i have","you've":"you have","we've":"we have","they've":"they have","i'll":"i will","you'll":"you will","he'll":"he will","she'll":"she will","it'll":"it will","we'll":"we will","they'll":"they will","i'd":"i would","you'd":"you would","couldn't":"could not","shouldn't":"should not","wouldn't":"would not"};
const HOMO=[["to","two","too"],["for","four"],["there","their","theyre"],["i","eye"],["right","write"],["see","sea"],["by","buy","bye"],["hear","here"],["know","no"],["one","won"],["eight","ate"],["blue","blew"],["new","knew"],["sun","son"],["meet","meat"],["week","weak"],["flower","flour"],["pair","pear"],["wear","where"],["hour","our"],["whole","hole"],["tail","tale"],["night","knight"],["wood","would"],["ok","okay"],["mr","mister"],["grey","gray"],["colour","color"],["favourite","favorite"],["practise","practice"],["programme","program"],["centre","center"],["theatre","theater"],["oclock","clock"]];
const CANON={}; HOMO.forEach(g=>g.forEach(w=>CANON[w]=g[0]));
const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function numWords(n){ if(n<20)return ONES[n]; if(n<100)return TENS[Math.floor(n/10)]+(n%10?" "+ONES[n%10]:""); if(n<1000){const r=n%100;return ONES[Math.floor(n/100)]+" hundred"+(r?" "+numWords(r):"");} return String(n); }
function normWord(w){
  const s=w.toLowerCase().replace(/[’‘`]/g,"'").replace(/[-–—_/]/g," ");
  return s.split(/\s+/).flatMap(p=>{
    p=p.replace(/[^a-z0-9']/g,"").replace(/^'+|'+$/g,"");
    if(!p)return [];
    if(CONTR[p])return CONTR[p].split(" ");
    if(/^\d+$/.test(p))return numWords(parseInt(p,10)).split(" ");
    return [p.replace(/'/g,"")];
  });
}
function normText(str){
  str=str.replace(/(\d+):00\b/g,"$1 o'clock").replace(/(\d+):(\d+)/g,"$1 $2");
  return str.split(/\s+/).flatMap(normWord);
}
const canon=w=>CANON[w]||w;
function lev(a,b){const m=a.length,n=b.length;let p=Array(n+1).fill(0).map((_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function cmp(a,b){ if(canon(a)===canon(b))return 0; if(a.length>=3&&b.length>=3&&1-lev(a,b)/Math.max(a.length,b.length)>=0.7)return 4; return 10; }
function align(T,H){
  const n=T.length,m=H.length,D=[];
  for(let i=0;i<=n;i++){D[i]=[];for(let j=0;j<=m;j++)D[i][j]=i===0?j*5:(j===0?i*10:0);}
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=Math.min(D[i-1][j-1]+cmp(T[i-1],H[j-1]),D[i-1][j]+10,D[i][j-1]+5);
  const st=Array(n).fill("bad");let i=n,j=m;
  while(i>0&&j>0){const c=cmp(T[i-1],H[j-1]);
    if(D[i][j]===D[i-1][j-1]+c){st[i-1]=c===0?"ok":(c===4?"close":"bad");i--;j--;}
    else if(D[i][j]===D[i-1][j]+10){st[i-1]="bad";i--;} else j--;}
  return st;
}
const scoreOf=st=>st.length?Math.round(100*st.reduce((s,x)=>s+(x==="ok"?1:x==="close"?0.6:0),0)/st.length):0;
const rank={ok:0,close:1,bad:2};

function evalSentence(sentence,alts){
  const disp=sentence.split(/\s+/).filter(Boolean);
  const toks=[];disp.forEach((w,i)=>normWord(w).forEach(t=>toks.push({t,i})));
  let best=null;
  for(const a of alts){const st=align(toks.map(x=>x.t),normText(a));const sc=scoreOf(st);if(!best||sc>best.score)best={st,score:sc,heard:a};}
  const dStat=disp.map(()=>"ok");
  toks.forEach((x,k)=>{if(rank[best.st[k]]>rank[dStat[x.i]])dStat[x.i]=best.st[k];});
  disp.forEach((w,i)=>{if(!normWord(w).length)dStat[i]="ok";});
  return {disp,dStat,score:best.score,heard:best.heard};
}
function evalWord(word,alts){
  const T=normWord(word);let best={status:"bad",heard:alts[0]||""};
  for(const a of alts){const H=normText(a);let s;
    if(T.length===1){const c=Math.min(...H.map(h=>cmp(T[0],h)),10);s=c===0?"ok":c===4?"close":"bad";}
    else{const st=align(T,H);s=st.every(x=>x==="ok")?"ok":st.some(x=>x!=="bad")?"close":"bad";}
    if(rank[s]<rank[best.status])best={status:s,heard:a};}
  return best;
}

/* 單字 0–100 分：完全辨識正確且信心高＝100；只在備選結果中出現＝86–92；沒對上依拼寫相似度給 0–85 */
function scoreWord(word,alts,confs){
  const T=normWord(word).map(canon);const Tj=T.join(" ");let best={score:0,heard:alts[0]||""};
  alts.forEach((a,k)=>{const H=normText(a).map(canon);if(!H.length)return;
    const cands=[H.join(" ")];
    for(let i=0;i<H.length;i++)for(let n=1;n<=Math.min(T.length+1,H.length-i);n++)cands.push(H.slice(i,i+n).join(" "));
    const Tn=Tj.replace(/ /g,"");let sim=0;cands.forEach(c=>{const cn=c.replace(/ /g,"");const s=cn===Tn?1:1-lev(Tn,cn)/Math.max(Tn.length,cn.length);if(s>sim)sim=s;});
    const cf=(confs&&confs[k])||0;let sc;
    if(sim===1){sc=k===0?((cf===0||cf>=0.75)?100:Math.min(99,Math.round(80+cf*25))):(k===1?92:86);}
    else sc=Math.round(Math.max(0,sim)*85);
    if(sc>best.score)best={score:sc,heard:a};});
  return best;
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function listen(maxMs,onInterim){
  return new Promise(resolve=>{
    const r=new SR();r.lang="en-US";r.interimResults=true;r.maxAlternatives=5;r.continuous=false;
    let alts=[],confs=[],err=null,done=false;
    const finish=()=>{if(done)return;done=true;clearTimeout(t1);clearTimeout(t2);activeRec=null;resolve({alts,confs,error:err});};
    const t1=setTimeout(()=>{try{r.stop();}catch(e){}},maxMs);
    const t2=setTimeout(finish,maxMs+3500);
    r.onresult=e=>{const R=Array.from(e.results);const k=Math.max(...R.map(x=>x.length));const m=new Map();
      for(let j=0;j<k;j++){const parts=R.map(res=>res[j]||res[0]);
        const s=parts.map(x=>x.transcript).join(" ").replace(/\s+/g," ").trim();
        const c=parts.reduce((a,x)=>a+(x.confidence||0),0)/parts.length;if(s&&!m.has(s))m.set(s,c);}
      alts=[...m.keys()];confs=[...m.values()];if(onInterim)onInterim(alts[0]||"");};
    r.onerror=e=>{err=e.error;};
    r.onend=finish;
    activeRec=r;
    try{r.start();}catch(e){err="start-failed";finish();}
  });
}

  $("wTally").textContent=tally(st);
  $("wPrev").disabled=wIdx===0&&wSrc.p===0;$("wNext").disabled=wIdx>=W.length-1&&wSrc.p>=packCount()-1;
  $("wList").innerHTML=W.map((x,i)=>{const r=done(st[x])?st[x]:null;const lab=c2e?(shortZh(Z[i])||x):x;
    const sc=r?(e2c?(r.first===100?"ok":"bad"):lvl(r.best)):"";const bd=r?(e2c?(r.first===100?"✓":"✗"):r.best):"";
    return `<div class="chip ${sc} ${i===wIdx?"cur":""}" data-i="${i}"><span>${esc(lab)}</span>${r?`<span class="badge">${bd}</span>`:""}</div>`;}).join("");
}
function buildOpts(w,z,st,ev){
  const k=mKey()+"#"+w;const right=shortZh(z)||"（暫無中文）";
  if(!optCache[k]){const pool=[...new Set(zhPool().map(shortZh).filter(x=>x&&x!==right))];const ds=[];
    while(ds.length<3&&pool.length){ds.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);}
    const all=[right,...ds];for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}optCache[k]=all;}
  const rec=st[w];const picked=rec&&rec.pick;
  $("wOpts").innerHTML=optCache[k].map((o,i)=>{let c="";if(picked!=null){if(o===right)c="good";else if(o===picked)c="bad";}
    return `<button data-o="${i}" class="${c}">${esc(o)}</button>`;}).join("");
  if(picked==null){$("wResult").innerHTML="";$("wStatus").textContent="選出正確的中文意思（可以先按 🔊 聽發音）";}
  else{$("wResult").innerHTML=picked===right?`<div class="big ok">✅</div><div>答對了！</div>`:`<div class="big bad">❌</div><div>正確答案：${esc(right)}</div>`;$("wStatus").textContent=z;}
}
$("wOpts").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  const W=curWords(),Z=curZh(),w=W[wIdx],z=Z[wIdx]||"",k=mKey();const st=wStat[k]||(wStat[k]={});
  const o=optCache[k+"#"+w][+b.dataset.o];const right=shortZh(z)||"（暫無中文）";const ok=o===right;
  const rec=st[w]||(st[w]={best:0,tries:[]});if(rec.first==null)rec.first=ok?100:0;rec.pick=o;rec.tries.push(ok?100:0);rec.best=Math.max(rec.best,ok?100:0);
  renderWord();say(w);
  if(ok&&$("wAuto").checked){const idx=wIdx,at=k;setTimeout(()=>{if(idx===wIdx&&at===mKey())wStep(1);},1500);}
  else if(!ok){setTimeout(()=>{if(st[w]&&st[w].pick===o&&o!==right){delete st[w].pick;renderWord();$("wStatus").textContent="再選一次看看";}},1800);}
};
$("wList").onclick=e=>{const c=e.target.closest(".chip");if(c){wIdx=+c.dataset.i;renderWord();}};
$("wSay").onclick=()=>{const W=curWords();if(!W.length)return;const w=W[wIdx];
  if(wMode==="c2e"){const k=mKey();const st=wStat[k]||(wStat[k]={});const r=st[w]||(st[w]={best:0,tries:[]});r.peek=true;renderWord();$("wSlow").classList.remove("hidden");}
  say(w);};
$("wSlow").onclick=()=>{const W=curWords();if(W.length)say(W[wIdx],true);};
$("wAgain").onclick=()=>{const W=curWords();if(W.length)say(W[wIdx]);};
$("wMine").onclick=()=>{if(wAudioURL){speechSynthesis.cancel();new Audio(wAudioURL).play();}};
function wStep(d){const n=curWords().length;
  if(d>0){if(wIdx<n-1){wIdx++;renderWord();}else if(wSrc.k==="L"&&wSrc.p<packCount()-1){setW("L",wSrc.i,wSrc.p+1);}}
  else{if(wIdx>0){wIdx--;renderWord();}else if(wSrc.k==="L"&&wSrc.p>0){setW("L",wSrc.i,wSrc.p-1);wIdx=curWords().length-1;renderWord();}}}
$("wPrev").onclick=()=>wStep(-1);
$("wNext").onclick=()=>wStep(1);
$("wMic").onclick=async()=>{
  if(activeRec){activeRec.stop();return;}
  if(!SR){showSupport();return;}
  const W=curWords();if(!W.length)return;const w=W[wIdx];const idx=wIdx,at=mKey();const sayMode=wMode==="say";
  $("wMic").disabled=true;$("wResult").innerHTML="";$("wHist").textContent="";$("wPlay").classList.add("hidden");
  if(sayMode){$("wStatus").textContent="🔊 先聽老師念…";await say(w);}
  $("wMic").disabled=false;
  if(idx!==wIdx||at!==mKey())return;
  micUI($("wMic"),true,"");$("wStatus").textContent=sayMode?"🎤 換你念！":"🎤 請說出英文…";
  const {r,url}=await recordAndListen(sayMode?4500:6000,t=>{$("wStatus").textContent="聽到："+t;},$("wRec").checked);
  micUI($("wMic"),false,"");
  if(idx!==wIdx||at!==mKey())return;
  if(!r.alts.length){renderWord();$("wStatus").textContent=r.recBroke?"這台裝置無法同時錄音和辨識，已自動關閉錄音，請再按一次。":errMsg(r.error||"no-speech");return;}
  if(wAudioURL)URL.revokeObjectURL(wAudioURL);wAudioURL=url;
  const ev=scoreWord(w,r.alts,r.confs);
  const st=wStat[at]||(wStat[at]={});const rec=st[w]||(st[w]={best:0,tries:[]});
  rec.tries.push(ev.score);rec.best=Math.max(rec.best,ev.score);
  renderWord(ev);
  if(ev.score>=100&&$("wAuto").checked){setTimeout(()=>{if(idx===wIdx&&at===mKey()&&!activeRec)wStep(1);},2000);}
};

/* ===== 自己貼 ===== */
$("cGo").onclick=()=>{
  const raw=$("cSent").value.trim();
  const sents=raw?raw.split(/\n+/).flatMap(l=>l.match(/[^.!?]+[.!?]*["')]*/g)||[]).map(s=>s.trim()).filter(s=>/[A-Za-z]/.test(s)):[];
  const words=$("cWord").value.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if(!sents.length&&!words.length){alert("請先貼上句子或單字。");return;}
  const i=sets.findIndex(s=>s.custom);const set={title:"自訂內容",custom:true,sentences:sents,words};
  if(i>=0)sets[i]=set;else sets.push(set);
  const si=sets.indexOf(set);setSet(si);setW("S",si,0);showTab(sents.length?"sent":"word");
};

function showSupport(){const n=$("support");n.classList.remove("hidden");
  n.textContent="這個瀏覽器不支援語音辨識。iPad／iPhone 請用 Safari 開啟，並到「設定 › 一般 › 鍵盤」開啟「啟用聽寫」。";}
if(!SR)showSupport();
(function(){let s=null;try{s=JSON.parse(localStorage.getItem("ha_wsrc")||"null");}catch(e){}
  if(s&&((s.k==="L"&&WB[s.i]&&s.p<Math.ceil(WB[s.i].words.length/PACK))||(s.k==="S"&&sets[s.i])))wSrc=s;
  else if(WB.length)wSrc={k:"L",i:0,p:0};})();
fillCefr();fillSelects();renderSentence();renderWord();
</script>
<script>
/* =====================================================================
   site-home.js — 📚 小站 button + 全站集點 (site-wide points & badges)
   Canonical copy: github.com/iam5980/kids-practice/template/site-home.js
   Version: 2026-10-25

   HOW TO USE: paste this whole file in its own <script> block just before
   </body> of EVERY page published to kids-practice (English and 中文部,
   apps, oral pages, listening players). Nothing else is required.

   1) "📚 小站" pill, bottom-left → in-page confirm card → site home.
   2) SitePoints — points and badges per kid, shared by every app on the
      site (same origin), shown on the home page 集點卡. Kept only on
      this device (localStorage).
        SitePoints.answer(ok)       after every judged answer
        SitePoints.roundEnd(pct)    when a round / drill ends (0–100)
        SitePoints.literacy(allOk)  when a 素養題組 is finished
      Points: correct +10, streak bonus +2 per answer in a row (max +10).
      No speed bonus — accuracy only.
   3) Auto-hooks, so older apps need no code changes:
        中文部 engine:  rtAns(right) → answer;  celebrate() → perfect round
        AppCore apps:   AppCore calls SitePoints itself (app-core ≥ 2026-10-25)
   ===================================================================== */
(function () {
  "use strict";
  if (window.__siteHome) return;
  window.__siteHome = true;
  var LIVE = "https://iam5980.github.io/kids-practice/";
  function homeUrl() {
    var p = location.pathname, i = p.indexOf("/kids-practice/");
    if (location.protocol.indexOf("http") === 0 && i >= 0) return location.origin + p.slice(0, i) + "/kids-practice/";
    return LIVE;
  }

  /* ---------------- SitePoints ---------------- */
  var BADGES = [
    { id: "first",   icon: "🌱", name: "第一次答對" },
    { id: "perfect", icon: "💯", name: "第一次滿分" },
    { id: "streak10",icon: "🔥", name: "連對 10 題" },
    { id: "streak20",icon: "🚀", name: "連對 20 題" },
    { id: "days3",   icon: "📅", name: "連續練習 3 天" },
    { id: "days7",   icon: "🗓️", name: "連續練習 7 天" },
    { id: "lit1",    icon: "🧩", name: "第一組素養題全對" },
    { id: "lit10",   icon: "🎓", name: "素養題達人（10 組全對）" },
    { id: "p500",    icon: "⭐", name: "累積 500 點" },
    { id: "p2000",   icon: "🌟", name: "累積 2000 點" },
    { id: "p5000",   icon: "🏆", name: "累積 5000 點" }
  ];
  function kidFromPath() {
    var m = location.pathname.match(/\/kids-practice\/([a-z0-9]+)\//i);
    return m && m[1] !== "template" && m[1] !== "shadowing" ? m[1] : null;
  }
  function today() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function dayDiff(a, b) { return Math.round((new Date(b) - new Date(a)) / 864e5); }
  function load(kid) {
    var d = null;
    try { d = JSON.parse(localStorage.getItem("kp-points-" + kid) || "null"); } catch (e) {}
    return d || { points: 0, today: "", todayPts: 0, days: [], badges: {}, correct: 0, perfects: 0, lit: 0, bestStreak: 0 };
  }
  function save(kid, d) { try { localStorage.setItem("kp-points-" + kid, JSON.stringify(d)); } catch (e) {} }
  function dayStreak(days) {
    if (!days.length) return 0;
    var s = days.slice().sort(), n = 1;
    if (dayDiff(s[s.length - 1], today()) > 1) return 0;
    for (var i = s.length - 1; i > 0; i--) { if (dayDiff(s[i - 1], s[i]) === 1) n++; else break; }
    return n;
  }
  var kid = kidFromPath(), streak = 0;
  function toast(html, big) {
    var t = document.createElement("div");
    t.className = "sp-toast" + (big ? " sp-big" : "");
    t.innerHTML = html;
    document.body.appendChild(t);
    setTimeout(function () { t.classList.add("sp-out"); }, big ? 2200 : 900);
    setTimeout(function () { t.remove(); }, big ? 2700 : 1300);
  }
  function grant(d, id) {
    if (d.badges[id]) return;
    d.badges[id] = today();
    var b = BADGES.filter(function (x) { return x.id === id; })[0];
    if (b) toast("🏅 獲得徽章<br><b>" + b.icon + " " + b.name + "</b>", true);
  }
  function update(fn) {
    if (!kid) return;
    var d = load(kid), t = today();
    if (d.today !== t) { d.today = t; d.todayPts = 0; }
    if (d.days.indexOf(t) < 0) { d.days.push(t); if (d.days.length > 60) d.days = d.days.slice(-60); }
    fn(d);
    var ds = dayStreak(d.days);
    if (ds >= 3) grant(d, "days3");
    if (ds >= 7) grant(d, "days7");
    if (d.points >= 500) grant(d, "p500");
    if (d.points >= 2000) grant(d, "p2000");
    if (d.points >= 5000) grant(d, "p5000");
    save(kid, d);
  }
  var SitePoints = {
    kid: kid,
    badges: BADGES,
    read: function (k) { var d = load(k || kid); d.dayStreak = dayStreak(d.days); return d; },
    answer: function (ok) {
      update(function (d) {
        if (ok) {
          streak++;
          var pts = 10 + Math.min(10, (streak - 1) * 2);
          d.points += pts; d.todayPts += pts; d.correct++;
          d.bestStreak = Math.max(d.bestStreak, streak);
          grant(d, "first");
          if (streak >= 10) grant(d, "streak10");
          if (streak >= 20) grant(d, "streak20");
          toast("+" + pts);
        } else { streak = 0; }
      });
    },
    roundEnd: function (pct) {
      if (pct >= 100) update(function (d) { d.perfects++; grant(d, "perfect"); });
    },
    literacy: function (allOk) {
      if (allOk) update(function (d) { d.lit++; grant(d, "lit1"); if (d.lit >= 10) grant(d, "lit10"); });
    }
  };
  window.SitePoints = SitePoints;

  /* auto-hooks for the 中文部 engine (global rtAns / celebrate) */
  if (typeof window.rtAns === "function" && !window.rtAns.__sp) {
    var oAns = window.rtAns;
    window.rtAns = function (right) { try { SitePoints.answer(!!right); } catch (e) {} return oAns.apply(this, arguments); };
    window.rtAns.__sp = true;
  }
  if (typeof window.celebrate === "function" && !window.celebrate.__sp) {
    var oCel = window.celebrate;
    window.celebrate = function () { try { SitePoints.roundEnd(100); } catch (e) {} return oCel.apply(this, arguments); };
    window.celebrate.__sp = true;
  }

  /* ---------------- styles ---------------- */
  var css = document.createElement("style");
  css.textContent =
    "#sh-btn{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:9000;" +
    "height:44px;padding:0 14px 0 10px;border-radius:999px;border:2px solid rgba(255,255,255,.9);background:#334155;color:#fff;font:700 16px/1 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;" +
    "box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;opacity:.9;touch-action:manipulation;white-space:nowrap}" +
    "#sh-btn:active{transform:scale(.94)}" +
    "#sh-mask{position:fixed;inset:0;z-index:9001;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px}" +
    "#sh-card{background:#fff;color:#0f172a;border-radius:18px;padding:20px 18px;max-width:340px;width:100%;text-align:center;" +
    "font:17px/1.5 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.3)}" +
    "#sh-card h3{margin:0 0 6px;font-size:20px}#sh-card p{margin:0 0 16px;color:#475569;font-size:15px}" +
    "#sh-card button{font:inherit;min-height:48px;border-radius:12px;border:0;padding:10px 16px;margin:4px;cursor:pointer}" +
    "#sh-go{background:#0284c7;color:#fff;font-weight:700}#sh-stay{background:#e2e8f0;color:#0f172a}" +
    "@media (prefers-color-scheme:dark){#sh-card{background:#1e293b;color:#e2e8f0}#sh-card p{color:#94a3b8}#sh-stay{background:#334155;color:#e2e8f0}}" +
    "body{padding-bottom:max(76px,calc(64px + env(safe-area-inset-bottom)))!important}" +
    ".sp-toast{position:fixed;left:max(84px,calc(72px + env(safe-area-inset-left)));bottom:max(18px,calc(6px + env(safe-area-inset-bottom)));z-index:9002;" +
    "background:#f59e0b;color:#1f2937;font:800 16px/1.3 -apple-system,'PingFang TC',sans-serif;padding:8px 12px;border-radius:999px;" +
    "box-shadow:0 4px 12px rgba(0,0,0,.25);pointer-events:none;transition:opacity .4s,transform .4s}" +
    ".sp-toast.sp-big{left:50%;bottom:auto;top:30%;transform:translateX(-50%);text-align:center;font-size:18px;padding:14px 22px;border-radius:18px}" +
    ".sp-toast.sp-out{opacity:0;transform:translateY(-14px)}.sp-toast.sp-big.sp-out{transform:translate(-50%,-14px)}";
  document.head.appendChild(css);

  /* ---------------- 📚 小站 button ---------------- */
  if (!document.body) return;
  var b = document.createElement("button");
  b.id = "sh-btn"; b.type = "button";
  b.setAttribute("aria-label", "回到練習小站"); b.title = "回到練習小站";
  b.textContent = "📚 小站";
  b.addEventListener("click", function () {
    if (document.getElementById("sh-mask")) return;
    var m = document.createElement("div"); m.id = "sh-mask";
    var pts = kid ? "<p>目前集點：⭐ " + load(kid).points + " 點</p>" : "";
    m.innerHTML = '<div id="sh-card" role="dialog" aria-modal="true"><h3>📚 回到練習小站？</h3>' +
      '<p>這一輪的作答不會保留（點數和最高分紀錄會留著）。</p>' + pts +
      '<button id="sh-go" type="button">回到練習小站</button><button id="sh-stay" type="button">繼續練習</button></div>';
    document.body.appendChild(m);
    function close() { m.remove(); }
    m.addEventListener("click", function (e) { if (e.target === m) close(); });
    document.getElementById("sh-stay").addEventListener("click", close);
    document.getElementById("sh-go").addEventListener("click", function () {
      try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
      location.href = homeUrl();
    });
    document.getElementById("sh-go").focus();
  });
  document.body.appendChild(b);
})();
</script>
