<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audrey's Grammar Final Review ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #FF7DA0; /* plurals rose */
    --c2: #6EC6FF; /* Demonstratives sky */
    --c3: #7EECC4; /* Can mint */
    --c4: #FFAD7D; /* Commands peach */
    --c5: #BFA9FF; /* mock exam lavender */
    --correct: #34C98A;
    --wrong: #FF5A7A;
    --text: #2D3A4A;
    --muted: #7A8FA6;
    --card: #ffffff;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: #F0F6FF;
    min-height: 100vh;
    color: var(--text);
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px 24px 16px;
    text-align: center;
  }
  header h1 { font-family:'Baloo 2',cursive; font-size:1.9rem; font-weight:800; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,0.2); }
  header p { color:rgba(255,255,255,0.85); font-size:0.88rem; margin-top:4px; }

  /* EXAM INFO BANNER */
  .exam-banner {
    background: #fff8e1;
    border-left: 5px solid #f5c400;
    margin: 14px 16px 0;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 0.88rem;
    font-weight: 700;
    color: #7a5800;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* UNIT CARDS (home) */
  .home-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 16px;
  }
  .unit-card {
    border-radius: 20px;
    padding: 20px 16px;
    cursor: pointer;
    transition: transform 0.18s, box-shadow 0.18s;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    border: none;
    text-align: left;
    font-family: 'Nunito', sans-serif;
  }
  .unit-card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0,0,0,0.13); }
  .unit-card .card-emoji { font-size: 2.2rem; margin-bottom: 8px; display: block; }
  .unit-card .card-title { font-family:'Baloo 2',cursive; font-size:1.05rem; font-weight:800; color:#fff; line-height:1.2; }
  .unit-card .card-sub { font-size:0.75rem; color:rgba(255,255,255,0.85); margin-top:4px; font-weight:600; }
  .unit-card .card-count { position:absolute; top:12px; right:14px; background:rgba(255,255,255,0.3); border-radius:20px; padding:2px 10px; font-size:0.75rem; font-weight:800; color:#fff; }
  .unit-card.u1 { background: linear-gradient(135deg, #FF7DA0, #ff5580); }
  .unit-card.u2 { background: linear-gradient(135deg, #6EC6FF, #3aabff); }
  .unit-card.u3 { background: linear-gradient(135deg, #7EECC4, #3ddba8); }
  .unit-card.u4 { background: linear-gradient(135deg, #FFAD7D, #ff8c45); }
  .unit-card.u5 { grid-column: 1 / -1; background: linear-gradient(135deg, #BFA9FF, #9b7eff); }
  .unit-card.u5 .card-emoji { display:inline; }
  .unit-card.u6 { grid-column: 1 / -1; background: linear-gradient(135deg, #FF6B6B, #FF8E53); }

  /* ORAL TEST */
  .oral-view { display:none; }
  .oral-view.active { display:block; }
  .oral-header {
    background: linear-gradient(135deg, #FF6B6B, #FF8E53);
    padding: 16px 20px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .oral-card {
    background: #fff;
    border-radius: 24px;
    margin: 16px 16px 12px;
    padding: 28px 20px 24px;
    box-shadow: 0 8px 32px rgba(255,107,107,0.15);
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .oral-q-num { font-size: 0.78rem; font-weight: 800; color: #FF6B6B; letter-spacing: 2px; text-transform: uppercase; }
  .oral-q-text { font-family: 'Baloo 2', cursive; font-size: 1.4rem; font-weight: 800; color: #2D3A4A; line-height: 1.4; }
  .oral-example { background: #fff8f0; border-radius: 12px; padding: 10px 14px; font-size: 0.84rem; color: #999; font-style: italic; line-height: 1.6; width: 100%; text-align: left; }

  /* BUTTONS ROW */
  .oral-btn-row { display: flex; gap: 14px; justify-content: center; align-items: center; margin-top: 4px; }
  .oral-speak-btn {
    background: linear-gradient(135deg, #6EC6FF, #3aabff);
    color: white; border: none; border-radius: 50%; width: 64px; height: 64px;
    font-size: 1.7rem; cursor: pointer; box-shadow: 0 4px 16px rgba(110,198,255,0.4);
    transition: all 0.2s; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .oral-speak-btn:hover { transform: scale(1.08); }
  .oral-speak-btn.speaking { background: linear-gradient(135deg, #667eea, #764ba2); animation: pulse 1s infinite; }

  .oral-rec-btn {
    background: linear-gradient(135deg, #FF6B6B, #FF8E53);
    color: white; border: none; border-radius: 50%; width: 72px; height: 72px;
    font-size: 2rem; cursor: pointer; box-shadow: 0 4px 18px rgba(255,107,107,0.4);
    transition: all 0.2s; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .oral-rec-btn.recording { background: linear-gradient(135deg, #c0002a, #ff4444); animation: pulse 0.7s infinite; box-shadow: 0 0 0 6px rgba(255,68,68,0.25); }
  .oral-rec-btn:hover { transform: scale(1.08); }

  .oral-play-btn {
    background: linear-gradient(135deg, #7EECC4, #3ddba8);
    color: white; border: none; border-radius: 50%; width: 56px; height: 56px;
    font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 14px rgba(126,236,196,0.4);
    transition: all 0.2s; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .oral-play-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .oral-play-btn:not(:disabled):hover { transform: scale(1.08); }

  .oral-rec-label { font-size: 0.75rem; font-weight: 800; color: #aaa; text-align: center; margin-top: 2px; }
  .oral-rec-status { font-size: 0.82rem; font-weight: 700; color: #FF6B6B; min-height: 20px; }

  /* NAV */
  .oral-dots { display: flex; justify-content: center; gap: 8px; margin: 8px 0 4px; }
  .oral-dot { width: 10px; height: 10px; border-radius: 50%; background: #ddd; transition: all 0.2s; }
  .oral-dot.active { background: #FF6B6B; transform: scale(1.3); }
  .oral-nav { display: flex; gap: 12px; margin: 0 16px 24px; }
  .oral-nav-btn { flex: 1; padding: 13px; border-radius: 16px; border: none; font-size: 0.95rem; font-weight: 800; cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.18s; }
  .oral-prev { background: #f0f0f0; color: #666; }
  .oral-next { background: linear-gradient(135deg, #FF6B6B, #FF8E53); color: white; }
  .oral-next:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(255,107,107,0.4); }
  .oral-tip-banner { margin: 10px 16px 6px; background: #fff8f0; border-left: 4px solid #FF8E53; border-radius: 10px; padding: 9px 14px; font-size: 0.8rem; font-weight: 700; color: #c05a00; }
  .oral-btn-labels { display:flex; gap:14px; justify-content:center; }
  .oral-btn-col { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .oral-sample-box {
    width: 100%;
    background: linear-gradient(135deg, #f0fff8, #e8f8ff);
    border: 2px solid #7EECC4;
    border-radius: 14px;
    padding: 12px 14px;
    text-align: left;
  }
  .oral-sample-label { font-size: 0.75rem; font-weight: 800; color: #1a7a50; margin-bottom: 6px; letter-spacing: 0.5px; }
  .oral-sample-text { font-size: 0.92rem; font-weight: 600; color: #2D3A4A; line-height: 1.6; margin-bottom: 10px; }
  .oral-sample-play {
    background: linear-gradient(135deg, #7EECC4, #3ddba8);
    color: white; border: none; border-radius: 20px;
    padding: 7px 18px; font-size: 0.85rem; font-weight: 800;
    cursor: pointer; font-family: 'Nunito', sans-serif;
    transition: all 0.18s;
  }
  .oral-sample-play:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(126,236,196,0.5); }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }

  /* PROGRESS RING on card */
  .card-progress { font-size:0.72rem; color:rgba(255,255,255,0.9); margin-top:6px; font-weight:700; }

  /* SECTION VIEW */
  .section-view { display:none; padding: 0 0 40px; }
  .section-view.active { display:block; }

  /* SECTION HEADER */
  .sec-header {
    padding: 16px 20px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .back-btn {
    background: rgba(255,255,255,0.3);
    border: none;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-weight: 800;
    cursor: pointer;
    color: #fff;
    font-family: 'Nunito', sans-serif;
  }
  .sec-title { font-family:'Baloo 2',cursive; font-size:1.2rem; font-weight:800; color:#fff; }

  /* PROGRESS BAR */
  .prog-wrap { background:rgba(255,255,255,0.3); border-radius:20px; height:8px; margin:0 20px 14px; overflow:hidden; }
  .prog-bar { height:100%; background:#fff; border-radius:20px; transition:width 0.4s; }
  .prog-label { text-align:center; font-size:0.78rem; color:rgba(255,255,255,0.9); font-weight:700; margin-bottom:10px; }

  /* QUESTIONS */
  main { padding: 0 14px 20px; }
  .q-card {
    background: var(--card);
    border-radius: 18px;
    padding: 20px 18px 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    border-top: 4px solid #ddd;
  }
  .q-num { font-size:0.72rem; font-weight:800; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; }
  .q-text { font-size:1.05rem; font-weight:700; color:var(--text); line-height:1.5; margin-bottom:12px; }
  .q-hint { font-size:0.78rem; color:var(--muted); margin-bottom:10px; background:#f5f8ff; border-radius:8px; padding:5px 10px; display:inline-block; }

  /* MC */
  .choices { display:grid; gap:8px; }
  .choice-btn {
    background:#f4f9ff; border:2px solid #d8eaff; border-radius:12px;
    padding:11px 14px; font-size:0.93rem; font-weight:600; cursor:pointer;
    text-align:left; transition:all 0.15s; color:var(--text); font-family:'Nunito',sans-serif;
  }
  .choice-btn:hover:not(:disabled) { background:#e0f0ff; border-color:#6EC6FF; }
  .choice-btn.reveal-correct { background:#d4fbe8!important; border-color:var(--correct)!important; color:#1a7a50!important; }
  .choice-btn.selected-wrong { background:#ffe0e6!important; border-color:var(--wrong)!important; color:#c0002a!important; }

  /* FILL */
  .fill-input {
    border:2px solid #d8eaff; border-radius:10px; padding:10px 14px;
    font-size:1rem; font-family:'Nunito',sans-serif; font-weight:600;
    width:100%; outline:none; background:#f4f9ff; color:var(--text);
    transition:border 0.2s;
  }
  .fill-input:focus { border-color:#6EC6FF; background:#fff; }
  .fill-input.correct { border-color:var(--correct); background:#d4fbe8; }
  .fill-input.wrong { border-color:var(--wrong); background:#ffe0e6; }

  /* TF */
  .tf-row { display:flex; gap:10px; }
  .tf-btn {
    flex:1; padding:11px; border-radius:12px; border:2px solid #d8eaff;
    font-size:1rem; font-weight:800; cursor:pointer; font-family:'Nunito',sans-serif;
    background:#f4f9ff; transition:all 0.15s;
  }
  .tf-btn.t-btn { color:#1a7a50; }
  .tf-btn.f-btn { color:#c0002a; }
  .tf-btn.reveal-correct { background:#d4fbe8!important; border-color:var(--correct)!important; }
  .tf-btn.selected-wrong { background:#ffe0e6!important; border-color:var(--wrong)!important; }

  /* FEEDBACK */
  .feedback { margin-top:10px; padding:9px 12px; border-radius:10px; font-size:0.88rem; font-weight:700; display:none; }
  .feedback.show { display:block; }
  .feedback.ok { background:#d4fbe8; color:#1a7a50; }
  .feedback.bad { background:#ffe0e6; color:#c0002a; }

  /* CORRECT ANSWER BOX */
  .ca-box { margin-top:8px; background:#fffbe6; border:2px dashed #f5c400; border-radius:10px; padding:8px 12px; display:none; }
  .ca-box.show { display:block; }
  .ca-label { font-size:0.72rem; color:#a07800; font-weight:700; margin-bottom:2px; }
  .ca-value { font-size:1.1rem; font-weight:800; color:#2D3A4A; }
  .ca-form { font-size:0.82rem; color:#666; margin-top:2px; font-style:italic; }

  /* BUTTONS */
  .btn-row { display:flex; gap:8px; margin-top:12px; }
  .btn { padding:9px 20px; border-radius:18px; border:none; font-size:0.9rem; font-weight:800; cursor:pointer; font-family:'Nunito',sans-serif; transition:all 0.15s; }
  .btn-check { background:#6EC6FF; color:#fff; }
  .btn-check:hover { background:#4db8ff; }
  .btn-submit-sec { background:linear-gradient(90deg,#FF7DA0,#FFAD7D); color:#fff; font-size:0.95rem; padding:12px 28px; border-radius:20px; border:none; font-weight:800; cursor:pointer; font-family:'Nunito',sans-serif; display:block; margin:6px auto 0; transition:all 0.18s; }
  .btn-submit-sec:hover { transform:translateY(-2px); box-shadow:0 4px 16px rgba(255,125,160,0.4); }
  .btn-reset { background:#BFA9FF; color:#fff; }

  /* RESULT */
  .result-panel { background:#fff; border-radius:22px; padding:28px 20px; text-align:center; box-shadow:var(--shadow); margin:0 14px; }
  .result-emoji { font-size:3.5rem; }
  .result-stars { font-size:1.8rem; margin:6px 0; }
  .result-score { font-family:'Baloo 2',cursive; font-size:2.8rem; font-weight:800; }
  .result-msg { font-size:1rem; font-weight:700; margin:6px 0 14px; color:var(--text); }
  .review-title { font-family:'Baloo 2',cursive; font-size:1rem; font-weight:800; margin:18px 0 10px; text-align:left; }
  .review-wrong { color:var(--wrong); }
  .review-ok { color:var(--correct); }
  .r-item { border-radius:12px; padding:12px 14px; margin-bottom:8px; text-align:left; }
  .r-item.bad { background:#fff5f7; border-left:4px solid var(--wrong); }
  .r-item.good { background:#f0fff8; border-left:4px solid var(--correct); padding:8px 14px; }
  .r-q { font-size:0.82rem; color:#aaa; margin-bottom:4px; }
  .r-qtext { font-size:0.93rem; font-weight:700; color:var(--text); margin-bottom:6px; }
  .r-ans-row { display:flex; flex-direction:column; gap:5px; }
  .r-user { background:#ffe0e6; border-radius:8px; padding:5px 10px; font-size:0.88rem; }
  .r-user span { color:#c0002a; font-weight:700; }
  .r-correct { background:#d4fbe8; border-radius:8px; padding:5px 10px; font-size:0.88rem; }
  .r-correct span { color:#1a7a50; font-weight:800; font-size:0.95rem; }
  .r-form { font-size:0.78rem; color:#666; font-style:italic; margin-top:2px; }

  /* ORAL SCORING & KEYWORDS */
  .oral-tag { font-size:0.72rem; font-weight:800; color:#FF6B6B; background:#fff0f3; border-radius:20px; padding:3px 12px; display:inline-block; margin-bottom:4px; }
  .oral-structure-box { width:100%; background:#f4f0ff; border:2px solid #BFA9FF; border-radius:12px; padding:10px 14px; text-align:left; }
  .oral-struct-label { font-size:0.72rem; font-weight:800; color:#6b4fa8; margin-bottom:4px; }
  .oral-struct-text { font-size:0.9rem; font-weight:700; color:#2D3A4A; line-height:1.6; }
  .oral-kw-box { width:100%; text-align:left; }
  .oral-kw-label { font-size:0.72rem; font-weight:800; color:#c07800; margin-bottom:6px; }
  .oral-kw-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .kw-chip { background:#fff8e1; border:2px solid #f5c400; border-radius:20px; padding:4px 12px; font-size:0.85rem; font-weight:800; color:#7a5800; transition:all 0.3s; }
  .kw-chip.kw-matched { background:#d4fbe8; border-color:#34C98A; color:#1a7a50; }
  .oral-score-badge { border:2.5px solid; border-radius:20px; padding:6px 18px; font-size:1rem; font-weight:800; display:inline-block; margin-top:4px; }
  .oral-transcript { background:#f5f5f5; border-radius:10px; padding:8px 12px; font-size:0.82rem; color:#666; text-align:left; width:100%; margin-top:4px; font-style:italic; }
  .oral-transcript-label { font-weight:800; color:#aaa; font-style:normal; }
  .oral-score-btn {
    background:linear-gradient(135deg,#BFA9FF,#9b7eff); color:white; border:none;
    border-radius:50%; width:64px; height:64px; font-size:1.7rem; cursor:pointer;
    box-shadow:0 4px 16px rgba(191,169,255,0.4); transition:all 0.2s;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .oral-score-btn:hover { transform:scale(1.08); }

  @media(max-width:480px) {
    .home-grid { grid-template-columns:1fr; }
    .unit-card.u5 { grid-column:1; }
    header h1 { font-size:1.5rem; }
  }
</style>
</head>
<body>

<header>
  <h1>✨ Audrey's Grammar Review</h1>
  <p>Ming Der Bilingual · Beethoven · 2026 Spring Final</p>
</header>

<div id="homeView">
  <div class="exam-banner">📅 Grammar Exam: June 11 (Thu) · Pathway 2 Unit 3 &amp; Unit 6</div>
  <div class="home-grid" id="homeGrid">
    <!-- rendered by JS -->
  </div>
</div>

<!-- Section views rendered by JS -->
<div id="sectionArea"></div>
<div id="oralArea"></div>

<script>
// ============================================================
// QUESTION BANKS — 4 themes + 1 mock exam
// ============================================================

const units = [
  // ── 1. Plurals ──────────────────────────────────────────
  {
    id: 0, emoji: '🔢', title: 'Plurals', sub: 'Singular & Plural Nouns', color: '#FF7DA0',
    gradient: 'linear-gradient(135deg,#FF7DA0,#ff5580)',
    tip: 'Remember: fish/sheep/deer never change! mouse→mice, child→children, foot→feet',
    questions: [
      // Regular plurals
      { type:'fill', q:'one book → two ______', hint:'+s', answer:'books' },
      { type:'fill', q:'one frog → two ______', hint:'+s', answer:'frogs' },
      { type:'fill', q:'one guitar → two ______', hint:'+s', answer:'guitars' },
      { type:'fill', q:'one key → two ______', hint:'vowel + y → just add s', answer:'keys' },
      { type:'fill', q:'one baby → two ______', hint:'y → ies', answer:'babies' },
      { type:'fill', q:'one butterfly → two ______', hint:'y → ies', answer:'butterflies' },
      { type:'fill', q:'one fly → two ______', hint:'y → ies', answer:'flies' },
      { type:'fill', q:'one tomato → two ______', hint:'+es', answer:'tomatoes' },
      { type:'fill', q:'one box → two ______', hint:'+es', answer:'boxes' },
      { type:'fill', q:'one fox → two ______', hint:'+es', answer:'foxes' },
      { type:'fill', q:'one glass → two ______', hint:'+es', answer:'glasses' },
      { type:'fill', q:'one brush → two ______', hint:'+es', answer:'brushes' },
      { type:'fill', q:'one torch → two ______', hint:'+es', answer:'torches' },
      { type:'fill', q:'one wolf → two ______', hint:'f → ves', answer:'wolves' },
      { type:'fill', q:'one knife → two ______', hint:'fe → ves', answer:'knives' },
      { type:'fill', q:'one leaf → two ______', hint:'f → ves', answer:'leaves' },
      // Irregular plurals
      { type:'fill', q:'one foot → two ______', hint:'irregular', answer:'feet' },
      { type:'fill', q:'one tooth → two ______', hint:'irregular', answer:'teeth' },
      { type:'fill', q:'one man → two ______', hint:'irregular', answer:'men' },
      { type:'fill', q:'one woman → two ______', hint:'irregular', answer:'women' },
      { type:'fill', q:'one child → two ______', hint:'irregular', answer:'children' },
      { type:'fill', q:'one mouse → two ______', hint:'irregular', answer:'mice' },
      { type:'fill', q:'one person → two ______', hint:'irregular', answer:'people' },
      { type:'fill', q:'one ox → two ______', hint:'irregular: -en', answer:'oxen' },
      // Unchanged plurals
      { type:'fill', q:'one fish → two ______', hint:'no change', answer:'fish' },
      { type:'fill', q:'one sheep → two ______', hint:'no change', answer:'sheep' },
      { type:'fill', q:'one deer → two ______', hint:'no change', answer:'deer' },
      // Sentence fill-ins
      { type:'fill', q:'The ______ are flying in the sky. (bird)', hint:'plural: +s', answer:'birds' },
      { type:'fill', q:'My ______ hurt when I eat ice cream. (tooth)', hint:'irregular plural', answer:'teeth' },
      { type:'fill', q:'Many ______ are standing near the lake. (deer)', hint:'no change', answer:'deer' },
      { type:'fill', q:'Look at the ______! They are shopping. (woman)', hint:'irregular plural', answer:'women' },
      { type:'fill', q:'We can see many ______ in the pond. (fish)', hint:'no change', answer:'fish' },
      { type:'fill', q:'The ______ are reading a storybook. (child)', hint:'irregular plural', answer:'children' },
      { type:'fill', q:'The ______ are working in the office. (man)', hint:'irregular plural', answer:'men' },

// ============================================================
// STATE
// ============================================================
let state = units.map(u => ({
  answers: new Array(u.questions.length).fill(null),
  checked: new Array(u.questions.length).fill(false),
  submitted: false, score: 0
}));
let currentUnit = -1;

// ============================================================
// HELPERS
// ============================================================
function norm(s) { return (s||'').trim().toLowerCase().replace(/[.,!?''']/g,'').replace(/\s+/g,' '); }
function check(q, userAns) {
  if (q.type==='tf') return userAns===q.answer;
  const c=norm(q.answer), u=norm(userAns);
  if (c===u) return true;
  // variants
  if (c==="can't"&&(u==="cant"||u==="cannot")) return true;
  if (c==="don't"&&(u==="dont"||u==="do not")) return true;
  if (c==="let's"&&u==="lets") return true;
  if (c==="don't drive"&&(u==="dont drive"||u==="do not drive")) return true;
  if (c==="isn't"&&(u==="isnt"||u==="is not")) return true;
  return false;
}
function pct(idx) {
  const st=state[idx], qs=units[idx].questions;
  if (!st.submitted) return null;
  return Math.round(st.score/qs.length*100);
}
function scoreLabel(p) {
  if (p>=90) return {emoji:'🏆',msg:'Outstanding! 🎊',stars:3};
  if (p>=75) return {emoji:'🌟',msg:'Great work! Keep it up!',stars:2};
  if (p>=60) return {emoji:'😊',msg:'Good job! Almost there!',stars:1};
  return {emoji:'📚',msg:'Keep practicing! You can do it!',stars:0};
}

// ============================================================
// HOME
// ============================================================
function renderHome() {
  currentUnit=-1;
  document.getElementById('homeView').style.display='block';
  document.getElementById('sectionArea').innerHTML='';
  const grid=document.getElementById('homeGrid');
  grid.innerHTML='';
  units.forEach((u,i)=>{
    const st=state[i];
    const answered=st.answers.filter(a=>a!==null).length;
    const total=u.questions.length;
    const p=pct(i);
    const card=document.createElement('button');
    card.className=`unit-card u${i+1}`;
    card.onclick=()=>renderSection(i);
    let progressTxt = st.submitted
      ? `✅ Done! Score ${st.score}/${total} (${p}%)`
      : answered>0 ? `In progress ${answered}/${total}` : `${total} questions`;
    card.innerHTML=`
      <span class="card-count">${progressTxt}</span>
      <span class="card-emoji">${u.emoji}</span>
      <div class="card-title">${u.title}</div>
      <div class="card-sub">${u.sub}</div>
    `;
    grid.appendChild(card);
  });

  // Oral Test card (special)
  const oralCard=document.createElement('button');
  oralCard.className='unit-card u6';
  oralCard.onclick=()=>renderOral();
  oralCard.innerHTML=`
    <span class="card-count">6 questions · speak aloud</span>
    <span class="card-emoji">🎤</span>
    <div class="card-title">Oral Test</div>
    <div class="card-sub">Live English · World of Work</div>
  `;
  grid.appendChild(oralCard);
}

// ============================================================
// SECTION
// ============================================================
function renderSection(idx) {
  currentUnit=idx;
  document.getElementById('homeView').style.display='none';
  const u=units[idx], st=state[idx];
  const area=document.getElementById('sectionArea');

  const answered=st.answers.filter(a=>a!==null).length;
  const total=u.questions.length;

  let html=`<div class="section-view active" style="background:${u.gradient}">
    <div class="sec-header">
      <button class="back-btn" onclick="renderHome()">← Back</button>
      <div class="sec-title">${u.emoji} ${u.title}</div>
    </div>
    <div class="prog-label">Progress ${answered} / ${total}</div>
    <div class="prog-wrap"><div class="prog-bar" id="progBar" style="width:${answered/total*100}%"></div></div>
  </div>`;
  area.innerHTML=html;

  // tip banner
  const tipDiv=document.createElement('div');
  tipDiv.style.cssText='margin:12px 14px 4px;background:#fff8e1;border-left:4px solid #f5c400;border-radius:10px;padding:8px 12px;font-size:0.8rem;font-weight:700;color:#7a5800;';
  tipDiv.textContent='💡 '+u.tip;
  area.appendChild(tipDiv);

  if(st.submitted){ renderResult(idx,area); return; }

  const mainDiv=document.createElement('main');
  u.questions.forEach((q,i)=>{
    const card=document.createElement('div');
    card.className='q-card';
    card.style.borderTopColor=u.color;
    card.id=`qc${i}`;
    let inner=`<div class="q-num">${u.title} · Q${i+1}</div><div class="q-text">${q.q}</div>`;
    if(q.hint) inner+=`<div class="q-hint">💡 ${q.hint}</div>`;
    if(q.type==='mc'){
      inner+=`<div class="choices">`+q.choices.map((c,ci)=>
        `<button class="choice-btn" id="cb${i}-${ci}" onclick="selMC(${idx},${i},${ci},'${c.replace(/'/g,"\\'")}',this)">${String.fromCharCode(65+ci)}) ${c}</button>`
      ).join('')+`</div>`;
    } else if(q.type==='fill'){
      inner+=`<input class="fill-input" id="fi${i}" placeholder="Type your answer..."
        oninput="state[${idx}].answers[${i}]=this.value"
        onkeydown="if(event.key==='Enter')checkOne(${idx},${i})"
        value="${st.answers[i]||''}">`;
    } else {
      inner+=`<div class="tf-row">
        <button class="tf-btn t-btn" id="tft${i}" onclick="selTF(${idx},${i},true,this)">✅ True</button>
        <button class="tf-btn f-btn" id="tff${i}" onclick="selTF(${idx},${i},false,this)">❌ False</button>
      </div>`;
    }
    inner+=`<div class="feedback" id="fb${i}"></div>
      <div class="ca-box" id="ca${i}">
        <div class="ca-label">✏️ Correct Answer</div>
        <div class="ca-value" id="cav${i}"></div>
        <div class="ca-form" id="caf${i}"></div>
      </div>
      <div class="btn-row"><button class="btn btn-check" onclick="checkOne(${idx},${i})">Check Answer</button></div>`;
    card.innerHTML=inner;
    mainDiv.appendChild(card);
    if(st.checked[i]) restoreOne(idx,i,q);
  });

  const submitBtn=document.createElement('button');
  submitBtn.className='btn-submit-sec';
  submitBtn.textContent='📊 Submit & See Results';
  submitBtn.onclick=()=>submitSection(idx);
  mainDiv.appendChild(submitBtn);
  area.appendChild(mainDiv);
}

function restoreOne(idx,i,q){
  const st=state[idx], ans=st.answers[i];
  if(ans===null) return;
  const correct=check(q,ans);
  if(q.type==='mc'){
    q.choices.forEach((c,ci)=>{
      const b=document.getElementById(`cb${i}-${ci}`);
      if(!b) return;
      b.disabled=true;
      if(c===q.answer) b.classList.add('reveal-correct');
      if(c===ans&&!correct) b.classList.add('selected-wrong');
    });
  } else if(q.type==='fill'){
    const inp=document.getElementById(`fi${i}`);
    if(inp){inp.disabled=true;inp.classList.add(correct?'correct':'wrong');}
  } else {
    ['t','f'].forEach(k=>{const b=document.getElementById(`tf${k}${i}`);if(b)b.disabled=true;});
    const tb=document.getElementById(`tft${i}`),fb=document.getElementById(`tff${i}`);
    if(tb&&q.answer===true) tb.classList.add('reveal-correct');
    if(fb&&q.answer===false) fb.classList.add('reveal-correct');
    if(ans!==q.answer){const wb=document.getElementById(`tf${ans?'t':'f'}${i}`);if(wb)wb.classList.add('selected-wrong');}
  }
  const fbEl=document.getElementById(`fb${i}`);
  if(fbEl){ fbEl.className=`feedback show ${correct?'ok':'bad'}`; fbEl.textContent=correct?'🎉 Correct! Great job!':'❌ Wrong! See correct answer below 👇'; }
  if(!correct){ showCA(i,q); }
}

function selMC(sIdx,qIdx,ci,val,btn){
  if(state[sIdx].checked[qIdx]) return;
  state[sIdx].answers[qIdx]=val;
  units[sIdx].questions[qIdx].choices.forEach((_,k)=>{const b=document.getElementById(`cb${qIdx}-${k}`);if(b)b.style.background=k===ci?'#cce8ff':'';});
}
function selTF(sIdx,qIdx,val,btn){
  if(state[sIdx].checked[qIdx]) return;
  state[sIdx].answers[qIdx]=val;
  ['t','f'].forEach(k=>{const b=document.getElementById(`tf${k}${qIdx}`);if(b)b.style.background='';});
  btn.style.background='#cce8ff';
}

function checkOne(sIdx,qIdx){
  const st=state[sIdx],q=units[sIdx].questions[qIdx];
  if(st.checked[qIdx]) return;
  if(q.type==='fill'){const inp=document.getElementById(`fi${qIdx}`);if(inp)st.answers[qIdx]=inp.value;}
  if(!st.answers[qIdx]&&st.answers[qIdx]!==false){alert('Please select or type your answer first!');return;}
  st.checked[qIdx]=true;
  const correct=check(q,st.answers[qIdx]);
  if(q.type==='mc'){
    q.choices.forEach((c,ci)=>{
      const b=document.getElementById(`cb${qIdx}-${ci}`);
      if(!b) return; b.disabled=true;
      if(c===q.answer) b.classList.add('reveal-correct');
      if(c===st.answers[qIdx]&&!correct) b.classList.add('selected-wrong');
    });
  } else if(q.type==='fill'){
    const inp=document.getElementById(`fi${qIdx}`);
    if(inp){inp.disabled=true;inp.classList.add(correct?'correct':'wrong');}
  } else {
    ['t','f'].forEach(k=>{const b=document.getElementById(`tf${k}${qIdx}`);if(b)b.disabled=true;});
    const tb=document.getElementById(`tft${qIdx}`),fb=document.getElementById(`tff${qIdx}`);
    if(tb&&q.answer===true) tb.classList.add('reveal-correct');
    if(fb&&q.answer===false) fb.classList.add('reveal-correct');
    if(st.answers[qIdx]!==q.answer){const wb=document.getElementById(`tf${st.answers[qIdx]?'t':'f'}${qIdx}`);if(wb)wb.classList.add('selected-wrong');}
  }
  const fbEl=document.getElementById(`fb${qIdx}`);
  if(fbEl){fbEl.className=`feedback show ${correct?'ok':'bad'}`;fbEl.textContent=correct?'🎉 Correct! Great job!':'❌ Wrong! See correct answer below 👇';}
  if(!correct) showCA(qIdx,q);
  // update progress
  const ans2=state[sIdx].answers.filter(a=>a!==null).length;
  const bar=document.getElementById('progBar'),lbl=document.querySelector('.prog-label');
  if(bar) bar.style.width=`${ans2/units[sIdx].questions.length*100}%`;
  if(lbl) lbl.textContent=`Progress ${ans2} / ${units[sIdx].questions.length}`;
}

function showCA(i,q){
  const box=document.getElementById(`ca${i}`),val=document.getElementById(`cav${i}`),frm=document.getElementById(`caf${i}`);
  if(!box||!val) return;
  box.classList.add('show');
  val.textContent=q.answer;
  if(frm) frm.textContent=q.correctForm?'Full sentence: '+q.correctForm:'';
}

function submitSection(idx){
  const st=state[idx],qs=units[idx].questions;
  const unanswered=qs.filter((_,i)=>!st.answers[i]&&st.answers[i]!==false).length;
  if(unanswered>0&&!confirm(`You have ${unanswered} unanswered questions. Submit anyway?`)) return;
  let score=0;
  qs.forEach((q,i)=>{if(st.answers[i]!==null&&st.answers[i]!==''&&check(q,st.answers[i]))score++;});
  st.score=score; st.submitted=true;
  renderSection(idx);
}

function renderResult(idx,area){
  const st=state[idx],u=units[idx],qs=u.questions;
  const total=qs.length, p=pct(idx), lb=scoreLabel(p);
  let stars=''; for(let i=0;i<3;i++) stars+=i<lb.stars?'⭐':'☆';

  const wrongList=[], okList=[];
  qs.forEach((q,i)=>{ const ans=st.answers[i]; const c=ans!==null&&ans!==''&&check(q,ans); (c?okList:wrongList).push(i); });

  let rHtml=`<div class="result-panel">
    <div class="result-emoji">${lb.emoji}</div>
    <div class="result-stars">${stars}</div>
    <div class="result-score" style="color:${u.color}">${st.score} / ${total}</div>
    <div class="result-msg">${lb.msg}</div>
    <div style="color:var(--muted);font-size:0.85rem;margin-bottom:16px;">Accuracy: ${p}%</div>
    <button class="btn btn-reset" onclick="resetSection(${idx})">🔄 Try Again</button>`;

  if(wrongList.length>0){
    rHtml+=`<div class="review-title review-wrong">📖 Wrong Answers — Review These (${wrongList.length})</div>`;
    wrongList.forEach(i=>{
      const q=qs[i],ans=st.answers[i];
      rHtml+=`<div class="r-item bad">
        <div class="r-q">Q${i+1}</div>
        <div class="r-qtext">${q.q}</div>
        <div class="r-ans-row">
          <div class="r-user">Your answer: <span>${ans||'(not answered)'}</span></div>
          <div class="r-correct">✅ Correct answer: <span>${q.answer}</span>
            ${q.correctForm?`<div class="r-form">Full sentence: ${q.correctForm}</div>`:''}
          </div>
        </div>
      </div>`;
    });
  }
  if(okList.length>0){
    rHtml+=`<div class="review-title review-ok">✅ Correct Answers (${okList.length})</div>`;
    okList.forEach(i=>{
      const q=qs[i];
      rHtml+=`<div class="r-item good"><span style="color:#aaa;font-size:0.75rem;">Q${i+1}</span>　<span style="font-weight:700;">${q.q}</span>　<span style="color:#1a7a50;font-weight:800;">→ ${q.answer}</span></div>`;
    });
  }
  rHtml+=`</div>`;

  const div=document.createElement('div');
  div.style.padding='14px 0';
  div.innerHTML=rHtml;
  area.appendChild(div);
}

function resetSection(idx){
  state[idx]={answers:new Array(units[idx].questions.length).fill(null),checked:new Array(units[idx].questions.length).fill(false),submitted:false,score:0};
  renderSection(idx);
}

// ── Recording ────────────────────────────────────────────
async function toggleRecord() {
  if (mediaRecorder && mediaRecorder.state==='recording') stopRecording();
  else startRecording();
}

function getSupportedMimeType() {
  const types=['audio/mp4','audio/aac','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/ogg'];
  for(const t of types) if(MediaRecorder.isTypeSupported(t)) return t;
  return '';
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    audioChunks=[];
    const mimeType=getSupportedMimeType();
    mediaRecorder=new MediaRecorder(stream, mimeType?{mimeType}:{});
    mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size>0)audioChunks.push(e.data);};
    mediaRecorder.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      const usedType=mediaRecorder.mimeType||mimeType||'audio/webm';
      audioBlob=new Blob(audioChunks,{type:usedType});
      if(audioURL)URL.revokeObjectURL(audioURL);
      audioURL=URL.createObjectURL(audioBlob);
      recordings[oralIdx]={url:audioURL,type:usedType};
      buildOralView();
    };
    mediaRecorder.start(200);
    const rb=document.getElementById('recBtn'),rl=document.getElementById('recLabel'),st=document.getElementById('recStatus');
    if(rb){rb.textContent='⏹';rb.classList.add('recording');}
    if(rl)rl.textContent='Stop';
    if(st)st.textContent='🔴 Recording... tap ⏹ to stop';
  } catch(err) {
    alert('Microphone access denied. Please allow microphone in browser settings.');
  }
}

function stopRecording() {
  if(mediaRecorder&&mediaRecorder.state==='recording') mediaRecorder.stop();
}

function playRecording() {
  const rec=recordings[oralIdx];
  if(!rec)return;
  if(audioPlayer){audioPlayer.pause();audioPlayer=null;}
  audioPlayer=new Audio();
  audioPlayer.src=rec.url;
  const pb=document.getElementById('playBtn');
  audioPlayer.oncanplaythrough=()=>audioPlayer.play().catch(()=>window.open(rec.url,'_blank'));
  audioPlayer.onplay=()=>{if(pb)pb.textContent='⏸';};
  audioPlayer.onended=()=>{if(pb)pb.textContent='▶';audioPlayer=null;};
  audioPlayer.onerror=()=>{window.open(rec.url,'_blank');if(pb)pb.textContent='▶';};
  audioPlayer.load();
}

// ── Speech recognition scoring ───────────────────────────
function startScoring() {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) { alert('Speech recognition not supported on this browser.'); return; }

  if (recognition) { recognition.stop(); recognition=null; return; }

  recognition = new SpeechRec();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 3;

  const btn = document.getElementById('scoreBtn');
  const st  = document.getElementById('recStatus');
  if (btn) { btn.textContent='🔴'; btn.style.background='#FF5A7A'; }
  if (st)  st.textContent = '🎤 Listening... speak now!';

  recognition.onresult = (event) => {
    // Collect all alternatives
    let transcript = '';
    for (let i=0; i<event.results[0].length; i++) {
      transcript += ' ' + event.results[0][i].transcript;
    }
    transcript = transcript.trim().toLowerCase();
    scoreAnswer(transcript);
  };

  recognition.onerror = (e) => {
    if (btn) { btn.textContent='🎯'; btn.style.background=''; }
    if (st)  st.textContent = 'Error: ' + e.error + '. Try again.';
    recognition = null;
  };

  recognition.onend = () => {
    if (btn) { btn.textContent='🎯'; btn.style.background=''; }
    recognition = null;
  };

  recognition.start();
}

function scoreAnswer(transcript) {
  const q = oralQuestions[oralIdx];
  const kws = q.keywords;
  const matchedWords = [];
  const lc = transcript.toLowerCase();

  kws.forEach(kw => {
    const clean = kw.replace(/'/g,"'").toLowerCase();
    if (lc.includes(clean) || lc.includes(clean.replace("'",""))) {
      matchedWords.push(kw);
    }
  });

  const pct = Math.round(matchedWords.length / kws.length * 100);
  scores[oralIdx] = { transcript, matched: matchedWords.length, total: kws.length, pct, matchedWords };
  buildOralView();
}

function oralNav(dir) {
  window.speechSynthesis&&window.speechSynthesis.cancel();
  if(mediaRecorder&&mediaRecorder.state==='recording')stopRecording();
  if(audioPlayer){audioPlayer.pause();audioPlayer=null;}
  if(recognition){recognition.stop();recognition=null;}
  const next=oralIdx+dir;
  if(next<0)return;
  if(next>=oralQuestions.length){exitOral();return;}
  oralIdx=next;
  buildOralView();
}

function exitOral() {
  window.speechSynthesis&&window.speechSynthesis.cancel();
  if(mediaRecorder&&mediaRecorder.state==='recording')stopRecording();
  if(audioPlayer){audioPlayer.pause();audioPlayer=null;}
  if(recognition){recognition.stop();recognition=null;}
  document.getElementById('oralArea').innerHTML='';
  renderHome();
}

// ============================================================
// INIT
// ============================================================
renderHome();
</script>
