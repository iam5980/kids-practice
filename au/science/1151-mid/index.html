<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audrey Science Midterm Practice</title>
<style>
:root{--navy:#0f2a4a;--navy2:#173a63;--sky:#38bdf8;--sky2:#e0f4ff;--green:#16a34a;--red:#dc2626;--yellow:#fde047;--bg:#f1f7fd;--card:#fff;--ink:#0f172a;--muted:#64748b}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:1.1rem;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.25rem}
header .sub{color:#bae6fd;font-size:.9rem}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--navy2);position:sticky;top:var(--hh,62px);z-index:4}
.drillbar{position:sticky;top:var(--navh,132px);z-index:3;display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--bg);padding:8px 0;margin-bottom:8px}
.drillbar .btn{margin:0}.btn.fin{background:#f59e0b;color:#1c1917}
.model.green{background:#dcfce7;border-left-color:var(--green);font-style:normal}
.notice{background:#fff7ed;border:2px solid #fdba74;border-radius:12px;padding:10px 12px;font-size:1rem}
nav button{flex:0 0 auto;min-height:48px;border:0;border-radius:24px;padding:0 16px;font-size:1rem;background:#24507f;color:#fff;cursor:pointer}
nav button.on{background:var(--sky);color:var(--navy);font-weight:700}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 2px 10px rgba(15,42,74,.08);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(15,42,74,.08);cursor:pointer;border:3px solid transparent}
.tile:hover{border-color:var(--sky)}
.tile .ic{font-size:2rem}.tile h3{margin:6px 0}
.bar{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-top:8px}.bar>div{height:100%;background:var(--sky)}
.qnum{color:var(--muted);font-size:.95rem;margin-bottom:6px;display:flex;justify-content:space-between}
.qtext{font-size:1.35rem;font-weight:600;line-height:1.5;margin:6px 0 16px}
.opt{display:block;width:100%;text-align:left;min-height:56px;margin:8px 0;padding:12px 16px;border:2px solid #cbd5e1;border-radius:14px;background:#fff;font-size:1.15rem;cursor:pointer}
.opt.sel{border-color:var(--sky);background:var(--sky2)}
.opt.ok{border-color:var(--green);background:#dcfce7}
.opt.bad{border-color:var(--red);background:#fee2e2}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.locked{opacity:.4}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big2 .opt{text-align:center;font-size:1.3rem;font-weight:700;min-height:72px}
input.txt{width:100%;font-size:1.3rem;padding:14px;border:2px solid #cbd5e1;border-radius:14px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:10px;border:2px dashed #94a3b8;border-radius:12px}
.bank span{background:var(--sky2);padding:6px 12px;border-radius:10px;font-weight:600}
.btn{min-height:54px;padding:0 22px;border:0;border-radius:14px;font-size:1.1rem;font-weight:700;cursor:pointer;margin:8px 8px 0 0}
.btn.pri{background:var(--navy);color:#fff}.btn.sky{background:var(--sky);color:var(--navy)}.btn.gr{background:#e2e8f0;color:var(--ink)}
.btn:disabled{opacity:.4}
.fb{margin-top:14px;padding:14px;border-radius:14px;font-size:1.1rem}
.fb.ok{background:#dcfce7;color:#14532d;font-weight:700}
.fb.bad{background:#fee2e2;color:#7f1d1d}
.ans{background:var(--yellow);color:#1c1917;font-size:1.45rem;font-weight:800;padding:12px 14px;border-radius:12px;margin:10px 0}
.speaker{font-size:3.4rem;text-align:center}
.ready{color:var(--green);font-weight:700;text-align:center;margin:8px 0}
.pill{display:inline-block;background:var(--sky2);color:var(--navy);padding:6px 12px;border-radius:20px;margin:4px;font-weight:600}
.badge{display:inline-block;background:var(--navy);color:#fff;border-radius:20px;padding:4px 12px;font-size:.9rem}
.wave{display:none;gap:4px;height:30px;align-items:center;margin:8px 0}.wave.on{display:flex}
.wave i{width:6px;background:var(--red);border-radius:3px;animation:w 1s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes w{0%,100%{height:6px}50%{height:28px}}
.model{background:#f0f9ff;border-left:6px solid var(--sky);padding:12px;border-radius:10px;font-style:italic;margin:10px 0}
.chk label{display:flex;gap:10px;align-items:center;min-height:46px;font-size:1.05rem}
.chk input{width:26px;height:26px}
.score{font-size:2.6rem;font-weight:800;color:var(--navy);text-align:center}
.rev{border-left:6px solid var(--green);padding:10px 12px;margin:8px 0;background:#f8fafc;border-radius:8px}
.rev.w{border-color:var(--red)}
.vtable{width:100%;border-collapse:collapse;font-size:1rem}.vtable td,.vtable th{border:1px solid #e2e8f0;padding:8px;vertical-align:top}.vtable th{background:var(--navy);color:#fff}
.scorebar{display:flex;gap:10px;flex-wrap:wrap;font-weight:700}
@media (max-width:520px){.big2{grid-template-columns:1fr}.qtext{font-size:1.2rem}}
</style>
</head>

s": "The symbol for oxygen is O2.", "zh": "氧氣", "t": "living"}, {"w": "carbon dioxide", "d": "the gas people or animals breathe out", "s": "Trees absorb carbon dioxide and produce oxygen.", "zh": "二氧化碳", "t": "living"}, {"w": "den", "d": "the home of some types of wild animal", "s": "The fox sleeps in its den.", "zh": "巢穴；窩", "t": "living"}, {"w": "brick", "d": "hard clay used for building walls, houses and other buildings", "s": "The house is made of red bricks.", "zh": "磚", "t": "living"}, {"w": "cell", "d": "the smallest basic unit of living things", "s": "Cells are the building blocks of life.", "zh": "細胞", "t": "living"}, {"w": "building block", "d": "basic materials for building things", "s": "The children used building blocks to make a castle.", "zh": "積木", "t": "living"}, {"w": "microscope", "d": "a device that uses lenses to make very small objects look larger", "s": "They looked at the blood samples under the microscope.", "zh": "顯微鏡", "t": "living"}, {"w": "bacteria", "d": "a very small organism that is too small to be seen by our eyes", "s": "Food must be heated to a high temperature to kill harmful bacteria.", "zh": "細菌", "t": "living"}, {"w": "magnify", "d": "to make something look bigger than it really is", "s": "We can magnify the photo to see more details.", "zh": "放大", "t": "living"}, {"w": "transport", "d": "to move something from one place to another", "s": "Our furniture can easily be transported from the shop to your home.", "zh": "運輸", "t": "living"}, {"w": "regular", "d": "happening or doing something often", "s": "There is a regular bus service to the airport.", "zh": "經常的", "t": "living"}, {"w": "supply", "d": "an amount of something that is provided or available to be used", "s": "Our bodies need a fresh supply of Vitamin C every day.", "zh": "供給量", "t": "living"}, {"w": "observe", "d": "to watch carefully", "s": "We can observe the stars through a telescope.", "zh": "觀察", "t": "living"}, {"w": "rot", "d": "to break down or decompose by a slow, natural process", "s": "The fruit was rotting in the basket.", "zh": "腐爛", "t": "plants"}, {"w": "wildflower", "d": "a flower that grows without having been planted by people", "s": "She picked a wildflower to decorate her room.", "zh": "野花", "t": "plants"}, {"w": "in common", "d": "in the same way as someone or something; shared similar traits", "s": "These two species have several characteristics in common.", "zh": "共同點", "t": "plants"}, {"w": "ground", "d": "the solid surface of the Earth", "s": "We sat on the ground to have a picnic.", "zh": "地面", "t": "plants"}, {"w": "structure", "d": "the way in which the parts of something are connected together", "s": "The cell walls of plants are strong structures.", "zh": "結構", "t": "plants"}, {"w": "stem", "d": "the stick-like central part of a plant that holds up a plant", "s": "A stem carries water, nutrients, and food throughout a plant.", "zh": "莖", "t": "plants"}, {"w": "leaf", "d": "a flat, usually green part of a plant that grows from the stem or branch", "s": "The leaves on the tree are turning red.", "zh": "葉子", "t": "plants"}, {"w": "root", "d": "the part of a plant that grows under the ground", "s": "Roots take in water and food, and they hold the plant in the soil.", "zh": "根", "t": "plants"}, {"w": "fruit", "d": "the part of any plant that holds the seeds", "s": "The fruit grows from the flower of the plant.", "zh": "果實", "t": "plants"}, {"w": "flower", "d": "the colorful part of a plant that makes fruit or seeds", "s": "Did you know that tomato plants grow flowers?", "zh": "花", "t": "plants"}, {"w": "cone", "d": "the hard dry fruit of a pine tree", "s": "The cone contains many small seeds.", "zh": "針葉松的錐形毬果", "t": "plants"}, {"w": "taproot", "d": "a thick main root found in some plants, such as carrots", "s": "Carrots and radishes are thick roots called taproots.", "zh": "軸根；直根", "t": "plants"}, {"w": "nutrient", "d": "any substance that plants or animals need in order to live and grow", "s": "Plants draw minerals and other nutrients from the soil.", "zh": "養分", "t": "plants"}, {"w": "substance", "d": "a type of solid, liquid or gas that has particular qualities; matter", "s": "Rubber is a flexible substance.", "zh": "物質", "t": "plants"}, {"w": "attach", "d": "to join or connect something", "s": "She will attach the button to the shirt.", "zh": "附著", "t": "plants"}, {"w": "upright", "d": "straight up or vertical", "s": "Please keep the vase upright so it doesn't spill.", "zh": "直立的", "t": "plants"}, {"w": "tube", "d": "a long, hollow structure used to carry liquids or gases", "s": "The children played with a tube in the hardware store.", "zh": "管子", "t": "plants"}, {"w": "trunk", "d": "the thick main stem of a tree", "s": "The squirrel climbed up the tree trunk.", "zh": "樹幹", "t": "plants"}, {"w": "photosynthesis", "d": "the process by which a plant uses the energy from the light of the Sun to produce its own food", "s": "Green plants are able to make their own food in a process called photosynthesis.", "zh": "光合作用", "t": "plants"}, {"w": "chlorophyll", "d": "the green substance in plants that allows them to use energy from the Sun", "s": "Chlorophyll gives leaves their green color.", "zh": "葉綠素", "t": "plants"}, {"w": "needle", "d": "a thin metal pin, used in sewing, that is pointed at one end", "s": "Can you thread this needle?", "zh": "針；針葉", "t": "plants"}, {"w": "radish", "d": "a small vegetable, usually red or white and round", "s": "My mom just bought a bunch of radishes from the market.", "zh": "蘿蔔", "t": "plants"}, {"w": "store", "d": "to put or keep things in a special place for use in the future", "s": "Squirrels store nuts for the winter.", "zh": "儲存", "t": "plants"}, {"w": "soak", "d": "to put something in liquid for a time so that it becomes completely wet", "s": "Leave the beans to soak overnight.", "zh": "浸泡", "t": "plants"}], "questions": [{"id": "L1", "tab": "living", "type": "mc", "q": "Living things are called ______.", "c": ["organisms", "cells", "nutrients"], "a": "A", "ex": "Living things are called organisms."}, {"id": "L2", "tab": "living", "type": "mc", "q": "All organisms use ______ to grow.", "c": ["rocks", "energy", "waste"], "a": "B", "ex": "All organisms use energy to grow."}, {"id": "L3", "tab": "living", "type": "mc", "q": "To grow means to ______ with age.", "c": ["change", "sleep", "break"], "a": "A", "ex": "To grow means to change with age."}, {"id": "L4", "tab": "living", "type": "mc", "q": "When a plant is in shade, it responds by bending toward ______.", "c": ["the soil", "sunlight", "the moon"], "a": "B", "ex": "A plant in shade bends toward sunlight."}, {"id": "L5", "tab": "living", "type": "mc", "q": "When a bird sees a cat and senses danger, it may ______.", "c": ["fly high into the trees", "go to sleep", "lay eggs"], "a": "A", "ex": "The bird responds to danger by flying high into the trees."}, {"id": "L6", "tab": "living", "type": "mc", "q": "When a day gets hot, a mouse may go ______ to keep cool.", "c": ["into the sun", "underground", "into a tree"], "a": "B", "ex": "A mouse may go underground to keep cool. That is responding."}, {"id": "L7", "tab": "living", "type": "mc", "q": "To reproduce means to make more of one's own ______.", "c": ["food", "kind", "space"], "a": "B", "ex": "To reproduce means to make more of one's own kind."}, {"id": "L8", "tab": "living", "type": "mc", "q": "An apple tree reproduces by making ______.", "c": ["eggs", "seeds", "cells"], "a": "B", "ex": "Apple seeds can grow into new apple trees."}, {"id": "L9", "tab": "living", "type": "mc", "q": "A turtle reproduces by laying ______.", "c": ["seeds", "cones", "eggs"], "a": "C", "ex": "Young turtles hatch from the eggs."}, {"id": "L10", "tab": "living", "type": "mc", "q": "Which of these is a nonliving thing?", "c": ["a sunflower", "a rock", "a turtle"], "a": "B", "ex": "Rocks do not grow, respond, or reproduce."}, {"id": "L11", "tab": "living", "type": "mc", "q": "Cars and roads are nonliving things made by ______.", "c": ["people", "nature", "plants"], "a": "A", "ex": "Cars and roads are made by people."}, {"id": "L12", "tab": "living", "type": "mc", "q": "Nonliving things do not use energy to grow, respond, or ______.", "c": ["reproduce", "move", "shine"], "a": "A", "ex": "Nonliving things do not grow, respond, or reproduce."}, {"id": "L13", "tab": "living", "type": "mc", "q": "Living things need food, water, space, and ______ to survive.", "c": ["toys", "gases", "money"], "a": "B", "ex": "Living things need food, water, gases, and space."}, {"id": "L14", "tab": "living", "type": "mc", "q": "A living thing will ______ if its needs are not met.", "c": ["grow", "die", "reproduce"], "a": "B", "ex": "A living thing will die if its needs are not met."}, {"id": "L15", "tab": "living", "type": "mc", "q": "An environment is all the living and nonliving things that ______ an organism.", "c": ["surround", "eat", "make"], "a": "A", "ex": "An environment is all the living and nonliving things that surround an organism."}, {"id": "L16", "tab": "living", "type": "mc", "q": "Living things get ______ from food.", "c": ["energy", "oxygen", "cells"], "a": "A", "ex": "Living things get energy from food."}, {"id": "L17", "tab": "living", "type": "mc", "q": "Animals get food by ______.", "c": ["making it from sunlight", "eating other organisms", "drinking water"], "a": "B", "ex": "Animals get food by eating other organisms."}, {"id": "L18", "tab": "living", "type": "mc", "q": "A caterpillar gets the energy it needs to grow by eating ______.", "c": ["rocks", "leaves", "bricks"], "a": "B", "ex": "A caterpillar eats leaves."}, {"id": "L19", "tab": "living", "type": "mc", "q": "More than ______ of your body is water.", "c": ["half", "one tenth", "none"], "a": "A", "ex": "More than half of your body is water."}, {"id": "L20", "tab": "living", "type": "mc", "q": "Living things use water to break down food and get rid of ______.", "c": ["waste", "cells", "space"], "a": "A", "ex": "Water helps living things break down food and get rid of waste."}, {"id": "L21", "tab": "living", "type": "mc", "q": "Living things need a ______ supply of water to stay healthy.", "c": ["regular", "small", "green"], "a": "A", "ex": "Living things need a regular supply of water."}, {"id": "L22", "tab": "living", "type": "mc", "q": "Oxygen is a gas found in ______.", "c": ["rocks and soil", "air and water", "cars and roads"], "a": "B", "ex": "Oxygen is a gas found in air and water."}, {"id": "L23", "tab": "living", "type": "mc", "q": "Fish, clams, and most other sea animals get oxygen from ______.", "c": ["the water around them", "the sand", "the Sun"], "a": "A", "ex": "Sea animals get oxygen from the water around them."}, {"id": "L24", "tab": "living", "type": "mc", "q": "A manatee must come to the surface to take in oxygen from the ______.", "c": ["air", "sand", "plants"], "a": "A", "ex": "A manatee comes up to take in oxygen from the air."}, {"id": "L25", "tab": "living", "type": "mc", "q": "Plants use energy from sunlight to change carbon dioxide and water into ______.", "c": ["food", "rocks", "oxygen tanks"], "a": "A", "ex": "Plants change carbon dioxide and water into food."}, {"id": "L26", "tab": "living", "type": "mc", "q": "Animals need space to move and ______.", "c": ["find food", "make bricks", "change color"], "a": "A", "ex": "Animals need space to move and find food."}, {"id": "L27", "tab": "living", "type": "mc", "q": "Small ______ help foxes stay safe.", "c": ["dens", "cones", "tubes"], "a": "A", "ex": "Foxes live in small dens."}, {"id": "L28", "tab": "living", "type": "mc", "q": "Cells are the building blocks of ______.", "c": ["houses", "life", "rocks"], "a": "B", "ex": "Cells are the building blocks of life."}, {"id": "L29", "tab": "living", "type": "mc", "q": "You need a tool called a ______ to observe cells.", "c": ["microscope", "ruler", "telescope"], "a": "A", "ex": "A microscope makes tiny things look larger."}, {"id": "L30", "tab": "living", "type": "mc", "q": "Organisms made of a single cell, like ______, live in soil, water, and on our skin.", "c": ["bacteria", "bricks", "turtles"], "a": "A", "ex": "Bacteria are made of a single cell."}, {"id": "L31", "tab": "living", "type": "mc", "q": "A building is made of many small bricks. You are made of many small parts called ______.", "c": ["cells", "seeds", "cones"], "a": "A", "ex": "You are made of many small parts called cells."}, {"id": "L32", "tab": "living", "type": "mc", "q": "People need all of the following to survive EXCEPT ______.", "c": ["air", "water", "cars"], "a": "C", "ex": "Cars are not a need. People need air, water, food, and space."}, {"id": "L33", "tab": "living", "type": "mc", "q": "When the weather gets cooler in autumn, a tree responds by ______.", "c": ["losing its leaves", "laying eggs", "flying away"], "a": "A", "ex": "The tree responds by losing its leaves."}, {"id": "L34", "tab": "living", "type": "mc", "q": "Cells are so small that it takes ______ of them to make one little ant.", "c": ["two", "ten", "millions"], "a": "C", "ex": "It takes millions of cells to make one little ant."}, {"id": "L35", "tab": "living", "type": "multi", "q": "What are characteristics of ALL living things? (Choose 2)", "c": ["They grow and change.", "They are made of bricks.", "They reproduce."], "a": ["A", "C"], "ex": "Living things grow, respond, and reproduce."}, {"id": "L36", "tab": "living", "type": "multi", "q": "What do living things need to survive? (Choose 2)", "c": ["water", "cars", "food"], "a": ["A", "C"], "ex": "Living things need food, water, gases, and space."}, {"id": "L37", "tab": "living", "type": "multi", "q": "Why do living things need water? (Choose 2)", "c": ["to break down food", "to get rid of waste", "to make bricks"], "a": ["A", "B"], "ex": "Water breaks down food, gets rid of waste, and moves food through the body."}, {"id": "L38", "tab": "living", "type": "tf", "q": "Living things grow, respond, and reproduce.", "a": "TRUE", "ex": "T /* ---------- TTS (skill-standard speak helper) ---------- */
function speak(text, rate = 0.88, pitch = 1.0, onend) {
  if (!window.speechSynthesis) { if (onend) onend(); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = rate;
  utter.pitch = pitch;
  let fired = false;
  const fin = () => { if (fired) return; fired = true; if (onend) onend(); };
  utter.onend = fin; utter.onerror = fin;
  window._utter = utter; // keep a reference so Safari does not drop it
  function setVoiceAndSpeak() {
    const voices = window.speechSynthesis.getVoices();
    const preferred = ['Samantha', 'Karen', 'Google US English', 'Microsoft Aria Online (Natural)'];
    let chosen = null;
    for (const name of preferred) {
      chosen = voices.find(v => v.name === name);
      if (chosen) break;
    }
    if (!chosen) chosen = voices.find(v => v.lang === 'en-US') || voices[0] || null;
    if (chosen) utter.voice = chosen;
    window.speechSynthesis.speak(utter);
    if (onend) setTimeout(fin, Math.max(4000, text.length * 100 / rate)); // safety unlock
  }
  const voices = window.speechSynthesis.getVoices();
  if (voices.length > 0) {
    setVoiceAndSpeak();
  } else {
    let started = false;
    const once = () => { if (started) return; started = true; setVoiceAndSpeak(); };
    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.onvoiceschanged = null;
      once();
    };
    setTimeout(once, 400); // fallback: some browsers never fire voiceschanged
  }
}

/* balanced answer positions: correct answers spread evenly over A/B/C(/D), never 3 in a row */
const POSQ={};let lastPos=[];
function runOK(a,prev){const s=prev.concat(a);for(let i=2;i<s.length;i++){if(s[i]===s[i-1]&&s[i]===s[i-2])return false;}return true;}
function balanced(n,prev){let a,k=0;do{a=[];for(let r=0;r<3;r++)for(let i=0;i<n;i++)a.push(i);shuffle(a);k++;}while(!runOK(a,prev)&&k<200);return a;}
function nextPos(n){if(!POSQ[n]||!POSQ[n].length)POSQ[n]=balanced(n,lastPos.slice(-2));const p=POSQ[n].shift();lastPos.push(p);if(lastPos.length>4)lastPos.shift();return p;}
const PAIRQ=[];
function nextPair(){if(!PAIRQ.length)PAIRQ.push(...shuffle([[0,1],[0,2],[1,2],[0,1],[0,2],[1,2]]));return PAIRQ.shift();}
function placeAt(correct,wrong,targets,n){const out=new Array(n);targets.forEach((t,k)=>out[t]=correct[k]);const w=shuffle(wrong.slice());for(let i=0;i<n;i++)if(out[i]===undefined)out[i]=w.shift();return out;}
function prep(q){ // choices re-ordered every time a question is shown
  if(q.type==="vocab_match"){const pos=nextPos(4);q._c=placeAt([q.word],q.others,[pos],4);q._ans=[pos];return;}
  if(q.type==="mc"||q.type==="listening"){const ci=L.indexOf(q.a);const pos=nextPos(q.c.length);
    q._c=placeAt([q.c[ci]],q.c.filter((_,i)=>i!==ci),[pos],q.c.length);q._ans=[pos];return;}
  if(q.type==="multi"){const corr=q.a.map(x=>q.c[L.indexOf(x)]);const pr=nextPair();
    q._c=placeAt(shuffle(corr),q.c.filter(c=>corr.indexOf(c)<0),pr,q.c.length);q._ans=pr.slice().sort();}
}
function choicesOf(q){return q._c;}
function correctIdx(q){return q._ans[0];}
function answerText(q){
  if(q.type==="mc"||q.type==="listening"||q.type==="vocab_match")return L[q._ans[0]]+") "+q._c[q._ans[0]];
  if(q.type==="multi")return q._ans.map(i=>L[i]+") "+q._c[i]).join("  +  ");
  return q.a;
}

  } else if(q.type==="tf"){
    h+='<div class="qtext">'+esc(q.q)+'</div><div class="big2"><button class="opt" id="o0" onclick="pick(0)">✅ TRUE</button><button class="opt" id="o1" onclick="pick(1)">❌ FALSE</button></div>';
  } else if(q.type==="sort"){
    h+='<div class="qtext" style="text-align:center">Is this LIVING or NONLIVING?<br><span style="font-size:2rem">'+esc(q.q)+'</span></div><div class="big2"><button class="opt" id="o0" onclick="pick(0)">🌱 LIVING</button><button class="opt" id="o1" onclick="pick(1)">🪨 NONLIVING</button></div>';
  } else if(q.type==="fill"){
    h+='<div class="bank">'+q.bank.map(b=>'<span>'+esc(b)+'</span>').join("")+'</div><div class="qtext">'+esc(q.q)+'</div><input class="txt" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" onkeydown="if(event.key===\'Enter\')check()">';
  }
  h+='<div><button class="btn pri" id="chk" onclick="check()">'+(P.mode==="mock"?"Save Answer":"Check Answer")+'</button><button class="btn sky" id="nxt" onclick="nextQ()" style="display:none">Next ➜</button></div><div id="fb"></div></div>';
  m.innerHTML=h;
  if(q.type==="listening")setTimeout(playListen,350);
}
function playListen(){const q=P.list[P.i];if(!q||q.type!=="listening")return;const r=document.getElementById("ready");if(r)r.textContent="🎧 Listening...";
  document.querySelectorAll(".opt").forEach(b=>{if(!P.checked){b.disabled=true;b.classList.add("locked");}});
  speak(q.say,0.88,1.0,()=>{if(P.checked)return;document.querySelectorAll(".opt").forEach(b=>{b.disabled=false;b.classList.remove("locked");});const r2=document.getElementById("ready");if(r2)r2.textContent="✅ Now choose your answer!";});}
function pick(i){if(P.checked)return;P.sel=i;document.querySelectorAll(".opt").forEach((b,j)=>b.classList.toggle("sel",j===i));}
function pickMulti(i){if(P.checked)return;const k=P.multi.indexOf(i);if(k>=0)P.multi.splice(k,1);else{if(P.multi.length>=2)P.multi.shift();P.multi.push(i);}
  document.querySelectorAll(".opt").forEach((b,j)=>b.classList.toggle("sel",P.multi.indexOf(j)>=0));}
function norm(s){return String(s).toLowerCase().replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim();}
function evaluate(q){
  if(q.type==="fill"){const v=norm((document.getElementById("inp")||{}).value||"");if(!v)return null;const ok=[q.a].concat(q.alt||[]).some(a=>norm(a)===v);return {ok:ok,given:v};}
  if(q.type==="multi"){if(P.multi.length!==2)return null;const g=P.multi.slice().sort();return {ok:g.join()===q._ans.join(),given:g.map(i=>L[i]+") "+q._c[i]).join(" + ")};}
  if(P.sel===null)return null;
  if(q.type==="tf"){const g=P.sel===0?"TRUE":"FALSE";return {ok:g===q.a,given:g};}
  if(q.type==="sort"){const g=P.sel===0?"LIVING":"NONLIVING";return {ok:g===q.a,given:g};}
  const ci=correctIdx(q);return {ok:P.sel===ci,given:L[P.sel]+") "+choicesOf(q)[P.sel]};
}
function check(){
  const q=P.list[P.i];const r=evaluate(q);const fb=document.getElementById("fb");
  if(!r){fb.innerHTML='<div class="fb bad">'+(q.type==="multi"?"Please choose TWO answers.":"Please answer first.")+'</div>';return;}
  P.checked=true;
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);const inp=document.getElementById("inp");if(inp)inp.disabled=true;
  document.getElementById("chk").style.display="none";document.getElementById("nxt").style.display="inline-block";
  P.answers.push({q:q,ok:r.ok,given:r.given,at:answerText(q)});
  if(P.mode==="mock"){fb.innerHTML='<div class="fb" style="background:#e0f2fe">Answer saved. 👍</div>';return;}
  mark(q.id,r.ok);
  // colour options
  if(q.type==="mc"||q.type==="listening"||q.type==="vocab_match"){const ci=correctIdx(q);document.getElementById("o"+ci).classList.add("ok");if(!r.ok)document.getElementById("o"+P.sel).classList.add("bad");}
  if(q.type==="tf"||q.type==="sort"){const ci=(q.a==="TRUE"||q.a==="LIVING")?0:1;document.getElementById("o"+ci).classList.add("ok");if(!r.ok)document.getElementById("o"+P.sel).classList.add("bad");}
  if(q.type==="multi"){q._ans.forEach(x=>document.getElementById("o"+x).classList.add("ok"));P.multi.forEach(i=>{if(q._ans.indexOf(i)<0)document.getElementById("o"+i).classList.add("bad");});}
  if(r.ok){fb.innerHTML='<div class="fb ok">Correct! Great job! ✓</div>';}
  else{let h='<div class="fb bad">✗ Not quite. The correct answer is:<div class="ans">'+esc(answerText(q))+'</div>';
    if(q.ex)h+='<div>💡 '+esc(q.ex)+'</div>';
    if(q.type==="listening")h+='<div style="margin-top:6px">📝 You heard: “'+esc(q.say)+'”</div>';
    h+='</div>';fb.innerHTML=h;}
}
function nextQ(){P.i++;showQ();}
function starsFor(p){const n=p>=90?5:p>=75?4:p>=55?3:p>=40?2:1;return "⭐".repeat(n);}
function finishScore(){
  if("speechSynthesis" in window)speechSynthesis.cancel();
  if(cur==="oral")return oralScore();
  const a=P.answers;const n=a.filter(x=>x.ok).length;const p=a.length?Math.round(100*n/a.length):0;
  const again=P.mode==="mock"?"mockStart()":"practice(\'"+P.tab+"\')";
  let h='<div class="card" style="text-align:center">';
  if(!a.length){h+='<h2>You have not answered any questions yet.</h2>';}
  else{h+='<div style="font-size:1.3rem">Answered <b>'+a.length+'</b> questions — <b>'+n+'</b> correct ('+p+'%)</div><div class="score">'+p+'%</div><div style="font-size:2rem">'+starsFor(p)+'</div>';}
  h+='<button class="btn pri" onclick="'+again+'">🔁 Try Again</button>';
  if(P.mode!=="mock")h+='<button class="btn sky" onclick="practiceWrong()">✏️ Only My Mistakes</button>';
  h+='<button class="btn gr" onclick="go(\'home\')">🏠 Home</button></div>';
  const wrong=a.filter(x=>!x.ok);const list=P.mode==="mock"?wrong.concat(a.filter(x=>x.ok)):wrong;
  if(a.length){h+='<div class="card"><h3>'+(P.mode==="mock"?"Review (mistakes first)":(wrong.length?"Review your mistakes":"No mistakes — excellent! 🌟"))+'</h3>';
    list.forEach(x=>{const q=x.q;const qt=q.type==="listening"?"🎧 "+q.say:q.type==="sort"?"Living or nonliving: "+q.q:q.q;
      h+='<div class="rev '+(x.ok?"":"w")+'"><div>'+(x.ok?"✅":"❌")+' '+esc(qt)+'</div>'+(x.ok?"":'<div>Your answer: '+esc(x.given)+'</div><div class="ans" style="font-size:1.15rem">'+esc(x.at)+'</div>')+'</div>';});
    h+='</div>';}
  document.getElementById("main").innerHTML=h;window.scrollTo(0,0);
}
function practiceWrong(){const w=qsFor(P.tab).filter(q=>done[q.id]===0);if(!w.length){const b=document.querySelector(".card");if(b)b.insertAdjacentHTML("beforeend","<div class=\"fb ok\">No mistakes left! 🌟</div>");return;}P={list:shuffle(w),i:0,tab:P.tab,checked:false,sel:null,multi:[],mode:"practice",answers:[]};showQ();}

/* ---------- mock exam ---------- */
const examCount=30;
function drawMockExam(){
  // keep the real-exam mix: some listening + mostly written
  const lis=shuffle(listenQs.slice()).slice(0,5);
  const rest=shuffle(BANK.filter(q=>q.type!=="listening").slice()).slice(0,examCount-5);
  return lis.concat(rest);
}
function mockStart(){if("speechSynthesis" in window)speechSynthesis.cancel();P={list:drawMockExam(),i:0,tab:"mock",checked:false,sel:null,multi:[],mode:"mock",answers:[]};showQ();}
/* ---------- vocab list (shown above practice on vocab tab) ---------- */

/* ---------- oral ---------- */
let OS={},REV={};let rec=null,chunks=[],recUrl={},timer=null;
function oral(){OS={};REV={};
  let h=drillbar("Oral Practice · "+DATA.oral.length+" questions")+'<div class="card"><h2 style="margin-top:0">🗣️ Oral Practice</h2><p>Like the real test: listen to the question and answer in <b>complete sentences</b>. No key words are given. Record yourself, tap Stop, then reveal the model answer.</p>'+
  '<div class="notice">📱 Recording works in <b>Safari or Chrome</b>. Inside an app viewer (claude.ai, LINE, Facebook, etc.) the microphone is blocked — open the link in Safari or Chrome instead.</div><div class="scorebar" id="osb" style="margin-top:10px"></div></div>';
  DATA.oral.forEach((o,i)=>{
    h+='<div class="card"><span class="badge">'+esc(o.topic)+'</span><div class="qtext">'+(i+1)+'. '+esc(o.q)+'</div>'+
    '<div><button class="btn sky" onclick="speak(DATA.oral['+i+'].q)">🔊 Play Question</button></div>'+
    '<div style="margin-top:10px"><b>🎙️ Record Your Answer</b><br><button class="btn pri" id="rs'+i+'" onclick="recStart('+i+')">⏺ Start</button><button class="btn gr" id="rt'+i+'" onclick="recStop('+i+')" disabled>⏹ Stop</button><button class="btn sky" id="rp'+i+'" onclick="recPlay('+i+')" disabled>▶️ Play My Answer</button> <span id="tm'+i+'"></span><div class="wave" id="wv'+i+'"><i></i><i></i><i></i><i></i><i></i></div></div>'+
    '<button class="btn gr" id="rv'+i+'" style="display:none" onclick="showModel('+i+')">👁 Reveal Answer</button><div id="md'+i+'"></div></div>';
  });
  document.getElementById("main").innerHTML=h;updOral();
}
function showReveal(i){const b=document.getElementById("rv"+i);if(b&&!REV[i])b.style.display="inline-block";}
function showModel(i){const o=DATA.oral[i];REV[i]=1;document.getElementById("rv"+i).style.display="none";
  document.getElementById("md"+i).innerHTML='<div class="model green">📝 Model Answer:<br><b>“'+esc(o.model)+'”</b></div><div>🔑 Key words to use: '+o.kw.map(k=>'<span class="pill">'+esc(k)+'</span>').join("")+'</div><button class="btn sky" onclick="speak(DATA.oral['+i+'].model)">🔊 Hear Model Answer</button><div class="chk" style="margin-top:10px"><b>📋 Self-check:</b>'+
  o.check.map((c,j)=>'<label><input type="checkbox" onchange="selfChk('+i+')" id="c'+i+'_'+j+'"> '+esc(c)+'</label>').join("")+'<div id="st'+i+'" style="font-size:1.5rem"></div></div>';selfChk(i);}
function selfChk(i){const n=DATA.oral[i].check.length;let k=0;for(let j=0;j<n;j++){const c=document.getElementById("c"+i+"_"+j);if(c&&c.checked)k++;}
  const r=k/n;document.getElementById("st"+i).textContent=r===1?"⭐⭐⭐":r>=0.67?"⭐⭐":r>=0.34?"⭐":"✏️";OS[i]={ok:r===1,k:k,n:n};updOral();}
function updOral(){const n=DATA.oral.length;const v=Object.values(OS);const ok=v.filter(x=>x.ok).length;const nd=v.length-ok;
  const e=document.getElementById("osb");if(e)e.innerHTML='<span>✅ '+ok+' got it</span><span>❌ '+nd+' need practice</span><span>⏳ '+(n-ok-nd)+' left</span>';}
function oralScore(){if(rec&&rec.state!=="inactive")try{rec.stop();}catch(e){}clearInterval(timer);
  const ids=Object.keys(OS).map(Number);const ok=ids.filter(i=>OS[i].ok).length;const p=ids.length?Math.round(100*ok/ids.length):0;
  let h='<div class="card" style="text-align:center">';
  if(!ids.length)h+='<h2>You have not checked any answers yet.</h2><p>Record an answer, tap Stop, then Reveal Answer and tick the self-check boxes.</p>';
  else h+='<div style="font-size:1.3rem">Answered <b>'+ids.length+'</b> questions — <b>'+ok+'</b> fully correct ('+p+'%)</div><div class="score">'+p+'%</div><div style="font-size:2rem">'+starsFor(p)+'</div>';
  h+='<button class="btn pri" onclick="oral()">🔁 Try Again</button><button class="btn gr" onclick="go(\'home\')">🏠 Home</button></div>';
  const need=ids.filter(i=>!OS[i].ok);
  if(ids.length){h+='<div class="card"><h3>'+(need.length?"Practice these again":"All answered questions were complete! 🌟")+'</h3>';
    need.forEach(i=>{const o=DATA.oral[i];h+='<div class="rev w"><div>❌ '+esc(o.q)+' <small>('+OS[i].k+'/'+OS[i].n+' points)</small></div><div class="ans" style="font-size:1.05rem">“'+esc(o.model)+'”</div></div>';});
    h+='</div>';}
  document.getElementById("main").innerHTML=h;window.scrollTo(0,0);}
function pickMime(){const t=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg"];if(!window.MediaRecorder)return null;for(const x of t){try{if(MediaRecorder.isTypeSupported(x))return x;}catch(e){}}return "";}
async function recStart(i){
  const msg=document.getElementById("tm"+i);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){micHelp(i);return;}
  const gum=navigator.mediaDevices.getUserMedia({audio:true}); // called directly inside the click handler
  msg.textContent="⏳ Asking for the microphone...";
  try{const s=await Promise.race([gum,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),8000))]);const mt=pickMime();
    rec=mt?new MediaRecorder(s,{mimeType:mt}):new MediaRecorder(s);chunks=[];
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    rec.onstop=()=>{const b=new Blob(chunks,{type:rec.mimeType||"audio/webm"});recUrl[i]=URL.createObjectURL(b);s.getTracks().forEach(t=>t.stop());document.getElementById("rp"+i).disabled=false;};
    rec.start();document.getElementById("rs"+i).disabled=true;document.getElementById("rt"+i).disabled=false;document.getElementById("wv"+i).classList.add("on");
    let sec=0;document.getElementById("tm"+i).textContent="0s";timer=setInterval(()=>{sec++;document.getElementById("tm"+i).textContent=sec+"s";if(sec>=60)recStop(i);},1000);
  }catch(e){micHelp(i);}
}
function micHelp(i){const m=document.getElementById("tm"+i);
  m.innerHTML='<div class="fb bad" style="margin-top:8px">🎙️ The microphone is not available here.<br>• If this page is open on claude.ai, recording is blocked there. Download the HTML file and open it in Safari or Chrome, then tap Start again.<br>• If a pop-up asked for the microphone, choose <b>Allow</b>.<br>You can still practice: say your answer out loud, then tap 👁 Reveal Answer.</div>';showReveal(i);}
function recStop(i){if(rec&&rec.state!=="inactive")rec.stop();clearInterval(timer);document.getElementById("rs"+i).disabled=false;document.getElementById("rt"+i).disabled=true;document.getElementById("wv"+i).classList.remove("on");showReveal(i);}
function recPlay(i){if(!recUrl[i])return;const a=new Audio(recUrl[i]);a.play().catch(()=>{});}

/* vocab tab: add word list button */
const _practice=practice;
practice=function(tab){_practice(tab);if(tab==="vocab"){const m=document.getElementById("main");const d=document.createElement("div");d.className="card";
  d.innerHTML='<details><summary style="font-weight:700;cursor:pointer;min-height:40px">📚 Show the Science word list (Week 1-6, '+DATA.vocab.length+' words)</summary><table class="vtable"><tr><th>Word</th><th>Definition</th></tr>'+DATA.vocab.map(v=>'<tr><td><b>'+esc(v.w)+'</b><br><small>'+esc(v.zh)+'</small></td><td>'+esc(v.d)+'<br><i style="color:#64748b">'+esc(v.s)+'</i></td></tr>').join("")+'</table></details>';
  m.appendChild(d);}};
function setOffsets(){const h=document.querySelector("header").offsetHeight;const n=document.getElementById("nav").offsetHeight;
  document.documentElement.style.setProperty("--hh",h+"px");document.documentElement.style.setProperty("--navh",(h+n)+"px");}
window.addEventListener("resize",setOffsets);
go("home");setOffsets();
</script>
<script>
/* =====================================================================
   site-home.js — "📚 小站" (back to 練習小站) button for every practice page
   Canonical copy: github.com/iam5980/kids-practice/template/site-home.js
   Version: 2026-10-24

   HOW TO USE: paste this whole file in its own <script> block just before
   </body> of EVERY page published to kids-practice (English and 中文部,
   apps, oral pages, listening players). No other code is needed.

   - Small "📚 小站" pill fixed at the bottom-left (safe-area aware)
   - Tap → in-page card: "回到練習小站嗎？" [回到練習小站] [繼續練習]
     (no window.confirm — it is blocked/ugly on iPad and stops speech)
   - Goes to the site root (…/kids-practice/), or the live site when the

   ===================================================================== */
(function () {
  "use strict";
  if (window.__siteHome || !document.body) return;
  window.__siteHome = true;
  var LIVE = "https://iam5980.github.io/kids-practice/";
  function homeUrl() {
    var p = location.pathname, i = p.indexOf("/kids-practice/");
    if (location.protocol.indexOf("http") === 0 && i >= 0) return location.origin + p.slice(0, i) + "/kids-practice/";

  }
  var css = document.createElement("style");
  css.textContent =
    "#sh-btn{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:9000;" +
    "height:44px;padding:0 14px 0 10px;border-radius:999px;border:2px solid rgba(255,255,255,.9);background:#334155;color:#fff;font:700 16px/1 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;" +

    "font:17px/1.5 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.3)}" +
    "#sh-card h3{margin:0 0 6px;font-size:20px}#sh-card p{margin:0 0 16px;color:#475569;font-size:15px}" +
    "#sh-card button{font:inherit;min-height:48px;border-radius:12px;border:0;padding:10px 16px;margin:4px;cursor:pointer}" +
    "#sh-go{background:#0284c7;color:#fff;font-weight:700}#sh-stay{background:#e2e8f0;color:#0f172a}" +
    "@media (prefers-color-scheme:dark){#sh-card{background:#1e293b;color:#e2e8f0}#sh-card p{color:#94a3b8}#sh-stay{background:#334155;color:#e2e8f0}}" +
    "body{padding-bottom:max(76px,calc(64px + env(safe-area-inset-bottom)))!important}";
  document.head.appendChild(css);

  var b = document.createElement("button");
  b.id = "sh-btn"; b.type = "button";
  b.setAttribute("aria-label", "回到練習小站"); b.title = "回到練習小站";
  b.textContent = "📚 小站";
  b.addEventListener("click", function () {
    if (document.getElementById("sh-mask")) return;

    document.body.appendChild(m);
    function close() { m.remove(); }
    m.addEventListener("click", function (e) { if (e.target === m) close(); });

    document.getElementById("sh-go").addEventListener("click", function () {
      try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
