<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>四上數學期末練功房</title>
<style>
html,body{margin:0}

/* 數學練功房：方格紙＋橘色主色；單欄、手機優先 */
:root{
  --paper:#fdfaf5; --card:#ffffff; --ink:#26211b; --muted:#6d6257;
  --sand:#f6e2c8; --orange:#c05d12; --blue:#1f5d8c; --blue-soft:#dceaf4;
  --line:#e7dac8; --ok:#2f7a45; --bad:#b3362f; --okbg:#e3f2e6; --badbg:#fbe7e5;
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"DIN Alternate","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16130f; --card:#211c16; --ink:#f0e8dd; --muted:#b0a494;
  --sand:#3a2d1d; --orange:#ffab5e; --blue:#8ec5ea; --blue-soft:#1d3346;
  --line:#3a3128; --ok:#7fd29a; --bad:#ff958c; --okbg:#1d3324; --badbg:#3a1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16130f; --card:#211c16; --ink:#f0e8dd; --muted:#b0a494;
  --sand:#3a2d1d; --orange:#ffab5e; --blue:#8ec5ea; --blue-soft:#1d3346;
  --line:#3a3128; --ok:#7fd29a; --bad:#ff958c; --okbg:#1d3324; --badbg:#3a1f1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header h1{font-family:var(--kai);font-size:clamp(25px,7vw,35px);margin:0;line-height:1.2;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.hdr{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.hdr>div{min-width:0}
.hdr #sfxBtn{flex:none;margin-top:6px}
.scope{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.chip.wrongchip[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.count{font-size:13px;color:var(--muted);margin-left:auto}
nav.tabs{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;background:var(--sand);padding:4px;border-radius:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
nav.tabs button{border:0;background:transparent;border-radius:9px;padding:8px 0;font-size:clamp(11px,3.2vw,15px);font-weight:500;white-space:nowrap}
@media (max-width:780px){nav.tabs{grid-template-columns:repeat(6,1fr)}}
.mkq{border-top:1px dashed var(--line);padding:10px 0;display:flex;flex-direction:column;gap:8px}
.mkq:first-of-type{border-top:0}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.mkbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:4;display:flex;gap:12px;align-items:center;justify-content:space-between}
.mktab{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.mktab th,.mktab td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
nav.tabs button[aria-selected="true"]{background:var(--card);font-weight:700;color:var(--orange);box-shadow:0 1px 2px rgba(0,0,0,.12)}
section{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--orange);background:var(--card);color:var(--orange);border-radius:10px;padding:8px 16px;font-weight:700}
.btn.primary{background:var(--orange);color:#fff}
.btn.blue{border-color:var(--blue);color:var(--blue)}
.btn.blue.primary{background:var(--blue);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.hint{color:var(--muted);font-size:14px;margin:0}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* 題目卡 */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.qsrc{font-size:12px;color:var(--muted)}
.qtext{font-size:clamp(17px,4.6vw,21px);line-height:1.85;font-family:var(--kai)}
.qtext b{color:var(--orange)}
.step{font-size:14px;color:var(--blue);font-weight:700}
.opts{display:grid;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;text-align:left;font-size:18px;min-height:48px;display:flex;align-items:center;gap:10px}
.opt .lab{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sand);color:var(--orange);display:grid;place-items:center;font-size:14px;font-weight:700}
.opt.good{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt:disabled{cursor:default}
.mono{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.5px}

/* 數字鍵盤 */
.slots{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-size:24px}
.slot{min-width:84px;min-height:48px;border:2px dashed var(--line);border-radius:10px;padding:4px 10px;background:var(--paper);
  display:inline-flex;align-items:center;justify-content:center;font-family:var(--num);font-size:26px;font-variant-numeric:tabular-nums}
.slot.on{border-style:solid;border-color:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 25%,transparent)}
.slot .ph{color:var(--muted);font-size:15px;font-family:var(--sans)}
.slotu{font-size:17px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pad button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;min-height:54px;font-size:24px;font-family:var(--num);font-weight:700}
.pad button.fn{font-family:var(--sans);font-size:16px;color:var(--orange);border-color:var(--orange)}
.pad button.go{background:var(--orange);color:#fff;border-color:var(--orange);font-family:var(--sans);font-size:17px}
.pad button:active{transform:translateY(1px)}
.fb{border-radius:12px;padding:10px 14px;border:2px solid var(--line);font-size:16px}
.fb.y{border-color:var(--ok);background:var(--okbg)}
.fb.n{border-color:var(--bad);background:var(--badbg)}
.fb b{font-size:19px}

/* 直式 */
.vert{display:inline-grid;justify-items:end;font-family:var(--num);font-size:30px;line-height:1.35;background:var(--paper);
  border:1.5px solid var(--line);border-radius:10px;padding:10px 16px;font-variant-numeric:tabular-nums}
.vert .ln{border-top:2.5px solid var(--ink);width:100%;margin-top:2px}
.vert .op{justify-self:start;margin-right:10px}
.vrow{display:flex;gap:10px;align-items:baseline}

/* HUD */
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px}
.rhud{min-height:40px}
.rhud .rrow{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.rhud .rrow b{font-size:18px;color:var(--ink);font-family:var(--num);font-variant-numeric:tabular-nums}
.rhud .cdw b{color:var(--bad)}
.rhud .plus{min-height:1.3em;font-size:14px;color:var(--orange);font-weight:700}
.timebar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0}
.timebar i{display:block;height:100%;background:var(--orange);transition:width .25s linear}
.timebar.warn i{background:var(--bad)}
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.rsum div{font-size:12px;color:var(--muted)}
.rsum b{display:block;font-size:24px;color:var(--ink);font-family:var(--num);font-variant-numeric:tabular-nums}
.qask{text-align:center;margin:0;font-size:15px}
.stars{font-size:34px;letter-spacing:4px;color:var(--orange);text-align:center}

/* 重點卡 */
.kcard{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--orange);border-radius:12px;padding:12px 14px}
.kcard h3{margin:0 0 6px;font-family:var(--kai);font-size:19px;color:var(--orange)}
.kcard ul{margin:0;padding-left:1.2em}
.kcard li{margin:3px 0}
.cover{background:var(--sand);border-radius:6px;color:transparent;user-select:none;cursor:pointer;padding:0 6px}
.cover::after{content:"點我看";color:var(--orange);font-size:13px}
.cover *{visibility:hidden}

/* 圖 */
.figbox{display:grid;place-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px}
.figbox svg{max-width:100%;height:auto}
.fg-line{stroke:var(--ink);fill:none}
.fg-thin{stroke:var(--muted);fill:none}
.fg-txt{fill:var(--ink);font-family:var(--sans);font-size:13px}
.fg-acc{stroke:var(--orange);fill:none}
.fg-accf{fill:var(--orange)}
.fg-fill{fill:var(--orange);fill-opacity:.22;stroke:var(--orange)}
.fg-dot{fill:var(--ink)}
.fg-hi{fill:var(--orange)}

/* 翻牌配對 */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.mc{aspect-ratio:1/1.15;border:1.5px solid var(--line);background:var(--sand);border-radius:12px;font-size:clamp(13px,3.6vw,18px);
  display:grid;place-items:center;padding:4px;text-align:center;line-height:1.25;transition:transform .2s}
.mc.open,.mc.done{background:var(--card);border-color:var(--orange)}
.mc.done{opacity:.45}
.mc .fc{visibility:hidden}
.mc.open .fc,.mc.done .fc{visibility:visible}
.mc.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.08)}}
.combo{text-align:center;font-family:var(--kai);font-size:21px;color:var(--orange);min-height:1.4em}

/* 錯題本 */
.wlist{display:flex;flex-direction:column;gap:8px}
.witem{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.witem .wq{font-family:var(--kai);font-size:17px}
.witem .wa{color:var(--ok);font-weight:700}
.tagn{display:inline-block;background:var(--sand);color:var(--orange);border-radius:6px;padding:0 6px;font-size:12px;font-weight:700;margin-right:6px}
[hidden]{display:none!important}

/* 慶祝 */
#party{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 72%,transparent);padding:16px}
#party .pbox{background:var(--card);border:2px solid var(--orange);border-radius:18px;padding:18px 22px;text-align:center;max-width:92vw}
#party h2{margin:0 0 6px;font-family:var(--kai);font-size:26px;color:var(--orange)}
#party .crew{display:flex;gap:10px;justify-content:center;margin:8px 0}
#party .crew svg{width:92px;height:92px;animation:bop .7s ease-in-out infinite alternate}
#party .crew svg:nth-child(2){animation-delay:.35s}
@keyframes bop{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-12px) rotate(5deg)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:49;overflow:hidden}
.confetti i{position:absolute;width:9px;height:14px;opacity:.92;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(104vh) rotate(680deg)}}
@media (prefers-reduced-motion:reduce){#party .crew svg,.confetti i,.mc.pop{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="hdr">
  <div>
    <h1>四上數學期末練功房</h1>
    <p>期末考範圍：第 6～10 單元　除法・三角形與全等・兩步驟問題與併式・二位小數・統計圖表</p>
  </div>
  <button class="chip" id="sfxBtn" type="button" aria-pressed="true">音效：開</button>
</header>

<div class="scope" id="scope"></div>

<nav class="tabs" role="tablist" aria-label="練習關卡">
  <button data-tab="key"   aria-selected="true">重點</button>
  <button data-tab="word"  aria-selected="false">應用題</button>
  <button data-tab="vert"  aria-selected="false">直式</button>
  <button data-tab="calc"  aria-selected="false">計算</button>
  <button data-tab="choice"aria-selected="false">選擇</button>
  <button data-tab="tf"    aria-selected="false">是非</button>
  <button data-tab="unit"  aria-selected="false">小數比較</button>
  <button data-tab="fig"   aria-selected="false">看圖</button>
  <button data-tab="mem"   aria-selected="false">配對</button>
  <button data-tab="mock"  aria-selected="false">模擬考</button>
  <button data-tab="wrong" aria-selected="false">錯題本</button>
</nav>

<section id="tab-key"></section>
<section id="tab-word"   hidden></section>
<section id="tab-vert"   hidden></section>
<section id="tab-calc"   hidden></section>
<section id="tab-choice" hidden></section>
<section id="tab-tf"     hidden></section>
<section id="tab-unit"   hidden></section>
<section id="tab-fig"    hidden></section>
<section id="tab-mem"    hidden></section>
<section id="tab-mock"   hidden></section>
<section id="tab-wrong"  hidden></section>

<p class="hint" style="border-top:1px solid var(--line);padding-top:10px">
  範圍是翰林版四上數學第 6～10 單元。題目依照老師給的期末複習卷、習作題型重新出題，數字由程式產生，答案都由程式計算並驗算過。
  分數、錯題只存在這台裝置的瀏覽器裡，換裝置或清除瀏覽資料就會不見。
</p>
</div>
<div id="party" hidden></div>
<script>
/* =====================================================================
   study-kit.js — read-aloud, level map and 素養題組 for any practice app
   Canonical copy: github.com/iam5980/kids-practice/template/study-kit.js
   Version: 2026-10-25

   HOW TO USE: paste the whole file inside the page's main <script> (before
   the app code). Works for 中文部 apps and English apps alike. Call
   KidKit.injectCSS() once. Points/badges are reported to SitePoints
   (from site-home.js) automatically when it is on the page.

   1) READ-ALOUD
      KidKit.say(text, {lang: "zh-TW" | "en-US", rate, math: true})
      KidKit.sayBtn(text, label, opts)  -> HTML string for a 🔊 button
        Clicks are handled by one delegated listener (no inline onclick).
        math: true turns 6 1/2 → 6又2分之1, 13/2 → 2分之13, × → 乘 …
        Put the definition's 🔊 INSIDE the element that "考自己" covers,
        so it cannot be heard before the answer is revealed.

   2) LEVEL MAP (闖關地圖) — one level per lesson/unit, 1–3 stars, never locked
      var map = KidKit.levelMap(container, {
          key: "au-zh-science-1151-mid",          // unique per app
          levels: [{id: "L1", name: "第 1 課 …"}, …, {id: "LIT", name: "素養題組"}],
          lang: "zh-TW",
          onPlay: function (id) { … start that level … } });
      KidKit.levelResult(key, id, pct)   -> stars earned (call when a level ends)
      Stars: ≥90% ★★★, ≥70% ★★, ≥40% ★, else 0. Best result is kept.

   3) 素養題組 (reading-heavy question sets)
      KidKit.passageSet(container, {
          title: "颱風來了",
          source: "teacher" | "self",               // self → 「自編」 label
          passage: "長文…（可含 <b>、<br>、<img>）",
          figure: "data:image/…",                    // optional
          lang: "zh-TW",
          questions: [
            {type: "mc",    q: "…", choices: ["對的", "錯1", "錯2"], exp: "…"},  // first choice = correct
            {type: "tf",    q: "…", answer: true, exp: "…"},
            {type: "multi", q: "…（選出兩個）", choices: [...], correct: [0, 2], exp: "…"},
            {type: "order", q: "…", items: ["第1步", "第2步", "第3步"], exp: "…"},       // items in correct order
            {type: "open",  q: "…", a: "參考答案", points: [["蒸發"], ["凝結", "變成水滴"]], need: 2}
          ]}, {onDone: function (r) { … r = {correct, total, allOk} … }});
      Passage stays one tap away (📖 看文章), can be read aloud, questions are
      judged one by one, choices are shuffled, and the set reports to
      SitePoints.literacy() when finished.
   ===================================================================== */
var KidKit = (function () {
  "use strict";
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function sp(name) { return window.SitePoints && window.SitePoints[name] ? window.SitePoints : null; }

  /* ---------- read-aloud ---------- */
  var voices = [];
  function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch (e) {} }
  if (window.speechSynthesis) {
    loadVoices();
    try { speechSynthesis.addEventListener("voiceschanged", loadVoices); } catch (e) { speechSynthesis.onvoiceschanged = loadVoices; }
  }
  function pickVoice(lang) {
    var v = voices.length ? voices : (window.speechSynthesis ? speechSynthesis.getVoices() : []);
    var tests = lang.indexOf("zh") === 0
      ? [/zh[-_]TW/i, /zh[-_](HK|Hant)/i, /^(zh|cmn)/i]
      : [/^Samantha$/, /^Karen$/, /Google US English/, /en[-_]US/i, /^en/i];
    for (var t = 0; t < tests.length; t++) for (var i = 0; i < v.length; i++) {
      if (tests[t].test(lang.indexOf("zh") === 0 ? v[i].lang : (t < 3 ? v[i].name : v[i].lang))) return v[i];
    }
    return null;
  }
  function plain(html) { var d = document.createElement("div"); d.innerHTML = String(html); return (d.textContent || "").replace(/\s+/g, " ").trim(); }
  function mathSpeech(s) {
    return s
      .replace(/(\d+)\s+(\d+)\s*\/\s*(\d+)/g, "$1又$3分之$2")
      .replace(/(\d+)\s*\/\s*(\d+)/g, "$2分之$1")
      .replace(/[×xX＊*](?=\s*\d)/g, "乘").replace(/[÷]/g, "除以")
      .replace(/[＋+]/g, "加").replace(/(\d)\s*[－-]\s*(\d)/g, "$1減$2")
      .replace(/[＝=]/g, "等於").replace(/[→⇒]/g, "，變成").replace(/＞|>/g, "大於").replace(/＜|</g, "小於")
      .replace(/≒/g, "約等於").replace(/（例/g, "（例如");
  }
  function say(text, o) {
    o = o || {};
    var lang = o.lang || "zh-TW";
    if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined") { hint("這個瀏覽器不支援朗讀，請改用 Safari 或 Chrome。"); return; }
    var t = plain(text);
    if (o.math) t = mathSpeech(t);
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t);
      u.lang = lang; u.rate = o.rate || (lang.indexOf("zh") === 0 ? 0.85 : 0.88);
      var v = pickVoice(lang); if (v) u.voice = v;
      say._u = u;
      speechSynthesis.speak(u);
      if (!v && lang.indexOf("zh") === 0) hint("找不到中文語音，聲音可能不正確。可在 iPad 設定裡加裝「中文（台灣）」語音。");
    } catch (e) { hint("朗讀失敗，請再按一次。"); }
  }
  function hint(msg) {
    var t = document.getElementById("kk-hint");
    if (!t) { t = el("div"); t.id = "kk-hint"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.className = "kk-hint kk-show";
    clearTimeout(hint._t); hint._t = setTimeout(function () { t.className = "kk-hint"; }, 3200);
  }
  function sayBtn(text, label, o) {
    o = o || {};
    return '<button type="button" class="kk-say" data-kk-say="' + esc(plain(text)) + '"' +
      (o.lang ? ' data-kk-lang="' + esc(o.lang) + '"' : "") + (o.math ? ' data-kk-math="1"' : "") +
      ' aria-label="' + esc((label || "朗讀") + "：" + plain(text).slice(0, 40)) + '">🔊' + (label ? " " + esc(label) : "") + "</button>";
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-kk-say]");
    if (!b) return;

  /* ---------- level map ---------- */

  function levelMap(container, o) {

          '<span class="kk-stars" aria-label="' + s + ' stars">' + "★★★".slice(0, s) + '<i>' + "☆☆☆".slice(0, 3 - s) + "</i></span></button>";

        ord.forEach(function (orig) {

      } else if (q.type === "order") {

          ans.forEach(function (t, k) { var b = el("button", "kk-tile kk-in", (k + 1) + ". " + esc(t)); b.type = "button";

      } else if (q.type === "open") {
        var ta = el("textarea", "kk-input"); ta.placeholder = T.typ;

            r.onresult = function (e) { var s = ""; for (var k = 0; k < e.results.length; k++) s += e.results[k][0].transcript; ta.value = base + s; c3.disabled = !ta.value.trim(); };

        ta.addEventListener("input", function () { c3.disabled = !ta.value.trim(); });

          var pts = q.points || [], txt = normZh(ta.value), hits = 0, list = [];
          pts.forEach(function (alts) {

          });
          var need = q.need || (pts.length <= 2 ? pts.length : Math.ceil(pts.length * 0.7));
          finishQ(pts.length ? hits >= need : false, esc(q.a) + '<div class="kk-exp">' + list.join("　") + "</div>", q.exp);
        });
        area.appendChild(ta); row.appendChild(mic); row.appendChild(c3); qbox.appendChild(row);
      }
      qbox.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
    function done() {
      var allOk = correct === qs.length;
      qbox.innerHTML = '<div class="kk-result"><div class="kk-big">' + T.res.replace("{c}", correct).replace("{t}", qs.length) + "</div>" +
        (allOk ? "<div>" + T.all + "</div>" : "") + "</div>";

      again.addEventListener("click", function () { passageSet(container, spec, o); });

  }

<script>
/* ===== KPDeal：選擇題正確答案位置平均分散（練習小站共用，版本 2026-11-10b）=====
   規則：每個位置（A/B/C/D…）出現次數一樣多，且正確答案不會連續 3 題在同一位置。
   用法（整段貼進 App 的 <script>，放在使用它的程式之前）：
     KPDeal.place(options, correct)   → 回傳新陣列：錯誤選項打亂，正確選項放到平均分散的位置
                                         correct 可以是「值」或「判斷函式 (item,index)=>boolean」
     KPDeal.pos(n)                    → 只要位置編號（0..n-1）時使用
     KPDeal.shuffle(arr)              → 一般打亂（回傳新陣列）
   注意：凡是「一題 + 數個選項 + 一個正解」的地方都要用 place，不要再用 shuffle 決定選項順序。
*/
var KPDeal=(function(){
  var decks={},last=[];
  function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function runOK(s){for(var i=2;i<s.length;i++)if(s[i]===s[i-1]&&s[i]===s[i-2])return false;return true}
  function pos(n){
    if(!(n>1))return 0;
    var d=decks[n];
    if(!d||!d.length){var base=[],k=0;for(var r=0;r<2;r++)for(var i=0;i<n;i++)base.push(i);
      do{d=sh(base);k++}while(!runOK(last.slice(-2).concat(d))&&k<300);decks[n]=d}
    var p=d.shift();
    if(last.length>=2&&last[last.length-1]===p&&last[last.length-2]===p){
      for(var i=0;i<d.length;i++)if(d[i]!==p){var q=d[i];d[i]=p;p=q;break}
      if(last[last.length-1]===p&&last[last.length-2]===p){var alt=(p+1+Math.floor(Math.random()*(n-1)))%n;d.push(p);p=alt}}
    last.push(p);if(last.length>4)last.shift();
    return p;
  }
  function place(arr,correct){
    var f=typeof correct==='function'?correct:function(x){return x===correct};
    var ci=-1;for(var i=0;i<arr.length;i++)if(f(arr[i],i)){ci=i;break}
    if(ci<0)return sh(arr);
    var c=arr[ci],w=sh(arr.filter(function(_,i){return i!==ci}));
    w.splice(pos(arr.length),0,c);
    return w;
  }

/* ===== 音效（Web Audio 合成）===== */
let sfxOn=load('au4mf-sfx',true),actx=null;
function tone(seq){
  if(!sfxOn)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    let t=actx.currentTime+0.01;
    seq.forEach(([f,d,type,v])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.16,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+0.03);t+=d*0.8});
  }catch(e){}
}
const SFX={
  ok:()=>tone([[659,.12],[880,.12],[1175,.25]]),
  bad:()=>tone([[311,.18,'triangle',.14],[233,.32,'triangle',.14]]),
  key:()=>tone([[880,.035,'square',.05]]),
  flip:()=>tone([[540,.05,'triangle',.07]]),
  match:()=>tone([[784,.09],[1047,.2]]),
  tick:()=>tone([[1250,.04,'square',.035]]),
  win:()=>tone([[523,.13],[659,.13],[784,.13],[1047,.13],[784,.1],[1047,.4]])
};

let tmode=load('au4mf-tmode','up'),rt=null;const QLIM=15;
const rmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
const timeChips=()=>`<div class="modes"><button class="chip" type="button" data-tm="up" aria-pressed="${tmode==='up'}">計時計分（不限時）</button><button class="chip" type="button" data-tm="cd" aria-pressed="${tmode==='cd'}">每題 ${QLIM} 秒倒數</button></div>`;

  document.querySelectorAll('[data-tm]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.tm===tmode))});
function rtStart(key){rt={key,t0:Date.now(),score:0,streak:0,best:0,ok:0,n:0,qT:Date.now(),onTimeout:null,last:'',lastTick:-1,done:false}}
function rtQ(onTimeout){if(!rt)return;rt.qT=Date.now();rt.onTimeout=(tmode==='cd'&&onTimeout)?onTimeout:null;rt.lastTick=-1;rtTick()}
function rtAns(right){
  if(!rt)return 0;rt.n++;rt.onTimeout=null;let pts=0;
  if(right){rt.ok++;rt.streak++;rt.best=Math.max(rt.best,rt.streak);const sec=(Date.now()-rt.qT)/1000;
    const sp=Math.round(50*Math.max(0,Math.min(1,1-(sec-3)/12))),cb=Math.min(5,rt.streak-1)*10;pts=100+sp+cb;rt.score+=pts;
    rt.last=`＋${pts}${sp?`（快答 ＋${sp}）`:''}${rt.streak>1?`・${rt.streak} 連對`:''}`}
  else{rt.streak=0;rt.last='連對中斷'}
  rtTick();return pts;
}
function rtTick(){
  if(!rt||rt.done)return;
  const now=Date.now(),el=(now-rt.t0)/1000;
  let cd='';
  if(rt.onTimeout){const left=QLIM-(now-rt.qT)/1000,c=Math.ceil(left);
    if(c<=3&&c>0&&c!==rt.lastTick){rt.lastTick=c;SFX.tick()}
    cd=`<div class="timebar${left<=5?' warn':''}"><i style="width:${Math.max(0,left/QLIM*100)}%"></i></div>`;
    if(left<=0){const f=rt.onTimeout;rt.onTimeout=null;f();return}}
  document.querySelectorAll('.rhud').forEach(h=>{const sec=h.closest('section');if(sec&&sec.hidden)return;
    h.innerHTML=`<div class="rrow"><span>時間 <b>${rmt(el)}</b></span><span>分數 <b>${rt.score}</b></span><span>連對 <b>${rt.streak}</b></span>${rt.onTimeout?`<span class="cdw">剩 <b>${Math.max(0,Math.ceil(QLIM-(now-rt.qT)/1000))}</b> 秒</span>`:''}</div>${cd}<div class="plus">${rt.last}</div>`})
}
setInterval(rtTick,250);
function rtEnd(label){
  if(!rt)return '';
  rt.done=true;rt.onTimeout=null;const el=(Date.now()-rt.t0)/1000,acc=rt.n?Math.round(rt.ok/rt.n*100):0;
  const key='au4mf-rbest-'+rt.key+(label||''),best=load(key,null),rec=(!best||rt.score>best.sc)&&rt.n>0;
  if(rec)save(key,{sc:rt.score,t:el});

   <p class="qask">${rec?'<b style="color:var(--orange)">新紀錄！</b>':`這一關最佳紀錄：${best?best.sc:0} 分`}</p>`;
}

/* ===== 答案比對 ===== */
function fracVal(s){
  s=String(s).trim();
  let m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);            // 帶分數 1 2/5
  if(m){const d=+m[3];return d?(+m[1])+(+m[2])/d:null}
  m=s.match(/^(\d+)\s*\/\s*(\d+)$/);                        // 假分數 7/5
  if(m){const d=+m[2];return d?(+m[1])/d:null}
  m=s.match(/^-?\d+(\.\d+)?$/);
  return m?parseFloat(s):null;
}
function sameNum(a,b){
  const x=fracVal(a),y=fracVal(b);
  if(x===null||y===null)return false;
  return Math.abs(x-y)<1e-9;
}
function normTxt(s){
  return String(s==null?'':s).replace(/\s+/g,'').replace(/[，,、。．]/g,'')
    .replace(/[（(][^）)]*[）)]/g,'').replace(/[°度]/g,'度').toLowerCase();
}

/* ===== 把答案拆成填空格（決定要幾個數字框、各框的單位）===== */
function slotsOf(ans){
  const s=String(ans==null?'':ans).trim();
  // 比大小符號 → 三選一
  if(/^[<>=＜＞＝]$/.test(s))
    return{k:'pick',opts:['＜','＝','＞'],ans:{'<':'＜','>':'＞','=':'＝'}[s]||s};
  // 對錯 → 兩選一
  if(/^[OＯ○]$/.test(s))return{k:'pick',opts:['O','✗'],ans:'O'};
  if(/^[XＸ×✗]$/.test(s))return{k:'pick',opts:['O','✗'],ans:'✗'};
  // 商…餘數
  let mq=s.match(/^(\d+)\s*…\s*(\d+)$/);
  if(mq)return{k:'num',parts:[{v:mq[1],u:'…'},{v:mq[2],u:''}],frac:false};
  // 複名數：公里＋公尺
  let m=s.match(/^(\d+)\s*公里\s*(\d+)\s*公尺$/);
  if(m)return{k:'num',parts:[{v:m[1],u:'公里'},{v:m[2],u:'公尺'}],frac:false};
  // 多個空格、用頓號分隔，而且每一格都是數字
  if(s.includes('、')){
    const ps=s.split('、').map(x=>x.trim());
    if(ps.length>1&&ps.every(x=>/^\d+(?:\.\d+)?$/.test(x)))
      return{k:'num',parts:ps.map((v,i)=>({v,u:'①②③④⑤⑥'[i]||''})),frac:false};
  }
  // 帶分數 1 2/5
  m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m)return{k:'num',parts:[{v:s,u:''}],frac:true,mixed:true};
  // 假分數 7/5
  m=s.match(/^(\d+)\s*\/\s*(\d+)$/);
  if(m)return{k:'num',parts:[{v:s,u:''}],frac:true};
  // 萬位記法：95 萬 2000 公斤、9萬2000、135 萬元
  m=s.match(/^(\d+)\s*萬\s*(\d+)?\s*([^\d\s]{0,3})$/);
  if(m)return m[2]
    ?{k:'num',parts:[{v:m[1],u:'萬'},{v:m[2],u:m[3]||''}],frac:false}
    :{k:'num',parts:[{v:m[1],u:'萬'+(m[3]||'')}],frac:false};
  // 單一個數（可帶單位）
  m=s.match(/^(\d+(?:\.\d+)?)\s*([^\d\s]{0,4})$/);
  if(m)return{k:'num',parts:[{v:m[1],u:m[2]||''}],frac:false,dec:m[1].includes('.')};
  return{k:'self'};                                        // 文字答案 → 看答案自評
}

/* ===== 數字鍵盤：點選作答，不叫出系統鍵盤 ===== */
function numPad(box, spec, done){
  // spec.parts = [{v,u}, ...]；spec.frac 代表要分數鍵
  const vals=spec.parts.map(()=>''),n=spec.parts.length;
  let cur=0,locked=false;
  const keys=['1','2','3','4','5','6','7','8','9','0'];
  function draw(){
    box.innerHTML=
      `<div class="slots">`+spec.parts.map((p,i)=>
        `<span class="slot${i===cur&&!locked?' on':''}" data-i="${i}">${vals[i]?esc(vals[i]):'<span class="ph">點數字</span>'}</span>`+
        (p.u?`<span class="slotu">${esc(p.u)}</span>`:'')).join('')+`</div>`+
      `<div class="pad">`+
        keys.slice(0,9).map(k=>`<button type="button" data-k="${k}">${k}</button>`).join('')+
        (spec.frac?`<button type="button" data-k="/">/</button>`:spec.dec?`<button type="button" data-k=".">.</button>`:`<button type="button" class="fn" data-k="back">退格</button>`)+
        `<button type="button" data-k="0">0</button>`+
        (spec.frac&&spec.mixed?`<button type="button" class="fn" data-k="sp">帶分數空格</button>`:`<button type="button" class="fn" data-k="clr">清除</button>`)+
        (spec.frac||spec.dec?`<button type="button" class="fn" data-k="back">退格</button>`:'')+
        `<button type="button" class="go" data-k="ok">確定</button>`+
      `</div>`;
  }
  box.addEventListener('click',e=>{
    if(locked)return;
    const sl=e.target.closest('.slot');
    if(sl){cur=+sl.dataset.i;draw();return}
    const b=e.target.closest('[data-k]');if(!b)return;
    const k=b.dataset.k;
    if(k==='ok'){
      if(vals.some(v=>!v)){toast('還有空格沒填喔');const e=vals.findIndex(v=>!v);if(e>=0){cur=e;draw()}return}
      locked=true;box.querySelectorAll('button').forEach(x=>x.disabled=true);
      done(vals.slice());return;
    }
    SFX.key();
    if(k==='back')vals[cur]=vals[cur].slice(0,-1);
    else if(k==='clr')vals[cur]='';
    else if(k==='sp'){if(vals[cur]&&!vals[cur].endsWith(' '))vals[cur]+=' '}
    else if(k==='.'){if(!vals[cur].includes('.'))vals[cur]=(vals[cur]||'0')+'.'}
    else if(vals[cur].length<9){
      vals[cur]+=k;
    }
    draw();
  });
  draw();
}

/* ===== 一關的通用流程 ===== */
const MODNAME={word:'應用題',vert:'直式計算',calc:'計算填空',choice:'選擇題',tf:'是非題',unit:'小數換算與比大小',fig:'看圖題'};
const MODTIP={
  word:'先看懂題目在問什麼：第一步選出正確的「算式」（兩步驟題要選有括號的併式），再算出答案。',
  vert:'除法直式（有餘數要填「商…餘數」）和小數加減直式。',
  calc:'除法、三角形角度、併式計算、小數位值的填空題。',
  choice:'四選一（或三選一）。',
  tf:'對的選 O，錯的選 ✗。',

  fig:'看圖回答：三角形分類、全等圖形、百格板、長條圖和折線圖。'
};
let run=null;

function intro(mod){
  const sec=$('#tab-'+mod),arr=DATA[mod]||[],p=poolOf(arr,mod);
  sec.innerHTML=`
    <div class="card">
      <h2 style="margin:0;font-family:var(--kai);color:var(--orange)">${MODNAME[mod]}</h2>
      <p class="hint">${MODTIP[mod]}</p>
      ${timeChips()}
      <div class="bar">${sizeSel('n-'+mod)}
        <button class="btn primary" type="button" data-start="${mod}">開始</button>
        <span class="hint">範圍內 ${p.length} 題</span></div>
      ${p.length?'':'<p class="hint">這個範圍沒有題目，請在上面多選幾個單元，或關掉「只練錯題」。</p>'}
    </div>`;
  const btn=sec.querySelector('[data-start]');
  if(btn)btn.onclick=()=>{
    const n=+sec.querySelector('#n-'+mod).value;
    if(!p.length){toast('這個範圍沒有題目');return}
    startRun(mod,shuffle(p).slice(0,n));
  };
}

function noLongRun(qs){
  // 是非題：避免同一個答案連續超過 2 題
  const out=[],left=qs.slice();
  while(left.length){const k=out.length>=2&&out[out.length-1].a===out[out.length-2].a?left.findIndex(x=>x.a!==out[out.length-1].a):0;out.push(left.splice(k<0?0:k,1)[0])}
  return out;
}
function startRun(mod,qs){
  if(mod==='tf')qs=noLongRun(qs);
  run={mod,qs,i:0,log:[]};rtStart(mod);
  drawQ();
}

function qCard(inner,extra){
  return `<div class="card"><div class="rhud"></div>${inner}</div>${extra||''}`;
}

function drawQ(){
  const sec=$('#tab-'+(run.mod==='fig'?'fig':run.mod));
  if(run.i>=run.qs.length)return finishRun();
  const q=run.qs[run.i],no=`第 ${run.i+1} / ${run.qs.length} 題`;
  const src=q.s?`<div class="qsrc">${no}　出處：${esc(q.s)}${q.gen?'（自動出題）':''}</div>`:`<div class="qsrc">${no}${q.gen?'　自動出題':''}</div>`;
  if(run.mod==='word')     return drawWord(sec,q,src);
  if(run.mod==='choice')   return drawChoice(sec,q,src,q.o,q.i);
  if(run.mod==='tf')       return drawChoice(sec,q,src,['O','✗'],q.a==='O'?0:1,true);
  if(run.mod==='vert')     return drawVert(sec,q,src);
  if(run.mod==='fig')      return drawFig(sec,q,src);
  return drawFill(sec,q,src);
}

function nextBtn(){
  return `<div class="bar" style="justify-content:flex-end"><button class="btn primary" type="button" id="nx">下一題 →</button></div>`;
}
function wireNext(){const b=$('#nx');if(b)b.onclick=()=>{run.i++;drawQ()}}

function judge(q,ok,given,showAns){
  rtAns(ok);
  if(ok)SFX.ok();else{SFX.bad();addWrong(run.mod,q)}
  run.log.push({q,ok});
  return `<div class="fb ${ok?'y':'n'}">${ok?'✓ 答對了！':`✗ 答錯了。正確答案：<b>${esc(showAns!==undefined?showAns:q.a)}</b>`}${
    (!ok&&given!==undefined&&given!==null&&given!=='')?`　你寫的是：${esc(given)}`:''}${
    q.full?`<div class="hint" style="margin-top:4px">算式：${esc(q.full)}</div>`:''}</div>`;
}

/* --- 共用：答案輸入區（數字鍵盤，或文字答案就「看答案」自評） --- */
// padBox 放鍵盤、fbBox 放回饋。回傳 true 表示用鍵盤自動批改、false 表示自評。
function answerArea(padBox,fbBox,q,hintTxt){
  const spec=slotsOf(q.a);
  if(spec.k==='pick'){                                  // ＜＝＞ 或 O／✗ → 直接點選
    const ai=spec.opts.indexOf(spec.ans);
    padBox.innerHTML=`<div class="opts" id="pk">${spec.opts.map((o,i)=>
      `<button class="opt" type="button" data-i="${i}" style="justify-content:center"><span style="font-size:24px">${esc(o)}</span></button>`).join('')}</div>`;
    const go=i=>{
      padBox.querySelectorAll('#pk .opt').forEach((b,j)=>{b.disabled=true;if(j===ai)b.classList.add('good');else if(j===i)b.classList.add('bad')});
      fbBox.innerHTML=judge(q,i===ai,i>=0?spec.opts[i]:'（沒作答）',spec.ans)+nextBtn();wireNext();
    };
    rtQ(()=>go(-1));
    padBox.querySelectorAll('#pk .opt').forEach(b=>b.onclick=()=>go(+b.dataset.i));
    return false;
  }
  rtQ(null);
  if(spec.k==='self'){
    padBox.innerHTML=`<p class="hint" style="text-align:center">${hintTxt||'先在心裡（或紙上）想好答案，再按「看答案」。'}</p>
      <div class="bar" style="justify-content:center"><button class="btn primary" type="button" id="rv">看答案</button></div>`;
    padBox.querySelector('#rv').onclick=()=>{
      padBox.innerHTML=`<div class="fb">正確答案：<b>${esc(q.a)}</b></div>
        <div class="bar" style="justify-content:center">
          <button class="btn blue primary" type="button" id="y">我答對了</button>
          <button class="btn" type="button" id="n">我答錯了</button></div>`;
      const fin=ok=>{
        rtAns(ok);if(ok)SFX.ok();else{SFX.bad();addWrong(run.mod,q)}
        run.log.push({q,ok});
        fbBox.innerHTML=`<div class="fb ${ok?'y':'n'}">${ok?'✓ 很好！':'✗ 記起來，等一下在錯題本可以再練。'}</div>`+nextBtn();wireNext();
      };
      padBox.querySelector('#y').onclick=()=>fin(true);
      padBox.querySelector('#n').onclick=()=>fin(false);
    };
    return false;
  }
  numPad(padBox,spec,vals=>{
    const given=spec.parts.map((p,i)=>vals[i]+(p.u?' '+p.u:'')).join(' ').trim();
    const right=spec.parts.every((p,i)=>sameNum(vals[i],p.v));
    fbBox.innerHTML=judge(q,right,given)+nextBtn();wireNext();
  });
  return true;
}

/* --- 第7單元：三角形（標出三個角的度數；marks 表示等長邊記號）--- */
function triPts(ang,W,H,pad){
  // 以 A(0,0)、B(1,0) 為底，算出 C，再縮放到畫布
  const [a,b]=ang,ra=a*R2D,rb=b*R2D;
  const t=Math.sin(rb)/Math.sin((180-a-b)*R2D);           // AC 長（AB=1）
  let P=[[0,0],[1,0],[t*Math.cos(ra),t*Math.sin(ra)]];
  const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);
  const minx=Math.min(...xs),maxx=Math.max(...xs),maxy=Math.max(...ys);
  const sc=Math.min((W-2*pad)/(maxx-minx),(H-2*pad)/(maxy||1));
  const ox=(W-(maxx-minx)*sc)/2-minx*sc;
  return P.map(([x,y])=>[ox+x*sc,H-pad-y*sc]);
}
function angMark(P,i,lab,cls){
  const p=P[i],q=P[(i+1)%3],r=P[(i+2)%3];
  const v1=[q[0]-p[0],q[1]-p[1]],v2=[r[0]-p[0],r[1]-p[1]];
  const n1=Math.hypot(...v1),n2=Math.hypot(...v2);
  const u1=[v1[0]/n1,v1[1]/n1],u2=[v2[0]/n2,v2[1]/n2];
  const bis=[u1[0]+u2[0],u1[1]+u2[1]],nb=Math.hypot(...bis)||1;
  const tx=p[0]+bis[0]/nb*34,ty=p[1]+bis[1]/nb*34;
  return `<text class="fg-txt" x="${tx.toFixed(1)}" y="${(ty+5).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="700" ${cls||''}>${lab}</text>`;
}
function sideTick(p,q,k){
  const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2,dx=q[0]-p[0],dy=q[1]-p[1],n=Math.hypot(dx,dy);
  const nx=-dy/n*7,ny=dx/n*7,tx=dx/n*4,ty=dy/n*4;let s='';
  for(let j=0;j<k;j++){const ox=(j-(k-1)/2)*tx*1.6,oy=(j-(k-1)/2)*ty*1.6;
    s+=`<line class="fg-acc" x1="${(mx+ox-nx).toFixed(1)}" y1="${(my+oy-ny).toFixed(1)}" x2="${(mx+ox+nx).toFixed(1)}" y2="${(my+oy+ny).toFixed(1)}" stroke-width="2.4"/>`}
  return s;
}
function svgTri(f){
  const A=f.ang,W=320,H=200,P=triPts(A,W,H,26);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="三角形，三個角分別是 ${A.join('、')} 度">`;
  s+=`<path class="fg-fill" d="M ${P.map(p=>p.map(v=>v.toFixed(1)).join(' ')).join(' L ')} Z" stroke-width="2.5"/>`;
  if(f.show)A.forEach((d,i)=>{s+=angMark(P,i,d+'°')});
  if(f.marks){
    // 兩角相等 → 對邊相等
    const side=i=>[P[(i+1)%3],P[(i+2)%3]];   // 角 i 的對邊
    const eq=[];for(let i=0;i<3;i++)for(let j=i+1;j<3;j++)if(A[i]===A[j]){eq.push(i,j)}
    [...new Set(eq)].forEach(i=>{const [p,q]=side(i);s+=sideTick(p,q,1)});
  }
  return s+'</svg>';
}
/* --- 全等三角形：甲 ABC、乙（旋轉或翻轉後）標 DEF --- */
function svgCong(f){
  const W=340,H=170,half=W/2;
  const P=triPts(f.ang,half-10,H-20,22).map(([x,y])=>[x,y+10]);
  // 乙：對三角形重心旋轉／翻轉，放到右半邊
  const cx=(P[0][0]+P[1][0]+P[2][0])/3,cy=(P[0][1]+P[1][1]+P[2][1])/3;
  const rad=f.rot*R2D;
  let Q=P.map(([x,y])=>{let dx=x-cx,dy=y-cy;if(f.flip)dx=-dx;
    return [dx*Math.cos(rad)-dy*Math.sin(rad),dx*Math.sin(rad)+dy*Math.cos(rad)]});
  const xs=Q.map(p=>p[0]),ys=Q.map(p=>p[1]);
  const w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys)-Math.min(...ys);
  const sc=Math.min(1,(half-30)/w,(H-30)/h);
  Q=Q.map(([x,y])=>[half+15+(x-Math.min(...xs))*sc+((half-30)-w*sc)/2,15+(y-Math.min(...ys))*sc+((H-30)-h*sc)/2]);
  const tri=(T,cls)=>`<path class="${cls}" d="M ${T.map(p=>p.map(v=>v.toFixed(1)).join(' ')).join(' L ')} Z" stroke-width="2.5"/>`;
  const lab=(T,i,t)=>{const gx=(T[0][0]+T[1][0]+T[2][0])/3,gy=(T[0][1]+T[1][1]+T[2][1])/3,p=T[i],dx=p[0]-gx,dy=p[1]-gy,n=Math.hypot(dx,dy)||1;
    return `<text class="fg-txt" x="${(p[0]+dx/n*14).toFixed(1)}" y="${(p[1]+dy/n*14+5).toFixed(1)}" text-anchor="middle" font-size="15" font-weight="700">${t}</text>`};
  let s=`<svg viewBox="0 0 ${W} ${H+16}" role="img" aria-label="全等的兩個三角形甲和乙">`;
  s+=tri(P,'fg-fill')+tri(Q,'fg-line');
  ['A','B','C'].forEach((t,i)=>s+=lab(P,i,t));
  f.map.forEach((t,i)=>s+=lab(Q,i,t));
  const g=T=>[(T[0][0]+T[1][0]+T[2][0])/3,(T[0][1]+T[1][1]+T[2][1])/3];
  const [g1x,g1y]=g(P),[g2x,g2y]=g(Q);
  s+=`<text class="fg-txt" x="${g1x.toFixed(1)}" y="${(g1y+5).toFixed(1)}" text-anchor="middle" font-size="14" style="fill:var(--orange)" font-weight="700">甲</text>`;
  s+=`<text class="fg-txt" x="${g2x.toFixed(1)}" y="${(g2y+5).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="700">乙</text>`;
  return s+'</svg>';
}
/* --- 第9單元：百格板 --- */
function svgGrid(f){
  const n=f.whole+(f.part?1:0),S=104,gap=12,W=n*(S+gap)+gap,H=S+20;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${n} 張百格板，塗色部分">`;
  for(let k=0;k<n;k++){
    const x0=gap+k*(S+gap),y0=10,full=k<f.whole,c=S/10;
    for(let r=0;r<10;r++)for(let col=0;col<10;col++){
      const idx=col*10+r;const on=full||idx<f.part;
      s+=`<rect x="${(x0+col*c).toFixed(1)}" y="${(y0+r*c).toFixed(1)}" width="${c.toFixed(1)}" height="${c.toFixed(1)}" class="${on?'fg-fill':'fg-thin'}" stroke-width="0.6"/>`;
    }
    s+=`<rect x="${x0}" y="${y0}" width="${S}" height="${S}" class="fg-line" stroke-width="1.6"/>`;
  }
  return s+'</svg>';
}
/* --- 第10單元：長條圖、折線圖（含省略符號）--- */
function chartFrame(f,W,H,L,B,T,draw){
  const vmax=Math.max(...f.vals),top=f.base+Math.ceil((vmax-f.base)/f.step+1)*f.step;
  const ny=Math.round((top-f.base)/f.step),plotH=H-B-T,yOf=v=>H-B-(v-f.base)/(top-f.base)*plotH;
  let s=`<svg viewBox="0 0 ${W} ${H+24}" role="img" aria-label="${esc(f.title)}">`;
  for(let k=0;k<=ny;k++){const v=f.base+k*f.step,y=yOf(v);
    s+=`<line class="fg-thin" x1="${L}" y1="${y.toFixed(1)}" x2="${W-10}" y2="${y.toFixed(1)}" stroke-width="${k===0?1.6:0.6}"/>`;
    if(k%Math.max(1,Math.ceil(ny/8))===0||k===ny)s+=`<text class="fg-txt" x="${L-6}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="11">${v}</text>`;}
  s+=`<line class="fg-line" x1="${L}" y1="${T-8}" x2="${L}" y2="${H-B+(f.base?14:0)}" stroke-width="1.8"/>`;
  if(f.base){const y=H-B+8;
    s+=`<text class="fg-txt" x="${L-6}" y="${H-B+22}" text-anchor="end" font-size="11">0</text>`;
    s+=`<path class="fg-acc" d="M ${L-7} ${y-1} l 4 -4 l 6 8 l 4 -4" stroke-width="2"/>`;}
  else s+=`<text class="fg-txt" x="${L-6}" y="${H-B+4}" text-anchor="end" font-size="11">0</text>`;
  s+=draw(yOf);
  s+=`<text class="fg-txt" x="${L-4}" y="${T-14}" font-size="11">（${esc(f.unit)}）</text>`;
  s+=`<text class="fg-txt" x="${W/2}" y="${H+18}" text-anchor="middle" font-size="12" font-weight="700">${esc(f.title)}</text>`;
  return s+'</svg>';
}
function svgBar(f){
  const W=360,H=210,L=46,B=30,T=26,n=f.cats.length,slot=(W-L-16)/n,bw=Math.min(36,slot*0.55);
  return chartFrame(f,W,H,L,B,T,yOf=>{let s='';
    f.cats.forEach((c,i)=>{const x=L+8+i*slot+(slot-bw)/2,y=yOf(f.vals[i]);
      s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-B-y).toFixed(1)}" class="fg-fill" stroke-width="1.5"/>`;
      s+=`<text class="fg-txt" x="${(x+bw/2).toFixed(1)}" y="${H-B+16}" text-anchor="middle" font-size="12">${esc(c)}</text>`});
    return s});
}
function svgLine(f){
  const W=360,H=210,L=46,B=30,T=26,n=f.cats.length,slot=(W-L-20)/(n-1);
  return chartFrame(f,W,H,L,B,T,yOf=>{let s='',pts=f.cats.map((c,i)=>[L+10+i*slot,yOf(f.vals[i])]);
    s+=`<path class="fg-acc" d="M ${pts.map(p=>p.map(v=>v.toFixed(1)).join(' ')).join(' L ')}" stroke-width="2.6"/>`;
    pts.forEach(([x,y],i)=>{s+=`<circle class="fg-accf" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"/>`;
      s+=`<text class="fg-txt" x="${x.toFixed(1)}" y="${H-B+16}" text-anchor="middle" font-size="12">${esc(f.cats[i])}</text>`});
    return s});
}

function figSVG(f){
  if(f.t==='ang')return svgAngle(f.deg,!!f.prot);
  if(f.t==='ang2')return svgAngle2(f.a,f.b);
  if(f.t==='nl')return svgNumline(f.max,f.den,f.dots,f.hi);
  if(f.t==='frac')return svgFrac(f.den,f.num);
  if(f.t==='clock')return svgClock(f.from,f.steps,f.dir);
  if(f.t==='route')return svgRoute(f);
  if(f.t==='tri')return svgTri(f);
  if(f.t==='cong')return svgCong(f);
  if(f.t==='grid')return svgGrid(f);
  if(f.t==='bar')return svgBar(f);
  if(f.t==='line')return svgLine(f);
  return '';
}

function drawFig(sec,q,src){
  const spec=q.o?{k:'choice'}:slotsOf(q.a);
  sec.innerHTML=qCard(`${src}
    <div class="figbox">${figSVG(q.fig)}</div>
    <div class="qtext">${esc(q.q)}</div>
    ${q.hint?`<p class="hint">提示：${esc(q.hint)}</p>`:''}
    <div id="pad"></div><div id="fb"></div>`);
  if(q.o){
    const order=KPDeal.place(q.o.map((_,i)=>i),k=>q.o[k]===q.a),shown=order.map(i=>q.o[i]),ai=shown.indexOf(q.a);
    $('#pad').innerHTML=`<div class="opts" id="oo">${shown.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><span class="lab">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>`;
    rtQ(()=>go(-1));
    sec.querySelectorAll('#oo .opt').forEach(b=>b.onclick=()=>go(+b.dataset.i));
    function go(i){
      sec.querySelectorAll('#oo .opt').forEach((b,j)=>{b.disabled=true;if(j===ai)b.classList.add('good');else if(j===i)b.classList.add('bad')});
      $('#fb').innerHTML=judge(q,i===ai,i>=0?shown[i]:'（沒作答）')+nextBtn();wireNext();
    }
    return;
  }
  rtQ(null);
  numPad($('#pad'),spec.k==='self'?{k:'num',parts:[{v:q.a,u:''}],frac:true,mixed:true}:spec,vals=>{
    const given=spec.parts&&spec.parts.length>1?`${vals[0]} 公里 ${vals[1]} 公尺`:vals[0];
    const right=spec.parts&&spec.parts.length>1
      ? (vals[0]===spec.parts[0].v&&vals[1]===spec.parts[1].v)
      : sameNum(vals[0],String(q.a).replace(/[^\d/. ]/g,'').trim());
    $('#fb').innerHTML=judge(q,right,given)+nextBtn();wireNext();
  });
}

function memDeal(){
  if(mm&&mm.timer)clearInterval(mm.timer);
  const sel=shuffle(memPool()).slice(0,memSize);
  const cards=shuffle(sel.flatMap((x,i)=>[{id:i,t:'a',x},{id:i,t:'b',x}]));

  mm={cards,open:[],done:0,moves:0,n:sel.length,lock:false,score:0,combo:0,maxCombo:0,start:0,el:0,limit,over:false,timer:null,lastTick:-1,msg:''};

function memStartClock(){
  if(mm.start)return;mm.start=Date.now();
  mm.timer=setInterval(()=>{if(!mm){return}mm.el=(Date.now()-mm.start)/1000;
    if(mm.limit){const left=Math.ceil(mm.limit-mm.el);if(left<=10&&left>0&&left!==mm.lastTick){mm.lastTick=left;SFX.tick()}
      if(mm.el>=mm.limit){mm.el=mm.limit;memEnd(false);return}}

  const tb=$('#mBar');if(tb){tb.classList.toggle('warn',!!warn);tb.firstElementChild.style.width=(mm.limit?left/mm.limit*100:mm.done/mm.n*100)+'%'}

const memFace=c=>`<span class="fc">${esc(c.t==='a'?c.x.a:c.x.b)}</span>`;
function memRender(fx){
  $('#tab-mem').innerHTML=`<div class="card">
    <div class="hud" id="mHud"></div><div class="timebar" id="mBar"><i></i></div>
    <div class="combo" id="mCombo">${esc(mm.msg)}</div>
    <div class="mem">${mm.cards.map((c,i)=>`<button class="mc${c.open?' open':''}${c.done?' done':''}${fx&&fx.idx.includes(i)?' '+fx.cls:''}" type="button" data-i="${i}" aria-label="${c.open||c.done?'已翻開':'蓋著的牌'}">${memFace(c)}</button>`).join('')}</div>
    <div class="bar"><button class="btn" id="mNew">重新發牌</button><button class="btn" id="mBack">換玩法</button></div>
    <div id="mMsg"></div>
   </div>`;
  memHud();
  $('#mNew').onclick=memDeal;$('#mBack').onclick=memIntro;
  document.querySelectorAll('#tab-mem .mc').forEach(b=>b.onclick=()=>memFlip(+b.dataset.i));
}
function memFlip(i){
  const c=mm.cards[i];if(mm.over||mm.lock||c.open||c.done)return;
  memStartClock();SFX.flip();
  c.open=true;mm.open.push(c);
  if(mm.open.length<2){memRender();return}
  mm.moves++;const [a,b]=mm.open,ia=mm.cards.indexOf(a),ib=mm.cards.indexOf(b);
  if(a.id===b.id&&a.t!==b.t){
    a.done=b.done=true;a.open=b.open=false;mm.done++;mm.open=[];mm.combo++;mm.maxCombo=Math.max(mm.maxCombo,mm.combo);
    const add=100+(mm.combo-1)*50;mm.score+=add;
    mm.msg=mm.combo>1?`${mm.combo} 連擊！＋${add}`:`配對成功 ＋${add}`;
    SFX.match();memRender({idx:[ia,ib],cls:'pop'});
    if(mm.done===mm.n)memEnd(true);
  }else{
    mm.combo=0;mm.msg='';mm.lock=true;memRender({idx:[ia,ib],cls:'pop'});
    setTimeout(()=>{if(!mm||mm.over)return;a.open=b.open=false;mm.open=[];mm.lock=false;memRender()},850);
  }
}
function memEnd(win){
  mm.over=true;clearInterval(mm.timer);mm.timer=null;
  if(mm.start)mm.el=Math.min(mm.limit||1e9,(Date.now()-mm.start)/1000);
  let bonus=0;if(win&&mm.limit)bonus=Math.ceil(mm.limit-mm.el)*10;mm.score+=bonus;
  memHud();
  if(!win){
    SFX.bad();
    const left=mm.cards.filter(c=>!c.done&&c.t==='a').map(c=>c.x);
    mm.cards.forEach(c=>{if(!c.done)c.open=true});memRender();
    $('#mMsg').innerHTML=`<div class="rsum"><div><b>${mm.done}/${mm.n}</b>配對</div><div><b>${mm.score}</b>分數</div></div>
      <p class="qask">時間到！還沒配到的：</p>
      <div class="wlist">${left.map(x=>`<div class="witem"><span class="wq">${esc(x.a)}</span> ＝ <span class="wa">${esc(x.b)}</span></div>`).join('')}</div>
      <div class="bar"><button class="btn primary" id="mAgain">再挑戰一次</button><button class="btn" id="mBack2">換玩法</button></div>`;
  }else{
    const stars=mm.moves<=mm.n+2?3:mm.moves<=Math.ceil(mm.n*1.7)?2:1;
    const k=memKey(),best=load(k,null);let rec=false;
    if(mm.limit){if(!best||mm.score>best.sc){save(k,{sc:mm.score});rec=true}}
    else{if(!best||mm.el<best.t){save(k,{t:mm.el,mv:mm.moves});rec=true}}
    setTimeout(()=>{if(stars===3)celebrate('三顆星過關！');else SFX.win()},250);
    $('#mMsg').innerHTML=`<div class="stars" aria-label="${stars} 顆星">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <div class="rsum"><div><b>${mm.score}</b>分數</div><div><b>${mmt(mm.el)}</b>用時</div><div><b>${mm.moves}</b>翻牌</div><div><b>${mm.maxCombo}</b>最高連擊</div></div>
      <p class="qask">${bonus?`剩餘時間加分 ＋${bonus}。`:''}${rec?'<b style="color:var(--orange)">新紀錄！</b>':`最佳紀錄：${best?(mm.limit?best.sc+' 分':mmt(best.t)):'—'}`}</p>
      <div class="bar"><button class="btn primary" id="mAgain">再玩一局</button><button class="btn" id="mBack2">換玩法</button></div>`;
  }
  const a=$('#mAgain');if(a)a.onclick=memDeal;
  const b2=$('#mBack2');if(b2)b2.onclick=memIntro;
}

const MOCK_PLAN=[['一、選擇題','choice',10],['二、是非題','tf',6],['三、填填看','fill',10],['四、看圖回答','fig',10],['五、併式與應用題','word',8],['六、直式計算','vert',6]];
const fmtN=x=>{const s=(Math.round(x*100)/100).toFixed(2);return s.replace(/\.?0+$/,'')};
function numOpts(a){
  a=String(a).trim();const out=new Set([a]);
  let m=a.match(/^(\d+)\s*…\s*(\d+)$/);
  if(m){const q=+m[1],r=+m[2];
    [[q+1,r],[q-1,r],[q,r+1],[q,Math.max(0,r-1)],[q*10,r],[q+10,r]].forEach(([x,y])=>{if(x>0&&out.size<4)out.add(`${x}…${y}`)});
    return [...out].slice(0,4);}
  m=a.match(/^(\d+(?:\.\d+)?)\s*(.*)$/);
  if(!m)return [a];
  const v=parseFloat(m[1]),u=m[2]?' '+m[2]:'',dec=m[1].includes('.')?m[1].split('.')[1].length:0;
  const c=dec?[v+0.1,v-0.1,v+0.01,v-0.01,v*10,v/10,v+1]:[v+1,v-1,v+10,v-10,v*10,+String(m[1]).split('').reverse().join(''),v+100,v+2];
  for(const x of shuffle(c)){if(out.size>=4)break;if(!(x>0))continue;const t=(dec?fmtN(x):String(Math.round(x)))+u;if(t!==a)out.add(t)}
  let k=2;while(out.size<4){out.add((dec?fmtN(v+k*0.01):String(Math.round(v+k)))+u);k++}
  return [...out].slice(0,4);
}
function mockItem(kind,q){
  const it={kind,src:q,pt:2};
  if(kind==='tf'){it.q=q.q;it.o=['O','✗'];it.a=q.a==='O'?'O':'✗';it.tf=true;it.mod='tf';return it}
  if(kind==='choice'){it.q=q.q;it.a=q.a;it.o=KPDeal.place(q.o.slice(),q.a);it.mod='choice';return it}
  if(kind==='fig'){it.q=q.q;it.fig=q.fig;it.a=q.a;it.o=KPDeal.place((q.o||numOpts(q.a)).slice(),q.a);it.mod='fig';return it}
  if(kind==='vert'){it.q=q.q+' ＝ ？';it.a=q.a;it.o=KPDeal.place(numOpts(q.a),q.a);it.mod='vert';return it}
  if(kind==='word'){it.q=q.q;it.a=q.a;it.o=KPDeal.place(numOpts(q.a),q.a);it.mod='word';return it}
  // 填填看：計算或單位
  const s=slotsOf(q.a);it.q=q.q;it.mod=q._m;
  if(s.k==='pick'){it.o=s.opts.slice();it.a=s.ans;it.tf=true;return it}
  it.a=q.a;it.o=KPDeal.place(numOpts(q.a),q.a);return it;
}
let mk=null;
function mockBuild(){
  const pools={choice:poolOf(DATA.choice,'choice'),tf:poolOf(DATA.tf,'tf'),
    fill:poolOf(DATA.calc,'calc').map(x=>({...x,_m:'calc'})).concat(poolOf(DATA.unit,'unit').map(x=>({...x,_m:'unit'}))),
    fig:FIGS.filter(inScope).filter(x=>!st.onlyWrong||wrong[wkey('fig',x.q)]),word:poolOf(DATA.word,'word'),vert:poolOf(DATA.vert,'vert')};
  const secs=[];
  MOCK_PLAN.forEach(([name,k,n])=>{
    // 依範圍內各單元平均抽題
    const p=shuffle(pools[k]),byU={};p.forEach(x=>(byU[x.u]=byU[x.u]||[]).push(x));
    const us=Object.keys(byU),pickd=[];let i=0;
    while(pickd.length<n&&us.some(u=>byU[u].length)){const u=us[i%us.length];if(byU[u].length)pickd.push(byU[u].shift());i++}
    if(pickd.length)secs.push({name,items:pickd.map(q=>mockItem(k,q))});
  });
  return secs;
}

  if(!mk.done){
    document.querySelectorAll('#tab-mock .mkq').forEach(q=>q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{

function mockSubmit(){
