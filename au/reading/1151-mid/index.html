body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;font-size:1.1rem;line-height:1.5;-webkit-tap-highlight-color:transparent}

 if(q.ty==="tf"||q.ty==="mc"){Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(o){var v=o.getAttribute("data-v");if(v===r.correct)o.classList.add("right");else if(v===given)o.classList.add("wrong")})}
 if(r.ok){fb.innerHTML='<div class="fb ok">Correct! Great job! ✓'+(q.ty==="short"?'<div class="exp">Model answer: '+esc(q.a)+'</div>':'')+'</div>'}
 else{var extra=q.ty==="short"?'<div class="exp">Include the key ideas and write a full sentence.</div>':"";if(q.exp)extra+='<div class="exp">'+esc(q.exp)+'</div>';fb.innerHTML='<div class="fb bad">✗ Not quite. The correct answer is:<div class="ans">'+esc(q.ty==="tf"?(q.a?"TRUE":"FALSE"):r.correct)+'</div>'+extra+'</div>'}
}
function flash(m){var fb=document.getElementById("fb");if(fb)fb.innerHTML='<div class="fb bad">'+m+'</div>'}

// ---------- oral recording ----------
var REC={rec:null,stream:null,chunks:[],url:null,timer:null,secs:0,audio:null};
function pickMime(){if(!window.MediaRecorder)return "";var m=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg"];for(var i=0;i<m.length;i++){try{if(MediaRecorder.isTypeSupported(m[i]))return m[i]}catch(e){}}return ""}
function noMic(){
 document.getElementById("recBtn").hidden=true;
 document.getElementById("micMsg").innerHTML='<div class="note" style="margin-top:12px">Use your device recorder instead. Tap a button, record your answer, then tap <b>Use</b> or <b>Done</b>. You can listen to it right here.</div>'+
 '<div class="btns" style="margin-top:4px"><label class="btn r" for="capA">🎙 Record Voice</label><label class="btn n" for="capV">📹 Record Video</label></div>'+
 '<input type="file" id="capA" accept="audio/*" capture hidden onchange="gotClip(this)"><input type="file" id="capV" accept="video/*" capture="user" hidden onchange="gotClip(this)">'+
 '<div id="clip"></div>';
}
function gotClip(inp){
 var f=inp.files&&inp.files[0];if(!f)return;
 if(REC.url)URL.revokeObjectURL(REC.url);REC.url=URL.createObjectURL(f);
 var isV=/^video/.test(f.type);
 document.getElementById("clip").innerHTML='<div style="margin-top:12px"><b>▶ Listen to your answer:</b><br>'+(isV?'<video controls playsinline style="width:100%;max-height:260px;border-radius:12px;margin-top:6px" src="'+REC.url+'"></video>':'<audio controls style="width:100%;margin-top:6px" src="'+REC.url+'"></audio>')+'</div>';
 document.getElementById("revealBtn").hidden=false;
}
function startRec(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){noMic();return}
 navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
  REC.stream=stream;REC.chunks=[];var mime=pickMime();
  try{REC.rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream)}catch(e){REC.rec=new MediaRecorder(stream)}
  REC.rec.ondataavailable=function(e){if(e.data&&e.data.size)REC.chunks.push(e.data)};
  REC.rec.onstop=function(){
   var b=new Blob(REC.chunks,{type:(REC.rec&&REC.rec.mimeType)||"audio/webm"});if(REC.url)URL.revokeObjectURL(REC.url);REC.url=URL.createObjectURL(b);
   var pb=document.getElementById("playBtn");if(pb)pb.hidden=false;
   var rv=document.getElementById("revealBtn");if(rv)rv.hidden=false;
  };
  REC.rec.start();REC.secs=0;
  document.getElementById("recBtn").hidden=true;document.getElementById("stopBtn").hidden=false;
  REC.timer=setInterval(function(){REC.secs++;var t=document.getElementById("tmr");if(t)t.textContent="● "+REC.secs+"s / 90s";if(REC.secs>=90)stopRec()},1000);
 }).catch(function(){noMic()});
}
function stopRec(silent){
 clearInterval(REC.timer);
 if(REC.rec&&REC.rec.state!=="inactive"){try{REC.rec.stop()}catch(e){}}
 if(REC.stream){REC.stream.getTracks().forEach(function(t){t.stop()});REC.stream=null}
 if(silent){REC.rec=null;return}
 var t=document.getElementById("tmr");if(t)t.textContent="";
 var sb=document.getElementById("stopBtn");if(sb)sb.hidden=true;
 var rb=document.getElementById("recBtn");if(rb){rb.hidden=false;rb.textContent="🎙 Record Again"}
}
function playRec(){if(!REC.url)return;if(REC.audio)REC.audio.pause();REC.audio=new Audio(REC.url);REC.audio.play().catch(function(){})}
function reveal(){
 var q=S.cur.q;document.getElementById("revealBtn").hidden=true;
 document.getElementById("oralOut").innerHTML='<div class="model"><b>📖 Model Answer:</b><br>'+esc(q.a)+'<br><button class="btn g" style="margin-top:8px" onclick="speak(S.cur.q.a)">🔊 Hear Model Answer</button><div class="exp" style="margin-top:8px">Key words: '+q.kw.map(function(k){return esc(k.split("|")[0])}).join(" · ")+'</div></div>'+
 '<div class="btns" id="selfScore"><button class="btn ok" onclick="selfScore(true)">✓ Got it</button><button class="btn g" onclick="selfScore(false)">✗ Still learning</button></div>';
}
function selfScore(ok){
 if(S.cur.checked)return;S.cur.checked=true;if(ok)S.score++;
 S.log.push({q:S.cur.q,given:ok?"Got it":"Still learning",ok:ok,correct:S.cur.q.a});
 document.getElementById("selfScore").innerHTML='<div class="fb '+(ok?"ok":"bad")+'" style="margin-top:0">'+(ok?"Great job! ✓":"Keep practising. You can try it again later.")+'</div>';
 var nx=document.getElementById("nxt");nx.hidden=false;if(S.i===S.qs.length-1)nx.textContent="Finish 🏁";
}

function next(){if(S.i<S.qs.length-1){S.i++;render()}else finish()}
function finish(){
 stopRec(true);try{speechSynthesis.cancel()}catch(e){}
 setHeader(S.title+" · Results",true,false);
 var n=S.log.length,c=S.log.filter(function(l){return l.ok}).length,p=n?Math.round(c*100/n):0;
 var st=p>=90?5:p>=75?4:p>=55?3:p>=40?2:1;
 var msg=p>=90?"Outstanding! 🌟":p>=75?"Great work! 😊":p>=55?"Getting there! 📝":"Keep practising! 💪";
 var h='<div class="panel score">';
 if(!n)h+='<div style="font-size:1.25rem;font-weight:800;margin:10px 0">No questions answered yet.</div>';
 else h+='<div class="stars">'+"⭐".repeat(st)+'</div><div class="big">'+c+' / '+n+'</div><div style="font-size:1.2rem;font-weight:800">Answered '+n+' question'+(n>1?"s":"")+' — '+c+' correct ('+p+'%)</div><div style="margin-top:4px">'+msg+'</div>';
 h+='<div class="btns" style="justify-content:center"><button class="btn p" onclick="S.again()">🔁 Try Again</button><button class="btn g" onclick="goHome()">← Back to Home</button></div></div>';
 var wrong=S.log.filter(function(l){return !l.ok});
 if(n){h+='<h3 class="revh">'+(wrong.length?"Review your mistakes":"No mistakes — perfect!")+'</h3>';
 wrong.forEach(function(l){
  var cc=l.q.ty==="tf"?(l.q.a?"TRUE":"FALSE"):l.correct;
  var qt=l.q.ty==="scramble"?l.q.zh+" ("+l.q.pos+")":l.q.ty==="listen"?"🎧 (listening)":l.q.q;
  h+='<div class="rev"><small>'+INSTR[l.q.ty]+'</small><div><b>✗ '+esc(qt)+'</b></div><div>Your answer: '+esc(l.given)+'</div><div class="ans" style="font-size:1.08rem">'+esc(cc)+'</div></div>'})}
 app.innerHTML=h;window.scrollTo(0,0);
}
goHome();
</script>

<script>
/* =====================================================================
   site-home.js — "📚 小站" (back to 練習小站) button for every practice page
   Canonical copy: github.com/iam5980/kids-practice/template/site-home.js
   Version: 2026-10-24

   HOW TO USE: paste this whole file in its own <script> block just before
   </body> of EVERY page published to kids-practice (English and 中文部,
   apps, oral pages, listening players). No other code is needed.

   - Small "📚 小站" pill fixed at the bottom-left (safe-area aware)
   - Tap → in-page card: "回到練習小站嗎？" [回到練習小站] [繼續練習]
     (no window.confirm — it is blocked/ugly on iPad and stops speech)
   - Goes to the site root (…/kids-practice/), or the live site when the
     page is opened outside it (Artifact preview, local file)
   - Adds bottom padding so the button never hides the last line
   ===================================================================== */
(function () {
  "use strict";
  if (window.__siteHome || !document.body) return;
  window.__siteHome = true;
  var LIVE = "https://iam5980.github.io/kids-practice/";
  function homeUrl() {
    var p = location.pathname, i = p.indexOf("/kids-practice/");
    if (location.protocol.indexOf("http") === 0 && i >= 0) return location.origin + p.slice(0, i) + "/kids-practice/";
    return LIVE;
  }
  var css = document.createElement("style");
  css.textContent =
    "#sh-btn{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:9000;" +
    "height:44px;padding:0 14px 0 10px;border-radius:999px;border:2px solid rgba(255,255,255,.9);background:#334155;color:#fff;font:700 16px/1 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;" +
    "box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;opacity:.9;touch-action:manipulation;white-space:nowrap}" +
    "#sh-btn:active{transform:scale(.94)}" +
    "#sh-mask{position:fixed;inset:0;z-index:9001;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px}" +
    "#sh-card{background:#fff;color:#0f172a;border-radius:18px;padding:20px 18px;max-width:340px;width:100%;text-align:center;" +
    "font:17px/1.5 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.3)}" +
    "#sh-card h3{margin:0 0 6px;font-size:20px}#sh-card p{margin:0 0 16px;color:#475569;font-size:15px}" +
    "#sh-card button{font:inherit;min-height:48px;border-radius:12px;border:0;padding:10px 16px;margin:4px;cursor:pointer}" +
    "#sh-go{background:#0284c7;color:#fff;font-weight:700}#sh-stay{background:#e2e8f0;color:#0f172a}" +
    "@media (prefers-color-scheme:dark){#sh-card{background:#1e293b;color:#e2e8f0}#sh-card p{color:#94a3b8}#sh-stay{background:#334155;color:#e2e8f0}}" +
    "body{padding-bottom:max(76px,calc(64px + env(safe-area-inset-bottom)))!important}";
  document.head.appendChild(css);

  var b = document.createElement("button");
  b.id = "sh-btn"; b.type = "button";
  b.setAttribute("aria-label", "回到練習小站"); b.title = "回到練習小站";
  b.textContent = "📚 小站";
  b.addEventListener("click", function () {
    if (document.getElementById("sh-mask")) return;
    var m = document.createElement("div"); m.id = "sh-mask";
    m.innerHTML = '<div id="sh-card" role="dialog" aria-modal="true"><h3>📚 回到練習小站？</h3>' +
      '<p>這一輪的作答不會保留（最高分紀錄會留著）。</p>' +
      '<button id="sh-go" type="button">回到練習小站</button><button id="sh-stay" type="button">繼續練習</button></div>';
    document.body.appendChild(m);
    function close() { m.remove(); }
    m.addEventListener("click", function (e) { if (e.target === m) close(); });
    document.getElementById("sh-stay").addEventListener("click", close);
    document.getElementById("sh-go").addEventListener("click", function () {
      try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
      location.href = homeUrl();
    });
    document.getElementById("sh-go").focus();
  });
  document.body.appendChild(b);
})();
</script>
