<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>四上國語生字練功房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 生字簿：紙頁＋課本側欄的灰綠＋描紅的粉紅；單欄、手機優先 */
:root{
  --paper:#f8faf6; --card:#ffffff; --ink:#1e2a23; --muted:#5d6d63;
  --sage:#c9dccb; --sage-deep:#3c6a4c; --rose:#f2b3c8; --rose-deep:#b23b67;
  --line:#d5e0d4; --ok:#2f7a45; --bad:#b3362f; --okbg:#e3f2e6; --badbg:#fbe7e5;
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121813; --card:#1a221c; --ink:#e7efe8; --muted:#9db0a2;
  --sage:#2b3f30; --sage-deep:#9fd0ad; --rose:#6d3247; --rose-deep:#f3a2bf;
  --line:#2d3b31; --ok:#7fd29a; --bad:#ff958c; --okbg:#1d3324; --badbg:#3a1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121813; --card:#1a221c; --ink:#e7efe8; --muted:#9db0a2;
  --sage:#2b3f30; --sage-deep:#9fd0ad; --rose:#6d3247; --rose-deep:#f3a2bf;
  --line:#2d3b31; --ok:#7fd29a; --bad:#ff958c; --okbg:#1d3324; --badbg:#3a1f1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header h1{font-family:var(--kai);font-size:clamp(26px,7vw,36px);margin:0;line-height:1.2;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,canvas:focus-visible{outline:3px solid var(--rose-deep);outline-offset:2px}
.scope{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--paper);font-weight:700}
.chip.wrongchip[aria-pressed="true"]{background:var(--rose-deep);border-color:var(--rose-deep)}
.count{font-size:13px;color:var(--muted);margin-left:auto}
nav.tabs{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;background:var(--sage);padding:4px;border-radius:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
nav.tabs button{border:0;background:transparent;border-radius:9px;padding:8px 0;font-size:clamp(12px,3.4vw,15px);font-weight:500;white-space:nowrap}
@media (max-width:760px){nav.tabs{grid-template-columns:repeat(6,1fr)}}
nav.tabs button[aria-selected="true"]{background:var(--card);font-weight:700;color:var(--sage-deep);box-shadow:0 1px 2px rgba(0,0,0,.12)}
section{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--sage-deep);background:var(--card);color:var(--sage-deep);border-radius:10px;padding:8px 16px;font-weight:700}
.btn.primary{background:var(--sage-deep);color:var(--paper)}
.btn.rose{border-color:var(--rose-deep);color:var(--rose-deep)}
.btn.rose.primary{background:var(--rose-deep);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:default}
.hint{color:var(--muted);font-size:14px;margin:0}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}

/* 田字格 */
.tian{position:relative;aspect-ratio:1;max-width:100%;border:2px solid var(--sage-deep);background:var(--card);display:grid;place-items:center}
.tian::before,.tian::after{content:"";position:absolute;pointer-events:none}
.tian::before{left:50%;top:0;bottom:0;border-left:1.5px dashed var(--line)}
.tian::after{top:50%;left:0;right:0;border-top:1.5px dashed var(--line)}
.tian .z{font-family:var(--kai);line-height:1;position:relative;z-index:1}

/* 生字卡 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.mini{width:100%;font-size:34px;padding:0}
.mini .z{font-size:34px}
.mini.sel{border-color:var(--rose-deep);box-shadow:0 0 0 2px var(--rose-deep)}
.mini .star{position:absolute;top:1px;right:3px;font-size:11px;color:var(--rose-deep);z-index:2;font-family:var(--sans)}
.groupHead{font-family:var(--kai);font-size:18px;margin:6px 0 -2px;color:var(--sage-deep)}
.detail{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.detail .tian .z{font-size:clamp(84px,24vw,128px)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-content:start;min-width:0}
.facts dt{color:var(--muted);font-size:14px;padding-top:3px}
.facts dd{margin:0;font-size:20px;font-weight:500}
.facts dd small{font-size:14px;color:var(--muted);font-weight:400}
.cover{background:var(--sage);border-radius:6px;color:transparent;user-select:none;cursor:pointer;padding:0 6px}
.cover::after{content:"點我看";color:var(--sage-deep);font-size:13px}
.cover *{visibility:hidden}
.zy{font-family:var(--sans);letter-spacing:1px}
.kai{font-family:var(--kai)}
.say{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--sage-deep);background:var(--card);color:var(--sage-deep);border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;vertical-align:middle;margin:2px 4px 2px 0;font-family:var(--sans)}
.say svg{width:16px;height:16px;fill:currentColor}
.say:active{background:var(--sage)}
.hdr{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.hdr>div{min-width:0}
.hdr #sfxBtn{flex:none;margin-top:6px}
.modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px}
.hud div{text-align:center;font-size:12px;color:var(--muted)}
.hud b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;font-family:var(--sans)}
.hud .warn b{color:var(--bad)}
.timebar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.timebar i{display:block;height:100%;background:var(--sage-deep);transition:width .25s linear}
.timebar.warn i{background:var(--bad)}
.combo{text-align:center;font-family:var(--kai);font-size:22px;color:var(--rose-deep);min-height:1.4em}
.stars{font-size:34px;letter-spacing:4px;color:var(--rose-deep)}
.mem.m16{grid-template-columns:repeat(4,1fr)}
.mc.open,.mc.done{transform:rotateY(0)}
.mc.pop{animation:pop .35s ease}
.mc.shake{animation:shake .35s ease}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.mc.pop,.mc.shake{animation:none}}
.fz{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:2px}
.flash{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.grade{display:flex;gap:14px;align-items:center;border-radius:14px;padding:12px 14px;border:2px solid var(--line);background:var(--card);margin-bottom:10px}
.grade.g-ok{border-color:var(--ok);background:var(--okbg)}.grade.g-chk{border-color:var(--rose-deep);background:var(--badbg)}
.gscore{text-align:center;flex:none}.gscore b{display:block;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}.gscore span{font-size:13px;color:var(--muted)}
.ginfo{min-width:0;font-size:15px}
.sent{font-family:var(--kai);font-size:24px;line-height:1.9;text-align:left;width:100%}
.sent .sc{border:0;background:transparent;font:inherit;padding:0 1px;border-radius:5px;cursor:pointer;color:var(--ink)}
.sent .sc.on{background:var(--rose);outline:2px solid var(--rose-deep)}
.sent .sc.hit{background:var(--okbg);outline:2px solid var(--ok);color:var(--ok)}
.sent .sc.miss{outline:2px dashed var(--bad);color:var(--bad)}
.sent .sc.fp{text-decoration:line-through;color:var(--muted)}
.sent .sc:disabled{cursor:default}
.fixrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.fixrow .arrow{font-size:20px;color:var(--muted)}
.fopts{display:flex;gap:6px;flex-wrap:wrap}
.opt.sm{min-height:0;padding:4px 12px;flex-direction:row}
.opt.sm .o1{font-size:26px}
#party{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 70%,transparent);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  --c1:#bfe3c6;--c2:#f2a7c0;--c3:#ffd36e;--c4:#a9cdf2;animation:fadein .25s ease}
#party.out{opacity:0;transition:opacity .3s}
@keyframes fadein{from{opacity:0}}
.party-card{position:relative;z-index:2;background:var(--card);border:2px solid var(--sage-deep);border-radius:20px;padding:18px 16px;text-align:center;max-width:380px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.dancers{display:flex;align-items:flex-end;justify-content:center;gap:4px}
.dancer{width:110px;height:auto}
.hundred{font-family:var(--kai);font-size:44px;font-weight:700;color:var(--rose-deep);align-self:center;animation:pulse .6s ease-in-out infinite alternate}
.d1{animation:bounce .5s ease-in-out infinite alternate;transform-origin:50% 100%}
.d2{animation:bounce .5s ease-in-out .25s infinite alternate;transform-origin:50% 100%}
.arm{transform-box:fill-box}
.d1 .al,.d2 .al{transform-origin:100% 100%;animation:wave .5s ease-in-out infinite alternate}
.d1 .ar,.d2 .ar{transform-origin:0 100%;animation:wave2 .5s ease-in-out infinite alternate}
.leg{transform-box:fill-box;transform-origin:50% 0}
.ll{animation:kick .5s ease-in-out infinite alternate}.lr{animation:kick .5s ease-in-out .25s infinite alternate}
@keyframes bounce{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg)}}
@keyframes wave{from{transform:rotate(18deg)}to{transform:rotate(-22deg)}}
@keyframes wave2{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
@keyframes kick{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.15)}}
.party-title{font-family:var(--kai);font-size:30px;font-weight:700;margin-top:6px}
.party-sub{color:var(--muted);margin:4px 0 12px}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{top:105%;transform:rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.d1,.d2,.arm,.leg,.hundred,.confetti i{animation:none!important}.confetti{display:none}}
.rhud{width:100%;display:flex;flex-direction:column;gap:4px}
.rrow{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.rrow b{color:var(--ink);font-size:17px}.rrow .cdw b{color:var(--bad)}
.plus{text-align:center;font-size:14px;font-weight:700;color:var(--rose-deep);min-height:1.3em}
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.rsum div{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:12px;color:var(--muted)}
.rsum b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.flag{display:inline-block;font-size:12px;background:var(--rose);color:var(--ink);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle}
@media (max-width:460px){.detail{grid-template-columns:1fr}.detail .tian{width:150px;margin:0 auto}}

/* 寫寫看 */
.prompt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.prompt .word{font-family:var(--kai);font-size:34px;line-height:1.4}
.prompt .box{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--rose-deep);border-radius:6px;padding:0 8px;margin:0 2px;font-family:var(--sans);font-size:22px;color:var(--rose-deep);vertical-align:middle;min-height:44px}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.padwrap{width:min(100%,340px);margin:0 auto}
.pad{touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.pad .ghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--kai);color:var(--rose);z-index:1;line-height:1}
.reveal{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.reveal .big{font-family:var(--kai);font-size:72px;line-height:1;color:var(--rose-deep)}
.reveal .info{min-width:0;flex:1}
.center{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

/* 選擇題 */
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.qchar{font-family:var(--kai);font-size:96px;line-height:1.05}
.qask{font-size:17px;margin:0;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:76px;justify-content:center}
.opt .o1{font-size:30px;font-family:var(--kai);line-height:1.1}
.opt .o1.zy{font-family:var(--sans);font-size:24px}
.opt .o2{font-size:12px;color:var(--muted)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt .mark{font-size:13px;font-weight:700}
.opt.ok .mark{color:var(--ok)}.opt.bad .mark{color:var(--bad)}
.fb{border-radius:10px;padding:8px 12px;width:100%;font-size:15px}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.fb b{color:var(--ink)}

/* 翻牌 */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:3/4;border-radius:12px;border:2px solid var(--sage-deep);background:var(--sage);display:grid;place-items:center;font-size:0;padding:4px;transition:transform .2s}
.mc.open,.mc.done{background:var(--card);font-size:16px}
.mc.done{border-color:var(--ok);opacity:.65}
.mc .k{font-family:var(--kai);font-size:clamp(30px,9vw,46px);line-height:1}
.mc .zyc{font-size:clamp(15px,4.4vw,20px);font-family:var(--sans)}
.mc .rad{font-family:var(--kai);font-size:clamp(26px,8vw,40px);line-height:1}
.mc .tag{font-size:11px;color:var(--muted);display:block;text-align:center}
.mc:not(.open):not(.done)::after{content:"?";font-size:28px;font-family:var(--kai);color:var(--sage-deep)}
@media (prefers-reduced-motion:reduce){.mc{transition:none}}

/* 結果、錯題 */
.done-box{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.score{font-family:var(--kai);font-size:44px;line-height:1;color:var(--sage-deep);font-variant-numeric:tabular-nums}
.wlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wz{font-family:var(--kai);font-size:28px;border:1.5px solid var(--rose-deep);border-radius:8px;padding:0 8px;color:var(--rose-deep)}
table{border-collapse:collapse;width:100%;font-size:15px}
.tbl{overflow-x:auto;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:500}
td.k{font-family:var(--kai);font-size:26px}
td.n{font-variant-numeric:tabular-nums;text-align:center}
.confirm{background:var(--badbg);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
</style>
</head>
<body>

<div class="wrap">
  <header class="hdr">
    <div><h1>四上國語生字練功房</h1>
    <p>第一課～第六課・89 個生字＋多音字＋形近字＋改錯字＋成語：會寫、會念、記得部首和筆畫</p></div>
    <button class="chip" id="sfxBtn" aria-pressed="true">音效：開</button>
  </header>

  <div class="scope" id="scope" aria-label="練習範圍"></div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="cards" aria-selected="true">生字卡</button>
    <button role="tab" data-tab="write" aria-selected="false">寫寫看</button>
    <button role="tab" data-tab="rad" aria-selected="false">部首</button>
    <button role="tab" data-tab="strk" aria-selected="false">筆畫</button>
    <button role="tab" data-tab="zy" aria-selected="false">注音</button>
    <button role="tab" data-tab="poly" aria-selected="false">多音字</button>
    <button role="tab" data-tab="form" aria-selected="false">形近字</button>
    <button role="tab" data-tab="err" aria-selected="false">改錯字</button>
    <button role="tab" data-tab="idm" aria-selected="false">成語</button>
    <button role="tab" data-tab="mem" aria-selected="false">翻牌</button>
    <button role="tab" data-tab="wrong" aria-selected="false">錯題</button>
  </nav>

  <!-- 生字卡 -->
  <section id="tab-cards">
    <div class="bar">
      <button class="btn" id="selfTest" aria-pressed="false">考自己：遮住注音和部首</button>
    </div>
    <div class="detail" id="detail"></div>
    <div id="cardGrid"></div>
    <p class="hint">★ 表示課本上有圈記的字。部首寫在字裡會變形的，例如「阜」在左邊寫成「阝」，卡片會特別標出來。</p>
  </section>

  <!-- 寫寫看 -->
  <section id="tab-write" hidden>
    <div id="writeArea"></div>
  </section>

  <!-- 部首 -->
  <section id="tab-rad" hidden><div id="radArea"></div></section>

  <!-- 注音 -->
  <section id="tab-strk" hidden><div id="strkArea"></div></section>
  <section id="tab-zy" hidden><div id="zyArea"></div></section>

  <!-- 翻牌 -->
  <section id="tab-poly" hidden><div id="polyArea"></div></section>
  <section id="tab-form" hidden><div id="formArea"></div></section>
  <section id="tab-err" hidden><div id="errArea"></div></section>
  <section id="tab-idm" hidden><div id="idmArea"></div></section>
  <section id="tab-mem" hidden><div id="memArea"></div></section>

  <!-- 錯題本 -->
  <section id="tab-wrong" hidden><div id="wrongArea"></div></section>
</div>

<script>
/* ===== 生字資料（依掃描頁序分 6 組）：組,字,注音,部首,部首外筆畫,總筆畫,語詞(○=本字),易混部首 ===== */
const RAW=`1,灣,ㄨㄢ,水,22,25,臺○,弓言糸
1,寒,ㄏㄢˊ,宀,9,12,○冷,冫八
1,島,ㄉㄠˇ,山,7,10,海○,鳥白

  if(!sfxOn)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    let t=actx.currentTime+0.01;
    seq.forEach(([f,d,type,v])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.16,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+0.03);t+=d*0.8});
  }catch(e){}
}

let cv,ctx,drawing=false,last=null,padStrokes=0,padLocked=false;
const padHTML=ch=>`<div class="padwrap"><div class="tian pad"><div class="ghost" hidden>${ch}</div><canvas aria-label="寫字格"></canvas></div></div>`;
function setupPad(root){
  cv=root.querySelector('canvas');ctx=cv.getContext('2d');padStrokes=0;padLocked=false;
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);ctx.scale(dpr,dpr);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Math.max(5,r.width/30);
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#1e2a23';
  root.querySelector('.ghost').style.fontSize=(r.width*0.82)+'px';
  const pt=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{if(padLocked)return;drawing=true;padStrokes++;last=pt(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}ctx.beginPath();ctx.arc(last[0],last[1],ctx.lineWidth/2,0,7);ctx.fillStyle=ctx.strokeStyle;ctx.fill()};
  cv.onpointermove=e=>{if(!drawing||padLocked)return;const p=pt(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false};
}
function clearPad(){if(padLocked)return;ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore();padStrokes=0}

/* 字形相似度：把手寫和標準楷書都縮放到 64×64、細化成骨架，再算互相覆蓋的比例 */
const GZ=64;
function toGrid(src){
  const w=src.width,h=src.height,d=src.getContext('2d').getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>60){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)return null;
  const off=document.createElement('canvas');off.width=off.height=GZ;const o=off.getContext('2d');
  const bw=x1-x0+1,bh=y1-y0+1,s=(GZ-4)/Math.max(bw,bh),dw=bw*s,dh=bh*s;
  o.drawImage(src,x0,y0,bw,bh,(GZ-dw)/2,(GZ-dh)/2,dw,dh);
  const od=o.getImageData(0,0,GZ,GZ).data,g=new Uint8Array(GZ*GZ);
  for(let i=0;i<g.length;i++)g[i]=od[i*4+3]>60?1:0;
  return g;
}
function thin(g){
  const N=GZ,a=Uint8Array.from(g);let ch=true;
  const P=(x,y)=>(x<0||y<0||x>=N||y>=N)?0:a[y*N+x];
  while(ch){ch=false;
    for(const step of [0,1]){const del=[];
      for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(!a[y*N+x])continue;
        const p=[P(x,y-1),P(x+1,y-1),P(x+1,y),P(x+1,y+1),P(x,y+1),P(x-1,y+1),P(x-1,y),P(x-1,y-1)];
        const B=p.reduce((s,v)=>s+v,0);if(B<2||B>6)continue;
        let A=0;for(let k=0;k<8;k++)if(!p[k]&&p[(k+1)%8])A++;if(A!==1)continue;
        if(step===0){if(p[0]*p[2]*p[4]||p[2]*p[4]*p[6])continue}else{if(p[0]*p[2]*p[6]||p[0]*p[4]*p[6])continue}
        del.push(y*N+x)}
      if(del.length){ch=true;del.forEach(i=>a[i]=0)}}}
  return a;
}
function dilate(g,r){const N=GZ,o=new Uint8Array(N*N);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(g[y*N+x])for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(dx*dx+dy*dy>r*r)continue;const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<N&&Y<N)o[Y*N+X]=1}
  return o}
async function gradeWriting(x){
  const n=padStrokes,t=x.t;
  let f=0;
  try{
    if(n>0){
      try{await document.fonts.load(`100px "LXGW WenKai TC"`,x.c)}catch(_){}
      const ref=document.createElement('canvas');ref.width=cv.width;ref.height=cv.height;
      const r=ref.getContext('2d');r.fillStyle='#000';r.textAlign='center';r.textBaseline='middle';
      r.font=`${Math.round(cv.width*0.82)}px "LXGW WenKai TC","BiauKai","DFKai-SB",serif`;r.fillText(x.c,cv.width/2,cv.height/2);
      const U0=toGrid(cv),R0=toGrid(ref);
      if(U0&&R0){const U=thin(U0),R=thin(R0),dU=dilate(U,3),dR=dilate(R,3);
        let su=0,sr=0,pu=0,pr=0;for(let i=0;i<U.length;i++){if(U[i]){su++;if(dR[i])pu++}if(R[i]){sr++;if(dU[i])pr++}}
        const p=su?pu/su:0,q=sr?pr/sr:0;f=p+q?2*p*q/(p+q):0}
    }
  }catch(e){f=0}
  const d=Math.abs(n-t);
  const sp=n===0?0:d===0?40:d===1?25:d===2?10:0;
  const fp=n===0?0:60*Math.min(1,Math.max(0,(f-0.6)/(0.88-0.6)));
  return {n,f,score:Math.round(sp+fp),good:n>0&&d===0&&f>=0.80};
}

/* ===== 選擇題（部首 r／注音 z）===== */
const TONES=['','ˊ','ˇ','ˋ'];
const splitTone=z=>'ˊˇˋ'.includes(z.slice(-1))?[z.slice(0,-1),z.slice(-1)]:[z,''];
const SWAP=[['ㄣ','ㄥ'],['ㄓ','ㄗ'],['ㄔ','ㄘ'],['ㄕ','ㄙ'],['ㄢ','ㄤ'],['ㄨㄛ','ㄛ'],['ㄧㄢ','ㄧㄤ'],['ㄩ','ㄧ']];
function zyOpts(z){
  const [b,t]=splitTone(z);
  const tones=shuffle(TONES.filter(x=>x!==t).map(x=>b+x));
  const snd=[];SWAP.forEach(([a,c])=>{if(b.includes(a))snd.push(b.replace(a,c)+t);else if(b.includes(c))snd.push(b.replace(c,a)+t)});
  const picks=[...new Set([tones[0],tones[1],...shuffle(snd),tones[2]])].filter(v=>v!==z).slice(0,3);
  return shuffle([z,...picks]);
}
function radOpts(x){
  const others=shuffle(x.cf.filter(r=>r!==x.r));
  const fill=shuffle(ALLR.filter(r=>r!==x.r&&!others.includes(r)));
  return shuffle([x.r,...others.slice(0,2),...fill].slice(0,4));
}
let qs={};
const QA={r:'#radArea',z:'#zyArea',s:'#strkArea'};
function strkOpts(n){const c=[n-2,n-1,n+1,n+2,n+3].filter(v=>v>=0&&v!==n);return shuffle([n,...shuffle(c).slice(0,3)].map(String))}
function quizIntro(k){

  const g=$('#'+k+'Go');if(g)g.onclick=()=>{rtStart('q'+k);qs[k]={q:shuffle(p).slice(0,+$('#'+k+'N').value),i:0,ok:0,bad:[]};quizQ(k)};

/* ===== 翻牌配對（計時賽／限時賽、連擊加分、星等、最佳紀錄）===== */
let mm=null,memKind='z',memMode='up',memSize=6;
const mmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
const memKey=()=>`zi4-best-${memKind}-${memMode}-${memSize}`;
function memIntro(){
  if(mm&&mm.timer){clearInterval(mm.timer)}
  const best=load(memKey(),null);
  const chip=(k,v,label)=>`<button class="chip" data-${k}="${v}" aria-pressed="${({kind:memKind,mode:memMode,size:String(memSize)})[k]===String(v)}">${label}</button>`;
  $('#memArea').innerHTML=`<div class="qcard"><p class="qask">翻開兩張牌，把<b>生字</b>和它的${memKind==='z'?'<b>注音</b>':'<b>部首</b>'}配成一對。連續配對成功有連擊加分！</p>
   <div class="modes">${chip('kind','z','字 ↔ 注音')}${chip('kind','r','字 ↔ 部首')}</div>
   <div class="modes">${chip('mode','up','計時賽：越快越好')}${chip('mode','down','限時賽：倒數讀秒')}</div>
   <div class="modes">${chip('size',6,'6 對（12 張）')}${chip('size',8,'8 對（16 張）')}</div>
   <p class="hint">${best?`這一關的最佳紀錄：${memMode==='up'?`${mmt(best.t)}・翻 ${best.mv} 次`:`${best.sc} 分`}`:'這一關還沒有紀錄，來創第一個吧！'}${memMode==='down'?`　限時 ${memSize===6?60:90} 秒`:''}</p>
   ${pool().length>=memSize?'<button class="btn primary" id="mGo">發牌開始</button>':`<p class="hint">範圍內至少要有 ${memSize} 個字，請多選幾課。</p>`}</div>`;
  document.querySelectorAll('#memArea [data-kind]').forEach(b=>b.onclick=()=>{memKind=b.dataset.kind;memIntro()});
  document.querySelectorAll('#memArea [data-mode]').forEach(b=>b.onclick=()=>{memMode=b.dataset.mode;memIntro()});
  document.querySelectorAll('#memArea [data-size]').forEach(b=>b.onclick=()=>{memSize=+b.dataset.size;memIntro()});
  const g=$('#mGo');if(g)g.onclick=memDeal;
}
function memDeal(){
  if(mm&&mm.timer)clearInterval(mm.timer);
  const seen=new Set(),pick=[];
  for(const x of shuffle(pool())){const key=memKind==='z'?x.z:x.r;if(seen.has(key))continue;seen.add(key);pick.push(x);if(pick.length===memSize)break}
  const cards=shuffle(pick.flatMap(x=>[{id:x.c,t:'c',x},{id:x.c,t:'a',x}]));
  const limit=memMode==='down'?(memSize===6?60:90):0;
  mm={cards,open:[],done:0,moves:0,n:pick.length,lock:false,score:0,combo:0,maxCombo:0,start:0,el:0,limit,over:false,timer:null,lastTick:-1,msg:''};
  memRender();
}
function memStartClock(){
  if(mm.start)return;mm.start=Date.now();
  mm.timer=setInterval(()=>{mm.el=(Date.now()-mm.start)/1000;
    if(mm.limit){const left=Math.ceil(mm.limit-mm.el);if(left<=10&&left>0&&left!==mm.lastTick){mm.lastTick=left;SFX.tick()}
      if(mm.el>=mm.limit){mm.el=mm.limit;memEnd(false);return}}
    memHud()},250);
}
function memHud(){
  const h=$('#mHud');if(!h)return;
  const left=mm.limit?Math.max(0,mm.limit-mm.el):0,warn=mm.limit&&left<=10;
  h.innerHTML=`<div class="${warn?'warn':''}">${mm.limit?'剩下':'時間'}<b>${mmt(mm.limit?Math.ceil(left):mm.el)}</b></div><div>翻牌<b>${mm.moves}</b></div><div>配對<b>${mm.done}/${mm.n}</b></div><div>分數<b>${mm.score}</b></div>`;
  const tb=$('#mBar');if(tb){tb.classList.toggle('warn',!!warn);tb.firstElementChild.style.width=(mm.limit?left/mm.limit*100:mm.done/mm.n*100)+'%'}
}
function memFace(c){return c.t==='c'?`<span class="k">${c.x.c}</span>`:memKind==='z'?`<span class="zyc">${c.x.z}</span>`:`<span><span class="rad">${c.x.r}</span><span class="tag zy">${RZ[c.x.r]||''}</span></span>`}
function memRender(fx){
  $('#memArea').innerHTML=`<div class="hud" id="mHud"></div><div class="timebar" id="mBar"><i></i></div>
   <div class="combo" id="mCombo">${mm.msg}</div>
   <div class="mem${mm.n===8?' m16':''}">${mm.cards.map((c,i)=>`<button class="mc${c.open?' open':''}${c.done?' done':''}${fx&&fx.idx.includes(i)?' '+fx.cls:''}" data-i="${i}" aria-label="${c.open||c.done?'已翻開':'蓋著的牌'}">${c.open||c.done?memFace(c):''}</button>`).join('')}</div>
   <div class="center"><button class="btn" id="mNew">重新發牌</button><button class="btn" id="mBack">換關卡</button></div>
   <div id="mMsg"></div>`;
  memHud();
  $('#mNew').onclick=memDeal;$('#mBack').onclick=memIntro;
  document.querySelectorAll('.mc').forEach(b=>b.onclick=()=>memFlip(+b.dataset.i));
}
function memFlip(i){
  const c=mm.cards[i];if(mm.over||mm.lock||c.open||c.done)return;
  memStartClock();SFX.flip();
  c.open=true;mm.open.push(c);
  if(mm.open.length===2){mm.moves++;const [a,b]=mm.open,ia=mm.cards.indexOf(a),ib=mm.cards.indexOf(b);
    if(a.id===b.id&&a.t!==b.t){
      a.done=b.done=true;a.open=b.open=false;mm.done++;mm.open=[];mm.combo++;mm.maxCombo=Math.max(mm.maxCombo,mm.combo);
      const add=100+(mm.combo-1)*50;mm.score+=add;
      mm.msg=mm.combo>1?`${mm.combo} 連擊！＋${add}`:`配對成功 ＋${add}`;
      mm.combo>1?SFX.combo():SFX.match();
      memRender({idx:[ia,ib],cls:'pop'});
      if(mm.done===mm.n)memEnd(true);
    }else{
      mm.combo=0;mm.msg='';mm.lock=true;memRender({idx:[ia,ib],cls:'shake'});
      setTimeout(()=>{if(mm.over)return;a.open=b.open=false;mm.open=[];mm.lock=false;memRender()},850);
    }
  }else memRender();
}
function memEnd(win){
  mm.over=true;clearInterval(mm.timer);mm.timer=null;
  if(mm.start)mm.el=Math.min(mm.limit||1e9,(Date.now()-mm.start)/1000);
  let bonus=0;if(win&&mm.limit)bonus=Math.ceil(mm.limit-mm.el)*10;mm.score+=bonus;
  memHud();
  if(!win){SFX.lose();
    const left=[...new Set(mm.cards.filter(c=>!c.done).map(c=>c.x))];
    mm.cards.forEach(c=>{if(!c.done)c.open=true});memRender();
    $('#mMsg').innerHTML=`<div class="done-box"><div class="score">時間到！</div><p class="qask">配了 ${mm.done} / ${mm.n} 對，得 ${mm.score} 分。還沒配到的：</p>
      <div class="wlist">${left.map(x=>`<span class="wz">${x.c} <span class="zy" style="font-size:14px">${memKind==='z'?x.z:x.r}</span></span>`).join('')}</div>
      <button class="btn primary" id="mAgain">再挑戰一次</button></div>`;
    $('#mAgain').onclick=memDeal;return;
  }
  const stars=mm.moves<=mm.n+2?3:mm.moves<=Math.ceil(mm.n*1.7)?2:1;
  const key=memKey(),best=load(key,null);let rec=false;
  if(mm.limit){if(!best||mm.score>best.sc){save(key,{sc:mm.score});rec=true}}
  else{if(!best||mm.el<best.t){save(key,{t:mm.el,mv:mm.moves});rec=true}}
  setTimeout(()=>stars===3?celebrate('三顆星過關！'):SFX.win(),250);
  $('#mMsg').innerHTML=`<div class="done-box"><div class="stars" aria-label="${stars} 顆星">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div class="score">${mm.score} 分</div>
    <p class="qask">用了 ${mmt(mm.el)}、翻 ${mm.moves} 次、最高 ${mm.maxCombo} 連擊${bonus?`，剩餘時間加分 ＋${bonus}`:''}。</p>
    ${rec?'<p class="qask" style="color:var(--rose-deep)"><b>🏆 新紀錄！</b></p>':''}
    <div class="center"><button class="btn primary" id="mAgain">再玩一局</button><button class="btn" id="mBack2">換關卡</button></div></div>`;
  $('#mAgain').onclick=memDeal;$('#mBack2').onclick=memIntro;
}

/* ===== 多音字（課本形音輕鬆學＋老師學習單＋隨堂測驗）===== */
const POLY=[
 {c:'與',g:3,r:{'ㄩˇ':'和、跟；給予；支持','ㄩˋ':'參加'},items:[['我○你','ㄩˇ'],['贈○','ㄩˇ'],['授○','ㄩˇ'],['給○','ㄩˇ'],['○人為善','ㄩˇ'],['參○','ㄩˋ'],['○會','ㄩˋ']]},
 {c:'空',g:3,r:{'ㄎㄨㄥˋ':'閒暇時間；騰出空間；還沒利用的','ㄎㄨㄥ':'什麼都沒有；天空；廣闊；白白的'},items:[['沒○','ㄎㄨㄥˋ'],['抽○','ㄎㄨㄥˋ'],['○出時間','ㄎㄨㄥˋ'],['○地','ㄎㄨㄥˋ'],['○位','ㄎㄨㄥˋ'],['○白','ㄎㄨㄥˋ'],['○閒','ㄎㄨㄥˋ'],['○屋','ㄎㄨㄥ'],['撲○','ㄎㄨㄥ'],['高○','ㄎㄨㄥ'],['天○','ㄎㄨㄥ'],['晴○萬里','ㄎㄨㄥ'],['海闊天○','ㄎㄨㄥ'],['○歡喜','ㄎㄨㄥ']]},
 {c:'行',g:4,r:{'ㄒㄧㄥˊ':'走路；流通；做；舉止作為','ㄏㄤˊ':'排成的直行；排行；銀行；行業；計算成排東西','ㄒㄧㄥˋ':'品德、操守'},items:[['直○','ㄒㄧㄥˊ'],['前○','ㄒㄧㄥˊ'],['發○','ㄒㄧㄥˊ'],['運○','ㄒㄧㄥˊ'],['○善','ㄒㄧㄥˊ'],['言○','ㄒㄧㄥˊ'],['○為','ㄒㄧㄥˊ'],['○列','ㄏㄤˊ'],['排○','ㄏㄤˊ'],['銀○','ㄏㄤˊ'],['各○各業','ㄏㄤˊ'],['一○樹','ㄏㄤˊ'],['一目十○','ㄏㄤˊ'],['品○','ㄒㄧㄥˋ'],['德○','ㄒㄧㄥˋ']]},
 {c:'曾',g:5,r:{'ㄘㄥˊ':'表示以前發生過、經歷過','ㄗㄥ':'中間隔兩代的親屬；姓'},items:[['未○','ㄘㄥˊ'],['似○相識','ㄘㄥˊ'],['○經','ㄘㄥˊ'],['○幾何時','ㄘㄥˊ'],['○孫','ㄗㄥ'],['○祖父','ㄗㄥ'],['○先生','ㄗㄥ']]},
];
const pw=(c,w)=>w.replace('○',c);
const pmark=(c,w)=>esc(w).replace('○',`<b style="color:var(--rose-deep)">「${c}」</b>`);
function polyPool(){
  let it=POLY.filter(p=>st.groups.has(p.g)).flatMap(p=>p.items.map(([w,z])=>({p,w,z,key:pw(p.c,w)})));
  if(st.onlyWrong)it=it.filter(x=>wrongP[x.key]);return it;
}
let ps=null;
function polyIntro(){
  const ps0=POLY.filter(p=>st.groups.has(p.g)),it=polyPool();
  $('#polyArea').innerHTML=`<div class="qcard"><p class="qask">同一個字放在不同語詞裡，念法不一樣（第三課：與、空；第四課：行；第五課：曾）。先看下面的整理，再挑戰選注音。</p>
    ${it.length?`${timeChips()}<p class="hint">練習：先看語詞自己念，再翻開看答案。挑戰：選出正確的注音。</p><div class="bar"><button class="btn" id="pPr">練習（翻卡念念看）</button><button class="btn primary" id="pGo">挑戰（${it.length} 題）</button></div>`:`<p class="hint">${st.onlyWrong?'目前沒有念錯的多音字，取消上方的「只練錯題」就能練全部。':'選的課次裡沒有多音字，多音字在第三、四、五課。'}</p>`}</div>
    ${ps0.map(p=>`<div class="tbl"><table><tr><th colspan="3"><span class="kai" style="font-size:26px;color:var(--ink)">${p.c}</span>　${GN[p.g-1]}</th></tr>
      ${Object.entries(p.r).map(([z,m])=>`<tr><td class="zy" style="font-size:18px">${z}</td><td class="kai" style="white-space:normal;font-size:18px">${p.items.filter(i=>i[1]===z).map(i=>pw(p.c,i[0])).join('、')}</td><td class="hint" style="white-space:normal">${m}</td></tr>`).join('')}</table></div>`).join('')}`;
  const g=$('#pGo');if(g)g.onclick=()=>{rtStart('poly');ps={q:shuffle(polyPool()),i:0,ok:0,bad:[]};polyQ()};
  const pr=$('#pPr');if(pr)pr.onclick=()=>{rtStart('poly');ps={q:shuffle(polyPool()),i:0,ok:0,bad:[],pr:true};polyPr()};
}
function polyPr(){
  if(ps.i>=ps.q.length)return polyDone();
  const x=ps.q[ps.i];
  $('#polyArea').innerHTML=`<div class="flash"><div class="rhud"></div><span class="prog">練習 ${ps.i+1} / ${ps.q.length}・會念 ${ps.ok}</span>
    <div class="qchar" style="font-size:clamp(44px,13vw,64px)">${pmark(x.p.c,x.w)}</div>
    <p class="qask">先自己念念看，「${x.p.c}」念什麼？</p>
    <div id="pAns"><button class="btn primary" id="pFlip">翻開看答案</button></div></div>`;
  rtQ(null);
  $('#pFlip').onclick=()=>{
    $('#pAns').innerHTML=`<div class="fb ok" style="color:var(--ink)">念 <b class="zy" style="font-size:24px">${x.z}</b>　${x.p.r[x.z]}<br>
      同一個字的其他念法：${Object.keys(x.p.r).filter(z=>z!==x.z).map(z=>`<span class="zy">${z}</span>（${x.p.items.filter(i=>i[1]===z).slice(0,3).map(i=>pw(x.p.c,i[0])).join('、')}）`).join('；')}<br>${sayBtn(x.key,'念語詞')}</div>
      <div class="center" style="margin-top:10px"><button class="btn primary" id="pKnow">我念對了</button><button class="btn rose primary" id="pNot">念錯了，記下來</button></div>`;
    $('#pKnow').onclick=()=>{rtAns(true);SFX.ok();ps.ok++;ps.i++;polyPr()};
    $('#pNot').onclick=()=>{rtAns(false);SFX.bad();ps.bad.push(x);wrongP[x.key]=(wrongP[x.key]||0)+1;save('zi4-wrongp',wrongP);renderScope();ps.i++;polyPr()};
  };
}
function polyQ(){
  if(ps.i>=ps.q.length)return polyDone();
  const x=ps.q[ps.i],opts=shuffle(Object.keys(x.p.r));
  $('#polyArea').innerHTML=`<div class="qcard"><div class="rhud"></div><span class="prog">第 ${ps.i+1} / ${ps.q.length} 題・答對 ${ps.ok}</span>
    <div class="qchar" style="font-size:clamp(44px,13vw,64px)">${pmark(x.p.c,x.w)}</div>
    <p class="qask">「${x.p.c}」在這個語詞裡怎麼念？</p>
    <div class="opts">${opts.map(o=>`<button class="opt" data-v="${o}"><span class="o1 zy">${o}</span><span class="mark"></span></button>`).join('')}</div>
    <div id="pFb" style="width:100%"></div></div>`;
  const answer=b=>{
    if(ps.answered)return;ps.answered=true;const right=!!b&&b.dataset.v===x.z;rtAns(right);
    document.querySelectorAll('#polyArea .opt').forEach(o=>{o.disabled=true;
      if(o.dataset.v===x.z){o.classList.add('ok');o.querySelector('.mark').textContent='✓ 正確答案'}
      else if(o===b){o.classList.add('bad');o.querySelector('.mark').textContent='✗ 你選的'}});
    if(right){ps.ok++;SFX.ok()}else{SFX.bad();ps.bad.push(x);wrongP[x.key]=(wrongP[x.key]||0)+1;save('zi4-wrongp',wrongP);renderScope()}
    $('#pFb').innerHTML=`<div class="fb ${right?'ok':'bad'}">${right?'答對了！':b?'再記一次：':'時間到！'}「${x.key}」的「${x.p.c}」念 <b class="zy">${x.z}</b>，意思是${x.p.r[x.z]}。<br>${sayBtn(x.key,'念語詞')}</div>
      <div class="center" style="margin-top:10px"><button class="btn primary" id="pNext">${ps.i+1<ps.q.length?'下一題':'看成績'}</button></div>`;
    $('#pNext').onclick=()=>{ps.i++;ps.answered=false;polyQ()};$('#pNext').focus();
  };
  document.querySelectorAll('#polyArea .opt').forEach(b=>b.onclick=()=>answer(b));
  rtQ(()=>answer(null));
}
function polyDone(){
  if(ps.q.length&&ps.ok===ps.q.length)celebrate('多音字全對！');
  $('#polyArea').innerHTML=`<div class="done-box"><div class="score">${ps.ok} / ${ps.q.length}</div>${rtEnd(ps.pr?'-pr':'')}
   <p class="qask">${ps.bad.length?'念錯的語詞：':'全對！'}</p>
   <div class="wlist">${ps.bad.map(x=>`<span class="wz" style="font-size:20px">${x.key} <span class="zy" style="font-size:14px">${x.z}</span></span>`).join('')}</div>
   <div class="center">${ps.bad.length?'<button class="btn rose primary" id="pRe">只練念錯的</button>':''}<button class="btn" id="pAgain">回到整理表</button></div></div>`;
  $('#pAgain').onclick=polyIntro;
  const r=$('#pRe');if(r)r.onclick=()=>{const pr=ps.pr;rtStart('poly');ps={q:shuffle(ps.bad),i:0,ok:0,bad:[],pr};pr?polyPr():polyQ()};
}

    <div class="sent" id="eSent">${chars.map((ch,i)=>isP(ch)?`<span class="pc">${ch}</span>`:`<button class="sc" data-i="${i}">${ch}</button>`).join('')}</div>
    <div class="center"><span class="prog" id="eCnt">已選 0 / ${e.fx.length}</span><button class="btn primary" id="eChk">檢查</button></div>
    <div id="eFix" style="width:100%"></div></div>`;
  rtQ(null);
  document.querySelectorAll('#eSent .sc').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('on',sel.has(i));$('#eCnt').textContent=`已選 ${sel.size} / ${e.fx.length}`});
  $('#eChk').onclick=()=>{
    $('#eChk').disabled=true;
    let found=0,falsePick=0;
    document.querySelectorAll('#eSent .sc').forEach(b=>{const i=+b.dataset.i;b.disabled=true;
      const isW=wrongIdx.includes(i);
      if(isW&&sel.has(i)){b.classList.add('hit');found++}
      else if(isW){b.classList.add('miss')}
      else if(sel.has(i)){b.classList.add('fp');falsePick++}});
    es.max+=e.fx.length*2;es.pts+=found;
    (found===e.fx.length&&!falsePick)?SFX.ok():SFX.bad();
    let fixed=0,answered=0,allOk=found===e.fx.length&&!falsePick;
    $('#eFix').innerHTML=`<div class="fb ${allOk?'ok':'bad'}">找到 ${found} / ${e.fx.length} 個錯字${falsePick?`，有 ${falsePick} 個字其實沒錯`:''}。${found<e.fx.length?'虛線框的是漏掉的錯字。':''}</div>
      <p class="qask" style="margin:8px 0 4px">每個錯字要改成哪個字？</p>
      ${e.fx.map(([w,c],k)=>`<div class="fixrow" data-k="${k}"><span class="wz" style="text-decoration:line-through">${w}</span><span class="arrow">→</span>
        <div class="fopts">${errOpts(w,c).map(o=>`<button class="opt sm" data-v="${o}"><span class="o1">${o}</span></button>`).join('')}</div></div>`).join('')}
      <div id="eNextWrap"></div>`;
    document.querySelectorAll('#eFix .fixrow').forEach(row=>{const [w,c]=e.fx[+row.dataset.k];
      row.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
        row.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(o.dataset.v===c)o.classList.add('ok');else if(o===b)o.classList.add('bad')});
        answered++;
        rtAns(b.dataset.v===c);if(b.dataset.v===c){fixed++;es.pts++;SFX.match()}else{SFX.bad();allOk=false;addWrong(c,'e');es.bad.push(c)}
        if(answered===e.fx.length){
          if(allOk&&fixed===e.fx.length)es.perfect++;
          e.fx.forEach(([w2,c2])=>{const i=e.s.indexOf(w2);const btn=document.querySelector(`#eSent .sc[data-i="${i}"]`);if(btn&&!btn.classList.contains('hit')){addWrong(c2,'e');es.bad.push(c2)}});
          $('#eNextWrap').innerHTML=`<div class="fb ok" style="color:var(--ink)">正確句子：<span class="kai" style="font-size:20px">${e.fx.reduce((t,[w2,c2])=>t.replace(w2,`<b style="color:var(--ok)">${c2}</b>`),esc(e.s))}</span></div>
            <div class="center" style="margin-top:10px"><button class="btn primary" id="eNext">${es.i+1<es.q.length?'下一題':'看成績'}</button></div>`;
          $('#eNext').onclick=()=>{es.i++;errQ()};$('#eNext').focus();
        }
      })});
  };
}
function errDone(){
  const pct=es.max?Math.round(es.pts/es.max*100):0;
  if(es.q.length&&pct===100)celebrate('改錯字全對！');
  const bad=[...new Set(es.bad)];
  $('#errArea').innerHTML=`<div class="done-box"><div class="score">${pct} 分</div>${rtEnd()}
    <p class="qask">找錯字＋改正確共得 ${es.pts} / ${es.max} 點，全對的題目 ${es.perfect} / ${es.q.length} 題。</p>
    ${bad.length?`<p class="qask">改錯的字：</p><div class="wlist">${bad.map(c=>`<span class="wz">${c}</span>`).join('')}</div>`:''}
    <div class="center"><button class="btn" id="eAgain">再來一次</button></div></div>`;
  $('#eAgain').onclick=errIntro;
}

   <g class="leg lr"><path d="M72 118 L78 144" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/></g>
   ${c.body}</svg>`;
}

/* ===== 100 分慶祝：隨機兩位原創角色跳舞＋彩紙 ===== */
function celebrate(msg){
  SFX.win();
  let ov=document.getElementById('party');if(ov)ov.remove();
  ov=document.createElement('div');ov.id='party';ov.setAttribute('role','dialog');ov.setAttribute('aria-label','100 分慶祝');
  const conf=Array.from({length:40},(_,i)=>`<i style="left:${Math.random()*100}%;animation-delay:${(Math.random()*1.2).toFixed(2)}s;animation-duration:${(2.2+Math.random()*1.8).toFixed(2)}s;background:var(--c${i%4});transform:rotate(${Math.random()*360}deg)"></i>`).join('');
  const pair=shuffle(CHARS).slice(0,2);
  ov.innerHTML=`<div class="confetti">${conf}</div>
   <div class="party-card">
    <div class="dancers">
     ${dancerSVG(pair[0],'d1')}
     <div class="hundred">100</div>
     ${dancerSVG(pair[1],'d2')}
    </div>
    <div class="party-title">${esc(msg||'100 分！')}</div>
    <p class="party-sub">${pair[0].name}和${pair[1].name}在幫你跳舞慶祝！</p>
    <button class="btn primary" id="partyClose">好耶，繼續加油</button>
   </div>`;
  document.body.appendChild(ov);
  const close=()=>{ov.classList.add('out');setTimeout(()=>ov.remove(),300)};
  ov.querySelector('#partyClose').onclick=close;ov.addEventListener('click',e=>{if(e.target===ov)close()});
  ov.querySelector('#partyClose').focus();
  setTimeout(()=>{if(document.body.contains(ov))close()},7000);
}

/* ===== 錯題本 ===== */
function renderWrong(confirm){
  const ks=Object.keys(wrong).sort((a,b)=>{const s=c=>Object.values(wrong[c]).reduce((a,b)=>a+(b||0),0);return s(b)-s(a)});
  const ik=Object.keys(wrongI).sort((a,b)=>wrongI[b]-wrongI[a]),pk=Object.keys(wrongP).sort((a,b)=>wrongP[b]-wrongP[a]),fk=Object.keys(wrongF).sort((a,b)=>wrongF[b]-wrongF[a]);
  $('#wrongArea').innerHTML=(ks.length||pk.length||fk.length||ik.length)?`<p class="hint">寫錯、選錯、念錯的字都會記在這裡（只存在這台裝置的瀏覽器裡）。上方點「只練錯題」，其他練習就只出這些字。</p>
   ${ks.length?`<div class="tbl"><table><tr><th>字</th><th>注音</th><th>部首</th><th>寫錯</th><th>部首</th><th>筆畫</th><th>注音</th><th>改錯</th></tr>
   ${ks.map(c=>{const x=BY[c],w=wrong[c];return `<tr><td class="k">${c}</td><td class="zy">${x.z}</td><td class="kai">${radTxt(x)}</td><td class="n">${w.w||''}</td><td class="n">${w.r||''}</td><td class="n">${w.s||''}</td><td class="n">${w.z||''}</td><td class="n">${w.e||''}</td></tr>`}).join('')}</table></div>`:''}
   ${pk.length?`<div class="tbl"><table><tr><th>多音字語詞</th><th>正確注音</th><th>念錯次數</th></tr>${pk.map(k=>{const it=POLY.flatMap(p=>p.items.map(i=>[pw(p.c,i[0]),i[1]])).find(i=>i[0]===k);return `<tr><td class="kai" style="font-size:20px">${k}</td><td class="zy">${it?it[1]:''}</td><td class="n">${wrongP[k]}</td></tr>`}).join('')}</table></div>`:''}
   ${fk.length?`<div class="tbl"><table><tr><th>形近字語詞</th><th>選錯次數</th></tr>${fk.map(k=>`<tr><td class="kai" style="font-size:20px">${k}</td><td class="n">${wrongF[k]}</td></tr>`).join('')}</table></div>`:''}
   ${ik.length?`<div class="tbl"><table><tr><th>成語</th><th>意思</th><th>選錯次數</th></tr>${ik.map(k=>`<tr><td class="kai" style="font-size:20px">${k}</td><td class="hint" style="white-space:normal">${IDM_MEAN[k]||''}</td><td class="n">${wrongI[k]}</td></tr>`).join('')}</table></div>`:''}
   <div class="bar"><button class="btn rose primary" id="goWrong">只練錯題</button><button class="btn" id="clrW">清空錯題本</button></div>
   ${confirm?`<div class="confirm">確定清空全部錯題紀錄？<button class="btn rose primary" id="clrYes">清空</button><button class="btn" id="clrNo">取消</button></div>`:''}`
   :`<div class="done-box"><p class="qask">錯題本是空的。</p><p class="hint">在「寫寫看」「部首」「注音」「筆畫」「多音字」「形近字」「改錯字」「成語」答錯的都會自動記到這裡。</p></div>`;
  const g=$('#goWrong');if(g)g.onclick=()=>{st.onlyWrong=true;renderScope();document.querySelector('[data-tab="write"]').click()};
  const c=$('#clrW');if(c)c.onclick=()=>renderWrong(true);
  const y=$('#clrYes');if(y)y.onclick=()=>{wrong={};wrongP={};wrongF={};wrongI={};save('zi4-wrongi',wrongI);save('zi4-wrong',wrong);save('zi4-wrongp',wrongP);save('zi4-wrongf',wrongF);renderScope();renderWrong()};
  const n=$('#clrNo');if(n)n.onclick=()=>renderWrong();
}

renderScope();renderCards();
</script>

<script>
/* =====================================================================
   site-home.js — 📚 小站 button + 全站集點 (site-wide points & badges)
   Canonical copy: github.com/iam5980/kids-practice/template/site-home.js
   Version: 2026-10-25

   HOW TO USE: paste this whole file in its own <script> block just before
   </body> of EVERY page published to kids-practice (English and 中文部,
   apps, oral pages, listening players). Nothing else is required.

   1) "📚 小站" pill, bottom-left → in-page confirm card → site home.
   2) SitePoints — points and badges per kid, shared by every app on the
      site (same origin), shown on the home page 集點卡. Kept only on
      this device (localStorage).
        SitePoints.answer(ok)       after every judged answer
        SitePoints.roundEnd(pct)    when a round / drill ends (0–100)
        SitePoints.literacy(allOk)  when a 素養題組 is finished
      Points: correct +10, streak bonus +2 per answer in a row (max +10).
      No speed bonus — accuracy only.
   3) Auto-hooks, so older apps need no code changes:
        中文部 engine:  rtAns(right) → answer;  celebrate() → perfect round
        AppCore apps:   AppCore calls SitePoints itself (app-core ≥ 2026-10-25)
   ===================================================================== */
(function () {
  "use strict";
  if (window.__siteHome) return;
  window.__siteHome = true;
  var LIVE = "https://iam5980.github.io/kids-practice/";
  function homeUrl() {
    var p = location.pathname, i = p.indexOf("/kids-practice/");
    if (location.protocol.indexOf("http") === 0 && i >= 0) return location.origin + p.slice(0, i) + "/kids-practice/";
    return LIVE;
  }

  /* ---------------- SitePoints ---------------- */
  var BADGES = [
    { id: "first",   icon: "🌱", name: "第一次答對" },
    { id: "perfect", icon: "💯", name: "第一次滿分" },
    { id: "streak10",icon: "🔥", name: "連對 10 題" },
    { id: "streak20",icon: "🚀", name: "連對 20 題" },
    { id: "days3",   icon: "📅", name: "連續練習 3 天" },
    { id: "days7",   icon: "🗓️", name: "連續練習 7 天" },
    { id: "lit1",    icon: "🧩", name: "第一組素養題全對" },
    { id: "lit10",   icon: "🎓", name: "素養題達人（10 組全對）" },
    { id: "p500",    icon: "⭐", name: "累積 500 點" },
    { id: "p2000",   icon: "🌟", name: "累積 2000 點" },
    { id: "p5000",   icon: "🏆", name: "累積 5000 點" }
  ];
  function kidFromPath() {
    var m = location.pathname.match(/\/kids-practice\/([a-z0-9]+)\//i);
    return m && m[1] !== "template" && m[1] !== "shadowing" ? m[1] : null;
  }
  function today() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function dayDiff(a, b) { return Math.round((new Date(b) - new Date(a)) / 864e5); }
  function load(kid) {
    var d = null;
    try { d = JSON.parse(localStorage.getItem("kp-points-" + kid) || "null"); } catch (e) {}
    return d || { points: 0, today: "", todayPts: 0, days: [], badges: {}, correct: 0, perfects: 0, lit: 0, bestStreak: 0 };
  }
  function save(kid, d) { try { localStorage.setItem("kp-points-" + kid, JSON.stringify(d)); } catch (e) {} }
  function dayStreak(days) {
    if (!days.length) return 0;
    var s = days.slice().sort(), n = 1;
    if (dayDiff(s[s.length - 1], today()) > 1) return 0;
    for (var i = s.length - 1; i > 0; i--) { if (dayDiff(s[i - 1], s[i]) === 1) n++; else break; }
    return n;
  }
  var kid = kidFromPath(), streak = 0;
  function toast(html, big) {
    var t = document.createElement("div");
    t.className = "sp-toast" + (big ? " sp-big" : "");
    t.innerHTML = html;
    document.body.appendChild(t);
    setTimeout(function () { t.classList.add("sp-out"); }, big ? 2200 : 900);
    setTimeout(function () { t.remove(); }, big ? 2700 : 1300);
  }
  function grant(d, id) {
    if (d.badges[id]) return;
    d.badges[id] = today();
    var b = BADGES.filter(function (x) { return x.id === id; })[0];
    if (b) toast("🏅 獲得徽章<br><b>" + b.icon + " " + b.name + "</b>", true);
  }
  function update(fn) {
    if (!kid) return;
    var d = load(kid), t = today();
    if (d.today !== t) { d.today = t; d.todayPts = 0; }
    if (d.days.indexOf(t) < 0) { d.days.push(t); if (d.days.length > 60) d.days = d.days.slice(-60); }
    fn(d);
    var ds = dayStreak(d.days);
    if (ds >= 3) grant(d, "days3");
    if (ds >= 7) grant(d, "days7");
    if (d.points >= 500) grant(d, "p500");
    if (d.points >= 2000) grant(d, "p2000");
    if (d.points >= 5000) grant(d, "p5000");
    save(kid, d);
  }
  var SitePoints = {
    kid: kid,
    badges: BADGES,
    read: function (k) { var d = load(k || kid); d.dayStreak = dayStreak(d.days); return d; },
    answer: function (ok) {
      update(function (d) {
        if (ok) {
          streak++;
          var pts = 10 + Math.min(10, (streak - 1) * 2);
          d.points += pts; d.todayPts += pts; d.correct++;
          d.bestStreak = Math.max(d.bestStreak, streak);
          grant(d, "first");
          if (streak >= 10) grant(d, "streak10");
          if (streak >= 20) grant(d, "streak20");
          toast("+" + pts);
        } else { streak = 0; }
      });
    },
    roundEnd: function (pct) {
      if (pct >= 100) update(function (d) { d.perfects++; grant(d, "perfect"); });
    },
    literacy: function (allOk) {
      if (allOk) update(function (d) { d.lit++; grant(d, "lit1"); if (d.lit >= 10) grant(d, "lit10"); });
    }
  };
  window.SitePoints = SitePoints;

  /* auto-hooks for the 中文部 engine (global rtAns / celebrate) */
  if (typeof window.rtAns === "function" && !window.rtAns.__sp) {
    var oAns = window.rtAns;
    window.rtAns = function (right) { try { SitePoints.answer(!!right); } catch (e) {} return oAns.apply(this, arguments); };
    window.rtAns.__sp = true;
  }
  if (typeof window.celebrate === "function" && !window.celebrate.__sp) {
    var oCel = window.celebrate;
    window.celebrate = function () { try { SitePoints.roundEnd(100); } catch (e) {} return oCel.apply(this, arguments); };
    window.celebrate.__sp = true;
  }

  /* ---------------- styles ---------------- */
  var css = document.createElement("style");
  css.textContent =
    "#sh-btn{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:9000;" +
    "height:44px;padding:0 14px 0 10px;border-radius:999px;border:2px solid rgba(255,255,255,.9);background:#334155;color:#fff;font:700 16px/1 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;" +
    "box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;opacity:.9;touch-action:manipulation;white-space:nowrap}" +
    "#sh-btn:active{transform:scale(.94)}" +
    "#sh-mask{position:fixed;inset:0;z-index:9001;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px}" +
    "#sh-card{background:#fff;color:#0f172a;border-radius:18px;padding:20px 18px;max-width:340px;width:100%;text-align:center;" +
    "font:17px/1.5 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.3)}" +
    "#sh-card h3{margin:0 0 6px;font-size:20px}#sh-card p{margin:0 0 16px;color:#475569;font-size:15px}" +
    "#sh-card button{font:inherit;min-height:48px;border-radius:12px;border:0;padding:10px 16px;margin:4px;cursor:pointer}" +
    "#sh-go{background:#0284c7;color:#fff;font-weight:700}#sh-stay{background:#e2e8f0;color:#0f172a}" +
    "@media (prefers-color-scheme:dark){#sh-card{background:#1e293b;color:#e2e8f0}#sh-card p{color:#94a3b8}#sh-stay{background:#334155;color:#e2e8f0}}" +
    "body{padding-bottom:max(76px,calc(64px + env(safe-area-inset-bottom)))!important}" +
    ".sp-toast{position:fixed;left:max(84px,calc(72px + env(safe-area-inset-left)));bottom:max(18px,calc(6px + env(safe-area-inset-bottom)));z-index:9002;" +
    "background:#f59e0b;color:#1f2937;font:800 16px/1.3 -apple-system,'PingFang TC',sans-serif;padding:8px 12px;border-radius:999px;" +
    "box-shadow:0 4px 12px rgba(0,0,0,.25);pointer-events:none;transition:opacity .4s,transform .4s}" +
    ".sp-toast.sp-big{left:50%;bottom:auto;top:30%;transform:translateX(-50%);text-align:center;font-size:18px;padding:14px 22px;border-radius:18px}" +
    ".sp-toast.sp-out{opacity:0;transform:translateY(-14px)}.sp-toast.sp-big.sp-out{transform:translate(-50%,-14px)}";
  document.head.appendChild(css);

  /* ---------------- 📚 小站 button ---------------- */
  if (!document.body) return;
  var b = document.createElement("button");
  b.id = "sh-btn"; b.type = "button";
  b.setAttribute("aria-label", "回到練習小站"); b.title = "回到練習小站";
  b.textContent = "📚 小站";
  b.addEventListener("click", function () {
    if (document.getElementById("sh-mask")) return;
    var m = document.createElement("div"); m.id = "sh-mask";
    var pts = kid ? "<p>目前集點：⭐ " + load(kid).points + " 點</p>" : "";
    m.innerHTML = '<div id="sh-card" role="dialog" aria-modal="true"><h3>📚 回到練習小站？</h3>' +
      '<p>這一輪的作答不會保留（點數和最高分紀錄會留著）。</p>' + pts +
      '<button id="sh-go" type="button">回到練習小站</button><button id="sh-stay" type="button">繼續練習</button></div>';
    document.body.appendChild(m);
    function close() { m.remove(); }
    m.addEventListener("click", function (e) { if (e.target === m) close(); });
    document.getElementById("sh-stay").addEventListener("click", close);
    document.getElementById("sh-go").addEventListener("click", function () {
      try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
      location.href = homeUrl();
    });
    document.getElementById("sh-go").focus();
  });
  document.body.appendChild(b);
})();
</script>
