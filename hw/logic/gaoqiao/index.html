<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>高僑 數理邏輯 錯題練功房</title>
<style>
html,body{margin:0}
html,body{margin:0}

/* 數學練功房：方格紙＋橘色主色；單欄、手機優先 */
:root{
  --paper:#fdfaf5; --card:#ffffff; --ink:#26211b; --muted:#6d6257;
  --sand:#f6e2c8; --orange:#c05d12; --blue:#1f5d8c; --blue-soft:#dceaf4;
  --line:#e7dac8; --ok:#2f7a45; --bad:#b3362f; --okbg:#e3f2e6; --badbg:#fbe7e5;
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"DIN Alternate","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16130f; --card:#211c16; --ink:#f0e8dd; --muted:#b0a494;
  --sand:#3a2d1d; --orange:#ffab5e; --blue:#8ec5ea; --blue-soft:#1d3346;
  --line:#3a3128; --ok:#7fd29a; --bad:#ff958c; --okbg:#1d3324; --badbg:#3a1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16130f; --card:#211c16; --ink:#f0e8dd; --muted:#b0a494;
  --sand:#3a2d1d; --orange:#ffab5e; --blue:#8ec5ea; --blue-soft:#1d3346;
  --line:#3a3128; --ok:#7fd29a; --bad:#ff958c; --okbg:#1d3324; --badbg:#3a1f1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header h1{font-family:var(--kai);font-size:clamp(25px,7vw,35px);margin:0;line-height:1.2;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.hdr{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.hdr>div{min-width:0}
.hdr #sfxBtn{flex:none;margin-top:6px}
.scope{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.chip.wrongchip[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.count{font-size:13px;color:var(--muted);margin-left:auto}
nav.tabs{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;background:var(--sand);padding:4px;border-radius:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
nav.tabs button{border:0;background:transparent;border-radius:9px;padding:8px 0;font-size:clamp(11px,3.2vw,15px);font-weight:500;white-space:nowrap}
@media (max-width:780px){nav.tabs{grid-template-columns:repeat(5,1fr)}}
nav.tabs button[aria-selected="true"]{background:var(--card);font-weight:700;color:var(--orange);box-shadow:0 1px 2px rgba(0,0,0,.12)}
section{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--orange);background:var(--card);color:var(--orange);border-radius:10px;padding:8px 16px;font-weight:700}
.btn.primary{background:var(--orange);color:#fff}
.btn.blue{border-color:var(--blue);color:var(--blue)}
.btn.blue.primary{background:var(--blue);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.hint{color:var(--muted);font-size:14px;margin:0}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* 題目卡 */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.qsrc{font-size:12px;color:var(--muted)}
.qtext{font-size:clamp(17px,4.6vw,21px);line-height:1.85;font-family:var(--kai)}
.qtext b{color:var(--orange)}
.step{font-size:14px;color:var(--blue);font-weight:700}
.opts{display:grid;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;text-align:left;font-size:18px;min-height:48px;display:flex;align-items:center;gap:10px}
.opt .lab{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sand);color:var(--orange);display:grid;place-items:center;font-size:14px;font-weight:700}
.opt.good{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt:disabled{cursor:default}
.mono{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.5px}

/* 數字鍵盤 */
.slots{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-size:24px}
.slot{min-width:84px;min-height:48px;border:2px dashed var(--line);border-radius:10px;padding:4px 10px;background:var(--paper);
  display:inline-flex;align-items:center;justify-content:center;font-family:var(--num);font-size:26px;font-variant-numeric:tabular-nums}
.slot.on{border-style:solid;border-color:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 25%,transparent)}
.slot .ph{color:var(--muted);font-size:15px;font-family:var(--sans)}
.slotu{font-size:17px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pad button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;min-height:54px;font-size:24px;font-family:var(--num);font-weight:700}
.pad button.fn{font-family:var(--sans);font-size:16px;color:var(--orange);border-color:var(--orange)}
.pad button.go{background:var(--orange);color:#fff;border-color:var(--orange);font-family:var(--sans);font-size:17px}
.pad button:active{transform:translateY(1px)}
.fb{border-radius:12px;padding:10px 14px;border:2px solid var(--line);font-size:16px}
.fb.y{border-color:var(--ok);background:var(--okbg)}
.fb.n{border-color:var(--bad);background:var(--badbg)}
.fb b{font-size:19px}

/* 直式 */
.vert{display:inline-grid;justify-items:end;font-family:var(--num);font-size:30px;line-height:1.35;background:var(--paper);
  border:1.5px solid var(--line);border-radius:10px;padding:10px 16px;font-variant-numeric:tabular-nums}
.vert .ln{border-top:2.5px solid var(--ink);width:100%;margin-top:2px}
.vert .op{justify-self:start;margin-right:10px}
.vrow{display:flex;gap:10px;align-items:baseline}

/* HUD */
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px}
.rhud{min-height:40px}
.rhud .rrow{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.rhud .rrow b{font-size:18px;color:var(--ink);font-family:var(--num);font-variant-numeric:tabular-nums}
.rhud .cdw b{color:var(--bad)}
.rhud .plus{min-height:1.3em;font-size:14px;color:var(--orange);font-weight:700}
.timebar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0}
.timebar i{display:block;height:100%;background:var(--orange);transition:width .25s linear}
.timebar.warn i{background:var(--bad)}
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.rsum div{font-size:12px;color:var(--muted)}
.rsum b{display:block;font-size:24px;color:var(--ink);font-family:var(--num);font-variant-numeric:tabular-nums}
.qask{text-align:center;margin:0;font-size:15px}
.stars{font-size:34px;letter-spacing:4px;color:var(--orange);text-align:center}

/* 重點卡 */
.kcard{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--orange);border-radius:12px;padding:12px 14px}
.kcard h3{margin:0 0 6px;font-family:var(--kai);font-size:19px;color:var(--orange)}
.kcard ul{margin:0;padding-left:1.2em}
.kcard li{margin:3px 0}
.cover{background:var(--sand);border-radius:6px;color:transparent;user-select:none;cursor:pointer;padding:0 6px}
.cover::after{content:"點我看";color:var(--orange);font-size:13px}
.cover *{visibility:hidden}

/* 圖 */
.figbox{display:grid;place-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px}
.figbox svg{max-width:100%;height:auto}
.fg-line{stroke:var(--ink);fill:none}
.fg-thin{stroke:var(--muted);fill:none}
.fg-txt{fill:var(--ink);font-family:var(--sans);font-size:13px}
.fg-acc{stroke:var(--orange);fill:none}
.fg-accf{fill:var(--orange)}
.fg-fill{fill:var(--orange);fill-opacity:.22;stroke:var(--orange)}
.fg-dot{fill:var(--ink)}
.fg-hi{fill:var(--orange)}

/* 翻牌配對 */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.mc{aspect-ratio:1/1.15;border:1.5px solid var(--line);background:var(--sand);border-radius:12px;font-size:clamp(13px,3.6vw,18px);
  display:grid;place-items:center;padding:4px;text-align:center;line-height:1.25;transition:transform .2s}
.mc.open,.mc.done{background:var(--card);border-color:var(--orange)}
.mc.done{opacity:.45}
.mc .fc{visibility:hidden}
.mc.open .fc,.mc.done .fc{visibility:visible}
.mc.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.08)}}
.combo{text-align:center;font-family:var(--kai);font-size:21px;color:var(--orange);min-height:1.4em}

/* 錯題本 */
.wlist{display:flex;flex-direction:column;gap:8px}
.witem{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.witem .wq{font-family:var(--kai);font-size:17px}
.witem .wa{color:var(--ok);font-weight:700}
.tagn{display:inline-block;background:var(--sand);color:var(--orange);border-radius:6px;padding:0 6px;font-size:12px;font-weight:700;margin-right:6px}
[hidden]{display:none!important}

/* 慶祝 */
#party{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 72%,transparent);padding:16px}
#party .pbox{background:var(--card);border:2px solid var(--orange);border-radius:18px;padding:18px 22px;text-align:center;max-width:92vw}
#party h2{margin:0 0 6px;font-family:var(--kai);font-size:26px;color:var(--orange)}
#party .crew{display:flex;gap:10px;justify-content:center;margin:8px 0}
#party .crew svg{width:92px;height:92px;animation:bop .7s ease-in-out infinite alternate}
#party .crew svg:nth-child(2){animation-delay:.35s}
@keyframes bop{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-12px) rotate(5deg)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:49;overflow:hidden}
.confetti i{position:absolute;width:9px;height:14px;opacity:.92;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(104vh) rotate(680deg)}}
@media (prefers-reduced-motion:reduce){#party .crew svg,.confetti i,.mc.pop{animation:none}}
.opt.sel{border-color:var(--orange);outline:2px solid var(--orange)}
.mtab{width:100%;border-collapse:collapse;margin:8px 0}.mtab th,.mtab td{border-bottom:1px solid var(--line);padding:6px;text-align:center}
.gh{font-family:var(--kai);color:var(--orange);margin:10px 0 0;font-size:21px}
.olist{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:17px}
details summary{cursor:pointer;color:var(--blue);font-weight:700;padding:4px 0}
.explain{font-size:16px;line-height:1.8;margin-top:6px}
.explain b{color:var(--orange)}
.card.inner{border-style:dashed}
.qtext sup,.qtext sub,.opt sup,.opt sub{font-size:.7em}
#scope{display:flex;flex-direction:column;gap:6px}
nav.tabs{grid-template-columns:repeat(5,1fr)!important}

</style>
</head>
<body>
<div class="wrap">
<header class="hdr">
  <div>
    <h1>數理邏輯 錯題練功房</h1>
    <p>高僑私中模擬考 第 1～3 回的錯題：先看講解 → 錯題重做 → 類題挑戰 → 模擬考</p>
  </div>
  <button class="chip" id="sfxBtn" type="button" aria-pressed="true">音效：開</button>
</header>
<div id="scope"></div>
<nav class="tabs" role="tablist" aria-label="練習關卡">

  <button data-tab="redo" aria-selected="false">錯題重做</button>
  <button data-tab="sim" aria-selected="false">類題</button>
  <button data-tab="mock" aria-selected="false">模擬考</button>

<main style="display:contents">
<section id="tab-learn"></section>
<section id="tab-redo" hidden></section>
<section id="tab-sim" hidden></section>
<section id="tab-mock" hidden></section>
<section id="tab-wrong" hidden></section>
</main>

<script>
/* ===== KPDeal：選擇題正確答案位置平均分散（練習小站共用，版本 2026-11-10b）=====
   規則：每個位置（A/B/C/D…）出現次數一樣多，且正確答案不會連續 3 題在同一位置。
   用法（整段貼進 App 的 <script>，放在使用它的程式之前）：
     KPDeal.place(options, correct)   → 回傳新陣列：錯誤選項打亂，正確選項放到平均分散的位置
                                         correct 可以是「值」或「判斷函式 (item,index)=>boolean」
     KPDeal.pos(n)                    → 只要位置編號（0..n-1）時使用
     KPDeal.shuffle(arr)              → 一般打亂（回傳新陣列）
   注意：凡是「一題 + 數個選項 + 一個正解」的地方都要用 place，不要再用 shuffle 決定選項順序。
*/
var KPDeal=(function(){
  var decks={},last=[];
  function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function runOK(s){for(var i=2;i<s.length;i++)if(s[i]===s[i-1]&&s[i]===s[i-2])return false;return true}
  function pos(n){
    if(!(n>1))return 0;
    var d=decks[n];
    if(!d||!d.length){var base=[],k=0;for(var r=0;r<2;r++)for(var i=0;i<n;i++)base.push(i);
      do{d=sh(base);k++}while(!runOK(last.slice(-2).concat(d))&&k<300);decks[n]=d}
    var p=d.shift();
    if(last.length>=2&&last[last.length-1]===p&&last[last.length-2]===p){
      for(var i=0;i<d.length;i++)if(d[i]!==p){var q=d[i];d[i]=p;p=q;break}
      if(last[last.length-1]===p&&last[last.length-2]===p){var alt=(p+1+Math.floor(Math.random()*(n-1)))%n;d.push(p);p=alt}}
    last.push(p);if(last.length>4)last.shift();
    return p;
  }
  function place(arr,correct){
    var f=typeof correct==='function'?correct:function(x){return x===correct};
    var ci=-1;for(var i=0;i<arr.length;i++)if(f(arr[i],i)){ci=i;break}
    if(ci<0)return sh(arr);
    var c=arr[ci],w=sh(arr.filter(function(_,i){return i!==ci}));
    w.splice(pos(arr.length),0,c);
    return w;
  }
  return {place:place,pos:pos,shuffle:sh};
})();

/* 高僑 數理邏輯 錯題資料
   r=回次 n=題號 g=題型 q=題目 o=選項(依原卷①②③④順序) a=正解索引 k=Howard 當時選的索引(null=不確定) f=圖代碼 e=解析
   s=類題 {q,o,a,e,f} */
const GN=['分數・比・百分率','公因數與公倍數','和差倍・年齡・雞兔','行程（相遇）','時間・日期・週期','幾何圖形','規律與推理'];
const BUS='快樂公車站每天早上 6:10 紅線和黃線同時開出第一班車；紅線每 12 分鐘一班，黃線每 30 分鐘一班。';
const RECIPE='1 壺雙色珍珠奶茶要用：紅茶 1<sup>3</sup>⁄<sub>4</sub> 公升、鮮奶 1<sup>3</sup>⁄<sub>4</sub> 公升、糖水 <sup>1</sup>⁄<sub>8</sub> 公升（另加白玉珍珠 3/8 公斤、黑糖珍珠 2/5 公斤）。';
const SCORE='某私中模擬考：數學加權分數＝（非選擇題得分÷非選擇題總分）×15＋（選擇題答對題數÷選擇題總題數）×85。非選擇題總分 6 分，選擇題共 25 題。金盾 80～100、銀盾 60～79、粉盾 40～59、藍盾 0～39。';
const Q=[
/* ===== 第 1 回 ===== */
{id:'1-5',r:1,n:5,g:2,k:null,q:'數學老師將糖果 120 顆、餅乾 110 塊，分別平均分給若干位小朋友，每人分得的糖果數量相同，餅乾數量也相同，最後糖果<b>不夠</b> 6 顆，餅乾<b>多出</b> 5 塊。若小朋友最多有 a 人、最少有 b 人，則 a＋b＝？',o:['24','26','28','30'],a:2,
 e:'① 糖果不夠 6 顆 → 補上 6 顆剛好分完：120＋6＝126。<br>② 餅乾多出 5 塊 → 拿掉 5 塊剛好分完：110－5＝105。<br>③ 人數要同時整除 126 和 105 → 是它們的公因數：(126,105)＝21，公因數有 1、3、7、21。<br>④ 多出 5 塊、少 6 顆，代表人數一定比 6 多（不然還能再多分一輪）→ 只剩 7 和 21。<br>a＝21，b＝7，a＋b＝<b>28</b>。',
 s:{q:'老師有鉛筆 86 枝、橡皮擦 65 個，平均分給一群小朋友。鉛筆<b>少</b> 4 枝，橡皮擦<b>多</b> 5 個。小朋友最多 a 人、最少 b 人，a＋b＝？',o:['34','36','40','45'],a:1,
 e:'鉛筆補 4 枝：86＋4＝90；橡皮擦拿掉 5 個：65－5＝60。<br>(90,60)＝30，公因數 1、2、3、5、6、10、15、30。<br>人數要比 5 多 → 6、10、15、30。最多 30、最少 6，30＋6＝<b>36</b>。'}},
{id:'1-6',r:1,n:6,g:2,k:1,q:'甲、乙、丙三人同時同地出發，依同方向繞周長 1200 公尺的圓形跑道競走；甲、乙、丙每分鐘分別走 150、200、300 公尺，則第一次會合於出發點時，經過多少分鐘？',o:['2','6','12','24'],a:3,
 e:'先算每人走一圈要幾分鐘：甲 1200÷150＝8，乙 1200÷200＝6，丙 1200÷300＝4。<br>三人都剛好回到出發點 → 時間要同時是 8、6、4 的倍數 → 最小公倍數 [8,6,4]＝<b>24</b> 分鐘。<br>⚠️ 不是求速度的公倍數，而是「一圈時間」的公倍數。',

{id:'1-8',r:1,n:8,g:6,k:0,f:'sqtri',q:'右圖是邊長 10 公分的正方形 ABCD 和正三角形 ABE 拼在一起，連接 E 和 C。求∠ㄅ（∠AEC）是多少度？',o:['35°','40°','45°','50°'],a:2,

{id:'1-9',r:1,n:9,g:3,k:2,q:'甲、乙兩人原有的錢相等，甲用去 1200 元，乙用去 800 元，則乙剩下的錢是甲剩下錢的 1.5 倍，求最初兩人<b>共有</b>多少元？',o:['2000','3000','3800','4000'],a:3,

{id:'1-14',r:1,n:14,g:1,k:2,q:'農場佔地面積 216 平方公尺，其中全部面積的 2/9 種植花椰菜、1/6 種植地瓜葉、5/12 種植大白菜，其餘面積種植高麗菜，則種植高麗菜的面積是幾平方公尺？',o:['36','42','48','56'],a:1,

{id:'1-17',r:1,n:17,g:2,k:0,q:'有大、小兩個整數，它們的和是 270，它們的最大公因數是 30，則這兩個整數的差<b>不可能</b>是多少？',o:['210','150','90','30'],a:2,

{id:'1-18',r:1,n:18,g:3,k:2,q:'兄、弟兩人，兄有 1260 元、弟有 370 元，某天爸爸又給兩人<b>一樣多</b>的零用錢，此時兄的錢是弟的 3 倍，則爸爸各給兄、弟兩人多少元？',o:['75','80','70','65'],a:0,

{id:'1-20',r:1,n:20,g:1,k:1,q:'鐵馬單車店一款公路車，若以定價的 7 折售出會<b>虧</b> 2800 元；若以定價的 9 折售出就會<b>賺</b> 4800 元。此款公路車的定價為多少元？',o:['32000','36000','38000','42000'],a:2,

{id:'1-22',r:1,n:22,g:5,k:2,q:'運動大會當天，從上午 7:00 到下午 1:00，校門口需要隨時保持有 4 位客服老師接待家長。補習班共有 12 位客服老師，若接待工作平均分配，則每位客服老師須服務多少分鐘？',o:['96','108','104','120'],a:3,

let sfxOn=load('sfx',true),actx=null;
function tone(seq){if(!sfxOn)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    let t=actx.currentTime+0.01;
    seq.forEach(([f,d,type,v])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.16,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+0.03);t+=d*0.8});}catch(e){}}
const SFX={ok:()=>tone([[659,.12],[880,.12],[1175,.25]]),bad:()=>tone([[311,.18,'triangle',.14],[233,.32,'triangle',.14]]),
  tick:()=>tone([[1250,.04,'square',.035]]),win:()=>tone([[523,.13],[659,.13],[784,.13],[1047,.13],[784,.1],[1047,.4]])};

function rtStart(key){rt={key,t0:Date.now(),score:0,streak:0,best:0,ok:0,n:0,qT:Date.now(),onTimeout:null,last:'',lastTick:-1,done:false}}
function rtQ(onTimeout){if(!rt)return;rt.qT=Date.now();rt.onTimeout=(tmode==='cd'&&onTimeout)?onTimeout:null;rt.lastTick=-1;rtTick()}
function rtAns(right){if(!rt)return 0;rt.n++;rt.onTimeout=null;let pts=0;
  if(right){rt.ok++;rt.streak++;rt.best=Math.max(rt.best,rt.streak);const sec=(Date.now()-rt.qT)/1000;
    const sp=Math.round(50*Math.max(0,Math.min(1,1-(sec-20)/70))),cb=Math.min(5,rt.streak-1)*10;pts=100+sp+cb;rt.score+=pts;
    rt.last=`＋${pts}${sp?`（快答 ＋${sp}）`:''}${rt.streak>1?`・${rt.streak} 連對`:''}`}
  else{rt.streak=0;rt.last='連對中斷'}
  rtTick();return pts}
function rtTick(){if(!rt||rt.done)return;const now=Date.now(),el=(now-rt.t0)/1000;let cd='';
  if(rt.onTimeout){const left=QLIM-(now-rt.qT)/1000,c=Math.ceil(left);
    if(c<=3&&c>0&&c!==rt.lastTick){rt.lastTick=c;SFX.tick()}
    cd=`<div class="timebar${left<=10?' warn':''}"><i style="width:${Math.max(0,left/QLIM*100)}%"></i></div>`;
    if(left<=0){const f=rt.onTimeout;rt.onTimeout=null;f();return}}
  document.querySelectorAll('.rhud').forEach(h=>{const sec=h.closest('section');if(sec&&sec.hidden)return;
    h.innerHTML=`<div class="rrow"><span>時間 <b>${rmt(el)}</b></span><span>分數 <b>${rt.score}</b></span><span>連對 <b>${rt.streak}</b></span>${rt.onTimeout?`<span class="cdw">剩 <b>${Math.max(0,Math.ceil(QLIM-(now-rt.qT)/1000))}</b> 秒</span>`:''}</div>${cd}<div class="plus">${rt.last}</div>`})}
setInterval(rtTick,250);
function rtEnd(){if(!rt)return '';rt.done=true;rt.onTimeout=null;const el=(Date.now()-rt.t0)/1000,acc=rt.n?Math.round(rt.ok/rt.n*100):0;
  const key='rbest-'+rt.key,best=load(key,null),rec=(!best||rt.score>best.sc)&&rt.n>0;if(rec)save(key,{sc:rt.score,t:el});

function singleQ(box,it){const d=deal(it);
  box.innerHTML=`<div class="card inner"><div class="qsrc">${it.src}</div><div class="qtext">${it.q}</div>${figHTML(it.f)}
   <div class="opts">${d.options.map((o,j)=>`<button class="opt" type="button" data-j="${j}"><span class="lab">${CIR[j]}</span><span>${o.t}</span></button>`).join('')}</div><div class="fbx"></div></div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,right=j===d.answer;
    box.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(k===d.answer){x.classList.add('good');x.querySelector('.lab').textContent='✓'}else if(k===j){x.classList.add('bad');x.querySelector('.lab').textContent='✗'}});
    if(right)SFX.ok();else{SFX.bad();addWrong(it)}
    box.querySelector('.fbx').innerHTML=`<div class="fb ${right?'y':'n'}"><b>${right?'✓ 答對了！':'✗ 再想想'}</b><div class="explain">${it.e}</div></div>`})}

/* ===== 一關的通用流程（錯題重做／類題）===== */
const MODN={o:'錯題重做',s:'類題挑戰'};
function intro(kind){const p=poolOf(kind),sec=$('#tab-'+(kind==='o'?'redo':'sim'));
  sec.innerHTML=`<div class="card"><p class="qask"><b>${MODN[kind]}</b>：${kind==='o'?'考卷上錯的題目，重做一次':'和錯題同一種解法、換了數字的新題目'}。範圍內共 <b>${p.length}</b> 題。</p>
   ${timeChips()}<div class="bar" style="justify-content:center"><label class="hint" for="sz">題數</label><select id="sz"><option value="10">10 題</option><option value="20">20 題</option><option value="999">全部</option></select>
   <button class="btn primary" id="go" ${p.length?'':'disabled'}>開始</button></div>
   <p class="hint">每題要算，草稿紙準備好！答完會出現講解。</p></div>`;
  $('#go').onclick=()=>run(kind,shuffle(p).slice(0,+$('#sz').value))}
function run(kind,list){const sec=$('#tab-'+(kind==='o'?'redo':'sim'));rtStart(kind);let i=0,ok=0;
  const show=()=>{if(i>=list.length)return end();const it=list[i];
    const d=deal(it);
    sec.innerHTML=`<div class="card"><div class="rhud"></div><div class="qsrc">${i+1} / ${list.length}　${it.src}・${GN[it.g-1]}</div>
     <div class="qtext">${it.q}</div>${figHTML(it.f)}
     <div class="opts">${d.options.map((o,j)=>`<button class="opt" type="button" data-j="${j}"><span class="lab">${CIR[j]}</span><span>${o.t}</span></button>`).join('')}</div>
     <div id="fbx"></div></div>`;
    const answer=j=>{const right=j===d.answer;rtAns(right);if(right){ok++;SFX.ok()}else{SFX.bad();addWrong(it)}
      sec.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(k===d.answer){x.classList.add('good');x.querySelector('.lab').textContent='✓'}else if(k===j){x.classList.add('bad');x.querySelector('.lab').textContent='✗'}});
      $('#fbx').innerHTML=`<div class="fb ${right?'y':'n'}"><b>${right?'✓ 答對了！':(j==null?'⏰ 時間到':'✗ 答錯了')}</b>${right?'':`　正確答案：${CIR[d.answer]} ${d.options[d.answer].t}`}
        <div class="explain">${it.e}</div></div><div class="bar" style="justify-content:flex-end;margin-top:8px"><button class="btn primary" id="nx">${i+1<list.length?'下一題':'看成績'}</button></div>`;
      $('#nx').onclick=()=>{i++;show()};$('#nx').scrollIntoView({behavior:'smooth',block:'nearest'})};
    sec.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.j));
    rtQ(()=>answer(null))};
  const end=()=>{sec.innerHTML=`<div class="card"><p class="qask">${MODN[kind]}完成！答對 ${ok} / ${list.length}</p>${rtEnd()}
    <div class="bar" style="justify-content:center"><button class="btn primary" id="again">再一輪</button></div></div>`;
    $('#again').onclick=()=>intro(kind);if(ok===list.length&&list.length)celebrate(MODN[kind]+'全對！');
};
  show()}

/* ===== 模擬考（點選作答，交卷後才公布）===== */
let mk=null;
function mockIntro(){const pool=poolOf('all');const best=load('mockbest',null);
  $('#tab-mock').innerHTML=`<div class="card"><p class="qask"><b>模擬考</b>：從錯題和類題中抽題，像真的考試一樣，交卷後才看對錯。</p>
   <p class="hint">範圍內題庫 ${pool.length} 題（原題＋類題）。高僑卷是 50 題、每題 2 分；建議先試 25 題（每題 4 分）。${best?`<br>最佳成績：<b>${best.sc}</b> 分（${best.n} 題）`:''}</p>
   <div class="bar" style="justify-content:center"><select id="mkn"><option value="25">25 題（每題 4 分）</option><option value="50">50 題（每題 2 分）</option></select>
   <button class="btn primary" id="mkgo" ${pool.length?'':'disabled'}>開始考試</button></div></div>`;
  $('#mkgo').onclick=()=>{const n=Math.min(+$('#mkn').value,pool.length);
    // 同一題的原題和類題不要同時出現太多：先打散，優先每個 id 取一題
    const sh=shuffle(pool),seen=new Set(),first=[],rest=[];sh.forEach(it=>{(seen.has(it.id)?rest:first).push(it);seen.add(it.id)});
    const list=first.concat(rest).slice(0,n);
    mk={list:list.map(it=>{const d=deal(it);return{it,d,sel:null}}),t0:Date.now(),warned:false,pts:100/n};

function mockRender(){const done=mk.list.filter(x=>x.sel!=null).length;
  $('#tab-mock').innerHTML=`<div class="card"><p class="qask">已作答 <b>${done}</b> / ${mk.list.length}</p></div>`+
   mk.list.map((x,i)=>`<div class="card" id="mq${i}"><div class="qsrc">${i+1}.（${Math.round(mk.pts*10)/10} 分）${x.sel!=null?'<b style="color:var(--orange)">● 已選</b>':''}</div>
    <div class="qtext">${x.it.q}</div>${figHTML(x.it.f)}
    <div class="opts">${x.d.options.map((o,j)=>`<button class="opt${x.sel===j?' sel':''}" type="button" data-q="${i}" data-j="${j}"><span class="lab">${CIR[j]}</span><span>${o.t}</span></button>`).join('')}</div></div>`).join('')+
   `<div class="card"><div id="mkwarn"></div><div class="bar" style="justify-content:center"><button class="btn primary" id="mksub">交卷</button></div></div>`;
  document.querySelectorAll('#tab-mock .opt').forEach(b=>b.onclick=()=>{const q=+b.dataset.q;mk.list[q].sel=+b.dataset.j;
    const card=$('#mq'+q);card.querySelectorAll('.opt').forEach((x,k)=>x.classList.toggle('sel',k===mk.list[q].sel));
    card.querySelector('.qsrc').innerHTML=`${q+1}.（${Math.round(mk.pts*10)/10} 分）<b style="color:var(--orange)">● 已選</b>`;
    document.querySelector('#tab-mock .qask b').textContent=mk.list.filter(x=>x.sel!=null).length});
  $('#mksub').onclick=()=>{const left=mk.list.filter(x=>x.sel==null).length;
    if(left&&!mk.warned){mk.warned=true;$('#mkwarn').innerHTML=`<div class="fb n">還有 <b>${left}</b> 題沒寫！檢查一下，確定要交卷就再按一次「交卷」。</div>`;return}
    mockResult()}}
function mockResult(){const el=(Date.now()-mk.t0)/1000;let ok=0;const byG={};
  mk.list.forEach(x=>{const r=x.sel===x.d.answer;if(r)ok++;else addWrong(x.it);const g=GN[x.it.g-1];byG[g]=byG[g]||[0,0];byG[g][1]++;if(r)byG[g][0]++});

   <table class="mtab"><tr><th>題型</th><th>答對</th><th>得分率</th></tr>${Object.entries(byG).map(([g,[a,b]])=>`<tr><td>${g}</td><td>${a} / ${b}</td><td>${Math.round(a/b*100)}%</td></tr>`).join('')}</table>

   mk.list.map((x,i)=>{const r=x.sel===x.d.answer;return `<div class="card"><div class="qsrc">${i+1}. ${r?'<b style="color:var(--ok)">✓ 正確</b>':'<b style="color:var(--bad)">✗ 錯誤</b>'}　${x.it.src}</div>
    <div class="qtext">${x.it.q}</div>${figHTML(x.it.f)}
    <div class="opts">${x.d.options.map((o,j)=>`<div class="opt${j===x.d.answer?' good':(j===x.sel?' bad':'')}"><span class="lab">${j===x.d.answer?'✓':(j===x.sel?'✗':CIR[j])}</span><span>${o.t}${j===x.sel&&!r?'（你選的）':''}</span></div>`).join('')}</div>
    ${r?'':`<div class="fb n"><div class="explain">${x.it.e}</div></div>`}</div>`}).join('');
  $('#mkagain').onclick=mockIntro;window.scrollTo({top:0,behavior:'smooth'});
  if(ok===mk.list.length)celebrate('模擬考滿分！');
  if(window.SiteDex)try{SiteDex.maybe(Math.round(ok/mk.list.length*100),mk.list.length)}catch(e){}}

<script>
/* =====================================================================
   site-home.js — 📚 小站 button + 全站集點 (site-wide points & badges)
   Canonical copy: github.com/iam5980/kids-practice/template/site-home.js
   Version: 2026-11-15（🌈 神話夥伴：24 種都變完全體後出現；首頁圖鑑可看進化過程、🎰 扭蛋機與卡冊）

   HOW TO USE: paste this whole file in its own <script> block just before
   </body> of EVERY page published to kids-practice (English and 中文部,
   apps, oral pages, listening players). Nothing else is required.

   1) "📚 小站" pill, bottom-left → in-page confirm card → site home.
   2) SitePoints — points and badges per kid, shared by every app on the
      site (same origin), shown on the home page 集點卡. Kept only on
      this device (localStorage).
        SitePoints.answer(ok)       after every judged answer
        SitePoints.roundEnd(pct)    when a round / drill ends (0–100)
        SitePoints.literacy(allOk)  when a 素養題組 is finished
      Points: correct +10, streak bonus +2 per answer in a row (max +10).
      No speed bonus — accuracy only.
   3) Auto-hooks, so older apps need no code changes:
        中文部 engine:  rtAns(right) → answer;  celebrate() → perfect round
        AppCore apps:   AppCore calls SitePoints itself (app-core ≥ 2026-10-25)
   ===================================================================== */
(function () {
  "use strict";
  if (window.__siteHome) return;
  window.__siteHome = true;
  var LIVE = "https://iam5980.github.io/kids-practice/";
  function homeUrl() {
    var p = location.pathname, i = p.indexOf("/kids-practice/");
    if (location.protocol.indexOf("http") === 0 && i >= 0) return location.origin + p.slice(0, i) + "/kids-practice/";
    return LIVE;
  }

  /* ---------------- SitePoints ---------------- */
  var BADGES = [
    { id: "first",   icon: "🌱", name: "第一次答對" },
    { id: "perfect", icon: "💯", name: "第一次滿分" },
    { id: "streak10",icon: "🔥", name: "連對 10 題" },
    { id: "streak20",icon: "🚀", name: "連對 20 題" },
    { id: "days3",   icon: "📅", name: "連續練習 3 天" },
    { id: "days7",   icon: "🗓️", name: "連續練習 7 天" },
    { id: "lit1",    icon: "🧩", name: "第一組素養題全對" },
    { id: "lit10",   icon: "🎓", name: "素養題達人（10 組全對）" },
    { id: "p500",    icon: "⭐", name: "累積 500 點" },
    { id: "p2000",   icon: "🌟", name: "累積 2000 點" },
    { id: "p5000",   icon: "🏆", name: "累積 5000 點" }
  ];
  function kidFromPath() {
    var m = location.pathname.match(/\/kids-practice\/([a-z0-9]+)\//i);
    if (m && m[1] === "shadowing") { try { return localStorage.getItem("kp-shadow-kid") || null; } catch (e) { return null; } }
    return m && m[1] !== "template" ? m[1] : null;
  }
  function today() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function dayDiff(a, b) { return Math.round((new Date(b) - new Date(a)) / 864e5); }
  function load(kid) {
    var d = null;
    try { d = JSON.parse(localStorage.getItem("kp-points-" + kid) || "null"); } catch (e) {}
    return d || { points: 0, today: "", todayPts: 0, days: [], badges: {}, correct: 0, perfects: 0, lit: 0, bestStreak: 0 };
  }
  function save(kid, d) { try { localStorage.setItem("kp-points-" + kid, JSON.stringify(d)); } catch (e) {} }
  function dayStreak(days) {
    if (!days.length) return 0;
