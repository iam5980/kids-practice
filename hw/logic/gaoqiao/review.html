<title>Howard 私中考前 錯題重做</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2933;--mute:#6b7280;--line:#e5e1d8;--acc:#2f6f5e;--acc2:#e8f1ee;--ok:#2e7d32;--okbg:#e8f5e9;--bad:#c62828;--badbg:#fdecea;--warn:#b26a00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:15px}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.muted{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:16px;cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.sm{padding:6px 10px;font-size:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.cl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:#fff;cursor:pointer;text-align:left;width:100%;font-size:16px}
.cl:hover{border-color:var(--acc)}
.tag{font-size:12px;border-radius:6px;padding:2px 7px;background:var(--acc2);color:var(--acc);white-space:nowrap}
.tag.w{background:#fff4e0;color:var(--warn)}
.big{font-size:28px;font-weight:700}
.q{font-size:19px;margin:4px 0 14px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;font-size:17px;cursor:pointer;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:12px;padding:12px 14px;margin-top:10px}
.fb.ok{background:var(--okbg)} .fb.bad{background:var(--badbg)}
ul.kp{margin:6px 0 0;padding-left:20px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc)}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.hide{display:none}
</style>
</head>

  const ord=shuffle([0,1,2,3]);S.ord=ord;S.answered=false;
  const wb=st.wb[q.n];
  app.innerHTML=`<div class="card"><div class="row"><span class="tag">${q.subj}</span><span class="muted">${esc(q.cname)}</span>${wb?`<span class="tag w">錯題本：已連對 ${wb.s}/2</span>`:''}</div>
  <div class="bar" style="margin:10px 0"><i style="width:${S.i/S.list.length*100}%"></i></div>
  <div class="q">${esc(q.q)}</div>${ord.map((k,j)=>`<button class="opt" data-k="${k}" onclick="pick(${k},this)">${C[j]} ${esc(q.o[k])}</button>`).join('')}<div id="fb"></div></div>`;scrollTo(0,0)}
function pick(k,el){if(S.answered)return;S.answered=true;const q=S.list[S.i],ok=k===q.a;
  document.querySelectorAll('.opt').forEach(b=>{const bk=+b.dataset.k;if(bk===q.a)b.classList.add('ok');else if(b===el)b.classList.add('bad')});
  st.done[q.n]=1;let note='';
  if(ok){S.ok++;if(st.wb[q.n]){st.wb[q.n].s++;if(st.wb[q.n].s>=2){delete st.wb[q.n];note='　🎉 連續答對 2 次，移出錯題本！'}else note='　錯題本：再答對 1 次就能移出'}}
  else{st.wb[q.n]={s:0};S.wrong.push(q);note='　已放進錯題本'}
  try{window.SitePoints&&SitePoints.answer(ok)}catch(e){}
  st.log.push([Date.now(),q.n,ok?1:0]);if(st.log.length>2000)st.log=st.log.slice(-2000);save();
  const right=C[S.ord.indexOf(q.a)];
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'✅ 答對了':'❌ 正確答案是 '+right}</b><span class="muted">${note}</span><div style="margin-top:6px">${esc(q.x)}</div></div>
  <div class="row" style="margin-top:12px"><button class="btn pri" id="nx" onclick="next()">${S.i+1<S.list.length?'下一題':'看結果'}</button><button class="btn" onclick="concept('${q.cid}')">回看這個觀念</button></div>`;
  $('#nx').focus()}
function next(){S.i++;if(S.i<S.list.length)return show();
  const n=S.list.length,p=Math.round(S.ok/n*100);$('#ttl').textContent='結果';try{window.SitePoints&&SitePoints.roundEnd(p)}catch(e){}
  app.innerHTML=`<div class="card" style="text-align:center"><div class="big">${S.ok} / ${n}</div><div class="muted">正確率 ${p}%</div>
  <p>${p===100?'🎉 全對！':p>=80?'很不錯，錯的題目明天再做一次。':'錯的題目已放進錯題本，先回看觀念重點再重做。'}</p></div>`+
  (S.wrong.length?`<div class="card"><b>這次錯的</b>`+S.wrong.map(q=>`<div style="margin-top:8px">${esc(q.q)}<div class="muted">正解：${esc(q.o[q.a])}</div></div>`).join('')+`</div>`:'')+
  `<div class="row">${S.wrong.length?`<button class="btn pri" onclick="run(shuffle(S.wrong),'錯的再做一次')">錯的馬上再做一次</button>`:''}<button class="btn" onclick="home()">回首頁</button></div>`;scrollTo(0,0)}
function resetAll(){if(!confirmReset)return;}
let confirmReset=false;
resetAll=function(){const b=event.target;if(!confirmReset){confirmReset=true;b.textContent='再按一次確認清除';setTimeout(()=>{confirmReset=false;b.textContent='清除練習紀錄'},3000);return}
  st.wb={};st.done={};st.log=[];save();confirmReset=false;home()}
document.addEventListener('keydown',e=>{if(!S||!document.querySelector('.opt'))return;const i='1234'.indexOf(e.key);
  if(i>=0&&!S.answered){const b=document.querySelectorAll('.opt')[i];b&&b.click()}else if(e.key==='Enter'&&S.answered){const n=$('#nx');n&&n.click()}});
home();
</script>
<script>
/* =====================================================================

(function () {
  "use strict";

  var LIVE = "https://iam5980.github.io/kids-practice/";
  function homeUrl() {

  /* ---------------- SitePoints ---------------- */
  var BADGES = [

    { id: "lit1",    icon: "🧩", name: "第一組素養題全對" },

  function kidFromPath() {
    var m = location.pathname.match(/\/kids-practice\/([a-z0-9]+)\//i);

    return m && m[1] !== "template" ? m[1] : null;
  }
  function today() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }

  }
  function save(kid, d) { try { localStorage.setItem("kp-points-" + kid, JSON.stringify(d)); } catch (e) {} }
  function dayStreak(days) {
    if (!days.length) return 0;
    var s = days.slice().sort(), n = 1;

    for (var i = s.length - 1; i > 0; i--) { if (dayDiff(s[i - 1], s[i]) === 1) n++; else break; }
    return n;
  }
  var kid = kidFromPath(), streak = 0;
  function toast(html, big) {

    setTimeout(function () { t.remove(); }, big ? 2700 : 1300);
  }
  function grant(d, id) {

  }
  function update(fn) {

  }
  /* 🎯 每日任務 — reset every day; each one gives +50 once */
  var QUESTS = [
    { id: "c20", icon: "✅", name: "今天答對 20 題", goal: 20, f: "correct" },

  function qDay(d) { var t = today(); if (!d.q || d.q.day !== t) d.q = { day: t, correct: 0, rounds: 0, streak: 0, done: {} }; }

  /* ---------------- 🔊 念解釋（ReadAloud）----------------

      speechSynthesis.speak(u);

  }
  function raScan() {
