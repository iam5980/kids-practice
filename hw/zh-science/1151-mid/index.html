<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>六上自然複習練功房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 自然科：水藍綠的溪流色＋珊瑚色重點；單欄、手機優先 */
:root{
  --paper:#f5fafa; --card:#ffffff; --ink:#152a2b; --muted:#54706f;
  --sage:#bfe0e2; --sage-deep:#1f6f73; --rose:#f7bfa8; --rose-deep:#c0562f;
  --line:#cfe2e3; --ok:#1f7a52; --bad:#b3362f; --okbg:#e0f3ea; --badbg:#fbe7e5;
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1818; --card:#172122; --ink:#e4efef; --muted:#9bb4b3;
  --sage:#234445; --sage-deep:#8ed2d6; --rose:#5a3326; --rose-deep:#f3a884;
  --line:#2a3b3c; --ok:#7fd2a8; --bad:#ff958c; --okbg:#1a3329; --badbg:#3a1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1818; --card:#172122; --ink:#e4efef; --muted:#9bb4b3;
  --sage:#234445; --sage-deep:#8ed2d6; --rose:#5a3326; --rose-deep:#f3a884;
  --line:#2a3b3c; --ok:#7fd2a8; --bad:#ff958c; --okbg:#1a3329; --badbg:#3a1f1d; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header h1{font-family:var(--kai);font-size:clamp(26px,7vw,36px);margin:0;line-height:1.2;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--rose-deep);outline-offset:2px}
.hdr{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.hdr>div{min-width:0}
.hdr #sfxBtn{flex:none;margin-top:6px}
.scope{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--paper);font-weight:700}
.chip.wrongchip[aria-pressed="true"]{background:var(--rose-deep);border-color:var(--rose-deep)}
.count{font-size:13px;color:var(--muted);margin-left:auto}
nav.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--sage);padding:4px;border-radius:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
nav.tabs button{border:0;background:transparent;border-radius:9px;padding:8px 0;font-size:clamp(12px,3.4vw,15px);font-weight:500;white-space:nowrap}
@media (max-width:620px){nav.tabs{grid-template-columns:repeat(4,1fr)}}
nav.tabs button[aria-selected="true"]{background:var(--card);font-weight:700;color:var(--sage-deep);box-shadow:0 1px 2px rgba(0,0,0,.12)}
section{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--sage-deep);background:var(--card);color:var(--sage-deep);border-radius:10px;padding:8px 16px;font-weight:700}
.btn.primary{background:var(--sage-deep);color:var(--paper)}
.btn.rose{border-color:var(--rose-deep);color:var(--rose-deep)}
.btn.rose.primary{background:var(--rose-deep);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:default}
.hint{color:var(--muted);font-size:14px;margin:0}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.kai{font-family:var(--kai)}
.modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cover{background:var(--sage);border-radius:6px;color:transparent;user-select:none;cursor:pointer;padding:0 6px}
.cover::after{content:"點我看";color:var(--sage-deep);font-size:13px}
.cover *{visibility:hidden}

/* 計時計分 */
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px}
.hud div{text-align:center;font-size:12px;color:var(--muted)}
.hud b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.hud .warn b{color:var(--bad)}
.timebar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.timebar i{display:block;height:100%;background:var(--sage-deep);transition:width .25s linear}
.timebar.warn i{background:var(--bad)}
.combo{text-align:center;font-family:var(--kai);font-size:22px;color:var(--rose-deep);min-height:1.4em}
.stars{font-size:34px;letter-spacing:4px;color:var(--rose-deep)}
.rhud{width:100%;display:flex;flex-direction:column;gap:4px}
.rrow{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.rrow b{color:var(--ink);font-size:17px}.rrow .cdw b{color:var(--bad)}
.plus{text-align:center;font-size:14px;font-weight:700;color:var(--rose-deep);min-height:1.3em}
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.rsum div{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:12px;color:var(--muted)}
.rsum b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}

/* 題目卡 */
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.qask{font-size:17px;margin:0;text-align:center}
.qbig{font-size:19px;line-height:1.7;text-align:left;width:100%}
.qtag{font-size:12px;color:var(--muted);align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.opts.one{grid-template-columns:1fr}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;display:flex;align-items:flex-start;gap:8px;min-height:52px;text-align:left;font-size:16px;line-height:1.5}
.opt .no{flex:none;font-size:18px;color:var(--sage-deep);font-weight:700}
.opt.tf{justify-content:center;align-items:center;font-size:28px;font-family:var(--kai);min-height:72px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt .mark{font-size:13px;font-weight:700;margin-left:auto;flex:none}
.opt.ok .mark{color:var(--ok)}.opt.bad .mark{color:var(--bad)}
.fb{border-radius:10px;padding:8px 12px;width:100%;font-size:15px;text-align:left}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.fb b{color:var(--ink)}
.fb .src{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.center{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

/* 概念卡 */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.cmini{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;font-family:var(--kai);font-size:17px;line-height:1.3}
.cmini.sel{border-color:var(--rose-deep);box-shadow:0 0 0 2px var(--rose-deep)}
.cdetail{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.cdetail .term{font-family:var(--kai);font-size:clamp(30px,8vw,42px);line-height:1.2}
.cdetail .dsc{font-size:17px;line-height:1.8}
.groupHead{font-family:var(--kai);font-size:18px;margin:6px 0 -2px;color:var(--sage-deep)}

/* 翻牌 */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{aspect-ratio:1;border-radius:12px;border:2px solid var(--sage-deep);background:var(--sage);display:grid;place-items:center;font-size:0;padding:6px;transition:transform .2s;overflow:hidden}
.mc.open,.mc.done{background:var(--card);font-size:14px}
.mc.done{border-color:var(--ok);opacity:.65}
.mc .term{font-family:var(--kai);font-size:clamp(17px,4.6vw,22px);font-weight:700;line-height:1.25}
.mc .dsc{font-size:clamp(11px,2.9vw,13px);line-height:1.35;color:var(--ink)}
.mc:not(.open):not(.done)::after{content:"?";font-size:28px;font-family:var(--kai);color:var(--sage-deep)}
.mc.pop{animation:pop .35s ease}
.mc.shake{animation:shake .35s ease}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.mc{transition:none}.mc.pop,.mc.shake{animation:none}}

/* 實驗步驟排序 */
.steps{display:flex;flex-direction:column;gap:8px;width:100%}
.step{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;text-align:left;font-size:15px;line-height:1.5;display:flex;gap:8px;align-items:flex-start;width:100%}
.step .no{flex:none;width:24px;height:24px;border-radius:50%;background:var(--sage);color:var(--sage-deep);font-size:13px;font-weight:700;display:grid;place-items:center}
.step.ok{border-color:var(--ok);background:var(--okbg)}
.step.ok .no{background:var(--ok);color:var(--paper)}
.step.bad{animation:shake .35s ease;border-color:var(--bad)}
@media (prefers-reduced-motion:reduce){.step.bad{animation:none}}

/* 結果、錯題 */
.done-box{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.score{font-family:var(--kai);font-size:44px;line-height:1;color:var(--sage-deep);font-variant-numeric:tabular-nums}
.wlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wz{font-family:var(--kai);font-size:20px;border:1.5px solid var(--rose-deep);border-radius:8px;padding:2px 8px;color:var(--rose-deep)}
table{border-collapse:collapse;width:100%;font-size:15px}
.tbl{overflow-x:auto;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}
td.q{white-space:normal;min-width:220px}
td.n{font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap}
.confirm{background:var(--badbg);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* 慶祝 */
#party{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 70%,transparent);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  --c1:#bfe3c6;--c2:#f2a7c0;--c3:#ffd36e;--c4:#a9cdf2;animation:fadein .25s ease}
#party.out{opacity:0;transition:opacity .3s}
@keyframes fadein{from{opacity:0}}
.party-card{position:relative;z-index:2;background:var(--card);border:2px solid var(--sage-deep);border-radius:20px;padding:18px 16px;text-align:center;max-width:380px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.dancers{display:flex;align-items:flex-end;justify-content:center;gap:4px}
.dancer{width:110px;height:auto}
.hundred{font-family:var(--kai);font-size:44px;font-weight:700;color:var(--rose-deep);align-self:center;animation:pulse .6s ease-in-out infinite alternate}
.d1{animation:bounce .5s ease-in-out infinite alternate;transform-origin:50% 100%}
.d2{animation:bounce .5s ease-in-out .25s infinite alternate;transform-origin:50% 100%}
.arm{transform-box:fill-box}
.d1 .al,.d2 .al{transform-origin:100% 100%;animation:wave .5s ease-in-out infinite alternate}
.d1 .ar,.d2 .ar{transform-origin:0 100%;animation:wave2 .5s ease-in-out infinite alternate}
.leg{transform-box:fill-box;transform-origin:50% 0}
.ll{animation:kick .5s ease-in-out infinite alternate}.lr{animation:kick .5s ease-in-out .25s infinite alternate}
@keyframes bounce{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg)}}
@keyframes wave{from{transform:rotate(18deg)}to{transform:rotate(-22deg)}}
@keyframes wave2{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
@keyframes kick{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.15)}}
.party-title{font-family:var(--kai);font-size:30px;font-weight:700;margin-top:6px}
.party-sub{color:var(--muted);margin:4px 0 12px}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{top:105%;transform:rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.d1,.d2,.arm,.leg,.hundred,.confetti i{animation:none!important}.confetti{display:none}}
[hidden]{display:none!important}
img{max-width:100%}

/* 圖表判讀：手繪 SVG 與資料表（固定淺色，深色模式也看得清楚）*/
.fig{width:100%;display:flex;justify-content:center;margin:2px 0}
.fig svg{display:block;border:1px solid #c9d6d8;border-radius:10px}
.dtab{border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:15px}
.dtab th,.dtab td{border:1px solid #c9d6d8;padding:6px 12px;text-align:center;color:#152a2b}
.dtab th{background:#dceef0;font-weight:700}
.ctx{width:100%;background:var(--paper);border:1.5px solid var(--line);border-left:5px solid var(--sage-deep);
  border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.8;text-align:left;font-family:var(--kai)}
/* 模擬考 */
.esec{width:100%;max-width:760px;margin:16px auto 0;font-family:var(--kai);font-size:20px;color:var(--sage-deep);
  border-bottom:2px solid var(--line);padding-bottom:4px}
.ecard{margin-top:10px}
.ehud{position:sticky;top:0;z-index:5;background:var(--card);border:1.5px solid var(--line);border-radius:999px;
  padding:6px 14px;font-size:14px;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.epts{font-size:12px;color:var(--rose-deep);border:1px solid var(--rose);border-radius:999px;padding:1px 8px;margin-left:6px}
.opt[aria-pressed="true"]{border-color:var(--sage-deep);background:var(--sage);font-weight:700}
.ewarn{color:var(--bad);font-size:15px}
</style>
</head>
<body>

<div class="wrap">
  <header class="hdr">
    <div><h1>六上自然複習練功房</h1>
    <p>期中考・單元一 探索天氣的變化＋單元二 水溶液：選擇是非、概念卡、翻牌、實驗步驟與變因、分類、因果、圖表判讀、素養題，還有一份 100 分模擬考</p></div>
    <button class="chip" id="sfxBtn" aria-pressed="true">音效：開</button>
  </header>

  <div class="scope" id="scope" aria-label="練習範圍"></div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="quiz" aria-selected="true">練習題</button>
    <button role="tab" data-tab="cards" aria-selected="false">概念卡</button>
    <button role="tab" data-tab="mem" aria-selected="false">翻牌</button>
    <button role="tab" data-tab="exp" aria-selected="false">實驗</button>
    <button role="tab" data-tab="sort" aria-selected="false">分類</button>
    <button role="tab" data-tab="pair" aria-selected="false">配對</button>
    <button role="tab" data-tab="chart" aria-selected="false">圖表</button>
    <button role="tab" data-tab="lit" aria-selected="false">素養</button>
    <button role="tab" data-tab="exam" aria-selected="false">模擬考</button>
    <button role="tab" data-tab="wrong" aria-selected="false">錯題</button>
  </nav>

  <section id="tab-quiz"><div id="quizArea"></div></section>
  <section id="tab-cards" hidden>
    <div class="bar"><button class="btn" id="selfTest" aria-pressed="false">考自己：遮住說明</button></div>
    <div class="cdetail" id="cDetail"></div>
    <div id="cardGrid"></div>
    <p class="hint">概念卡的說明都來自課本重點整理。點「考自己」可以把說明遮起來，先自己想一遍再看答案。</p>
  </section>
  <section id="tab-mem" hidden><div id="memArea"></div></section>
  <section id="tab-exp" hidden><div id="expArea"></div></section>
  <section id="tab-sort" hidden><div id="sortArea"></div></section>
  <section id="tab-pair" hidden><div id="pairArea"></div></section>
  <section id="tab-chart" hidden><div id="chartArea"></div></section>
  <section id="tab-lit" hidden><div id="litArea"></div></section>
  <section id="tab-exam" hidden><div id="examArea"></div></section>
  <section id="tab-wrong" hidden><div id="wrongArea"></div></section>
</div>

<script>
/* ===== 題庫資料：答案全部來自教用版印刷答案（重點整理、隨堂練習、月考A/B卷、期中考A/B卷、素養學習單）===== */
/* ===== 題庫資料：答案全部來自教用版印刷答案 ===== */
/* 題庫 A：單元一 探索天氣的變化
   g: 1-1 天氣變化的主角 / 1-2 預測天氣變化 / 1-3 氣候正在改變嗎
   t: tf（是非，a:0=○對 1=╳錯）/ mc（選擇，a 為正解索引）
   s: 出處 */
const QB1=[
/* ── 重點整理 活動一（教用）是非 ── */
{g:'1-1',t:'tf',q:'爬山的時候，有時在步道周圍會看見白茫茫的一片，且沾到衣服上會溼溼的，這是霧。',a:0,s:'重點整理1-1',e:'霧是水蒸氣在地面附近凝結成的小水滴。'},
{g:'1-1',t:'tf',q:'露和霜都是水蒸氣變成的，雖然形成時的環境氣溫不同，但形態都是液態。',a:1,s:'重點整理1-1',e:'露是液態的小水滴，霜是固態的冰晶。'},
{g:'1-1',t:'tf',q:'雲中的小水滴或冰晶聚集變大後會往下掉落，如果在掉落的過程中融化，就是下雪。',a:1,s:'重點整理1-1',e:'掉落過程中融化成水是下雨；沒有融化才是下雪。'},
{g:'1-1',t:'tf',q:'地球上的海洋面積大，能夠吸收大部分的太陽輻射並儲存大量熱能，對地球氣溫的調節有很大的作用。',a:0,s:'重點整理1-1',e:'海面溫度變化比陸地小，所以海洋可以調節氣溫。'},
/* ── 重點整理 活動一（教用）選擇 ── */
{g:'1-1',t:'mc',q:'小妍和家人到山上露營，隔天清晨他發現樹葉上面有許多小水珠，請問這些小水珠可能是什麼？',o:['雪','霜','霧','露'],a:3,s:'重點整理1-1',e:'氣溫夠低時，水蒸氣附著在較冷的物體表面凝結成小水滴，就是露。'},

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const hash=s=>{let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return (h>>>0).toString(36)};
const NUM=['①','②','③','④','⑤','⑥'];

/* ===== 音效（Web Audio 合成，不需下載音檔）===== */
let sfxOn=load('sci6-sfx',true),actx=null;
function tone(seq){
  if(!sfxOn)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    let t=actx.currentTime+0.01;
    seq.forEach(([f,d,type,v])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.16,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+0.03);t+=d*0.8});
  }catch(e){}
}
const SFX={
  ok:()=>tone([[659,.12],[880,.12],[1175,.25]]),
  bad:()=>tone([[311,.18,'triangle',.14],[233,.32,'triangle',.14]]),
  flip:()=>tone([[540,.05,'triangle',.07]]),
  match:()=>tone([[784,.09],[1047,.2]]),
  combo:()=>tone([[784,.08],[988,.08],[1319,.22]]),
  tick:()=>tone([[1250,.04,'square',.035]]),
  win:()=>tone([[523,.13],[659,.13],[784,.13],[1047,.13],[784,.1],[1047,.4]]),
  lose:()=>tone([[392,.2,'triangle'],[330,.2,'triangle'],[262,.45,'triangle']])
};
function renderSfx(){const b=$('#sfxBtn');b.setAttribute('aria-pressed',sfxOn);b.textContent='音效：'+(sfxOn?'開':'關')}
$('#sfxBtn').onclick=()=>{sfxOn=!sfxOn;save('sci6-sfx',sfxOn);renderSfx();if(sfxOn)SFX.ok()};
renderSfx();

let tmode=load('sci6-tmode','up'),rt=null;const QLIM=15;
const rmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
const timeChips=()=>`<div class="modes"><button class="chip" data-tm="up" aria-pressed="${tmode==='up'}">計時計分</button><button class="chip" data-tm="cd" aria-pressed="${tmode==='cd'}">每題 ${QLIM} 秒倒數</button></div>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-tm]');if(!b)return;tmode=b.dataset.tm;save('sci6-tmode',tmode);document.querySelectorAll('[data-tm]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.tm===tmode))});
function rtStart(key){rt={key,t0:Date.now(),score:0,streak:0,best:0,ok:0,n:0,qT:Date.now(),onTimeout:null,last:'',lastTick:-1,done:false}}
function rtQ(onTimeout){if(!rt)return;rt.qT=Date.now();rt.onTimeout=(tmode==='cd'&&onTimeout)?onTimeout:null;rt.lastTick=-1;rtTick()}
function rtAns(right){
  if(!rt)return 0;rt.n++;rt.onTimeout=null;let pts=0;
  if(right){rt.ok++;rt.streak++;rt.best=Math.max(rt.best,rt.streak);const sec=(Date.now()-rt.qT)/1000;
    const sp=Math.round(50*Math.max(0,Math.min(1,1-(sec-3)/12))),cb=Math.min(5,rt.streak-1)*10;pts=100+sp+cb;rt.score+=pts;
    rt.last=`＋${pts}${sp?`（快答 ＋${sp}）`:''}${rt.streak>1?`・${rt.streak} 連對`:''}`}
  else{rt.streak=0;rt.last='連對中斷'}
  rtTick();return pts;
}
function rtTick(){
  if(!rt||rt.done)return;
  const now=Date.now(),el=(now-rt.t0)/1000;
  let cd='';
  if(rt.onTimeout){const left=QLIM-(now-rt.qT)/1000,c=Math.ceil(left);
    if(c<=3&&c>0&&c!==rt.lastTick){rt.lastTick=c;SFX.tick()}
    cd=`<div class="timebar${left<=5?' warn':''}"><i style="width:${Math.max(0,left/QLIM*100)}%"></i></div>`;
    if(left<=0){const f=rt.onTimeout;rt.onTimeout=null;f();return}}
  document.querySelectorAll('.rhud').forEach(h=>{const sec=h.closest('section');if(sec&&sec.hidden)return;
    h.innerHTML=`<div class="rrow"><span>時間 <b>${rmt(el)}</b></span><span>分數 <b>${rt.score}</b></span><span>連對 <b>${rt.streak}</b></span>${rt.onTimeout?`<span class="cdw">剩 <b>${Math.max(0,Math.ceil(QLIM-(now-rt.qT)/1000))}</b> 秒</span>`:''}</div>${cd}<div class="plus">${rt.last}</div>`})
}
setInterval(rtTick,250);
function rtEnd(label){
  if(!rt)return '';
  rt.done=true;rt.onTimeout=null;const el=(Date.now()-rt.t0)/1000,acc=rt.n?Math.round(rt.ok/rt.n*100):0;
  const key='sci6-rbest-'+rt.key+(label||''),best=load(key,null),rec=!best||rt.score>best.sc;
  if(rec&&rt.n)save(key,{sc:rt.score,t:el});
  return `<div class="rsum"><div><b>${rt.score}</b>分數</div><div><b>${rmt(el)}</b>用時</div><div><b>${acc}%</b>正確率</div><div><b>${rt.best}</b>最高連對</div></div>
   <p class="qask">${rec&&rt.n?'<b style="color:var(--rose-deep)">新紀錄！</b>':`這一關最佳紀錄：${best?best.sc:0} 分`}</p>`;
}

   (n?`<button class="chip wrongchip" data-g="wrong" aria-pressed="${st.onlyWrong}">只練錯題（${n}）</button>`:'')+

let qz=null;
function qzStart(cfg){qz=Object.assign({i:0,ok:0,bad:[]},cfg);rtStart(cfg.key);qzQ()}
function qzQ(){
  const x=qz.items[qz.i],long=x.o.some(s=>s.length>8);
  $(qz.area).innerHTML=`<div class="qcard"><div class="rhud"></div>
   ${x.tag?`<span class="qtag">${esc(x.tag)}</span>`:''}
   ${x.fig?`<div class="fig">${x.fig}</div>`:''}
   ${x.ctx?`<div class="ctx">${esc(x.ctx)}</div>`:''}
   <p class="qbig">${qz.i+1}. ${esc(x.q)}</p>
   <div class="opts${x.tf?'':(long?' one':'')}">${x.o.map((o,i)=>`<button class="opt${x.tf?' tf':''}" data-k="${i}">${x.tf?'':`<span class="no">${NUM[i]}</span>`}<span>${esc(o)}</span></button>`).join('')}</div>
   <div class="prog">第 ${qz.i+1} / ${qz.items.length} 題${qz.i?`・已對 ${qz.ok} 題`:''}</div></div>`;
  document.querySelectorAll(qz.area+' .opt').forEach(b=>b.onclick=()=>qzPick(+b.dataset.k));
  rtQ(()=>qzPick(-1));
}
const ansTxt=x=>x.tf?(x.a?'╳ 錯':'○ 對'):NUM[x.a]+' '+x.o[x.a];
function qzPick(k){
  const x=qz.items[qz.i],right=k===x.a;
  document.querySelectorAll(qz.area+' .opt').forEach(b=>{b.disabled=true;const i=+b.dataset.k;
    if(i===x.a)b.classList.add('ok'),b.insertAdjacentHTML('beforeend','<span class="mark">正解</span>');
    else if(i===k)b.classList.add('bad'),b.insertAdjacentHTML('beforeend','<span class="mark">你選的</span>')});
  rtAns(right);
  if(right){qz.ok++;SFX.ok()}else{qz.bad.push(x);SFX.bad();addWrong(qz.mod,x.q,ansTxt(x),x.s||'',x.g)}
  const fb=document.createElement('div');fb.className='fb '+(right?'ok':'bad');
  fb.innerHTML=`<b>${right?'答對了！':(k<0?'時間到：':'正確答案是 ')}${right?'':esc(ansTxt(x))}</b>${x.e?'<br>'+esc(x.e):''}${x.s?`<span class="src">出處：${esc(x.s)}</span>`:''}`;
  const card=document.querySelector(qz.area+' .qcard');card.appendChild(fb);
  const nb=document.createElement('button');nb.className='btn primary';nb.textContent=qz.i+1<qz.items.length?'下一題':'看成績';
  card.appendChild(nb);nb.onclick=()=>{qz.i++;qz.i<qz.items.length?qzQ():qzEnd()};nb.focus();
}
function qzEnd(){
  const n=qz.items.length,full=qz.ok===n;

function memIntro(){

function memDeal(){

  const cards=shuffle(pick.flatMap(x=>[{id:x.k,t:'c',x},{id:x.k,t:'a',x}]));
  const limit=memMode==='down'?(memSize===6?90:120):0;
  mm={cards,open:[],done:0,moves:0,n:pick.length,lock:false,score:0,combo:0,maxCombo:0,start:0,el:0,limit,over:false,timer:null,lastTick:-1,msg:''};

function memStartClock(){

  mm.timer=setInterval(()=>{mm.el=(Date.now()-mm.start)/1000;
    if(mm.limit){const left=Math.ceil(mm.limit-mm.el);if(left<=10&&left>0&&left!==mm.lastTick){mm.lastTick=left;SFX.tick()}
      if(mm.el>=mm.limit){mm.el=mm.limit;memEnd(false);return}}

}
function memHud(){
  const h=$('#mHud');if(!h)return;
  const left=mm.limit?Math.max(0,mm.limit-mm.el):0,warn=mm.limit&&left<=10;
  h.innerHTML=`<div class="${warn?'warn':''}">${mm.limit?'剩下':'時間'}<b>${mmt(mm.limit?Math.ceil(left):mm.el)}</b></div><div>翻牌<b>${mm.moves}</b></div><div>配對<b>${mm.done}/${mm.n}</b></div><div>分數<b>${mm.score}</b></div>`;
  const tb=$('#mBar');if(tb){tb.classList.toggle('warn',!!warn);tb.firstElementChild.style.width=(mm.limit?left/mm.limit*100:mm.done/mm.n*100)+'%'}
}
const memFace=c=>c.t==='c'?`<span class="term">${esc(c.x.k)}</span>`:`<span class="dsc">${esc(c.x.d)}</span>`;
function memRender(fx){
  $('#memArea').innerHTML=`<div class="hud" id="mHud"></div><div class="timebar" id="mBar"><i></i></div>
   <div class="combo" id="mCombo">${mm.msg}</div>
   <div class="mem">${mm.cards.map((c,i)=>`<button class="mc${c.open?' open':''}${c.done?' done':''}${fx&&fx.idx.includes(i)?' '+fx.cls:''}" data-i="${i}" aria-label="${c.open||c.done?'已翻開':'蓋著的牌'}">${c.open||c.done?memFace(c):''}</button>`).join('')}</div>
   <div class="center"><button class="btn" id="mNew">重新發牌</button><button class="btn" id="mBack">換關卡</button></div>
   <div id="mMsg"></div>`;
  memHud();

}
function memFlip(i){
  const c=mm.cards[i];if(mm.over||mm.lock||c.open||c.done)return;
  memStartClock();SFX.flip();
  c.open=true;mm.open.push(c);
  if(mm.open.length===2){mm.moves++;const [a,b]=mm.open,ia=mm.cards.indexOf(a),ib=mm.cards.indexOf(b);
    if(a.id===b.id&&a.t!==b.t){
      a.done=b.done=true;a.open=b.open=false;mm.done++;mm.open=[];mm.combo++;mm.maxCombo=Math.max(mm.maxCombo,mm.combo);
      const add=100+(mm.combo-1)*50;mm.score+=add;
      mm.msg=mm.combo>1?`${mm.combo} 連擊！＋${add}`:`配對成功 ＋${add}`;
      mm.combo>1?SFX.combo():SFX.match();
      memRender({idx:[ia,ib],cls:'pop'});
      if(mm.done===mm.n)memEnd(true);
    }else{
      mm.combo=0;mm.msg='';mm.lock=true;memRender({idx:[ia,ib],cls:'shake'});
      setTimeout(()=>{if(mm.over)return;a.open=b.open=false;mm.open=[];mm.lock=false;memRender()},900);
    }
  }else memRender();
}
function memEnd(win){
  mm.over=true;clearInterval(mm.timer);mm.timer=null;
  if(mm.start)mm.el=Math.min(mm.limit||1e9,(Date.now()-mm.start)/1000);
  let bonus=0;if(win&&mm.limit)bonus=Math.ceil(mm.limit-mm.el)*10;mm.score+=bonus;
  memHud();
  if(!win){SFX.lose();
    const left=[...new Set(mm.cards.filter(c=>!c.done).map(c=>c.x))];
    mm.cards.forEach(c=>{if(!c.done)c.open=true});memRender();
    $('#mMsg').innerHTML=`<div class="done-box"><div class="score">時間到！</div><p class="qask">配了 ${mm.done} / ${mm.n} 對，得 ${mm.score} 分。還沒配到的：</p>
      <div class="wlist">${left.map(x=>`<span class="wz">${esc(x.k)}</span>`).join('')}</div>
      <button class="btn primary" id="mAgain">再挑戰一次</button></div>`;
    $('#mAgain').onclick=memDeal;return;
  }
  const stars=mm.moves<=mm.n+2?3:mm.moves<=Math.ceil(mm.n*1.7)?2:1;
  const key=memKey(),best=load(key,null);let rec=false;
  if(mm.limit){if(!best||mm.score>best.sc){save(key,{sc:mm.score});rec=true}}
  else{if(!best||mm.el<best.t){save(key,{t:mm.el,mv:mm.moves});rec=true}}
  setTimeout(()=>stars===3?celebrate('三顆星過關！'):SFX.win(),250);
  $('#mMsg').innerHTML=`<div class="done-box"><div class="stars" aria-label="${stars} 顆星">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div class="score">${mm.score} 分</div>
    <p class="qask">用了 ${mmt(mm.el)}、翻 ${mm.moves} 次、最高 ${mm.maxCombo} 連擊${bonus?`，剩餘時間加分 ＋${bonus}`:''}。</p>
    ${rec?'<p class="qask" style="color:var(--rose-deep)"><b>🏆 新紀錄！</b></p>':''}
    <div class="center"><button class="btn primary" id="mAgain">再玩一局</button><button class="btn" id="mBack2">換關卡</button></div></div>`;
  $('#mAgain').onclick=memDeal;$('#mBack2').onclick=memIntro;
}

function expSeqStart(sets){rtStart('expseq');ex={sets:shuffle(sets),i:0,perfect:0};expSeqQ()}
function expSeqQ(){

function expSeqRender(fx){
  const c=ex.cur,s=c.s,n=s.steps.length;
  $('#expArea').innerHTML=`<div class="qcard"><div class="rhud"></div>
   <span class="qtag">${esc(s.g)}・${esc(s.s)}</span>
   <p class="qbig">${esc(s.t)}：請依正確順序點選（第 ${c.placed.length+1} / ${n} 步）</p>
   <div class="steps">${c.order.map((t,i)=>{const pi=c.placed.indexOf(t);
     return `<button class="step${pi>=0?' ok':''}${fx===i?' bad':''}" data-i="${i}"${pi>=0?' disabled':''}><span class="no">${pi>=0?pi+1:'?'}</span><span>${esc(t)}</span></button>`}).join('')}</div>

  $('#xBack').onclick=expIntro;
}
function expSeqTap(i){
  const c=ex.cur,t=c.order[i],want=c.s.steps[c.placed.length];

    if(c.placed.length===c.s.steps.length){
      const perfect=c.mis===0;rtAns(perfect);if(perfect)ex.perfect++;
      else addWrong('實驗步驟',`${c.s.t}（${c.s.g}）的正確步驟順序`,c.s.steps.map((x,k)=>`${k+1}.${x}`).join('　'),c.s.s,c.s.g);
      expSeqRender();
      const card=$('#expArea .qcard'),fb=document.createElement('div');
      fb.className='fb '+(perfect?'ok':'bad');
      fb.innerHTML=`<b>${perfect?'順序全對，一次就排好！':`排好了，但中間點錯 ${c.mis} 次。`}</b><br>${c.s.steps.map((x,k)=>`${k+1}. ${esc(x)}`).join('<br>')}<span class="src">出處：${esc(c.s.s)}</span>`;

function pairItems(){
  const p=CAUSE.filter(inScope);if(p.length<4)return [];
  const out=p.map(x=>{
    const r2c=Math.random()<0.5;
    const key=r2c?'c':'r',ask=r2c?'r':'c';
    let pool=p.filter(y=>y!==x&&y.g===x.g&&y[key]!==x[key]);
    if(pool.length<3)pool=p.filter(y=>y!==x&&y[key]!==x[key]);
    const seen=new Set([x[key]]),ds=[];
    for(const y of shuffle(pool)){if(seen.has(y[key]))continue;seen.add(y[key]);ds.push(y[key]);if(ds.length===3)break}
    const o=shuffle([x[key],...ds]);
    return {q:r2c?`「${x.r}」最可能是下列哪一個原因造成的？`:`「${x.c}」會造成下列哪一個結果？`,
      o,a:o.indexOf(x[key]),g:x.g,s:'課本・重點歸納',
      e:`${x.c} → ${x.r}`,tag:'因果配對・'+x.g};

  return st.onlyWrong?out.filter(x=>isWrong(x.q)):out;
}

/* ===== 模擬考：交卷後才公布答案和分數 ===== */
let ek=null;
const EX_TF=10,EX_MC=10,EX_HI=8;
function examBuild(){
  const out=[];
  shuffle(QB.filter(x=>x.t==='tf')).slice(0,EX_TF).map(toQ).forEach(q=>out.push({q,pt:3,sec:'一、是非題'}));
  shuffle(QB.filter(x=>x.t==='mc')).slice(0,EX_MC).map(toQ).forEach(q=>out.push({q,pt:3,sec:'二、選擇題'}));
  shuffle(LIT.concat(CHART)).slice(0,EX_HI)
    .map(x=>Object.assign({},x,{tag:(x.fig?'圖表判讀・':'素養題・')+x.g}))
    .forEach(q=>out.push({q,pt:5,sec:'三、圖表與素養題'}));
  return out;
}
function examIntro(){
  const best=load('sci6-exam-best',null);
  $('#examArea').innerHTML=`<div class="qcard">
   <p class="qask">模擬考的題型和學校的期中考卷一樣：<b>是非題 ${EX_TF} 題（每題 3 分）、選擇題 ${EX_MC} 題（每題 3 分）、圖表與素養題 ${EX_HI} 題（每題 5 分），滿分 100 分</b>。</p>
   <p class="hint">模擬考<b>不會馬上公布答案</b>，整份寫完按「交卷」才會出現分數和詳解，中途可以回頭改答案。題目從整個期中考範圍（單元一＋單元二）隨機抽出，上面的課次按鈕這一關不作用。</p>
   ${best!=null?`<p class="hint">這台裝置最高分：<b>${best} 分</b></p>`:''}
   <button class="btn primary" id="eGo">開始模擬考</button></div>`;
  $('#eGo').onclick=examStart;
}
function examStart(){
  if(ek&&ek.timer)clearInterval(ek.timer);
  ek={items:examBuild(),ans:{},t0:Date.now(),done:false,timer:null,warn:false};
  examRender();
  ek.timer=setInterval(examHud,1000);
}
function examHud(){
  const h=$('#eHud');if(!h||!ek)return;
  const t=Math.floor((Date.now()-ek.t0)/1000),n=Object.keys(ek.ans).length;
  h.textContent=ek.done?`已交卷・用時 ${rmt(t)}`:`已作答 ${n} / ${ek.items.length} 題・用時 ${rmt(t)}`;
}
function examRender(){
  let last='';
  const body=ek.items.map((it,i)=>{
    const q=it.q,head=it.sec!==last?`<h3 class="esec">${it.sec}（每題 ${it.pt} 分）</h3>`:'';
    last=it.sec;
    const long=q.o.some(s=>s.length>8);
    return head+`<div class="qcard ecard" id="eq${i}">
     <span class="qtag">${esc(q.tag||'')}<span class="epts">${it.pt} 分</span></span>
     ${q.fig?`<div class="fig">${q.fig}</div>`:''}
     ${q.ctx?`<div class="ctx">${esc(q.ctx)}</div>`:''}
     <p class="qbig">${i+1}. ${esc(q.q)}</p>
     <div class="opts${q.tf?'':(long?' one':'')}">${q.o.map((o,k)=>`<button class="opt${q.tf?' tf':''}" aria-pressed="false" data-q="${i}" data-k="${k}">${q.tf?'':`<span class="no">${NUM[k]}</span>`}<span>${esc(o)}</span></button>`).join('')}</div>
    </div>`;
  }).join('');
  $('#examArea').innerHTML=`<div class="ehud" id="eHud"></div>${body}
   <div class="done-box" id="eFoot"><div class="center"><button class="btn primary" id="eSubmit">交卷</button><button class="btn" id="eQuit">離開模擬考</button></div><div id="eWarn"></div></div>`;
  document.querySelectorAll('#examArea .opt').forEach(b=>b.onclick=()=>examPick(+b.dataset.q,+b.dataset.k));
  $('#eSubmit').onclick=examSubmit;
  $('#eQuit').onclick=()=>{if(ek&&ek.timer)clearInterval(ek.timer);ek=null;examIntro()};
  examHud();
}
function examPick(i,k){
  if(!ek||ek.done)return;
  ek.ans[i]=k;SFX.tick&&SFX.tick();
  document.querySelectorAll(`#eq${i} .opt`).forEach(b=>b.setAttribute('aria-pressed',+b.dataset.k===k));
  examHud();
}
function examSubmit(){
  if(!ek||ek.done)return;
  const miss=ek.items.map((x,i)=>i).filter(i=>!(i in ek.ans));
  if(miss.length&&!ek.warn){
    ek.warn=true;
    $('#eWarn').innerHTML=`<p class="ewarn">還有 ${miss.length} 題沒有作答（第 ${miss.map(i=>i+1).join('、')} 題）。沒寫的算錯喔，確定要交卷嗎？</p>
     <div class="center"><button class="btn rose primary" id="eYes">確定交卷</button><button class="btn" id="eNo">回去寫完</button></div>`;
    $('#eYes').onclick=()=>{$('#eWarn').innerHTML='';examSubmit()};
    $('#eNo').onclick=()=>{ek.warn=false;$('#eWarn').innerHTML='';const f=document.getElementById('eq'+miss[0]);if(f&&f.scrollIntoView)f.scrollIntoView({block:'center'})};
    return;
  }
  ek.done=true;if(ek.timer){clearInterval(ek.timer);ek.timer=null}
  let score=0,ok=0;
  ek.items.forEach((it,i)=>{
    const q=it.q,k=(i in ek.ans)?ek.ans[i]:-1,right=k===q.a;
    if(right){score+=it.pt;ok++}else addWrong('模擬考',q.q,ansTxt(q),q.s||'',q.g);
    document.querySelectorAll(`#eq${i} .opt`).forEach(b=>{b.disabled=true;const j=+b.dataset.k;
      if(j===q.a){b.classList.add('ok');b.insertAdjacentHTML('beforeend','<span class="mark">正解</span>')}
      else if(j===k){b.classList.add('bad');b.insertAdjacentHTML('beforeend','<span class="mark">你選的</span>')}});
    const card=document.getElementById('eq'+i),fb=document.createElement('div');
    fb.className='fb '+(right?'ok':'bad');
    fb.innerHTML=`<b>${right?`答對，得 ${it.pt} 分`:(k<0?'沒有作答，正確答案是 ':'答錯了，正確答案是 ')+(right?'':esc(ansTxt(q)))}</b>${q.e?'<br>'+esc(q.e):''}${q.s?`<span class="src">出處：${esc(q.s)}</span>`:''}`;
    card.appendChild(fb);
  });
  const t=Math.floor((Date.now()-ek.t0)/1000),n=ek.items.length;
  const best=load('sci6-exam-best',null),nb=(best==null||score>best);
  if(nb)save('sci6-exam-best',score);
  const lv=score===100?'滿分！真的很厲害':score>=90?'非常好，再補幾個小地方就完美了':score>=80?'不錯，答錯的再看一次就好':score>=60?'及格了，錯題本要多練幾次':'先把錯題本和概念卡讀一遍，再考一次';
  $('#eFoot').outerHTML=`<div class="done-box" id="eFoot"><div class="score">${score} 分</div>
   <p class="qask">答對 ${ok} / ${n} 題・用時 ${rmt(t)}${nb?'・<b>新紀錄！</b>':(best!=null?`・最高分 ${best} 分`:'')}</p>
   <p class="hint">${lv}。答錯的題目都已經記進錯題本，上面每一題下面都有詳解和出處。</p>
   <div class="center"><button class="btn primary" id="eAgain">再考一份</button><button class="btn" id="eWrong">去看錯題本</button><button class="btn" id="eOut">離開模擬考</button></div></div>`;
  $('#eAgain').onclick=examStart;
  $('#eWrong').onclick=()=>document.querySelector('[data-tab="wrong"]').click();
  $('#eOut').onclick=()=>{ek=null;examIntro()};
  examHud();
  if(score===100)setTimeout(()=>celebrate('模擬考 100 分！'),300);else SFX.lose();
  const top=$('#examArea .ehud');if(top&&top.scrollIntoView)top.scrollIntoView({block:'start'});
}

   :`<div class="done-box"><p class="qask">錯題本是空的。</p><p class="hint">在「練習題」「實驗」「分類」「配對」「圖表」「素養」和「模擬考」答錯的題目都會自動記到這裡。</p></div>`;

  var b = document.createElement("button");
  b.id = "sh-btn"; b.type = "button";
  b.setAttribute("aria-label", "回到練習小站"); b.title = "回到練習小站";
  b.textContent = "📚 小站";
  b.addEventListener("click", function () {
    if (document.getElementById("sh-mask")) return;
    var m = document.createElement("div"); m.id = "sh-mask";
    m.innerHTML = '<div id="sh-card" role="dialog" aria-modal="true"><h3>📚 回到練習小站？</h3>' +
      '<p>這一輪的作答不會保留（最高分紀錄會留著）。</p>' +
      '<button id="sh-go" type="button">回到練習小站</button><button id="sh-stay" type="button">繼續練習</button></div>';
    document.body.appendChild(m);
    function close() { m.remove(); }
    m.addEventListener("click", function (e) { if (e.target === m) close(); });
    document.getElementById("sh-stay").addEventListener("click", close);
    document.getElementById("sh-go").addEventListener("click", function () {
      try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
      location.href = homeUrl();
    });
    document.getElementById("sh-go").focus();
  });
  document.body.appendChild(b);
})();
</script>
</body>
</html>
