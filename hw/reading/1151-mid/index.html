<style>
:root{--bg:#f0f4ff;--surface:#fff;--raised:#f8f9ff;--border:#c5cae9;--fg:#1a237e;--muted:#5c6bc0;--navy:#1565c0;--accent:#1976d2;--chip:#e3f2fd;--chipfg:#0d47a1;--correct:#2e7d32;--wrong:#c62828;--gold:#f57f17;--purple:#6a1b9a;color-scheme:light}

:root[data-theme="dark"]{--bg:#0d1117;--surface:#161b2e;--raised:#1e2440;--border:#2e3560;--fg:#e8eaf6;--muted:#9fa8da;--navy:#90caf9;--accent:#64b5f6;--chip:#1e2a4a;--chipfg:#90caf9;--correct:#81c784;--wrong:#ef9a9a;--gold:#ffd54f;--purple:#ce93d8;color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:'Nunito',sans-serif;font-size:16px}
#home{display:block}

.themeBtn{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:20px;padding:6px 14px;font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer}
.unlock{background:#fff8e1;border:2px solid #f9a825;border-radius:12px;padding:14px;margin:16px;text-align:center;display:none}
.unlock p{color:#e65100;font-weight:800;margin-bottom:8px}

.zone{margin-bottom:28px}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.choice.selected{border-color:var(--accent);background:var(--chip)}

<script>
/* ── THEME ── */
(function(){
  const saved = localStorage.getItem('theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
})();
document.getElementById('themeToggle').addEventListener('click', function(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  this.textContent = next === 'dark' ? '☀️ Light' : '🌙 Dark';
});

/* ── TTS ── */
let _voices = [];
function _loadVoices(){ const v=window.speechSynthesis.getVoices(); if(v.length) _voices=v; }
window.speechSynthesis.addEventListener('voiceschanged', _loadVoices);
_loadVoices(); setTimeout(_loadVoices,500); setTimeout(_loadVoices,1500);

function bestVoice(){
  const vv=_voices.length?_voices:window.speechSynthesis.getVoices();
  const tests=[
    v=>v.name==='Samantha',v=>v.name==='Karen',v=>v.name==='Daniel',
    v=>v.name.includes('Google US English'),v=>v.name.includes('Google UK English'),
    v=>v.lang==='en-US'&&v.localService,v=>v.lang==='en-GB'&&v.localService,
    v=>v.lang.startsWith('en')&&v.localService,v=>v.lang.startsWith('en')
  ];
  for(const t of tests){ const m=vv.find(t); if(m) return m; }
  return null;
}
function speak(text){
  window.speechSynthesis.cancel();
  if(!_voices.length) _voices=window.speechSynthesis.getVoices();
  const u=new SpeechSynthesisUtterance(text);
  const v=bestVoice(); if(v) u.voice=v;
  u.lang='en-US'; u.rate=0.88; u.pitch=1.0;
  window.speechSynthesis.speak(u);
}

/* iOS unlock */
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(isIOS) document.getElementById('unlockBar').style.display='block';
document.getElementById('unlockBtn').addEventListener('click',function(){
  speak('Voice enabled');
  const bar=document.getElementById('unlockBar');
  bar.style.borderColor='#81c784';
  bar.querySelector('p').textContent='✅ Voice enabled!';
  this.style.display='none';
  setTimeout(()=>{ bar.style.display='none'; },1500);
});

/* ── SHUFFLE ── */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

    oral:'🗣️ Oral Must-Know',mock:'🎯 Full Mock Exam'
  };

  if(type==='mock') pool=shuffle(BANK).slice(0,30);

  else if(type==='yeller') pool=shuffle(BANK.filter(q=>q.st==='yeller'));
  else pool=shuffle(BANK.filter(q=>q.ty===type));

  renderQ();
}

/* ── RENDER QUESTION ── */
function renderQ(){
  const cont=document.getElementById('panelInner');

  const choices=shuffle(q.choices);
  let html='';
  if(isMock) html+=`<button class="newSetBtn" id="newSetBtn">🔀 New Random Set</button>`;
  html+=`<div class="qCard">
    <div class="qNum">Question ${drillIdx+1} / ${drillQ.length}</div>
    <div class="qText" id="qText">${q.q}</div>
    <button class="speakBtn" id="speakQBtn">🔊 Hear Question</button>
    <div class="choices" id="choices">
      ${choices.map((c,ci)=>`<button class="choice" data-c="${ci}" data-val="${c}">${c}</button>`).join('')}
    </div>
    <div>
      <button class="checkBtn" id="checkBtn">Check Answer</button>
      <button class="nextBtn" id="nextBtn">${drillIdx+1<drillQ.length?'Next →':'Finish!'}</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>`;
  cont.innerHTML=html;
  if(isMock) document.getElementById('newSetBtn').addEventListener('click',()=>startDrill('mock'));
  document.getElementById('speakQBtn').addEventListener('click',()=>speak(q.q));
  document.querySelectorAll('.choice').forEach(btn=>{
    btn.addEventListener('click',function(){
      if(this.disabled) return;
      document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));
      this.classList.add('selected');
    });
  });
  document.getElementById('checkBtn').addEventListener('click',()=>checkAnswer(q));
  document.getElementById('nextBtn').addEventListener('click',()=>{ drillIdx++; renderQ(); });
}

function checkAnswer(q){
  const sel=document.querySelector('.choice.selected');
  if(!sel){ alert('Please select an answer first.'); return; }
  const given=sel.dataset.val;
  const correct=q.a;
  const isRight=given.toLowerCase()===correct.toLowerCase();
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  document.getElementById('checkBtn').style.display='none';
  document.getElementById('nextBtn').style.display='inline-block';
  drillResults.push({q:q.q,given,correct,ok:isRight});
  const fb=document.getElementById('feedback');
  if(isRight){
    fb.className='feedback correct';
    fb.textContent='✅ Correct! Great job!';
  } else {
    fb.className='feedback wrong';
    fb.innerHTML='❌ Not quite.<div class="answerBox">✅ Correct answer: '+correct+'</div>';
  }
  sel.style.background=isRight?'rgba(46,125,50,.15)':'rgba(183,28,28,.15)';
  sel.style.borderColor=isRight?'#81c784':'#ef9a9a';
}

/* ── SCORE SCREEN ── */
function showScore(){
  const cont=document.getElementById('panelInner');
  const answered=drillResults.length;
  const correct=drillResults.filter(r=>r.ok).length;
  const pct=answered>0?Math.round(correct/answered*100):0;
  const stars=pct>=90?'⭐⭐⭐⭐⭐':pct>=75?'⭐⭐⭐⭐':pct>=55?'⭐⭐⭐':pct>=40?'⭐⭐':'⭐';
  const label=pct>=90?'Outstanding! 🏆':pct>=75?'Good job! 😊':pct>=55?'Getting there! 💪':'Keep practising! 📖';
  const wrong=drillResults.filter(r=>!r.ok);
  const right=drillResults.filter(r=>r.ok);
  let review='';
  if(wrong.length){
    review+='<div style="font-weight:800;margin-bottom:8px;color:var(--wrong)">❌ Review — wrong answers:</div>';
    wrong.forEach(r=>{
      review+=`<div class="reviewItem wrong">
        <div class="reviewQ">${r.q}</div>
        <div class="reviewA"><span class="wrong-a">Your answer: ${r.given}</span></div>
        <div class="reviewA"><span class="correct-a">✅ Correct: ${r.correct}</span></div>
      </div>`;
    });
  }
  if(right.length){
    review+='<div style="font-weight:800;margin:12px 0 8px;color:var(--correct)">✅ Correct answers:</div>';
    right.forEach(r=>{
      review+=`<div class="reviewItem">
        <div class="reviewQ">${r.q}</div>
        <div class="reviewA"><span class="correct-a">✅ ${r.correct}</span></div>
      </div>`;
    });
  }
  cont.innerHTML=`
    <div class="scoreScreen show">
      <div class="scoreStar">${stars}</div>
      <div class="scorePct">${pct}%</div>
      <div class="scoreDetail">${correct} / ${answered} correct · ${label}</div>
      <button class="retryBtn" id="retryBtn">🔄 Try Again</button>
    </div>
    <div class="reviewList">${review}</div>`;
  document.getElementById('retryBtn').addEventListener('click',()=>startDrill(currentDrill));
}

      document.getElementById('orw-'+i).style.display='none';
    });
  });

async function oralToggle(i){
  const s=oralState[i];
  const btn=document.getElementById('orec-'+i);
  const info=document.getElementById('ori-'+i);
  if(!s.recorder||s.recorder.state==='inactive'){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const mimes=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];
      const mime=mimes.find(m=>MediaRecorder.isTypeSupported(m))||'';
      s.recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});
      s.chunks=[];
      s.recorder.ondataavailable=e=>{ if(e.data.size>0) s.chunks.push(e.data); };
      s.recorder.onstop=()=>{
        s.blob=new Blob(s.chunks,{type:s.recorder.mimeType||'audio/webm'});
        document.getElementById('oplay-'+i).disabled=false;
        document.getElementById('orw-'+i).style.display='block';
        btn.textContent='⏺ Record Again'; btn.classList.remove('active');
        info.textContent='Recording saved!';
        clearInterval(s.timer);
      };
      s.recorder.start(200);
      btn.textContent='⏹ Stop'; btn.classList.add('active');
      let sec=0;
      s.timer=setInterval(()=>{
        sec++; info.textContent='Recording… '+sec+'s / 90s';
        if(sec>=90) oralToggle(i);
      },1000);
    }catch(e){
      alert('Microphone access denied. Allow microphone in browser settings.');
    }
  } else if(s.recorder.state==='recording'){
    clearInterval(s.timer);
    s.recorder.stop();
    s.recorder.stream.getTracks().forEach(t=>t.stop());
  }
}

function oralPlay(i){
  const s=oralState[i];
  if(!s.blob) return;
  const url=URL.createObjectURL(s.blob);
  const audio=new Audio(url);
  audio.play();
}

  function today() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }

    var d = load(kid), t = today();
    if (d.today !== t) { d.today = t; d.todayPts = 0; }
    if (d.days.indexOf(t) < 0) { d.days.push(t); if (d.days.length > 60) d.days = d.days.slice(-60); }
    fn(d);
    var ds = dayStreak(d.days);
    if (ds >= 3) grant(d, "days3");
    if (ds >= 7) grant(d, "days7");
    if (d.points >= 500) grant(d, "p500");
    if (d.points >= 2000) grant(d, "p2000");
    if (d.points >= 5000) grant(d, "p5000");
    save(kid, d);
  }
  var SitePoints = {
    kid: kid,
    badges: BADGES,
    read: function (k) { var d = load(k || kid); d.dayStreak = dayStreak(d.days); return d; },
    answer: function (ok) {
      update(function (d) {
        if (ok) {
          streak++;
          var pts = 10 + Math.min(10, (streak - 1) * 2);
          d.points += pts; d.todayPts += pts; d.correct++;
          d.bestStreak = Math.max(d.bestStreak, streak);
          grant(d, "first");
          if (streak >= 10) grant(d, "streak10");
          if (streak >= 20) grant(d, "streak20");
          toast("+" + pts);
        } else { streak = 0; }
      });
    },
    roundEnd: function (pct) {
      if (pct >= 100) update(function (d) { d.perfects++; grant(d, "perfect"); });
    },
    literacy: function (allOk) {
      if (allOk) update(function (d) { d.lit++; grant(d, "lit1"); if (d.lit >= 10) grant(d, "lit10"); });
    }
  };
  window.SitePoints = SitePoints;

  /* auto-hooks for the 中文部 engine (global rtAns / celebrate) */
  if (typeof window.rtAns === "function" && !window.rtAns.__sp) {
    var oAns = window.rtAns;
    window.rtAns = function (right) { try { SitePoints.answer(!!right); } catch (e) {} return oAns.apply(this, arguments); };
    window.rtAns.__sp = true;
  }
  if (typeof window.celebrate === "function" && !window.celebrate.__sp) {
    var oCel = window.celebrate;
    window.celebrate = function () { try { SitePoints.roundEnd(100); } catch (e) {} return oCel.apply(this, arguments); };
    window.celebrate.__sp = true;
  }

  /* ---------------- styles ---------------- */
  var css = document.createElement("style");
  css.textContent =
    "#sh-btn{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:9000;" +
    "height:44px;padding:0 14px 0 10px;border-radius:999px;border:2px solid rgba(255,255,255,.9);background:#334155;color:#fff;font:700 16px/1 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;" +
    "box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;opacity:.9;touch-action:manipulation;white-space:nowrap}" +
    "#sh-btn:active{transform:scale(.94)}" +
    "#sh-mask{position:fixed;inset:0;z-index:9001;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px}" +
    "#sh-card{background:#fff;color:#0f172a;border-radius:18px;padding:20px 18px;max-width:340px;width:100%;text-align:center;" +
    "font:17px/1.5 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.3)}" +
    "#sh-card h3{margin:0 0 6px;font-size:20px}#sh-card p{margin:0 0 16px;color:#475569;font-size:15px}" +
    "#sh-card button{font:inherit;min-height:48px;border-radius:12px;border:0;padding:10px 16px;margin:4px;cursor:pointer}" +
    "#sh-go{background:#0284c7;color:#fff;font-weight:700}#sh-stay{background:#e2e8f0;color:#0f172a}" +
    "@media (prefers-color-scheme:dark){#sh-card{background:#1e293b;color:#e2e8f0}#sh-card p{color:#94a3b8}#sh-stay{background:#334155;color:#e2e8f0}}" +
    "body{padding-bottom:max(76px,calc(64px + env(safe-area-inset-bottom)))!important}" +
    ".sp-toast{position:fixed;left:max(84px,calc(72px + env(safe-area-inset-left)));bottom:max(18px,calc(6px + env(safe-area-inset-bottom)));z-index:9002;" +
    "background:#f59e0b;color:#1f2937;font:800 16px/1.3 -apple-system,'PingFang TC',sans-serif;padding:8px 12px;border-radius:999px;" +
    "box-shadow:0 4px 12px rgba(0,0,0,.25);pointer-events:none;transition:opacity .4s,transform .4s}" +
    ".sp-toast.sp-big{left:50%;bottom:auto;top:30%;transform:translateX(-50%);text-align:center;font-size:18px;padding:14px 22px;border-radius:18px}" +
    ".sp-toast.sp-out{opacity:0;transform:translateY(-14px)}.sp-toast.sp-big.sp-out{transform:translate(-50%,-14px)}";
  document.head.appendChild(css);

  /* ---------------- 📚 小站 button ---------------- */
  if (!document.body) return;
  var b = document.createElement("button");
  b.id = "sh-btn"; b.type = "button";
  b.setAttribute("aria-label", "回到練習小站"); b.title = "回到練習小站";
  b.textContent = "📚 小站";
  b.addEventListener("click", function () {
    if (document.getElementById("sh-mask")) return;
    var m = document.createElement("div"); m.id = "sh-mask";
    var pts = kid ? "<p>目前集點：⭐ " + load(kid).points + " 點</p>" : "";
    m.innerHTML = '<div id="sh-card" role="dialog" aria-modal="true"><h3>📚 回到練習小站？</h3>' +
      '<p>這一輪的作答不會保留（點數和最高分紀錄會留著）。</p>' + pts +
      '<button id="sh-go" type="button">回到練習小站</button><button id="sh-stay" type="button">繼續練習</button></div>';
    document.body.appendChild(m);
    function close() { m.remove(); }
    m.addEventListener("click", function (e) { if (e.target === m) close(); });
    document.getElementById("sh-stay").addEventListener("click", close);
    document.getElementById("sh-go").addEventListener("click", function () {
      try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
      location.href = homeUrl();
    });
    document.getElementById("sh-go").focus();
  });
  document.body.appendChild(b);
})();
</script>
</body>
</html>
