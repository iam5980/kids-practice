<script>
/* ===== KPDeal：選擇題正確答案位置平均分散（練習小站共用，版本 2026-11-10b）=====
   規則：每個位置（A/B/C/D…）出現次數一樣多，且正確答案不會連續 3 題在同一位置。
   用法（整段貼進 App 的 <script>，放在使用它的程式之前）：
     KPDeal.place(options, correct)   → 回傳新陣列：錯誤選項打亂，正確選項放到平均分散的位置
                                         correct 可以是「值」或「判斷函式 (item,index)=>boolean」
     KPDeal.pos(n)                    → 只要位置編號（0..n-1）時使用
     KPDeal.shuffle(arr)              → 一般打亂（回傳新陣列）
   注意：凡是「一題 + 數個選項 + 一個正解」的地方都要用 place，不要再用 shuffle 決定選項順序。
*/
var KPDeal=(function(){
  var decks={},last=[];
  function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function runOK(s){for(var i=2;i<s.length;i++)if(s[i]===s[i-1]&&s[i]===s[i-2])return false;return true}
  function pos(n){
    if(!(n>1))return 0;
    var d=decks[n];
    if(!d||!d.length){var base=[],k=0;for(var r=0;r<2;r++)for(var i=0;i<n;i++)base.push(i);
      do{d=sh(base);k++}while(!runOK(last.slice(-2).concat(d))&&k<300);decks[n]=d}
    var p=d.shift();
    if(last.length>=2&&last[last.length-1]===p&&last[last.length-2]===p){
      for(var i=0;i<d.length;i++)if(d[i]!==p){var q=d[i];d[i]=p;p=q;break}
      if(last[last.length-1]===p&&last[last.length-2]===p){var alt=(p+1+Math.floor(Math.random()*(n-1)))%n;d.push(p);p=alt}}
    last.push(p);if(last.length>4)last.shift();
    return p;
  }
  function place(arr,correct){
    var f=typeof correct==='function'?correct:function(x){return x===correct};
    var ci=-1;for(var i=0;i<arr.length;i++)if(f(arr[i],i)){ci=i;break}
    if(ci<0)return sh(arr);
    var c=arr[ci],w=sh(arr.filter(function(_,i){return i!==ci}));
    w.splice(pos(arr.length),0,c);
    return w;
  }
  return {place:place,pos:pos,shuffle:sh};
})();

/* ── THEME ── */
(function(){
  const saved = localStorage.getItem('theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
})();
document.getElementById('themeToggle').addEventListener('click', function(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  this.textContent = next === 'dark' ? '☀️ Light' : '🌙 Dark';
});

/* ── TTS ── */
let _voices = [];
function _loadVoices(){ const v=window.speechSynthesis.getVoices(); if(v.length) _voices=v; }
window.speechSynthesis.addEventListener('voiceschanged', _loadVoices);
_loadVoices(); setTimeout(_loadVoices,500); setTimeout(_loadVoices,1500);

function bestVoice(){
  const vv=_voices.length?_voices:window.speechSynthesis.getVoices();
  const tests=[
    v=>v.name==='Samantha',v=>v.name==='Karen',v=>v.name==='Daniel',
    v=>v.name.includes('Google US English'),v=>v.name.includes('Google UK English'),
    v=>v.lang==='en-US'&&v.localService,v=>v.lang==='en-GB'&&v.localService,
    v=>v.lang.startsWith('en')&&v.localService,v=>v.lang.startsWith('en')
  ];
  for(const t of tests){ const m=vv.find(t); if(m) return m; }
  return null;
}
function speak(text){
  window.speechSynthesis.cancel();
  if(!_voices.length) _voices=window.speechSynthesis.getVoices();
  const u=new SpeechSynthesisUtterance(text);
  const v=bestVoice(); if(v) u.voice=v;
  u.lang='en-US'; u.rate=0.88; u.pitch=1.0;
  window.speechSynthesis.speak(u);
}

/* iOS unlock */
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(isIOS) document.getElementById('unlockBar').style.display='block';
document.getElementById('unlockBtn').addEventListener('click',function(){
  speak('Voice enabled');
  const bar=document.getElementById('unlockBar');
  bar.style.borderColor='#81c784';
  bar.querySelector('p').textContent='✅ Voice enabled!';
  this.style.display='none';
  setTimeout(()=>{ bar.style.display='none'; },1500);
});

/* ── SHUFFLE ── */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function renderQ(){
  const cont=document.getElementById('panelInner');

  const q=drillQ[drillIdx];
  const isMock=currentDrill==='mock';
  const choices=KPDeal.place(q.choices,c=>String(c).toLowerCase()===String(q.a).toLowerCase());
  let html='';
  if(isMock) html+=`<button class="newSetBtn" id="newSetBtn">🔀 New Random Set</button>`;
  html+=`<div class="qCard">
    <div class="qNum">Question ${drillIdx+1} / ${drillQ.length}</div>
    <div class="qText" id="qText">${q.q}</div>
    <button class="speakBtn" id="speakQBtn">🔊 Hear Question</button>
    <div class="choices" id="choices">
      ${choices.map((c,ci)=>`<button class="choice" data-c="${ci}" data-val="${c}">${c}</button>`).join('')}
    </div>
    <div>
      <button class="checkBtn" id="checkBtn">Check Answer</button>
      <button class="nextBtn" id="nextBtn">${drillIdx+1<drillQ.length?'Next →':'Finish!'}</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>`;
  cont.innerHTML=html;
  if(isMock) document.getElementById('newSetBtn').addEventListener('click',()=>startDrill('mock'));
  document.getElementById('speakQBtn').addEventListener('click',()=>speak(q.q));
  document.querySelectorAll('.choice').forEach(btn=>{
    btn.addEventListener('click',function(){
      if(this.disabled) return;
      document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));
      this.classList.add('selected');
    });
  });
  document.getElementById('checkBtn').addEventListener('click',()=>checkAnswer(q));
  document.getElementById('nextBtn').addEventListener('click',()=>{ drillIdx++; renderQ(); });
}

function checkAnswer(q){
  const sel=document.querySelector('.choice.selected');
  if(!sel){ alert('Please select an answer first.'); return; }
  const given=sel.dataset.val;
  const correct=q.a;
  const isRight=given.toLowerCase()===correct.toLowerCase();
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  document.getElementById('checkBtn').style.display='none';
  document.getElementById('nextBtn').style.display='inline-block';
  drillResults.push({q:q.q,given,correct,ok:isRight});
  const fb=document.getElementById('feedback');
  if(isRight){
    fb.className='feedback correct';
    fb.textContent='✅ Correct! Great job!';
  } else {
    fb.className='feedback wrong';
    fb.innerHTML='❌ Not quite.<div class="answerBox">✅ Correct answer: '+correct+'</div>';
  }
  sel.style.background=isRight?'rgba(46,125,50,.15)':'rgba(183,28,28,.15)';
  sel.style.borderColor=isRight?'#81c784':'#ef9a9a';
}

function showScore(){

  const answered=drillResults.length;
  const correct=drillResults.filter(r=>r.ok).length;
  const pct=answered>0?Math.round(correct/answered*100):0;
  const stars=pct>=90?'⭐⭐⭐⭐⭐':pct>=75?'⭐⭐⭐⭐':pct>=55?'⭐⭐⭐':pct>=40?'⭐⭐':'⭐';
  const label=pct>=90?'Outstanding! 🏆':pct>=75?'Good job! 😊':pct>=55?'Getting there! 💪':'Keep practising! 📖';
  const wrong=drillResults.filter(r=>!r.ok);
  const right=drillResults.filter(r=>r.ok);
  let review='';
  if(wrong.length){
    review+='<div style="font-weight:800;margin-bottom:8px;color:var(--wrong)">❌ Review — wrong answers:</div>';
    wrong.forEach(r=>{
      review+=`<div class="reviewItem wrong">
        <div class="reviewQ">${r.q}</div>
        <div class="reviewA"><span class="wrong-a">Your answer: ${r.given}</span></div>
        <div class="reviewA"><span class="correct-a">✅ Correct: ${r.correct}</span></div>
      </div>`;
    });
  }
  if(right.length){
    review+='<div style="font-weight:800;margin:12px 0 8px;color:var(--correct)">✅ Correct answers:</div>';
    right.forEach(r=>{
      review+=`<div class="reviewItem">
        <div class="reviewQ">${r.q}</div>
        <div class="reviewA"><span class="correct-a">✅ ${r.correct}</span></div>
      </div>`;
    });
  }
  cont.innerHTML=`
    <div class="scoreScreen show">
      <div class="scoreStar">${stars}</div>
      <div class="scorePct">${pct}%</div>
      <div class="scoreDetail">${correct} / ${answered} correct · ${label}</div>
      <button class="retryBtn" id="retryBtn">🔄 Try Again</button>
    </div>
    <div class="reviewList">${review}</div>`;
  document.getElementById('retryBtn').addEventListener('click',()=>startDrill(currentDrill));
}

async function oralToggle(i){
  const s=oralState[i];
  const btn=document.getElementById('orec-'+i);
  const info=document.getElementById('ori-'+i);
  if(!s.recorder||s.recorder.state==='inactive'){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const mimes=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];
      const mime=mimes.find(m=>MediaRecorder.isTypeSupported(m))||'';
      s.recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});
      s.chunks=[];
      s.recorder.ondataavailable=e=>{ if(e.data.size>0) s.chunks.push(e.data); };
      s.recorder.onstop=()=>{
        s.blob=new Blob(s.chunks,{type:s.recorder.mimeType||'audio/webm'});
        document.getElementById('oplay-'+i).disabled=false;
        document.getElementById('orw-'+i).style.display='block';
        btn.textContent='⏺ Record Again'; btn.classList.remove('active');
        info.textContent='Recording saved!';
        clearInterval(s.timer);
      };
      s.recorder.start(200);
      btn.textContent='⏹ Stop'; btn.classList.add('active');
      let sec=0;
      s.timer=setInterval(()=>{
        sec++; info.textContent='Recording… '+sec+'s / 90s';
        if(sec>=90) oralToggle(i);
      },1000);
    }catch(e){
      alert('Microphone access denied. Allow microphone in browser settings.');
    }
  } else if(s.recorder.state==='recording'){
    clearInterval(s.timer);
    s.recorder.stop();
    s.recorder.stream.getTracks().forEach(t=>t.stop());
  }
}

function oralPlay(i){
  const s=oralState[i];
  if(!s.blob) return;
  const url=URL.createObjectURL(s.blob);
  const audio=new Audio(url);
  audio.play();
}

      try { var r = window.rt || (typeof rt !== "undefined" ? rt : null); if (r && !r.done && r.n >= 1) SitePoints.roundEnd(Math.round(r.ok / r.n * 100), true, r.n >= 5 ? r.n : 0); } catch (e) {}

    "#sh-go{background:#0284c7;color:#fff;font-weight:700}#sh-stay{background:#e2e8f0;color:#0f172a}" +

    ".sp-say{font:14px/1 sans-serif;border:1px solid rgba(100,116,139,.45);background:transparent;border-radius:999px;padding:3px 7px;margin-left:6px;cursor:pointer;vertical-align:middle;color:inherit}" +
    ".sd-mask{position:fixed;inset:0;z-index:9003;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px}" +
    ".sd-card{background:#fff;color:#0f172a;border-radius:20px;padding:18px;max-width:340px;width:100%;text-align:center;font:16px/1.5 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.35)}" +
    ".sd-card h3{margin:0 0 4px;font-size:20px}.sd-tag{margin:0;font-weight:800}.sd-msg{color:#475569;margin:6px 0 12px}" +
    ".sd-pic{width:150px;height:150px;margin:6px auto}.sd-bob{animation:sdb 1.1s ease-in-out infinite}.sd-shake{animation:sds .3s linear 3}.sd-got{animation:sdg .6s ease-out}.sd-run{animation:sdr .8s ease-in forwards}" +

  function qHtml() {
    var d = load(kid); qDay(d);
    return '<p style="text-align:left;font-size:14px;margin:-8px 0 14px">🎯 今天的任務：<br>' + QUESTS.map(function (q) {

    }).join("<br>") + "</p>";
  }
  /* ---------------- 📚 小站 button ---------------- */
  if (!document.body || window.__siteHomeNoBtn) return;
  var b = document.createElement("button");
  b.id = "sh-btn"; b.type = "button";
  b.setAttribute("aria-label", "回到練習小站"); b.title = "回到練習小站";

      try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
