<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Howard Oral Practice 115-1</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--surface:#161b2e;--raised:#1e2440;--border:#2e3560;--fg:#e8eaf6;--muted:#9fa8da;--navy:#90caf9;--correct:#81c784;--purple:#a855f7;--gold:#fbbf24;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Nunito',sans-serif;font-size:16px;padding:0 16px 40px}
.topbar{background:var(--surface);border-bottom:2px solid var(--border);padding:16px;margin:0 -16px 20px;display:flex;align-items:center;gap:12px}
.topbar h1{font-family:'Fredoka One',cursive;font-size:1.4rem;color:var(--navy)}
.topbar p{font-size:.8rem;color:var(--muted)}
.notice{background:#1a0a2a;border:2px solid var(--purple);color:#e9d5ff;border-radius:12px;padding:14px;margin-bottom:20px;font-size:.85rem;line-height:1.7}
.notice strong{color:#c084fc}
.unlock{background:#1a1000;border:2px solid var(--gold);border-radius:12px;padding:16px;margin-bottom:20px;text-align:center;display:none}
.unlock p{color:var(--gold);font-weight:800;margin-bottom:10px}
.unlock button{background:var(--gold);color:#1a1000;border:none;border-radius:22px;padding:12px 28px;font-size:1rem;font-weight:800;font-family:inherit;cursor:pointer;min-height:48px}
.inner{max-width:700px;margin:0 auto}
.card{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:20px;margin-bottom:18px}
.badge{display:inline-block;background:#c62828;color:#fff;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:12px;margin-bottom:8px;letter-spacing:.06em}
.qnum{font-size:.75rem;color:var(--muted);font-weight:700;margin-bottom:3px}
.qtext{font-size:1.05rem;font-weight:700;margin-bottom:14px;line-height:1.5}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.btn{padding:9px 16px;border-radius:22px;border:2px solid var(--border);background:var(--raised);color:var(--fg);font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;min-height:46px}
.btn:disabled{opacity:.35;cursor:default}
.btn.teal{border-color:#4dd0e1;color:#4dd0e1}
.btn.red{border-color:#ef9a9a;color:#ef9a9a}
.btn.red.active{background:#c62828;color:#fff;border-color:#c62828}
.btn.green{border-color:var(--correct);color:var(--correct)}
.btn.purple{border-color:var(--purple);color:var(--purple)}
.recinfo{font-size:.8rem;color:var(--muted);font-weight:700;min-height:20px;margin:4px 0 8px}
.modelbox{background:rgba(129,199,132,.1);border:2px solid var(--correct);border-radius:10px;padding:14px;margin-top:10px;display:none}
.modelbox.show{display:block}
.modellabel{font-size:.75rem;color:var(--correct);font-weight:700;margin-bottom:6px}
.modeltext{font-size:.95rem;line-height:1.6}
.scorezone{margin-top:12px;display:none}
.scorezone.show{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:6px 12px;border-radius:16px;border:2px solid var(--border);background:var(--raised);color:var(--fg);font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer}
.chip.hit{background:var(--correct);color:#1a2035;border-color:var(--correct)}
.barwrap{background:var(--raised);border-radius:6px;height:10px;margin:8px 0}
.barfill{height:100%;border-radius:6px;background:var(--correct);transition:.4s}
.grade{font-size:.85rem;font-weight:700;color:var(--gold)}
.pts{font-size:.8rem;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div class="topbar">
  <div>
    <h1>🗣️ Howard Oral Practice 115-1</h1>
    <p>期中考 Oral Must-Know · Egypt + Old Yeller</p>
  </div>
</div>
<div class="inner">
  <div class="notice">
    <strong>Recording requires Safari or Chrome</strong><br>
    Open in Safari (iOS) or Chrome — not inside another app.<br>
    iOS: tap ··· → <em>Open in Safari</em>
  </div>
  <div class="unlock" id="unlockBar">
    <p>🔇 Tap to enable voice</p>
    <button id="unlockBtn">🔊 Enable Voice</button>
    <div style="color:#9fa8da;font-size:.8rem;margin-top:8px">iOS needs one tap before 🔊 works</div>
  </div>
  <div id="cards"></div>
</div>

<script>
/* ── DATA ── */
const ORAL = [
  {
    q: "What is the genre of 'Egypt' and what does it mean?",
    model: "The genre of 'Egypt' is expository text. Expository text gives facts and information about a real topic.",
    keys: ["expository","facts","information","real topic"], pts: 3
  },
  {
    q: "What is the genre of 'Old Yeller' and what does it mean?",
    model: "The genre of 'Old Yeller' is historical fiction. Historical fiction is a story set in the past that mixes real historical events with made-up characters and events.",
    keys: ["historical fiction","past","historical events","made-up"], pts: 3
  },
  {
    q: "Describe the bear attack scene in 'Old Yeller'. What happened?",
    model: "Arliss grabbed a bear cub at the spring hole. When the mama bear charged to protect her cub, Old Yeller jumped in and fought the mama bear to save Arliss. Old Yeller was lunging up the creek bank to fight the bear. After the fight, Mama held the wounded dog inside the cabin and cried.",
    keys: ["bear cub","mama bear","Old Yeller","fought","protect Arliss","creek bank"], pts: 4
  },
  {
    q: "What is the Question of the Week for 'Old Yeller'? Give an example from the story.",
    model: "The Question of the Week is 'How can we help protect those we love?' In the story, Old Yeller protected Arliss by fighting the mama bear, even though he could get badly hurt. This shows that Old Yeller was willing to risk his life to protect someone he loved.",
    keys: ["protect","love","Old Yeller","bear","Arliss","risk"], pts: 4
  },
  {
    q: "What is the Question of the Week for 'Egypt'? How does the text answer it?",
    model: "The Question of the Week is 'What does it mean to be unique and creative?' The ancient Egyptians showed their creativity through their art, hieroglyphs, pyramid building, and mummification techniques, which were unique to their culture.",
    keys: ["unique","creative","hieroglyphs","pyramids","mummification"], pts: 4
  },
  {
    q: "Describe ancient Egyptian mummification. Why did Egyptians make mummies?",
    model: "Ancient Egyptians mummified their dead because they believed the soul needed the body in the afterlife. They removed the organs and preserved them separately, then used special chemicals and wrappings to prevent the body from decaying. The mummy was then placed in a sarcophagus, which is a decorated stone coffin.",
    keys: ["soul","afterlife","organs","preserved","sarcophagus","decay"], pts: 4
  }
];

/* ── TTS ── */
let _voices = [];
function loadVoices() {
  const v = window.speechSynthesis.getVoices();
  if (v.length) _voices = v;
}
window.speechSynthesis.addEventListener('voiceschanged', loadVoices);
loadVoices();
setTimeout(loadVoices, 500);
setTimeout(loadVoices, 1500);

function bestVoice() {
  const vv = _voices.length ? _voices : window.speechSynthesis.getVoices();
  const tests = [
    v => v.name === 'Samantha', v => v.name === 'Karen', v => v.name === 'Daniel',
    v => v.name.includes('Google US English'), v => v.name.includes('Google UK English'),
    v => v.lang === 'en-US' && v.localService, v => v.lang === 'en-GB' && v.localService,
    v => v.lang.startsWith('en') && v.localService, v => v.lang.startsWith('en')
  ];
  for (const t of tests) { const m = vv.find(t); if (m) return m; }
  return null;
}

// speak is called directly from button click listeners — stays synchronous on iOS
function speak(text) {
  window.speechSynthesis.cancel();
  if (!_voices.length) _voices = window.speechSynthesis.getVoices();
  const u = new SpeechSynthesisUtterance(text);
  const v = bestVoice(); if (v) u.voice = v;
  u.lang = 'en-US'; u.rate = 0.88; u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}

/* ── iOS unlock bar ── */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (isIOS) document.getElementById('unlockBar').style.display = 'block';

document.getElementById('unlockBtn').addEventListener('click', function() {
  speak('Voice enabled');
  const bar = document.getElementById('unlockBar');
  bar.style.borderColor = '#81c784';
  bar.style.background = '#0a2a0a';
  bar.querySelector('p').textContent = '✅ Voice enabled!';
  this.style.display = 'none';
  setTimeout(() => { bar.style.display = 'none'; }, 1500);
});

/* ── State ── */
const state = ORAL.map(() => ({ recorder: null, chunks: [], blob: null, timer: null }));

/* ── Grade ── */
function gradeLabel(pct) {
  if (pct >= 90) return '🌟 Outstanding!';
  if (pct >= 75) return '😊 Good job!';
  if (pct >= 55) return '💪 Getting there!';
  return '📖 Keep practising!';
}

/* ── Build cards ── */
function buildCards() {
  const cont = document.getElementById('cards');
  cont.innerHTML = ORAL.map((item, i) => {
    const chips = item.keys.map((k, ki) =>
      `<button class="chip" data-card="${i}" data-ki="${ki}">${k}</button>`
    ).join('');
    return `
    <div class="card">
      <div class="badge">★ EXAM MUST-KNOW</div>
      <div class="qnum">Question ${i+1}</div>
      <div class="qtext" id="qt-${i}">${item.q}</div>
      <div class="btnrow">
        <button class="btn teal" data-speak-q="${i}">🔊 Hear Question</button>
        <button class="btn red" id="rec-${i}">⏺ Record Answer</button>
        <button class="btn green" id="play-${i}" disabled>▶ Play Back</button>
      </div>
      <div class="recinfo" id="ri-${i}"></div>
      <div id="rw-${i}" style="display:none">
        <button class="btn purple" data-reveal="${i}">👁 Reveal Answer</button>
      </div>
      <div class="modelbox" id="mb-${i}">
        <div class="modellabel">✅ Model Answer</div>
        <div class="modeltext" id="mt-${i}">${item.model}</div>
        <div style="margin-top:10px">
          <button class="btn teal" data-speak-m="${i}">🔊 Hear Model Answer</button>
        </div>
      </div>
      <div class="scorezone" id="sz-${i}">
        <div style="font-size:.85rem;font-weight:700;margin-bottom:6px;color:var(--muted)">Tap keywords you said:</div>
        <div class="chips" id="chips-${i}">${chips}</div>
        <div class="barwrap"><div class="barfill" id="bar-${i}" style="width:0"></div></div>
        <div class="grade" id="gr-${i}">–</div>
        <div class="pts">${item.pts} pts total</div>
      </div>
    </div>`;
  }).join('');

  // Attach all listeners after DOM is built
  // Hear Question buttons
  document.querySelectorAll('[data-speak-q]').forEach(btn => {
    const i = +btn.dataset.speakQ;
    btn.addEventListener('click', () => speak(ORAL[i].q));
  });

  // Hear Model Answer buttons
  document.querySelectorAll('[data-speak-m]').forEach(btn => {
    const i = +btn.dataset.speakM;
    btn.addEventListener('click', () => speak(ORAL[i].model));
  });

  // Record buttons
  ORAL.forEach((_, i) => {
    document.getElementById('rec-'+i).addEventListener('click', () => oralToggle(i));
    document.getElementById('play-'+i).addEventListener('click', () => oralPlay(i));
  });

  // Reveal buttons
  document.querySelectorAll('[data-reveal]').forEach(btn => {
    const i = +btn.dataset.reveal;
    btn.addEventListener('click', () => oralReveal(i));
  });

  // Keyword chips
  document.querySelectorAll('.chip[data-card]').forEach(chip => {
    chip.addEventListener('click', () => {
      chip.classList.toggle('hit');
      const i = +chip.dataset.card;
      const total = ORAL[i].keys.length;
      const hits = document.querySelectorAll(`.chip[data-card="${i}"].hit`).length;
      const pct = Math.round(hits / total * 100);
      document.getElementById('bar-'+i).style.width = pct + '%';
      document.getElementById('gr-'+i).textContent = gradeLabel(pct) + ' (' + hits + '/' + total + ' keywords)';
    });
  });
}

/* ── Recording ── */
async function oralToggle(i) {
  const s = state[i];
  const btn = document.getElementById('rec-'+i);
  const info = document.getElementById('ri-'+i);
  if (!s.recorder || s.recorder.state === 'inactive') {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimes = ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];
      const mime = mimes.find(m => MediaRecorder.isTypeSupported(m)) || '';
      s.recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
      s.chunks = [];
      s.recorder.ondataavailable = e => { if (e.data.size > 0) s.chunks.push(e.data); };
      s.recorder.onstop = () => {
        s.blob = new Blob(s.chunks, { type: s.recorder.mimeType || 'audio/webm' });
        document.getElementById('play-'+i).disabled = false;
        document.getElementById('rw-'+i).style.display = 'block';
        btn.textContent = '⏺ Record Again'; btn.classList.remove('active');
        info.textContent = 'Recording saved!';
        clearInterval(s.timer);
      };
      s.recorder.start(200);
      btn.textContent = '⏹ Stop'; btn.classList.add('active');
      let sec = 0;
      s.timer = setInterval(() => {
        sec++; info.textContent = 'Recording… ' + sec + 's / 90s';
        if (sec >= 90) oralToggle(i);
      }, 1000);
    } catch(e) {
      alert('Microphone access denied. Allow microphone in browser settings.');
    }
  } else if (s.recorder.state === 'recording') {
    clearInterval(s.timer);
    s.recorder.stop();
    s.recorder.stream.getTracks().forEach(t => t.stop());
  }
}

function oralPlay(i) {
  const s = state[i];
  if (!s.blob) return;
  const url = URL.createObjectURL(s.blob);
  const audio = new Audio(url);
  audio.play();
}

function oralReveal(i) {
  document.getElementById('mb-'+i).classList.add('show');
  document.getElementById('rw-'+i).style.display = 'none';
  document.getElementById('sz-'+i).classList.add('show');
}

buildCards();
</script>
</body>
</html>
