<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>六上社會期末練功房</title>
</head>
<body>
<style>
/* 社會課：土黃紙頁＋磚紅重點；單欄、手機優先 */
:root{
  --paper:#fbf8f0; --card:#ffffff; --ink:#2b2518; --muted:#6c6350;
  --sage:#ead9b4; --sage-deep:#8a6b2b; --rose:#f6cba8; --rose-deep:#b3502a;
  --line:#e2d6bb; --ok:#2f7a45; --bad:#b3362f; --okbg:#e3f2e6; --badbg:#fbe7e5;
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17140e; --card:#211c14; --ink:#f0e9db; --muted:#b2a68d;
  --sage:#3a3121; --sage-deep:#e0bc6b; --rose:#4a2a1c; --rose-deep:#f0a877;
  --line:#3a3222; --ok:#7fd29a; --bad:#ff958c; --okbg:#1d3324; --badbg:#3a1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17140e; --card:#211c14; --ink:#f0e9db; --muted:#b2a68d;
  --sage:#3a3121; --sage-deep:#e0bc6b; --rose:#4a2a1c; --rose-deep:#f0a877;
  --line:#3a3222; --ok:#7fd29a; --bad:#ff958c; --okbg:#1d3324; --badbg:#3a1f1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header h1{font-family:var(--kai);font-size:clamp(24px,6.4vw,34px);margin:0;line-height:1.2;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,canvas:focus-visible{outline:3px solid var(--rose-deep);outline-offset:2px}
.scope{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--paper);font-weight:700}
.chip.wrongchip[aria-pressed="true"]{background:var(--rose-deep);border-color:var(--rose-deep)}
.count{font-size:13px;color:var(--muted);margin-left:auto}
nav.tabs{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;background:var(--sage);padding:4px;border-radius:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
nav.tabs button{border:0;background:transparent;border-radius:9px;padding:8px 0;font-size:clamp(12px,3.4vw,15px);font-weight:500;white-space:nowrap}
@media (max-width:760px){nav.tabs{grid-template-columns:repeat(5,1fr)}}
nav.tabs button[aria-selected="true"]{background:var(--card);font-weight:700;color:var(--sage-deep);box-shadow:0 1px 2px rgba(0,0,0,.12)}
section{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--sage-deep);background:var(--card);color:var(--sage-deep);border-radius:10px;padding:8px 16px;font-weight:700}
.btn.primary{background:var(--sage-deep);color:var(--paper)}
.btn.rose{border-color:var(--rose-deep);color:var(--rose-deep)}
.btn.rose.primary{background:var(--rose-deep);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:default}
.hint{color:var(--muted);font-size:14px;margin:0}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.hdr{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.hdr>div{min-width:0}
.hdr #sfxBtn{flex:none;margin-top:6px}
.modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.kai{font-family:var(--kai)}
.zy{font-family:var(--sans);letter-spacing:1px}
.say{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--sage-deep);background:var(--card);color:var(--sage-deep);border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;vertical-align:middle;margin:2px 4px 2px 0;font-family:var(--sans)}
.say svg{width:16px;height:16px;fill:currentColor}
.say:active{background:var(--sage)}

/* 重點卡 */
.termlist{display:flex;flex-direction:column;gap:8px}
.termcard{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.termcard .tt{font-family:var(--kai);font-size:22px;font-weight:700;color:var(--sage-deep);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.termcard .td{margin:4px 0 0;font-size:16px}
.groupHead{font-family:var(--kai);font-size:18px;margin:8px 0 -2px;color:var(--sage-deep)}
.cover{background:var(--sage);border-radius:6px;color:transparent;user-select:none;cursor:pointer;padding:0 6px;display:inline-block;min-width:120px}
.cover::after{content:"點我看答案";color:var(--sage-deep);font-size:13px}
.cover *{visibility:hidden}
.lesson{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-family:var(--sans);font-weight:400}

/* 題卡、選項 */
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.qask{font-size:17px;margin:0;text-align:center}
.qask.left{text-align:left;width:100%}
.opts{display:grid;grid-template-columns:1fr;gap:8px;width:100%}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;display:flex;align-items:flex-start;gap:8px;text-align:left;line-height:1.5}
.opt .o0{font-weight:700;color:var(--sage-deep);flex:none}
.opt .o1{font-size:16px;min-width:0}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt .mark{font-size:13px;font-weight:700;margin-left:auto;flex:none}
.opt.ok .mark{color:var(--ok)}.opt.bad .mark{color:var(--bad)}
.opt.tfbig{justify-content:center;font-size:30px;padding:16px;font-weight:700}
.fb{border-radius:10px;padding:8px 12px;width:100%;font-size:15px}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.fb b{color:var(--ink)}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* 計分列 */
.rhud{width:100%;display:flex;flex-direction:column;gap:4px}
.rrow{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.rrow b{color:var(--ink);font-size:17px}.rrow .cdw b{color:var(--bad)}
.plus{text-align:center;font-size:14px;font-weight:700;color:var(--rose-deep);min-height:1.3em}
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.rsum div{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:12px;color:var(--muted)}
.rsum b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px}
.hud div{text-align:center;font-size:12px;color:var(--muted)}
.hud b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;font-family:var(--sans)}
.hud .warn b{color:var(--bad)}
.timebar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.timebar i{display:block;height:100%;background:var(--sage-deep);transition:width .25s linear}
.timebar.warn i{background:var(--bad)}
.combo{text-align:center;font-family:var(--kai);font-size:22px;color:var(--rose-deep);min-height:1.4em}
.stars{font-size:34px;letter-spacing:4px;color:var(--rose-deep)}

/* 配對題（連線式） */
.pairwrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.pcol{display:flex;flex-direction:column;gap:8px}
.pitem{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;text-align:left;font-size:15px;line-height:1.4;min-height:52px}
.pitem.sel{border-color:var(--rose-deep);box-shadow:0 0 0 2px var(--rose-deep)}
.pitem.done{border-color:var(--ok);background:var(--okbg);opacity:.7}
.pitem.wrongflash{border-color:var(--bad);background:var(--badbg)}
.pnum{font-size:12px;color:var(--muted);display:block}

/* 分類題 */
.sortq{font-size:17px;width:100%}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.bins.b3{grid-template-columns:repeat(3,1fr)}
.bin{border:2px dashed var(--line);border-radius:12px;padding:8px;min-height:80px;background:var(--paper)}
.bin h4{margin:0 0 6px;font-size:15px;color:var(--sage-deep);font-family:var(--kai)}
.bin .tagi{display:block;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;font-size:14px;margin-bottom:4px}
.bin .tagi.ok{border-color:var(--ok);background:var(--okbg)}
.bin .tagi.bad{border-color:var(--bad);background:var(--badbg)}
.cur{background:var(--card);border:2px solid var(--rose-deep);border-radius:12px;padding:10px;text-align:center;font-size:19px;width:100%}

/* 圖表 */
.chartbox{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;width:100%}
.chartbox svg{display:block;width:100%;height:auto}
.srcnote{font-size:12px;color:var(--muted);margin:4px 0 0;text-align:right}
.tblwrap{overflow-x:auto;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
table.tbl{border-collapse:collapse;width:100%;font-size:15px}
table.tbl caption{font-size:13px;color:var(--muted);padding:8px 10px 0;text-align:left}

/* 寫國字 */
.tian{position:relative;aspect-ratio:1;max-width:100%;border:2px solid var(--sage-deep);background:var(--card);display:grid;place-items:center}
.tian::before,.tian::after{content:"";position:absolute;pointer-events:none}
.tian::before{left:50%;top:0;bottom:0;border-left:1.5px dashed var(--line)}
.tian::after{top:50%;left:0;right:0;border-top:1.5px dashed var(--line)}
.tian .z{font-family:var(--kai);line-height:1;position:relative;z-index:1}
.prompt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.prompt .word{font-family:var(--kai);font-size:34px;line-height:1.5}
.prompt .box{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--rose-deep);border-radius:6px;padding:0 8px;margin:0 2px;font-family:var(--sans);font-size:20px;color:var(--rose-deep);vertical-align:middle;min-height:44px}
.padwrap{width:min(100%,340px);margin:0 auto}
.pad{touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.pad .ghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--kai);color:var(--rose);z-index:1;line-height:1}
.reveal{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.reveal .big{font-family:var(--kai);font-size:72px;line-height:1;color:var(--rose-deep)}
.reveal .info{min-width:0;flex:1}
.center{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.grade{display:flex;gap:14px;align-items:center;border-radius:14px;padding:12px 14px;border:2px solid var(--line);background:var(--card);margin-bottom:10px}
.grade.g-ok{border-color:var(--ok);background:var(--okbg)}.grade.g-chk{border-color:var(--rose-deep);background:var(--badbg)}
.gscore{text-align:center;flex:none}.gscore b{display:block;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}.gscore span{font-size:13px;color:var(--muted)}
.ginfo{min-width:0;font-size:15px}

/* 翻牌 */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mem.m16{grid-template-columns:repeat(4,1fr)}
.mc{aspect-ratio:3/4;border-radius:12px;border:2px solid var(--sage-deep);background:var(--sage);display:grid;place-items:center;font-size:0;padding:6px;transition:transform .2s;overflow:hidden}
.mc.open,.mc.done{background:var(--card);font-size:13px}
.mc.done{border-color:var(--ok);opacity:.65}
.mc .k{font-family:var(--kai);font-size:clamp(14px,4.2vw,19px);line-height:1.3;text-align:center}
.mc .k.sm{font-size:clamp(11px,3.2vw,14px);line-height:1.3}
.mc:not(.open):not(.done)::after{content:"?";font-size:28px;font-family:var(--kai);color:var(--sage-deep)}
.mc.pop{animation:pop .35s ease}
.mc.shake{animation:shake .35s ease}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.mc{transition:none}.mc.pop,.mc.shake{animation:none}}

/* 慶祝 */
#party{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 70%,transparent);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  --c1:#e8d9a8;--c2:#f0b48a;--c3:#ffd36e;--c4:#a9cdf2;animation:fadein .25s ease}
#party.out{opacity:0;transition:opacity .3s}
@keyframes fadein{from{opacity:0}}
.party-card{position:relative;z-index:2;background:var(--card);border:2px solid var(--sage-deep);border-radius:20px;padding:18px 16px;text-align:center;max-width:380px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.dancers{display:flex;align-items:flex-end;justify-content:center;gap:4px}
.dancer{width:110px;height:auto}
.hundred{font-family:var(--kai);font-size:44px;font-weight:700;color:var(--rose-deep);align-self:center;animation:pulse .6s ease-in-out infinite alternate}
.d1{animation:bounce .5s ease-in-out infinite alternate;transform-origin:50% 100%}
.d2{animation:bounce .5s ease-in-out .25s infinite alternate;transform-origin:50% 100%}
.arm{transform-box:fill-box}
.d1 .al,.d2 .al{transform-origin:100% 100%;animation:wave .5s ease-in-out infinite alternate}
.d1 .ar,.d2 .ar{transform-origin:0 100%;animation:wave2 .5s ease-in-out infinite alternate}
.leg{transform-box:fill-box;transform-origin:50% 0}
.ll{animation:kick .5s ease-in-out infinite alternate}.lr{animation:kick .5s ease-in-out .25s infinite alternate}
@keyframes bounce{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg)}}
@keyframes wave{from{transform:rotate(18deg)}to{transform:rotate(-22deg)}}
@keyframes wave2{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
@keyframes kick{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.15)}}
.party-title{font-family:var(--kai);font-size:30px;font-weight:700;margin-top:6px}
.party-sub{color:var(--muted);margin:4px 0 12px}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{top:105%;transform:rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.d1,.d2,.arm,.leg,.hundred,.confetti i{animation:none!important}.confetti{display:none}}

/* 結果、錯題 */
.done-box{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.score{font-family:var(--kai);font-size:44px;line-height:1;color:var(--sage-deep);font-variant-numeric:tabular-nums}
.wlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wz{font-family:var(--kai);font-size:22px;border:1.5px solid var(--rose-deep);border-radius:8px;padding:0 8px;color:var(--rose-deep)}
table{border-collapse:collapse;width:100%;font-size:15px}
.tbl{overflow-x:auto;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:13px;color:var(--muted);font-weight:500}
td.n{font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap}
.wtbl td{white-space:normal}
.confirm{background:var(--badbg);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flag{display:inline-block;font-size:12px;background:var(--rose);color:var(--ink);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
</style>
<div class="wrap">
<header class="hdr">
  <div>
    <h1>六上社會期末練功房</h1>
    <p>期末考範圍：第三單元 迎向科技發展新挑戰、第四單元 生活中的規範與運作、第五單元 四角辯論會（3-1～5）</p>
  </div>
  <button class="btn" id="sfxBtn" aria-pressed="true">音效：開</button>
</header>

<div class="scope" id="scope"></div>

<nav class="tabs" role="tablist" aria-label="練習模式">
  <button role="tab" data-tab="cards" aria-selected="true">重點卡</button>
  <button role="tab" data-tab="mc" aria-selected="false">選擇</button>
  <button role="tab" data-tab="tf" aria-selected="false">是非</button>
  <button role="tab" data-tab="pair" aria-selected="false">配對</button>
  <button role="tab" data-tab="sort" aria-selected="false">分類</button>
  <button role="tab" data-tab="chart" aria-selected="false">圖表</button>
  <button role="tab" data-tab="write" aria-selected="false">寫國字</button>
  <button role="tab" data-tab="mem" aria-selected="false">翻牌</button>
  <button role="tab" data-tab="exam" aria-selected="false">模擬考</button>
  <button role="tab" data-tab="wrong" aria-selected="false">錯題</button>
</nav>

<section id="tab-cards"><div id="cardsArea"></div></section>
<section id="tab-mc" hidden><div id="mcArea"></div></section>
<section id="tab-tf" hidden><div id="tfArea"></div></section>
<section id="tab-pair" hidden><div id="pairArea"></div></section>
<section id="tab-sort" hidden><div id="sortArea"></div></section>
<section id="tab-chart" hidden><div id="chartArea"></div></section>
<section id="tab-write" hidden><div id="writeArea"></div></section>
<section id="tab-mem" hidden><div id="memArea"></div></section>
<section id="tab-exam" hidden><div id="examArea"></div></section>
<section id="tab-wrong" hidden><div id="wrongArea"></div></section>

<p class="hint">答對、答錯的紀錄只存在這台裝置的瀏覽器裡，換手機或清除瀏覽資料就會不見，也不會同步到別的裝置。題目與答案都來自老師的課堂筆記、重點整理小試身手、課文預習單和課本素養題組；圖表判讀的圖是自己畫的，標「自製練習圖」的數值為練習用。</p>
</div>
<script>
/* ===== KPDeal：選擇題正確答案位置平均分散（練習小站共用，版本 2026-11-10b）=====
   規則：每個位置（A/B/C/D…）出現次數一樣多，且正確答案不會連續 3 題在同一位置。
   用法（整段貼進 App 的 <script>，放在使用它的程式之前）：
     KPDeal.place(options, correct)   → 回傳新陣列：錯誤選項打亂，正確選項放到平均分散的位置
                                         correct 可以是「值」或「判斷函式 (item,index)=>boolean」
     KPDeal.pos(n)                    → 只要位置編號（0..n-1）時使用
     KPDeal.shuffle(arr)              → 一般打亂（回傳新陣列）
   注意：凡是「一題 + 數個選項 + 一個正解」的地方都要用 place，不要再用 shuffle 決定選項順序。
*/
var KPDeal=(function(){
  var decks={},last=[];
  function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function runOK(s){for(var i=2;i<s.length;i++)if(s[i]===s[i-1]&&s[i]===s[i-2])return false;return true}
  function pos(n){
    if(!(n>1))return 0;
    var d=decks[n];
    if(!d||!d.length){var base=[],k=0;for(var r=0;r<2;r++)for(var i=0;i<n;i++)base.push(i);
      do{d=sh(base);k++}while(!runOK(last.slice(-2).concat(d))&&k<300);decks[n]=d}
    var p=d.shift();
    if(last.length>=2&&last[last.length-1]===p&&last[last.length-2]===p){
      for(var i=0;i<d.length;i++)if(d[i]!==p){var q=d[i];d[i]=p;p=q;break}
      if(last[last.length-1]===p&&last[last.length-2]===p){var alt=(p+1+Math.floor(Math.random()*(n-1)))%n;d.push(p);p=alt}}
    last.push(p);if(last.length>4)last.shift();
    return p;
  }
  function place(arr,correct){
    var f=typeof correct==='function'?correct:function(x){return x===correct};
    var ci=-1;for(var i=0;i<arr.length;i++)if(f(arr[i],i)){ci=i;break}
    if(ci<0)return sh(arr);
    var c=arr[ci],w=sh(arr.filter(function(_,i){return i!==ci}));
    w.splice(pos(arr.length),0,c);
    return w;
  }
  return {place:place,pos:pos,shuffle:sh};
})();

/* ===== 圖表判讀（素養題）CHART =====
   圖都是自己用 SVG 畫的原創示意圖，不使用課本圖片。
   標「課本資料」的，數值直接取自課本素養題；
   標「自製練習圖」的，數值是為了練習判讀而設計，題目的答案都看圖就能得到。 */

/* 直立長條圖：values 單位可自訂 */
function barSVG(labels,values,title,unit,vmax,step){
  const W=680,H=310,L=56,R=20,T=30,B=58;
  const pw=W-L-R, ph=H-T-B, n=labels.length;
  const bw=pw/n*0.56;
  let bars='',xlab='',gy='',yl='';
  for(let v=0;v<=vmax;v+=step){
    const y=T+ph-v/vmax*ph;
    gy+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${L+pw}" y2="${y.toFixed(1)}" stroke="currentColor" stroke-width=".5" opacity=".22"/>`;
    yl+=`<text x="${L-7}" y="${(y+4).toFixed(1)}" font-size="11" text-anchor="end" fill="currentColor">${v}</text>`;
  }
  for(let i=0;i<n;i++){
    const cx=L+pw/n*(i+0.5), bh=values[i]/vmax*ph;
    bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${(T+ph-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="#cbb089" stroke="#8a6d43" stroke-width="1"/>`;
    bars+=`<text x="${cx.toFixed(1)}" y="${(T+ph-bh-6).toFixed(1)}" font-size="12" text-anchor="middle" fill="currentColor">${values[i]}</text>`;
    const parts=String(labels[i]).split('\n');
    parts.forEach((p,k)=>{xlab+=`<text x="${cx.toFixed(1)}" y="${H-B+18+k*15}" font-size="12" text-anchor="middle" fill="currentColor">${p}</text>`});
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${title}">
  <text x="${W/2}" y="18" font-size="14" text-anchor="middle" fill="currentColor">${title}</text>
  ${gy}${yl}
  <line x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}" stroke="currentColor" stroke-width="1"/>
  <line x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}" stroke="currentColor" stroke-width="1"/>
  <text x="${L-7}" y="${T-8}" font-size="11" text-anchor="end" fill="currentColor">${unit}</text>
  ${bars}${xlab}</svg>`;
}

/* 橫向比例條：每一項占全體的百分比 */
function shareSVG(labels,pcts,title){
  const W=680,H=250,L=112,R=58,T=30,B=22;
  const pw=W-L-R, ph=H-T-B, n=labels.length;
  const bh=Math.min(28,ph/n*0.62);
  const cols=['#cbb089','#9db8c9','#b9a2c4','#a8c0a0','#d79f8e'];
  let bars='',ylab='';
  for(let i=0;i<n;i++){
    const cy=T+ph/n*(i+0.5), bl=pcts[i]/50*pw;
    bars+=`<rect x="${L}" y="${(cy-bh/2).toFixed(1)}" width="${bl.toFixed(1)}" height="${bh.toFixed(1)}" fill="${cols[i%cols.length]}" stroke="#6b6b6b" stroke-width="1"/>`;
    bars+=`<text x="${(L+bl+7).toFixed(1)}" y="${(cy+4).toFixed(1)}" font-size="12" fill="currentColor">${pcts[i]}%</text>`;
    ylab+=`<text x="${L-8}" y="${(cy+4).toFixed(1)}" font-size="12" text-anchor="end" fill="currentColor">${labels[i]}</text>`;
  }
  let gy='';
  for(let v=0;v<=50;v+=10){
    const x=L+v/50*pw;
    gy+=`<line x1="${x.toFixed(1)}" y1="${T}" x2="${x.toFixed(1)}" y2="${T+ph}" stroke="currentColor" stroke-width=".5" opacity=".22"/>`;
    gy+=`<text x="${x.toFixed(1)}" y="${T+ph+16}" font-size="11" text-anchor="middle" fill="currentColor">${v}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${title}">
  <text x="${W/2}" y="18" font-size="14" text-anchor="middle" fill="currentColor">${title}</text>
  ${gy}
  <line x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}" stroke="currentColor" stroke-width="1"/>
  ${bars}${ylab}</svg>`;
}

let sfxOn=load('hw6sf-sfx',true),actx=null;
function tone(seq){
  if(!sfxOn)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    let t=actx.currentTime+0.01;
    seq.forEach(([f,d,type,v])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.16,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+0.03);t+=d*0.8});
  }catch(e){}
}

function rtStart(key){rt={key,t0:Date.now(),score:0,streak:0,best:0,ok:0,n:0,qT:Date.now(),onTimeout:null,last:'',lastTick:-1,done:false}}
function rtQ(onTimeout){if(!rt)return;rt.qT=Date.now();rt.onTimeout=(tmode==='cd'&&onTimeout)?onTimeout:null;rt.lastTick=-1;rtTick()}
function rtAns(right){
  if(!rt)return 0;rt.n++;rt.onTimeout=null;let pts=0;
  if(right){rt.ok++;rt.streak++;rt.best=Math.max(rt.best,rt.streak);const sec=(Date.now()-rt.qT)/1000;
    const sp=Math.round(50*Math.max(0,Math.min(1,1-(sec-3)/12))),cb=Math.min(5,rt.streak-1)*10;pts=100+sp+cb;rt.score+=pts;
    rt.last=`＋${pts}${sp?`（快答 ＋${sp}）`:''}${rt.streak>1?`・${rt.streak} 連對`:''}`}
  else{rt.streak=0;rt.last='連對中斷'}
  rtTick();return pts;
}
function rtTick(){
  if(!rt||rt.done)return;
  const now=Date.now(),el=(now-rt.t0)/1000;
  let cd='';
  if(rt.onTimeout){const left=QLIM-(now-rt.qT)/1000,c=Math.ceil(left);
    if(c<=3&&c>0&&c!==rt.lastTick){rt.lastTick=c;SFX.tick()}
    cd=`<div class="timebar${left<=5?' warn':''}"><i style="width:${Math.max(0,left/QLIM*100)}%"></i></div>`;

let ps=null;
function pairIntro(){
  const p=pool(PAIR,'pair');
  $('#pairArea').innerHTML=`<div class="qcard"><p class="qask">左邊點一下，再點右邊和它相配的那一個。配對成功會變綠色 ✓。</p>

function pairStart(idx){
  const g=PAIR[idx];
  rtStart('pair');
  /* 右邊可能有「多對一」（例如好幾個聚落都是因為交通方便），所以右欄先去掉重複，
     並記住每一張右卡還要被配幾次，全部配完才算完成。 */
  const rights=[];g.items.forEach(it=>{if(rights.indexOf(it[1])<0)rights.push(it[1])});
  const need={},tot={};
  rights.forEach((r,k)=>{need[k]=tot[k]=g.items.filter(it=>it[1]===r).length});
  ps={idx,cat:g.cat,g:g.g,
     L:shuffle(g.items.map((it,i)=>({t:it[0],i,r:rights.indexOf(it[1])}))),
     R:shuffle(rights.map((t,k)=>({t,i:k}))),
     need,tot,doneL:{},doneR:{},sel:null,n:g.items.length,ok:0,tries:0,fx:null};
  pairRender();rtQ(null);
}
function pairRender(){
  const cell=(side,o)=>{
    const done=side==='L'?ps.doneL[o.i]:ps.doneR[o.i];
    const sel=ps.sel&&ps.sel.side===side&&ps.sel.i===o.i;
    const fx=ps.fx&&ps.fx.side===side&&ps.fx.i===o.i;
    const more=side==='R'&&ps.tot[o.i]>1&&!done?`<span class="lesson" style="margin-left:6px">還要 ${ps.need[o.i]} 個</span>`:'';
    return `<button class="pitem${done?' done':''}${sel?' sel':''}${fx?' wrongflash':''}" data-s="${side}" data-i="${o.i}"${done?' disabled':''}>${esc(o.t)}${more}${done?' ✓':''}</button>`};
  $('#pairArea').innerHTML=`<div class="qcard"><div class="rhud"></div>
    <span class="prog">${esc(ps.cat)}　<span class="lesson">${GN[ps.g-1]}</span>　已配對 ${ps.ok} / ${ps.n}</span>
    <div class="pairwrap">
      <div class="pcol">${ps.L.map(o=>cell('L',o)).join('')}</div>
      <div class="pcol">${ps.R.map(o=>cell('R',o)).join('')}</div>
    </div>
    <div class="center"><button class="btn" id="pBack">換一組</button></div>
    <div id="pMsg"></div></div>`;
  $('#pBack').onclick=pairIntro;
  document.querySelectorAll('#pairArea .pitem').forEach(b=>b.onclick=()=>pairTap(b.dataset.s,+b.dataset.i));
}
function pairTap(side,i){
  if(side==='L'?ps.doneL[i]:ps.doneR[i])return;
  if(!ps.sel||ps.sel.side===side){ps.sel={side,i};ps.fx=null;SFX.flip();pairRender();return}
  const li=side==='L'?i:ps.sel.i,ri=side==='L'?ps.sel.i:i;
  ps.tries++;
  const lo=ps.L.filter(o=>o.i===li)[0];
  if(lo&&lo.r===ri){
    ps.doneL[li]=true;ps.need[ri]--;if(ps.need[ri]<=0)ps.doneR[ri]=true;
    ps.ok++;ps.sel=null;ps.fx=null;rtAns(true);SFX.match();
    pairRender();
    if(ps.ok===ps.n)return pairDone();
    rtQ(null);
  }else{
    rtAns(false);SFX.bad();addWrong('pair',ps.idx,ps.cat);
    ps.fx={side,i};const keep=ps.sel;ps.sel=null;pairRender();
    $('#pMsg').innerHTML=`<div class="fb bad">✗ 這兩個不是一對，再想一想。</div>`;
    setTimeout(()=>{if(ps&&ps.fx){ps.fx=null;pairRender();rtQ(null)}},700);
  }
}
function pairDone(){
  const perfect=ps.tries===ps.n;
  if(perfect)celebrate('配對全對！');else SFX.win();
  $('#pMsg').innerHTML=`<div class="done-box"><div class="score">${ps.ok} / ${ps.n}</div>${rtEnd('-'+ps.idx)}
    <p class="qask">${perfect?'一次都沒配錯，超強！':`配了 ${ps.tries} 次才全部完成，再練一次會更快。`}</p>
    <div class="center"><button class="btn primary" id="pAgain">再配一次</button><button class="btn" id="pBack2">換一組</button></div></div>`;
  $('#pAgain').onclick=()=>pairStart(ps.idx);$('#pBack2').onclick=pairIntro;
}

function sortQ(){

/* 字形相似度：把手寫和標準楷書都縮放到 64×64、細化成骨架，再算互相覆蓋的比例 */
const GZ=64;
function toGrid(src){
  const w=src.width,h=src.height,d=src.getContext('2d').getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>60){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)return null;
  const off=document.createElement('canvas');off.width=off.height=GZ;const o=off.getContext('2d');
  const bw=x1-x0+1,bh=y1-y0+1,s=(GZ-4)/Math.max(bw,bh),dw=bw*s,dh=bh*s;
  o.drawImage(src,x0,y0,bw,bh,(GZ-dw)/2,(GZ-dh)/2,dw,dh);
  const od=o.getImageData(0,0,GZ,GZ).data,g=new Uint8Array(GZ*GZ);
  for(let i=0;i<g.length;i++)g[i]=od[i*4+3]>60?1:0;
  return g;
}
function thin(g){
  const N=GZ,a=Uint8Array.from(g);let ch=true;
  const P=(x,y)=>(x<0||y<0||x>=N||y>=N)?0:a[y*N+x];
  while(ch){ch=false;
    for(const step of [0,1]){const del=[];
      for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(!a[y*N+x])continue;
        const p=[P(x,y-1),P(x+1,y-1),P(x+1,y),P(x+1,y+1),P(x,y+1),P(x-1,y+1),P(x-1,y),P(x-1,y-1)];
        const B=p.reduce((s,v)=>s+v,0);if(B<2||B>6)continue;
        let A=0;for(let k=0;k<8;k++)if(!p[k]&&p[(k+1)%8])A++;if(A!==1)continue;
        if(step===0){if(p[0]*p[2]*p[4]||p[2]*p[4]*p[6])continue}else{if(p[0]*p[2]*p[6]||p[0]*p[4]*p[6])continue}
        del.push(y*N+x)}
      if(del.length){ch=true;del.forEach(i=>a[i]=0)}}}

}
function dilate(g,r){const N=GZ,o=new Uint8Array(N*N);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(g[y*N+x])for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(dx*dx+dy*dy>r*r)continue;const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<N&&Y<N)o[Y*N+X]=1}
  return o}

  const n=padStrokes;

  try{
    if(n>0){

      const ref=document.createElement('canvas');ref.width=cv.width;ref.height=cv.height;
      const r=ref.getContext('2d');r.fillStyle='#000';r.textAlign='center';r.textBaseline='middle';
      r.font=`${Math.round(cv.width*0.82)}px "LXGW WenKai TC","BiauKai","DFKai-SB",serif`;r.fillText(ch,cv.width/2,cv.height/2);
      const U0=toGrid(cv),R0=toGrid(ref);

        let su=0,sr=0,pu=0,pr=0;for(let i=0;i<U.length;i++){if(U[i]){su++;if(dR[i])pu++}if(R[i]){sr++;if(dU[i])pr++}}

   <div class="combo" id="mCombo">${mm.msg}</div>
   <div class="mem${mm.n===8?' m16':''}">${mm.cards.map((c,i)=>`<button class="mc${c.open?' open':''}${c.done?' done':''}${fx&&fx.idx.includes(i)?' '+fx.cls:''}" data-i="${i}" aria-label="${c.open||c.done?'已翻開':'蓋著的牌'}">${c.open||c.done?memFace(c):''}</button>`).join('')}</div>
   <div class="center"><button class="btn" id="mNew">重新發牌</button><button class="btn" id="mBack">換關卡</button></div>
   <div id="mMsg"></div>`;
  memHud();
  $('#mNew').onclick=memDeal;$('#mBack').onclick=memIntro;
  document.querySelectorAll('.mc').forEach(b=>b.onclick=()=>memFlip(+b.dataset.i));
}
function memFlip(i){
  const c=mm.cards[i];if(mm.over||mm.lock||c.open||c.done)return;
  memStartClock();SFX.flip();
  c.open=true;mm.open.push(c);
  if(mm.open.length===2){mm.moves++;const [a,b]=mm.open,ia=mm.cards.indexOf(a),ib=mm.cards.indexOf(b);
    if(a.id===b.id&&a.t!==b.t){
      a.done=b.done=true;a.open=b.open=false;mm.done++;mm.open=[];mm.combo++;mm.maxCombo=Math.max(mm.maxCombo,mm.combo);
      const add=100+(mm.combo-1)*50;mm.score+=add;
      mm.msg=mm.combo>1?`${mm.combo} 連擊！＋${add}`:`配對成功 ＋${add}`;
      mm.combo>1?SFX.combo():SFX.match();
      memRender({idx:[ia,ib],cls:'pop'});
      if(mm.done===mm.n)memEnd(true);
    }else{
      mm.combo=0;mm.msg='';mm.lock=true;memRender({idx:[ia,ib],cls:'shake'});
      setTimeout(()=>{if(mm.over)return;a.open=b.open=false;mm.open=[];mm.lock=false;memRender()},900);
    }
  }else memRender();
}
function memEnd(win){
  mm.over=true;clearInterval(mm.timer);mm.timer=null;
  if(mm.start)mm.el=Math.min(mm.limit||1e9,(Date.now()-mm.start)/1000);
  let bonus=0;if(win&&mm.limit)bonus=Math.ceil(mm.limit-mm.el)*10;mm.score+=bonus;
  memHud();
  if(!win){SFX.lose();
    const left=mm.cards.filter(c=>!c.done&&c.t==='a').map(c=>c.x);
    mm.cards.forEach(c=>{if(!c.done)c.open=true});memRender();
    $('#mMsg').innerHTML=`<div class="done-box"><div class="score">時間到！</div><p class="qask">配了 ${mm.done} / ${mm.n} 對，得 ${mm.score} 分。還沒配到的：</p>
      <div class="termlist" style="text-align:left">${left.map(x=>`<div class="termcard"><div class="tt" style="font-size:16px">${esc(x.a)}</div><p class="td">${esc(x.b)}</p></div>`).join('')}</div>
      <button class="btn primary" id="mAgain">再挑戰一次</button></div>`;
    $('#mAgain').onclick=memDeal;return;
  }
  const stars=mm.moves<=mm.n+2?3:mm.moves<=Math.ceil(mm.n*1.7)?2:1;
  const key=memKey(),best=load(key,null);let rec=false;
  if(mm.limit){if(!best||mm.score>best.sc){save(key,{sc:mm.score});rec=true}}
  else{if(!best||mm.el<best.t){save(key,{t:mm.el,mv:mm.moves});rec=true}}
  setTimeout(()=>stars===3?celebrate('三顆星過關！'):SFX.win(),250);
  $('#mMsg').innerHTML=`<div class="done-box"><div class="stars" aria-label="${stars} 顆星">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div class="score">${mm.score} 分</div>
    <p class="qask">用了 ${mmt(mm.el)}、翻 ${mm.moves} 次、最高 ${mm.maxCombo} 連擊${bonus?`，剩餘時間加分 ＋${bonus}`:''}。</p>
    ${rec?'<p class="qask" style="color:var(--rose-deep)"><b>🏆 新紀錄！</b></p>':''}
    <div class="center"><button class="btn primary" id="mAgain">再玩一局</button><button class="btn" id="mBack2">換關卡</button></div></div>`;
  $('#mAgain').onclick=memDeal;$('#mBack2').onclick=memIntro;
}

/* ===== 模擬考（交卷後才公布答案與分數）===== */
let ex=null;
const EXPLAN=[['tf',15,2,'一、是非題'],['mc',14,2,'二、選擇題'],['pair',6,2,'三、配對題'],['sort',6,2,'四、分類題'],['chart',6,3,'五、圖表判讀']];
function examIntro(){
  if(ex&&ex.timer){clearInterval(ex.timer);ex.timer=null}
  const best=load('hw6sf-exambest',null);
  $('#examArea').innerHTML=`<div class="qcard"><p class="qask">模擬考要<b>全部作答完、按「交卷」之後</b>才會看到答案和分數，和真的考試一樣。</p>
    <div class="tblwrap"><table class="tbl"><tr><th>大題</th><th>題數</th><th>每題</th><th>小計</th></tr>
      ${EXPLAN.map(([k,n,p,t])=>`<tr><td>${t}</td><td class="n">${n}</td><td class="n">${p} 分</td><td class="n">${n*p} 分</td></tr>`).join('')}
      <tr><th>合計</th><th class="n">${EXPLAN.reduce((a,b)=>a+b[1],0)}</th><th></th><th class="n">${EXPLAN.reduce((a,b)=>a+b[1]*b[2],0)} 分</th></tr></table></div>
    <p class="hint">${best?`上次最好成績：${best.sc} 分（${best.d}）`:'還沒有考過，加油！'}</p>
    <p class="hint">題目會從範圍內隨機抽，所以每次考都不一樣。若上方只選了部分課次，題數可能會變少，總分也會跟著調整。</p>
    <button class="btn primary" id="exGo">開始模擬考</button></div>`;
  $('#exGo').onclick=examStart;
}
function examBuild(){
  const items=[];
  const addTF=n=>shuffle(pool(TF)).slice(0,n).forEach(x=>items.push({sec:0,kind:'tf',q:x.q,o:['○ 對','✗ 錯'],a:x.a?0:1,why:x.why,pt:2}));
  const addMC=n=>shuffle(pool(MC)).slice(0,n).forEach(x=>{const od=shuffle(x.o.map((t,i)=>({t,i})));
    items.push({sec:1,kind:'mc',q:x.q,o:od.map(o=>o.t),a:od.findIndex(o=>o.i===x.a),why:x.why,pt:2})});
  const addPair=n=>{
    const gs=pool(PAIR);if(!gs.length)return;
    const flat=[];gs.forEach(g=>g.items.forEach(it=>flat.push({l:it[0],r:it[1],cat:g.cat,gi:g._i})));
    shuffle(flat).slice(0,n).forEach(p=>{
      const same=PAIR[p.gi].items.map(it=>it[1]).filter(r=>r!==p.r);
      const other=flat.map(f=>f.r).filter(r=>r!==p.r&&!same.includes(r));
      const dis=shuffle(same).slice(0,3);while(dis.length<3&&other.length)dis.push(shuffle(other).shift());
      const od=shuffle([p.r].concat(dis.slice(0,3)));
      items.push({sec:2,kind:'pair',q:`${p.l}（${p.cat}）`,o:od,a:od.indexOf(p.r),why:`「${p.l}」要配「${p.r}」。`,pt:2})})};
  const addSort=n=>{
    const gs=pool(SORT);if(!gs.length)return;
    const flat=[];gs.forEach(g=>g.items.forEach(it=>flat.push({t:it[0],c:it[1],cats:g.cats,q:g.q})));
    shuffle(flat).slice(0,n).forEach(f=>items.push({sec:3,kind:'sort',q:`${f.q}　→　「${f.t}」`,o:f.cats.slice(),a:f.c,why:`「${f.t}」屬於「${f.cats[f.c]}」。`,pt:2}))};
  const addChart=n=>{
    const cs2=shuffle(pool(CHART));let left=n;
    for(const c of cs2){
      if(left<=0)break;
      const qs=shuffle(c.qs).slice(0,Math.min(5,left));left-=qs.length;
      qs.forEach((x,j)=>{const od=shuffle(x.o.map((t,i)=>({t,i})));
        items.push({sec:4,kind:'chart',q:x.q,o:od.map(o=>o.t),a:od.findIndex(o=>o.i===x.a),why:x.why,pt:3,
          chart:j===0?{svg:c.svg,note:c.note,title:c.title}:null})})}};
  addTF(15);addMC(14);addPair(6);addSort(6);addChart(6);
  items.forEach(it=>{if(it.kind==='tf')return;const od=KPDeal.place(it.o.map((t,i)=>({t,i})),o=>o.i===it.a);it.o=od.map(o=>o.t);it.a=od.findIndex(o=>o.i===it.a)});
  return items;
}
function examStart(){
  const items=examBuild();
  if(!items.length){$('#examArea').innerHTML=`<div class="qcard">${emptyMsg}<button class="btn" id="exB">回去</button></div>`;$('#exB').onclick=examIntro;return}
  ex={items,ans:{},t0:Date.now(),timer:null,over:false};
  examRender();
  ex.timer=setInterval(()=>{const e=$('#exClock');if(e)e.textContent=mmt((Date.now()-ex.t0)/1000)},500);
}
function examRender(){
  let html=`<div class="hud"><div>作答時間<b id="exClock">0:00</b></div><div>已答<b id="exDone">0</b></div><div>題數<b>${ex.items.length}</b></div><div>總分<b>${ex.items.reduce((a,b)=>a+b.pt,0)}</b></div></div>`;
  let sec=-1;
  ex.items.forEach((it,i)=>{
    if(it.sec!==sec){sec=it.sec;const p=EXPLAN[sec];html+=`<h3 class="groupHead">${p[3]}（每題 ${p[2]} 分）</h3>`}
    html+=`<div class="qcard" style="align-items:stretch">
      ${it.chart?`<div class="chartbox">${it.chart.svg()}</div><p class="srcnote">${esc(it.chart.note)}</p>`:''}
      <p class="qask left"><b>${i+1}.</b> ${esc(it.q)}</p>
      <div class="opts" data-q="${i}">${it.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="o0">${OL[k]}</span><span class="o1">${esc(o)}</span></button>`).join('')}</div></div>`;
  });
  html+=`<div class="qcard"><p class="hint" id="exWarn"></p><button class="btn primary" id="exSubmit">交卷，看分數</button>
    <button class="btn" id="exQuit">放棄這次模擬考</button></div>`;
  $('#examArea').innerHTML=html;
  document.querySelectorAll('#examArea .opts').forEach(g=>{
    const qi=+g.dataset.q;
    g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      ex.ans[qi]=+b.dataset.k;SFX.flip();
      g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel2',x===b));
      g.querySelectorAll('.opt').forEach(x=>x.style.borderColor=x===b?'var(--rose-deep)':'');
      $('#exDone').textContent=Object.keys(ex.ans).length;
    });
  });
  $('#exQuit').onclick=()=>{if(ex.timer)clearInterval(ex.timer);examIntro()};
  $('#exSubmit').onclick=()=>{
    const un=ex.items.map((_,i)=>i).filter(i=>!(i in ex.ans));
    if(un.length&&!ex.warned){ex.warned=true;$('#exWarn').innerHTML=`還有 ${un.length} 題沒作答（第 ${un.slice(0,8).map(i=>i+1).join('、')}${un.length>8?'…':''} 題）。要直接交卷就再按一次「交卷」。`;return}
    examGrade();
  };
}
function examGrade(){
  if(ex.timer){clearInterval(ex.timer);ex.timer=null}
  ex.over=true;
  const el=(Date.now()-ex.t0)/1000;
  let got=0,total=0;const secS=[0,0,0,0,0],secT=[0,0,0,0,0];
  ex.items.forEach((it,i)=>{total+=it.pt;secT[it.sec]+=it.pt;
    if(ex.ans[i]===it.a){got+=it.pt;secS[it.sec]+=it.pt}});
  const pct=total?Math.round(got/total*100):0;
  const best=load('hw6sf-exambest',null),rec=!best||got>best.sc;
  const d=new Date();const ds=`${d.getMonth()+1}/${d.getDate()}`;
  if(rec)save('hw6sf-exambest',{sc:got,d:ds});
  if(pct===100)celebrate('模擬考滿分！');else if(pct>=80)SFX.win();else SFX.lose();
  let html=`<div class="done-box"><div class="score">${got} / ${total} 分</div>
    <p class="qask">用了 ${mmt(el)}，正確率 ${pct}%${rec?'　<b style="color:var(--rose-deep)">新紀錄！</b>':`　最佳 ${best?best.sc:0} 分`}</p>
    <div class="tblwrap" style="width:100%"><table class="tbl"><tr><th>大題</th><th>得分</th><th>滿分</th></tr>
      ${EXPLAN.map((p,s)=>secT[s]?`<tr><td>${p[3]}</td><td class="n">${secS[s]}</td><td class="n">${secT[s]}</td></tr>`:'').join('')}</table></div>
    <div class="center"><button class="btn primary" id="exAgain">再考一次</button><button class="btn" id="exBack">回說明</button></div></div>
    <h3 class="groupHead">檢討：每一題的答案</h3>`;
  ex.items.forEach((it,i)=>{
    const my=ex.ans[i],right=my===it.a;
    html+=`<div class="qcard" style="align-items:stretch">
      <p class="qask left"><b>${i+1}.</b> ${esc(it.q)}</p>
      <div class="opts">${it.o.map((o,k)=>`<div class="opt${k===it.a?' ok':(k===my?' bad':'')}"><span class="o0">${OL[k]}</span><span class="o1">${esc(o)}</span>${k===it.a?'<span class="mark">✓ 正確</span>':(k===my?'<span class="mark">✗ 你選的</span>':'')}</div>`).join('')}</div>
      <div class="fb ${right?'ok':'bad'}">${right?'✓ 答對':my===undefined?'✗ 沒作答':'✗ 答錯'}　<b>${esc(it.why)}</b></div></div>`;
  });
  $('#examArea').innerHTML=html;
  $('#exAgain').onclick=examStart;$('#exBack').onclick=examIntro;
  window.scrollTo(0,0);
}

      setTimeout(function () {
        tries--;
        if (Math.random() < rate) {
          var dx = dxLoad(kid), r = dx[d[0]] || { n: 0, d: today(), s: 0, g: 0 }, first = !dx[d[0]], before = dxStage(r.n);
          r.n++; if (shiny) r.s = (r.s || 0) + 1; if (giant) r.g = (r.g || 0) + 1; dx[d[0]] = r; dxSave(kid, dx);
          var after = dxStage(r.n), have = DEX.filter(function (x) { return dx[x[0]]; }).length;
          var evo = after > before;
          pic.innerHTML = dxSvg(d[0], false, { stage: after, shiny: shiny, giant: giant });
          pic.className = "sd-pic sd-got";
          msg.innerHTML = "🎉 抓到了！" + (first ? "新夥伴加入圖鑑" : "又抓到一隻（第 " + r.n + " 隻）") +
            (evo ? "<br>✨ <b>" + d[1] + " 進化了！</b>現在是 " + "★★★".slice(0, after) + (after === 3 ? "（完全體）" : "") : (after < 3 ? "<br>再抓 " + ((after === 1 ? 3 : 6) - r.n) + " 隻就會進化" : "")) +
            (shiny ? "<br>✨ 閃亮版收集 +1" : "") + (giant ? "<br>🌟 巨大化收集 +1" : "") +
            "<br>圖鑑 <b>" + have + " / " + DEX.length + "</b>（回小站可以看）";
          th.remove(); sk.textContent = "好耶，繼續練習";
        } else if (tries > 0) {
          pic.className = "sd-pic sd-bob"; th.disabled = false;
          msg.innerHTML = "差一點！牠跳出來了，再試一次（還有 <b>" + tries + "</b> 次機會）";
        } else {
          pic.className = "sd-pic sd-run"; th.remove(); sk.textContent = "下次再來";
          msg.innerHTML = "牠跑走了… 下一輪答得好，還有機會再遇到！";
        }
      }, 900);
    };
  }
  var SiteDex = {
    list: DEX, rarity: RARE, svg: dxSvg, stage: dxStage, read: function (k) { return dxLoad(k || kid); },
    maybe: function (pct, n) {
      if (!kid || n === 0 || pct < 70) return;
      var now = Date.now(); if (now - dxLast < 5000) return; dxLast = now;
      var p = pct >= 100 ? 1 : pct >= 90 ? 0.6 : 0.35;
      if (Math.random() < p) setTimeout(function () { dxEncounter(pct); }, 1800);
    }
  };
  window.SiteDex = SiteDex;
  var oRE = SitePoints.roundEnd;
  SitePoints.roundEnd = function (pct, noPerfect, n) { oRE(pct, noPerfect); try { SiteDex.maybe(pct, n); } catch (e) {} };
  if (typeof window.rtEnd === "function" && !window.rtEnd.__sd) {
    var oEnd = window.rtEnd;
    window.rtEnd = function () {
      try { var r = window.rt || (typeof rt !== "undefined" ? rt : null); if (r && !r.done && r.n >= 1) SitePoints.roundEnd(Math.round(r.ok / r.n * 100), true, r.n >= 5 ? r.n : 0); } catch (e) {}
      return oEnd.apply(this, arguments);
    };
    window.rtEnd.__sd = true;
  }

  /* ---------------- styles ---------------- */
  var css = document.createElement("style");
  css.textContent =
    "#sh-btn{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:9000;" +
    "height:44px;padding:0 14px 0 10px;border-radius:999px;border:2px solid rgba(255,255,255,.9);background:#334155;color:#fff;font:700 16px/1 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;" +
    "box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;opacity:.9;touch-action:manipulation;white-space:nowrap}" +
    "#sh-btn:active{transform:scale(.94)}" +
    "#sh-mask{position:fixed;inset:0;z-index:9001;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px}" +
    "#sh-card{background:#fff;color:#0f172a;border-radius:18px;padding:20px 18px;max-width:340px;width:100%;text-align:center;" +
    "font:17px/1.5 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.3)}" +
    "#sh-card h3{margin:0 0 6px;font-size:20px}#sh-card p{margin:0 0 16px;color:#475569;font-size:15px}" +
    "#sh-card button{font:inherit;min-height:48px;border-radius:12px;border:0;padding:10px 16px;margin:4px;cursor:pointer}" +
    "#sh-go{background:#0284c7;color:#fff;font-weight:700}#sh-stay{background:#e2e8f0;color:#0f172a}" +
    "@media (prefers-color-scheme:dark){#sh-card{background:#1e293b;color:#e2e8f0}#sh-card p{color:#94a3b8}#sh-stay{background:#334155;color:#e2e8f0}}" +
    ".sp-say{font:14px/1 sans-serif;border:1px solid rgba(100,116,139,.45);background:transparent;border-radius:999px;padding:3px 7px;margin-left:6px;cursor:pointer;vertical-align:middle;color:inherit}" +
    ".sd-mask{position:fixed;inset:0;z-index:9003;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px}" +
    ".sd-card{background:#fff;color:#0f172a;border-radius:20px;padding:18px;max-width:340px;width:100%;text-align:center;font:16px/1.5 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.35)}" +
    ".sd-card h3{margin:0 0 4px;font-size:20px}.sd-tag{margin:0;font-weight:800}.sd-msg{color:#475569;margin:6px 0 12px}" +
    ".sd-pic{width:150px;height:150px;margin:6px auto}.sd-bob{animation:sdb 1.1s ease-in-out infinite}.sd-shake{animation:sds .3s linear 3}.sd-got{animation:sdg .6s ease-out}.sd-run{animation:sdr .8s ease-in forwards}" +
    "@keyframes sdb{50%{transform:translateY(-10px)}}@keyframes sds{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}@keyframes sdg{0%{transform:scale(.6)}70%{transform:scale(1.15)}}@keyframes sdr{to{transform:translateX(220px);opacity:0}}" +
    ".sd-card button{font:inherit;min-height:48px;border-radius:12px;border:0;padding:10px 16px;margin:4px;cursor:pointer}.sd-throw{background:#7c3aed;color:#fff;font-weight:800}.sd-skip{background:#e2e8f0;color:#0f172a}" +
    "@media (prefers-color-scheme:dark){.sd-card{background:#1e293b;color:#e2e8f0}.sd-msg{color:#94a3b8}.sd-skip{background:#334155;color:#e2e8f0}}" +
    "body{padding-bottom:max(76px,calc(64px + env(safe-area-inset-bottom)))!important}" +
    ".sp-toast{position:fixed;left:max(84px,calc(72px + env(safe-area-inset-left)));bottom:max(18px,calc(6px + env(safe-area-inset-bottom)));z-index:9002;" +
    "background:#f59e0b;color:#1f2937;font:800 16px/1.3 -apple-system,'PingFang TC',sans-serif;padding:8px 12px;border-radius:999px;" +
    "box-shadow:0 4px 12px rgba(0,0,0,.25);pointer-events:none;transition:opacity .4s,transform .4s}" +
    ".sp-toast.sp-big{left:50%;bottom:auto;top:30%;transform:translateX(-50%);text-align:center;font-size:18px;padding:14px 22px;border-radius:18px}" +
    ".sp-toast.sp-out{opacity:0;transform:translateY(-14px)}.sp-toast.sp-big.sp-out{transform:translate(-50%,-14px)}";
  document.head.appendChild(css);

  function qHtml() {
    var d = load(kid); qDay(d);
    return '<p style="text-align:left;font-size:14px;margin:-8px 0 14px">🎯 今天的任務：<br>' + QUESTS.map(function (q) {
      var v = Math.min(q.goal, d.q[q.f] || 0); return (d.q.done[q.id] ? "✅ " : "⬜ ") + q.name + "（" + v + "/" + q.goal + "）";
    }).join("<br>") + "</p>";
  }
  /* ---------------- 📚 小站 button ---------------- */
  if (!document.body || window.__siteHomeNoBtn) return;
  var b = document.createElement("button");
  b.id = "sh-btn"; b.type = "button";
  b.setAttribute("aria-label", "回到練習小站"); b.title = "回到練習小站";
  b.textContent = "📚 小站";
  b.addEventListener("click", function () {
    if (document.getElementById("sh-mask")) return;
    var m = document.createElement("div"); m.id = "sh-mask";
    var pts = kid ? "<p>目前集點：⭐ " + load(kid).points + " 點・🎒 圖鑑 " + DEX.filter(function (x) { return dxLoad(kid)[x[0]]; }).length + " / " + DEX.length + "</p>" + qHtml() : "";
    m.innerHTML = '<div id="sh-card" role="dialog" aria-modal="true"><h3>📚 回到練習小站？</h3>' +
      '<p>這一輪的作答不會保留（點數和最高分紀錄會留著）。</p>' + pts +
      '<button id="sh-go" type="button">回到練習小站</button><button id="sh-stay" type="button">繼續練習</button></div>';
    document.body.appendChild(m);
    function close() { m.remove(); }
    m.addEventListener("click", function (e) { if (e.target === m) close(); });

      try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
