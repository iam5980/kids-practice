<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>六上數學期末練功房</title>
<style>
html,body{margin:0}

/* 數學練功房：方格紙＋橘色主色；單欄、手機優先 */
:root{
  --paper:#fdfaf5; --card:#ffffff; --ink:#26211b; --muted:#6d6257;
  --sand:#f6e2c8; --orange:#c05d12; --blue:#1f5d8c; --blue-soft:#dceaf4;
  --line:#e7dac8; --ok:#2f7a45; --bad:#b3362f; --okbg:#e3f2e6; --badbg:#fbe7e5;
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"DIN Alternate","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16130f; --card:#211c16; --ink:#f0e8dd; --muted:#b0a494;
  --sand:#3a2d1d; --orange:#ffab5e; --blue:#8ec5ea; --blue-soft:#1d3346;
  --line:#3a3128; --ok:#7fd29a; --bad:#ff958c; --okbg:#1d3324; --badbg:#3a1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16130f; --card:#211c16; --ink:#f0e8dd; --muted:#b0a494;
  --sand:#3a2d1d; --orange:#ffab5e; --blue:#8ec5ea; --blue-soft:#1d3346;
  --line:#3a3128; --ok:#7fd29a; --bad:#ff958c; --okbg:#1d3324; --badbg:#3a1f1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header h1{font-family:var(--kai);font-size:clamp(25px,7vw,35px);margin:0;line-height:1.2;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.hdr{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.hdr>div{min-width:0}
.hdr #sfxBtn{flex:none;margin-top:6px}
.scope{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.chip.wrongchip[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.count{font-size:13px;color:var(--muted);margin-left:auto}
nav.tabs{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;background:var(--sand);padding:4px;border-radius:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
nav.tabs button{border:0;background:transparent;border-radius:9px;padding:8px 0;font-size:clamp(11px,3.2vw,15px);font-weight:500;white-space:nowrap}
@media (max-width:780px){nav.tabs{grid-template-columns:repeat(5,1fr)}}
nav.tabs button[aria-selected="true"]{background:var(--card);font-weight:700;color:var(--orange);box-shadow:0 1px 2px rgba(0,0,0,.12)}
section{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--orange);background:var(--card);color:var(--orange);border-radius:10px;padding:8px 16px;font-weight:700}
.btn.primary{background:var(--orange);color:#fff}
.btn.blue{border-color:var(--blue);color:var(--blue)}
.btn.blue.primary{background:var(--blue);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.hint{color:var(--muted);font-size:14px;margin:0}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* 題目卡 */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.qsrc{font-size:12px;color:var(--muted)}
.qtext{font-size:clamp(17px,4.6vw,21px);line-height:1.85;font-family:var(--kai)}
.qtext b{color:var(--orange)}
.step{font-size:14px;color:var(--blue);font-weight:700}
.opts{display:grid;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;text-align:left;font-size:18px;min-height:48px;display:flex;align-items:center;gap:10px}
.opt .lab{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sand);color:var(--orange);display:grid;place-items:center;font-size:14px;font-weight:700}
.opt.good{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt:disabled{cursor:default}
.mono{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.5px}

/* 數字鍵盤 */
.slots{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-size:24px}
.slot{min-width:84px;min-height:48px;border:2px dashed var(--line);border-radius:10px;padding:4px 10px;background:var(--paper);
  display:inline-flex;align-items:center;justify-content:center;font-family:var(--num);font-size:26px;font-variant-numeric:tabular-nums}
.slot.on{border-style:solid;border-color:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 25%,transparent)}
.slot .ph{color:var(--muted);font-size:15px;font-family:var(--sans)}
.slotu{font-size:17px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pad button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;min-height:54px;font-size:24px;font-family:var(--num);font-weight:700}
.pad button.fn{font-family:var(--sans);font-size:16px;color:var(--orange);border-color:var(--orange)}
.pad button.go{background:var(--orange);color:#fff;border-color:var(--orange);font-family:var(--sans);font-size:17px}
.pad button:active{transform:translateY(1px)}
.fb{border-radius:12px;padding:10px 14px;border:2px solid var(--line);font-size:16px}
.fb.y{border-color:var(--ok);background:var(--okbg)}
.fb.n{border-color:var(--bad);background:var(--badbg)}
.fb b{font-size:19px}

/* 直式 */
.vert{display:inline-grid;justify-items:end;font-family:var(--num);font-size:30px;line-height:1.35;background:var(--paper);
  border:1.5px solid var(--line);border-radius:10px;padding:10px 16px;font-variant-numeric:tabular-nums}
.vert .ln{border-top:2.5px solid var(--ink);width:100%;margin-top:2px}
.vert .op{justify-self:start;margin-right:10px}
.vrow{display:flex;gap:10px;align-items:baseline}

/* HUD */
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px}
.rhud{min-height:40px}
.rhud .rrow{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.rhud .rrow b{font-size:18px;color:var(--ink);font-family:var(--num);font-variant-numeric:tabular-nums}
.rhud .cdw b{color:var(--bad)}
.rhud .plus{min-height:1.3em;font-size:14px;color:var(--orange);font-weight:700}
.timebar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0}
.timebar i{display:block;height:100%;background:var(--orange);transition:width .25s linear}
.timebar.warn i{background:var(--bad)}
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.rsum div{font-size:12px;color:var(--muted)}
.rsum b{display:block;font-size:24px;color:var(--ink);font-family:var(--num);font-variant-numeric:tabular-nums}
.qask{text-align:center;margin:0;font-size:15px}
.stars{font-size:34px;letter-spacing:4px;color:var(--orange);text-align:center}

/* 重點卡 */
.kcard{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--orange);border-radius:12px;padding:12px 14px}
.kcard h3{margin:0 0 6px;font-family:var(--kai);font-size:19px;color:var(--orange)}
.kcard ul{margin:0;padding-left:1.2em}
.kcard li{margin:3px 0}
.cover{background:var(--sand);border-radius:6px;color:transparent;user-select:none;cursor:pointer;padding:0 6px}
.cover::after{content:"點我看";color:var(--orange);font-size:13px}
.cover *{visibility:hidden}

/* 圖 */
.figbox{display:grid;place-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px}
.figbox svg{max-width:100%;height:auto}
.fg-line{stroke:var(--ink);fill:none}
.fg-thin{stroke:var(--muted);fill:none}
.fg-txt{fill:var(--ink);font-family:var(--sans);font-size:13px}
.fg-acc{stroke:var(--orange);fill:none}
.fg-accf{fill:var(--orange)}
.fg-fill{fill:var(--orange);fill-opacity:.22;stroke:var(--orange)}
.fg-dot{fill:var(--ink)}
.fg-hi{fill:var(--orange)}

/* 翻牌配對 */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.mc{aspect-ratio:1/1.15;border:1.5px solid var(--line);background:var(--sand);border-radius:12px;font-size:clamp(13px,3.6vw,18px);
  display:grid;place-items:center;padding:4px;text-align:center;line-height:1.25;transition:transform .2s}
.mc.open,.mc.done{background:var(--card);border-color:var(--orange)}
.mc.done{opacity:.45}
.mc .fc{visibility:hidden}
.mc.open .fc,.mc.done .fc{visibility:visible}
.mc.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.08)}}
.combo{text-align:center;font-family:var(--kai);font-size:21px;color:var(--orange);min-height:1.4em}

/* 錯題本 */
.wlist{display:flex;flex-direction:column;gap:8px}
.witem{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.witem .wq{font-family:var(--kai);font-size:17px}
.witem .wa{color:var(--ok);font-weight:700}
.tagn{display:inline-block;background:var(--sand);color:var(--orange);border-radius:6px;padding:0 6px;font-size:12px;font-weight:700;margin-right:6px}
[hidden]{display:none!important}

/* 慶祝 */
#party{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 72%,transparent);padding:16px}
#party .pbox{background:var(--card);border:2px solid var(--orange);border-radius:18px;padding:18px 22px;text-align:center;max-width:92vw}
#party h2{margin:0 0 6px;font-family:var(--kai);font-size:26px;color:var(--orange)}
#party .crew{display:flex;gap:10px;justify-content:center;margin:8px 0}
#party .crew svg{width:92px;height:92px;animation:bop .7s ease-in-out infinite alternate}
#party .crew svg:nth-child(2){animation-delay:.35s}
@keyframes bop{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-12px) rotate(5deg)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:49;overflow:hidden}
.confetti i{position:absolute;width:9px;height:14px;opacity:.92;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(104vh) rotate(680deg)}}
@media (prefers-reduced-motion:reduce){#party .crew svg,.confetti i,.mc.pop{animation:none}}
.opt.sel{border-color:var(--orange);outline:2px solid var(--orange)}
.mtab{width:100%;border-collapse:collapse;margin:8px 0}.mtab th,.mtab td{border-bottom:1px solid var(--line);padding:6px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header class="hdr">
  <div>
    <h1>六上數學期末練功房</h1>
    <p>期末考範圍：第 5～8 單元　兩量關係與比・圓周長與扇形周長・放大、縮小與比例尺・怎樣解題</p>
  </div>
  <button class="chip" id="sfxBtn" type="button" aria-pressed="true">音效：開</button>
</header>

<div class="scope" id="scope"></div>

<nav class="tabs" role="tablist" aria-label="練習關卡">
  <button data-tab="key"   aria-selected="true">重點</button>
  <button data-tab="word"  aria-selected="false">應用題</button>
  <button data-tab="vert"  aria-selected="false">直式</button>
  <button data-tab="calc"  aria-selected="false">計算</button>
  <button data-tab="choice"aria-selected="false">選擇</button>
  <button data-tab="tf"    aria-selected="false">是非</button>
  <button data-tab="fig"   aria-selected="false">圖形</button>
  <button data-tab="mem"   aria-selected="false">配對</button>
  <button data-tab="mock"  aria-selected="false">模擬考</button>
  <button data-tab="wrong" aria-selected="false">錯題本</button>
</nav>

<section id="tab-key"></section>
<section id="tab-word"   hidden></section>
<section id="tab-vert"   hidden></section>
<section id="tab-calc"   hidden></section>
<section id="tab-choice" hidden></section>
<section id="tab-tf"     hidden></section>
<section id="tab-fig"    hidden></section>
<section id="tab-mem"    hidden></section>
<section id="tab-mock"   hidden></section>
<section id="tab-wrong"  hidden></section>

<p class="hint" style="border-top:1px solid var(--line);padding-top:10px">
  題型依翰林版六上數學第 5～8 單元的期末考卷、期末複習卷、單元卷整理，題目是改寫情境與數字的練習題，答案都由程式計算並驗算過。
  分數、錯題只存在這台裝置的瀏覽器裡，換裝置或清除瀏覽資料就會不見。
</p>
</div>
<div id="party" hidden></div>
<script>
/* =====================================================================
   study-kit.js — read-aloud, level map and 素養題組 for any practice app
   Canonical copy: github.com/iam5980/kids-practice/template/study-kit.js
   Version: 2026-10-25

   HOW TO USE: paste the whole file inside the page's main <script> (before
   the app code). Works for 中文部 apps and English apps alike. Call
   KidKit.injectCSS() once. Points/badges are reported to SitePoints
   (from site-home.js) automatically when it is on the page.

   1) READ-ALOUD
      KidKit.say(text, {lang: "zh-TW" | "en-US", rate, math: true})
      KidKit.sayBtn(text, label, opts)  -> HTML string for a 🔊 button
        Clicks are handled by one delegated listener (no inline onclick).
        math: true turns 6 1/2 → 6又2分之1, 13/2 → 2分之13, × → 乘 …
        Put the definition's 🔊 INSIDE the element that "考自己" covers,
        so it cannot be heard before the answer is revealed.

   2) LEVEL MAP (闖關地圖) — one level per lesson/unit, 1–3 stars, never locked
      var map = KidKit.levelMap(container, {
          key: "au-zh-science-1151-mid",          // unique per app
          levels: [{id: "L1", name: "第 1 課 …"}, …, {id: "LIT", name: "素養題組"}],
          lang: "zh-TW",
          onPlay: function (id) { … start that level … } });
      KidKit.levelResult(key, id, pct)   -> stars earned (call when a level ends)
      Stars: ≥90% ★★★, ≥70% ★★, ≥40% ★, else 0. Best result is kept.

   3) 素養題組 (reading-heavy question sets)
      KidKit.passageSet(container, {
          title: "颱風來了",
          source: "teacher" | "self",               // self → 「自編」 label
          passage: "長文…（可含 <b>、<br>、<img>）",
          figure: "data:image/…",                    // optional
          lang: "zh-TW",
          questions: [
            {type: "mc",    q: "…", choices: ["對的", "錯1", "錯2"], exp: "…"},  // first choice = correct
            {type: "tf",    q: "…", answer: true, exp: "…"},
            {type: "multi", q: "…（選出兩個）", choices: [...], correct: [0, 2], exp: "…"},
            {type: "order", q: "…", items: ["第1步", "第2步", "第3步"], exp: "…"},       // items in correct order
            {type: "open",  q: "…", a: "參考答案", points: [["蒸發"], ["凝結", "變成水滴"]], need: 2}
          ]}, {onDone: function (r) { … r = {correct, total, allOk} … }});
      Passage stays one tap away (📖 看文章), can be read aloud, questions are
      judged one by one, choices are shuffled, and the set reports to
      SitePoints.literacy() when finished.
   ===================================================================== */
var KidKit = (function () {
  "use strict";
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function sp(name) { return window.SitePoints && window.SitePoints[name] ? window.SitePoints : null; }

  /* ---------- read-aloud ---------- */
  var voices = [];
  function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch (e) {} }
  if (window.speechSynthesis) {
    loadVoices();
    try { speechSynthesis.addEventListener("voiceschanged", loadVoices); } catch (e) { speechSynthesis.onvoiceschanged = loadVoices; }
  }
  function pickVoice(lang) {
    var v = voices.length ? voices : (window.speechSynthesis ? speechSynthesis.getVoices() : []);
    var tests = lang.indexOf("zh") === 0
      ? [/zh[-_]TW/i, /zh[-_](HK|Hant)/i, /^(zh|cmn)/i]
      : [/^Samantha$/, /^Karen$/, /Google US English/, /en[-_]US/i, /^en/i];
    for (var t = 0; t < tests.length; t++) for (var i = 0; i < v.length; i++) {
      if (tests[t].test(lang.indexOf("zh") === 0 ? v[i].lang : (t < 3 ? v[i].name : v[i].lang))) return v[i];
    }
    return null;
  }
  function plain(html) { var d = document.createElement("div"); d.innerHTML = String(html); return (d.textContent || "").replace(/\s+/g, " ").trim(); }
  function mathSpeech(s) {
    return s
      .replace(/(\d+)\s+(\d+)\s*\/\s*(\d+)/g, "$1又$3分之$2")
      .replace(/(\d+)\s*\/\s*(\d+)/g, "$2分之$1")
      .replace(/[×xX＊*](?=\s*\d)/g, "乘").replace(/[÷]/g, "除以")
      .replace(/[＋+]/g, "加").replace(/(\d)\s*[－-]\s*(\d)/g, "$1減$2")
      .replace(/[＝=]/g, "等於").replace(/[→⇒]/g, "，變成").replace(/＞|>/g, "大於").replace(/＜|</g, "小於")
      .replace(/≒/g, "約等於").replace(/（例/g, "（例如");
  }
  function say(text, o) {
    o = o || {};
    var lang = o.lang || "zh-TW";
    if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined") { hint("這個瀏覽器不支援朗讀，請改用 Safari 或 Chrome。"); return; }
    var t = plain(text);
    if (o.math) t = mathSpeech(t);
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t);
      u.lang = lang; u.rate = o.rate || (lang.indexOf("zh") === 0 ? 0.85 : 0.88);
      var v = pickVoice(lang); if (v) u.voice = v;
      say._u = u;
      speechSynthesis.speak(u);
      if (!v && lang.indexOf("zh") === 0) hint("找不到中文語音，聲音可能不正確。可在 iPad 設定裡加裝「中文（台灣）」語音。");
    } catch (e) { hint("朗讀失敗，請再按一次。"); }
  }
  function hint(msg) {
    var t = document.getElementById("kk-hint");
    if (!t) { t = el("div"); t.id = "kk-hint"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.className = "kk-hint kk-show";
    clearTimeout(hint._t); hint._t = setTimeout(function () { t.className = "kk-hint"; }, 3200);
  }
  function sayBtn(text, label, o) {
    o = o || {};
    return '<button type="button" class="kk-say" data-kk-say="' + esc(plain(text)) + '"' +
      (o.lang ? ' data-kk-lang="' + esc(o.lang) + '"' : "") + (o.math ? ' data-kk-math="1"' : "") +
      ' aria-label="' + esc((label || "朗讀") + "：" + plain(text).slice(0, 40)) + '">🔊' + (label ? " " + esc(label) : "") + "</button>";
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-kk-say]");
    if (!b) return;
    e.stopPropagation(); e.preventDefault();
    say(b.getAttribute("data-kk-say"), { lang: b.getAttribute("data-kk-lang") || "zh-TW", math: b.hasAttribute("data-kk-math") });
  }, true);

  /* ---------- level map ---------- */
  function lvLoad(key) { try { return JSON.parse(localStorage.getItem("kk-lv-" + key) || "{}"); } catch (e) { return {}; } }
  function starsFor(pct) { return pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 40 ? 1 : 0; }
  function levelResult(key, id, pct) {

        var ord = shuffle(q.choices.map(function (c, k) { return k; })), sel = [];

        ord.forEach(function (orig) {

          var need = q.need || (pts.length <= 2 ? pts.length : Math.ceil(pts.length * 0.7));
          finishQ(pts.length ? hits >= need : false, esc(q.a) + '<div class="kk-exp">' + list.join("　") + "</div>", q.exp);
        });
        area.appendChild(ta); row.appendChild(mic); row.appendChild(c3); qbox.appendChild(row);
      }
      qbox.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
    function done() {
      var allOk = correct === qs.length;
      qbox.innerHTML = '<div class="kk-result"><div class="kk-big">' + T.res.replace("{c}", correct).replace("{t}", qs.length) + "</div>" +
        (allOk ? "<div>" + T.all + "</div>" : "") + "</div>";

      again.addEventListener("click", function () { passageSet(container, spec, o); });

      if (o.onDone) o.onDone({ correct: correct, total: qs.length, allOk: allOk });

  }

<script>
/* ===== KPDeal：選擇題正確答案位置平均分散（練習小站共用，版本 2026-11-10b）=====
   規則：每個位置（A/B/C/D…）出現次數一樣多，且正確答案不會連續 3 題在同一位置。
   用法（整段貼進 App 的 <script>，放在使用它的程式之前）：
     KPDeal.place(options, correct)   → 回傳新陣列：錯誤選項打亂，正確選項放到平均分散的位置
                                         correct 可以是「值」或「判斷函式 (item,index)=>boolean」
     KPDeal.pos(n)                    → 只要位置編號（0..n-1）時使用
     KPDeal.shuffle(arr)              → 一般打亂（回傳新陣列）
   注意：凡是「一題 + 數個選項 + 一個正解」的地方都要用 place，不要再用 shuffle 決定選項順序。
*/
var KPDeal=(function(){
  var decks={},last=[];
  function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function runOK(s){for(var i=2;i<s.length;i++)if(s[i]===s[i-1]&&s[i]===s[i-2])return false;return true}
  function pos(n){
    if(!(n>1))return 0;
    var d=decks[n];
    if(!d||!d.length){var base=[],k=0;for(var r=0;r<2;r++)for(var i=0;i<n;i++)base.push(i);
      do{d=sh(base);k++}while(!runOK(last.slice(-2).concat(d))&&k<300);decks[n]=d}
    var p=d.shift();
    if(last.length>=2&&last[last.length-1]===p&&last[last.length-2]===p){
      for(var i=0;i<d.length;i++)if(d[i]!==p){var q=d[i];d[i]=p;p=q;break}
      if(last[last.length-1]===p&&last[last.length-2]===p){var alt=(p+1+Math.floor(Math.random()*(n-1)))%n;d.push(p);p=alt}}
    last.push(p);if(last.length>4)last.shift();
    return p;
  }
  function place(arr,correct){
    var f=typeof correct==='function'?correct:function(x){return x===correct};
    var ci=-1;for(var i=0;i<arr.length;i++)if(f(arr[i],i)){ci=i;break}
    if(ci<0)return sh(arr);
    var c=arr[ci],w=sh(arr.filter(function(_,i){return i!==ci}));
    w.splice(pos(arr.length),0,c);
    return w;
  }

function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}

      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+0.03);t+=d*0.8});
  }catch(e){}
}

/* ===== 答案比對 ===== */
function fracVal(s){
  s=String(s).trim();
  let m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);            // 帶分數 1 2/5
  if(m){const d=+m[3];return d?(+m[1])+(+m[2])/d:null}
  m=s.match(/^(\d+)\s*\/\s*(\d+)$/);                        // 假分數 7/5
  if(m){const d=+m[2];return d?(+m[1])/d:null}
  m=s.match(/^-?\d+(\.\d+)?$/);
  return m?parseFloat(s):null;
}
function sameNum(a,b){
  const x=fracVal(a),y=fracVal(b);
  if(x===null||y===null)return false;
  return Math.abs(x-y)<1e-9;
}
function normTxt(s){
  return String(s==null?'':s).replace(/\s+/g,'').replace(/[，,、。．]/g,'')
    .replace(/[（(][^）)]*[）)]/g,'').replace(/[°度]/g,'度').toLowerCase();
}

/* ===== 把答案拆成填空格（決定要幾個數字框、各框的單位）===== */
function slotsOf(ans){
  const s=String(ans==null?'':ans).trim();
  // 比大小符號 → 三選一
  if(/^[<>=＜＞＝]$/.test(s))
    return{k:'pick',opts:['＜','＝','＞'],ans:{'<':'＜','>':'＞','=':'＝'}[s]||s};
  // 對錯 → 兩選一
  if(/^[OＯ○]$/.test(s))return{k:'pick',opts:['O','✗'],ans:'O'};
  if(/^[XＸ×✗]$/.test(s))return{k:'pick',opts:['O','✗'],ans:'✗'};
  // 複名數：公里＋公尺
  let m=s.match(/^(\d+)\s*公里\s*(\d+)\s*公尺$/);
  if(m)return{k:'num',parts:[{v:m[1],u:'公里'},{v:m[2],u:'公尺'}],frac:false};
  // 多個空格、用頓號分隔，而且每一格都是數字
  if(s.includes('、')){
    const ps=s.split('、').map(x=>x.trim());
    if(ps.length>1&&ps.every(x=>/^\d+(?:\.\d+)?$/.test(x)||/^\d+\s*\/\s*\d+$/.test(x)))
      return{k:'num',parts:ps.map((v,i)=>({v,u:'①②③④⑤⑥'[i]||''})),frac:ps.some(x=>x.includes('/')),dec:ps.some(x=>x.includes('.'))};
  }
  // 比 4：5
  m=s.match(/^(\d+(?:\.\d+)?)\s*[:：]\s*(\d+(?:\.\d+)?)$/);
  if(m)return{k:'num',parts:[{v:m[1],u:'：'},{v:m[2],u:''}],frac:false,dec:/\./.test(s)};
  // 分數＋單位 3/4 公斤、1 2/5 公升
  m=s.match(/^((?:\d+\s+)?\d+\s*\/\s*\d+)\s*([^\d\s\/]{1,4})$/);
  if(m)return{k:'num',parts:[{v:m[1],u:m[2]}],frac:true,mixed:/\s/.test(m[1].trim())};
  // 帶分數 1 2/5
  m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m)return{k:'num',parts:[{v:s,u:''}],frac:true,mixed:true};
  // 假分數 7/5
  m=s.match(/^(\d+)\s*\/\s*(\d+)$/);
  if(m)return{k:'num',parts:[{v:s,u:''}],frac:true};
  // 萬位記法：95 萬 2000 公斤、9萬2000、135 萬元
  m=s.match(/^(\d+)\s*萬\s*(\d+)?\s*([^\d\s]{0,3})$/);
  if(m)return m[2]
    ?{k:'num',parts:[{v:m[1],u:'萬'},{v:m[2],u:m[3]||''}],frac:false}
    :{k:'num',parts:[{v:m[1],u:'萬'+(m[3]||'')}],frac:false};
  // 單一個數（可帶單位）
  m=s.match(/^(\d+(?:\.\d+)?)\s*([^\d\s]{0,4})$/);
  if(m)return{k:'num',parts:[{v:m[1],u:m[2]||''}],frac:false,dec:m[1].includes('.')};
  return{k:'self'};                                        // 文字答案 → 看答案自評
}

/* ===== 數字鍵盤：點選作答，不叫出系統鍵盤 ===== */
function numPad(box, spec, done){
  // spec.parts = [{v,u}, ...]；spec.frac 代表要分數鍵
  const vals=spec.parts.map(()=>''),n=spec.parts.length;
  let cur=0,locked=false;
  const keys=['1','2','3','4','5','6','7','8','9','0'];
  function draw(){
    box.innerHTML=
      `<div class="slots">`+spec.parts.map((p,i)=>
        `<span class="slot${i===cur&&!locked?' on':''}" data-i="${i}">${vals[i]?esc(vals[i]):'<span class="ph">點數字</span>'}</span>`+
        (p.u?`<span class="slotu">${esc(p.u)}</span>`:'')).join('')+`</div>`+
      `<div class="pad">`+
        keys.slice(0,9).map(k=>`<button type="button" data-k="${k}">${k}</button>`).join('')+
        (spec.frac?`<button type="button" data-k="/">/</button>`:`<button type="button" class="fn" data-k="back">退格</button>`)+
        `<button type="button" data-k="0">0</button>`+(spec.dec?`<button type="button" data-k=".">.</button>`:'')+
        (spec.frac?`<button type="button" class="fn" data-k="sp">帶分數空格</button>`:`<button type="button" class="fn" data-k="clr">清除</button>`)+
        (spec.frac?`<button type="button" class="fn" data-k="back">退格</button>`:'')+
        `<button type="button" class="go" data-k="ok">確定</button>`+
      `</div>`;
  }
  box.addEventListener('click',e=>{
    if(locked)return;
    const sl=e.target.closest('.slot');
    if(sl){cur=+sl.dataset.i;draw();return}
    const b=e.target.closest('[data-k]');if(!b)return;
    const k=b.dataset.k;
    if(k==='ok'){
      if(vals.some(v=>!v)){toast('還有空格沒填喔');return}
      locked=true;box.querySelectorAll('button').forEach(x=>x.disabled=true);
      done(vals.slice());return;
    }
    SFX.key();
    if(k==='back')vals[cur]=vals[cur].slice(0,-1);
    else if(k==='clr')vals[cur]='';
    else if(k==='sp'){if(vals[cur]&&!vals[cur].endsWith(' '))vals[cur]+=' '}
    else if(vals[cur].length<9){
      vals[cur]+=k;
      if(n>1&&vals[cur].length>=String(spec.parts[cur].v).length&&cur<n-1)cur++;
    }
    draw();
  });
  draw();
}

/* --- 共用：答案輸入區（數字鍵盤，或文字答案就「看答案」自評） --- */
// padBox 放鍵盤、fbBox 放回饋。回傳 true 表示用鍵盤自動批改、false 表示自評。
function answerArea(padBox,fbBox,q,hintTxt){
  const spec=slotsOf(q.a);
  if(spec.k==='pick'){                                  // ＜＝＞ 或 O／✗ → 直接點選
    const ai=spec.opts.indexOf(spec.ans);
    padBox.innerHTML=`<div class="opts" id="pk">${spec.opts.map((o,i)=>
      `<button class="opt" type="button" data-i="${i}" style="justify-content:center"><span style="font-size:24px">${esc(o)}</span></button>`).join('')}</div>`;
    const go=i=>{
      padBox.querySelectorAll('#pk .opt').forEach((b,j)=>{b.disabled=true;if(j===ai)b.classList.add('good');else if(j===i)b.classList.add('bad')});
      fbBox.innerHTML=judge(q,i===ai,i>=0?spec.opts[i]:'（沒作答）',spec.ans)+nextBtn();wireNext();
    };
    rtQ(()=>go(-1));
    padBox.querySelectorAll('#pk .opt').forEach(b=>b.onclick=()=>go(+b.dataset.i));
    return false;
  }
  rtQ(null);
  if(spec.k==='self'){
    padBox.innerHTML=`<p class="hint" style="text-align:center">${hintTxt||'先在心裡（或紙上）想好答案，再按「看答案」。'}</p>
      <div class="bar" style="justify-content:center"><button class="btn primary" type="button" id="rv">看答案</button></div>`;
    padBox.querySelector('#rv').onclick=()=>{
      padBox.innerHTML=`<div class="fb">正確答案：<b>${esc(q.a)}</b></div>
        <div class="bar" style="justify-content:center">
          <button class="btn blue primary" type="button" id="y">我答對了</button>
          <button class="btn" type="button" id="n">我答錯了</button></div>`;
      const fin=ok=>{
        rtAns(ok);if(ok)SFX.ok();else{SFX.bad();addWrong(run.mod,q)}
        run.log.push({q,ok});
        fbBox.innerHTML=`<div class="fb ${ok?'y':'n'}">${ok?'✓ 很好！':'✗ 記起來，等一下在錯題本可以再練。'}</div>`+nextBtn();wireNext();
      };
      padBox.querySelector('#y').onclick=()=>fin(true);
      padBox.querySelector('#n').onclick=()=>fin(false);
    };
    return false;
  }
  numPad(padBox,spec,vals=>{
    const given=spec.parts.map((p,i)=>vals[i]+(p.u?' '+p.u:'')).join(' ').trim();
    const right=spec.parts.every((p,i)=>sameNum(vals[i],p.v));
    fbBox.innerHTML=judge(q,right,given)+nextBtn();wireNext();
  });
  return true;
}

function drawWord(sec,q,src){
  const opts=KPDeal.place([q.e].concat(q.d),q.e),ai=opts.indexOf(q.e);
  sec.innerHTML=qCard(`${src}

}

    <div class="bar" style="justify-content:center">

      <button class="btn" type="button" id="back">回關卡說明</button></div>
  </div>`;
  $('#again').onclick=()=>{const p=run.mod==='fig'?figPool():poolOf(DATA[run.mod],run.mod);

/* ===== 圖形：全部用 SVG 畫出來（線條清楚、放大不糊、深淺色都能看）===== */
const R2D=Math.PI/180;
const px=(cx,cy,r,deg)=>[cx+r*Math.cos(-deg*R2D),cy+r*Math.sin(-deg*R2D)];

function svgAngle(deg,withProt){
  const cx=160,cy=150,R=120,W=320,H=withProt?180:180;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="一個 ${withProt?'放在量角器上的':''}角">`;
  if(withProt){
    s+=`<path class="fg-thin" d="M ${cx-R} ${cy} A ${R} ${R} 0 0 1 ${cx+R} ${cy} Z" stroke-width="1.2"/>`;
    for(let d=0;d<=180;d+=5){
      const len=(d%10===0)?(d%30===0?16:11):6;
      const [x1,y1]=px(cx,cy,R,d),[x2,y2]=px(cx,cy,R-len,d);
      s+=`<line class="fg-thin" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke-width="${d%30===0?1.4:0.8}"/>`;
    }
    for(let d=0;d<=180;d+=30){
      const [tx,ty]=px(cx,cy,R-28,d);
      s+=`<text class="fg-txt" x="${tx.toFixed(1)}" y="${(ty+4).toFixed(1)}" text-anchor="middle" font-size="11">${d}</text>`;
    }
  }
  const [ax,ay]=px(cx,cy,R+8,0),[bx,by]=px(cx,cy,R+8,deg);
  s+=`<line class="fg-acc" x1="${cx}" y1="${cy}" x2="${ax.toFixed(1)}" y2="${ay.toFixed(1)}" stroke-width="3"/>`;
  s+=`<line class="fg-acc" x1="${cx}" y1="${cy}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}" stroke-width="3"/>`;
  const [m1x,m1y]=px(cx,cy,34,0),[m2x,m2y]=px(cx,cy,34,deg);
  s+=`<path class="fg-acc" d="M ${m1x.toFixed(1)} ${m1y.toFixed(1)} A 34 34 0 ${deg>180?1:0} 0 ${m2x.toFixed(1)} ${m2y.toFixed(1)}" stroke-width="2" stroke-dasharray="4 3"/>`;
  s+=`<circle class="fg-accf" cx="${cx}" cy="${cy}" r="4"/></svg>`;
  return s;
}

function svgAngle2(a,b){
  const cx=170,cy=165,R=130;
  let s=`<svg viewBox="0 0 340 185" role="img" aria-label="相鄰的兩個角 A 和 B">`;
  const arms=[0,a,a+b];
  arms.forEach(d=>{const [x,y]=px(cx,cy,R,d);
    s+=`<line class="fg-line" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke-width="2.5"/>`});
  const arc=(r,d0,d1,cls)=>{const [x1,y1]=px(cx,cy,r,d0),[x2,y2]=px(cx,cy,r,d1);
    return `<path class="${cls}" d="M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 0 0 ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke-width="2.5"/>`};
  s+=arc(44,0,a,'fg-acc')+arc(62,a,a+b,'fg-line');
  const [l1x,l1y]=px(cx,cy,30,a/2),[l2x,l2y]=px(cx,cy,80,a+b/2);
  s+=`<text class="fg-txt" x="${l1x.toFixed(1)}" y="${(l1y+4).toFixed(1)}" text-anchor="middle" font-weight="700" font-size="15">A</text>`;
  s+=`<text class="fg-txt" x="${l2x.toFixed(1)}" y="${(l2y+4).toFixed(1)}" text-anchor="middle" font-weight="700" font-size="15">B</text>`;
  s+=`<text class="fg-txt" x="${(cx+8)}" y="${cy+18}" font-size="12">∠A＝${a}° ∠B＝${b}°</text>`;
  s+=`<circle class="fg-dot" cx="${cx}" cy="${cy}" r="3.5"/></svg>`;
  return s;
}

function svgNumline(mx,den,dots,hi){
  const W=640,L=40,R=W-50,y=70,n=mx*den,step=(R-L)/n;
  let s=`<svg viewBox="0 0 ${W} 110" role="img" aria-label="0 到 ${mx} 的數線，每一格分成 ${den} 等分">`;
  s+=`<line class="fg-line" x1="${L}" y1="${y}" x2="${R+14}" y2="${y}" stroke-width="2.5"/>`;
  s+=`<path class="fg-line" d="M ${R+14} ${y} l -12 -6 v 12 z" fill="currentColor" stroke="none" style="fill:var(--ink)"/>`;
  for(let i=0;i<=n;i++){
    const x=L+i*step,big=i%den===0;
    s+=`<line class="fg-line" x1="${x.toFixed(1)}" y1="${y-(big?14:8)}" x2="${x.toFixed(1)}" y2="${y}" stroke-width="${big?2.5:1.5}"/>`;
    if(big)s+=`<text class="fg-txt" x="${x.toFixed(1)}" y="${y+22}" text-anchor="middle" font-size="16" font-weight="700">${i/den}</text>`;
  }
  dots.forEach((p,i)=>{
    const x=L+p*step,on=(hi===undefined||hi===i);
    s+=`<circle class="${on?'fg-hi':'fg-dot'}" cx="${x.toFixed(1)}" cy="${y}" r="${on?7:5.5}"/>`;
    s+=`<text class="fg-txt" x="${x.toFixed(1)}" y="${y-22}" text-anchor="middle" font-size="13" font-weight="700" ${on?'style="fill:var(--orange)"':''}>${i+1}</text>`;
  });
  s+=`</svg>`;return s;
}

function svgFrac(den,num){
  const whole=Math.ceil(num/den),per=Math.min(whole,4),R=46,gap=14;
  const W=per*(R*2+gap)+gap,H=R*2+34;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${whole} 個圓，每個平分成 ${den} 份，一共塗了 ${num} 份">`;
  let left=num;
  for(let c=0;c<per;c++){
    const cx=gap+R+c*(R*2+gap),cy=R+8;
    for(let k=0;k<den;k++){
      const d0=90-k*360/den,d1=90-(k+1)*360/den;
      const [x1,y1]=px(cx,cy,R,d0),[x2,y2]=px(cx,cy,R,d1);
      const big=(360/den)>180?1:0,on=left>0;
      s+=`<path class="${on?'fg-fill':'fg-line'}" d="M ${cx} ${cy} L ${x1.toFixed(1)} ${y1.toFixed(1)} A ${R} ${R} 0 ${big} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z" stroke-width="1.5"/>`;
      if(on)left--;
    }
  }
  s+=`</svg>`;return s;
}

function svgClock(from,steps,dir){
  const cx=100,cy=100,R=80;
  let s=`<svg viewBox="0 0 200 200" role="img" aria-label="鐘面，指針從 ${from} 轉動 ${steps} 大格">`;
  s+=`<circle class="fg-line" cx="${cx}" cy="${cy}" r="${R}" stroke-width="2.5"/>`;
  for(let h=1;h<=12;h++){
    const deg=90-h*30,[tx,ty]=px(cx,cy,R-16,deg);
    s+=`<text class="fg-txt" x="${tx.toFixed(1)}" y="${(ty+5).toFixed(1)}" text-anchor="middle" font-size="15" font-weight="700">${h}</text>`;
    const [a1,b1]=px(cx,cy,R,deg),[a2,b2]=px(cx,cy,R-6,deg);
    s+=`<line class="fg-line" x1="${a1.toFixed(1)}" y1="${b1.toFixed(1)}" x2="${a2.toFixed(1)}" y2="${b2.toFixed(1)}" stroke-width="1.5"/>`;
  }
  const d0=90-from*30,[hx,hy]=px(cx,cy,R-28,d0);
  s+=`<line class="fg-acc" x1="${cx}" y1="${cy}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke-width="4"/>`;
  const sweep=steps*30*(dir==='cw'?-1:1),d1=d0+sweep;
  const [p1x,p1y]=px(cx,cy,34,d0),[p2x,p2y]=px(cx,cy,34,d1);
  s+=`<path class="fg-acc" d="M ${p1x.toFixed(1)} ${p1y.toFixed(1)} A 34 34 0 ${Math.abs(sweep)>180?1:0} ${dir==='cw'?1:0} ${p2x.toFixed(1)} ${p2y.toFixed(1)}" stroke-width="2" stroke-dasharray="4 3"/>`;
  s+=`<circle class="fg-accf" cx="${cx}" cy="${cy}" r="4.5"/></svg>`;
  return s;
}

function svgRoute(f){
  const N={};f.nodes.forEach(n=>N[n.id]=n);
  let s=`<svg viewBox="0 0 430 260" role="img" aria-label="路線圖">`;
  f.edges.forEach(([a,b,d])=>{
    const p=N[a],q=N[b];
    s+=`<line class="fg-line" x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke-width="2.5"/>`;
    const mx=(p.x+q.x)/2,my=(p.y+q.y)/2;
    s+=`<rect x="${mx-30}" y="${my-11}" width="60" height="19" rx="5" style="fill:var(--paper);stroke:none"/>`;
    s+=`<text class="fg-txt" x="${mx}" y="${my+3}" text-anchor="middle" font-size="12" style="fill:var(--orange)" font-weight="700">${d}公尺</text>`;
  });
  f.nodes.forEach(n=>{
    s+=`<circle class="fg-dot" cx="${n.x}" cy="${n.y}" r="5"/>`;
    s+=`<text class="fg-txt" x="${n.x}" y="${n.y-11}" text-anchor="middle" font-size="13" font-weight="700">${n.n}</text>`;
  });
  s+=`</svg>`;return s;
}

function svgCirc(f){
  const R=70,cx=110,cy=95;
  let s=`<svg viewBox="0 0 220 190" role="img" aria-label="圓">`;
  s+=`<circle class="fg-fill" cx="${cx}" cy="${cy}" r="${R}" stroke-width="2.5"/><circle class="fg-dot" cx="${cx}" cy="${cy}" r="3.5"/>`;
  if(f.kind==='d'){s+=`<line class="fg-acc" x1="${cx-R}" y1="${cy}" x2="${cx+R}" y2="${cy}" stroke-width="3"/><text class="fg-txt" x="${cx}" y="${cy-8}" text-anchor="middle" font-weight="700">${esc(f.lab)}</text>`}
  else{s+=`<line class="fg-acc" x1="${cx}" y1="${cy}" x2="${cx+R}" y2="${cy}" stroke-width="3"/><text class="fg-txt" x="${cx+R/2}" y="${cy-8}" text-anchor="middle" font-weight="700">${esc(f.lab)}</text>`}
  return s+`</svg>`;
}
function svgSect(f){
  const R=80,cx=110,cy=f.deg>180?100:130,a0=f.deg>180?-45:90-f.deg/2,a1=a0+f.deg;
  const [x0,y0]=px(cx,cy,R,a0),[x1,y1]=px(cx,cy,R,a1),big=f.deg>180?1:0;
  let s=`<svg viewBox="0 0 220 ${f.deg>180?205:150}" role="img" aria-label="扇形">`;
  s+=`<path class="fg-fill" d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${big} 0 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" stroke-width="2.5"/>`;
  const [lx,ly]=px(cx,cy,R*0.62,a0);
  s+=`<text class="fg-txt" x="${(lx+(f.deg>180?0:16)).toFixed(1)}" y="${(ly+(f.deg>180?16:4)).toFixed(1)}" text-anchor="start" font-weight="700">${f.r} cm</text>`;
  const [ax,ay]=px(cx,cy,36,a0+f.deg/2);
  s+=`<path class="fg-acc" d="M${px(cx,cy,16,a0).map(v=>v.toFixed(1)).join(' ')} A16 16 0 ${big} 0 ${px(cx,cy,16,a1).map(v=>v.toFixed(1)).join(' ')}" stroke-width="2"/>`;
  s+=`<text class="fg-txt" x="${ax.toFixed(1)}" y="${(ay+5).toFixed(1)}" text-anchor="middle" font-size="12" style="fill:var(--orange)" font-weight="700">${f.deg}°</text>`;
  return s+`</svg>`;
}
function svgSemi(f){
  let s=`<svg viewBox="0 0 220 130" role="img" aria-label="半圓">`;
  s+=`<path class="fg-fill" d="M30 105 A80 80 0 0 1 190 105 Z" stroke-width="2.5"/>`;
  s+=`<text class="fg-txt" x="110" y="123" text-anchor="middle" font-weight="700">${f.d} cm</text>`;
  return s+`</svg>`;
}
function svgSqSemi(f){
  const x=50,y=20,w=120;
  let s=`<svg viewBox="0 0 220 165" role="img" aria-label="正方形挖掉兩個半圓">`;
  s+=`<path class="fg-fill" d="M${x} ${y} A${w/2} ${w/2} 0 0 0 ${x+w} ${y} L${x+w} ${y+w} A${w/2} ${w/2} 0 0 0 ${x} ${y+w} Z" stroke-width="2.5"/>`;
  s+=`<line class="fg-thin" x1="${x}" y1="${y}" x2="${x+w}" y2="${y}" stroke-dasharray="4 4"/><line class="fg-thin" x1="${x}" y1="${y+w}" x2="${x+w}" y2="${y+w}" stroke-dasharray="4 4"/>`;
  s+=`<text class="fg-txt" x="${x-6}" y="${y+w/2+4}" text-anchor="end" font-weight="700">${f.a}</text><text class="fg-txt" x="${x+w/2}" y="${y+w+20}" text-anchor="middle">（單位：公分）</text>`;
  return s+`</svg>`;
}
function svgBar(f){
  const u=50;let s=`<svg viewBox="0 0 ${40+u*f.cm+60} 70" role="img" aria-label="線段比例尺">`;
  s+=`<line class="fg-line" x1="20" y1="40" x2="${20+u*f.cm}" y2="40" stroke-width="3"/>`;
  for(let i=0;i<=f.cm;i++)s+=`<line class="fg-line" x1="${20+u*i}" y1="32" x2="${20+u*i}" y2="48" stroke-width="2"/>`;
  s+=`<text class="fg-txt" x="20" y="24" text-anchor="middle">0</text><text class="fg-txt" x="${20+u*f.cm}" y="24" text-anchor="middle" font-weight="700">${esc(f.lab)}</text>`;
  s+=`<text class="fg-txt" x="${20+u*f.cm/2}" y="64" text-anchor="middle" font-size="11" style="fill:var(--muted)">（線段長 ${f.cm} 公分）</text>`;
  return s+`</svg>`;
}
function svgEnl(f){
  const g=14,W=f.w*g,H=f.h*g,W2=W*f.k,H2=H*f.k,top=10,vw=Math.max(240,W+W2+70);
  let s=`<svg viewBox="0 0 ${vw} ${H2+40}" role="img" aria-label="原圖和放大圖">`;
  s+=`<rect class="fg-fill" x="10" y="${top+H2-H}" width="${W}" height="${H}" stroke-width="2"/>`;
  s+=`<text class="fg-txt" x="${10+W/2}" y="${top+H2+18}" text-anchor="middle">原圖</text>`;
  s+=`<rect class="fg-fill" x="${W+40}" y="${top}" width="${W2}" height="${H2}" stroke-width="2"/>`;
  s+=`<text class="fg-txt" x="${W+40+W2/2}" y="${top+H2+18}" text-anchor="middle">${f.k} 倍放大圖</text>`;
  return s+`</svg>`;
}
function svgTrees(f){
  const n=f.n,gap=40,w=40+gap*(n-1);
  let s=`<svg viewBox="0 0 ${w+20} 90" role="img" aria-label="路邊種樹">`;
  s+=`<line class="fg-thin" x1="10" y1="62" x2="${w+10}" y2="62" stroke-width="3"/>`;
  for(let i=0;i<n;i++){const x=30+gap*i;s+=`<line class="fg-line" x1="${x}" y1="62" x2="${x}" y2="40" stroke-width="3"/><circle cx="${x}" cy="32" r="11" style="fill:var(--ok);fill-opacity:.55;stroke:var(--ok)"/>`;
    if(i<n-1)s+=`<text class="fg-txt" x="${x+gap/2}" y="80" text-anchor="middle" font-size="11">${f.gap}m</text>`}
  return s+`</svg>`;
}
function figSVG(f){
  if(f.t==='circ')return svgCirc(f);
  if(f.t==='sect')return svgSect(f);
  if(f.t==='semi')return svgSemi(f);
  if(f.t==='sqsemi')return svgSqSemi(f);
  if(f.t==='bar')return svgBar(f);
  if(f.t==='enl')return svgEnl(f);
  if(f.t==='trees')return svgTrees(f);
  if(f.t==='ang')return svgAngle(f.deg,!!f.prot);
  if(f.t==='ang2')return svgAngle2(f.a,f.b);
  if(f.t==='nl')return svgNumline(f.max,f.den,f.dots,f.hi);
  if(f.t==='frac')return svgFrac(f.den,f.num);
  if(f.t==='clock')return svgClock(f.from,f.steps,f.dir);
  if(f.t==='route')return svgRoute(f);
  return '';
}

function memFlip(i){
  const c=mm.cards[i];if(mm.over||mm.lock||c.open||c.done)return;

  mm.moves++;const [a,b]=mm.open,ia=mm.cards.indexOf(a),ib=mm.cards.indexOf(b);

      <p class="qask">${bonus?`剩餘時間加分 ＋${bonus}。`:''}${rec?'<b style="color:var(--orange)">新紀錄！</b>':`最佳紀錄：${best?(mm.limit?best.sc+' 分':mmt(best.t)):'—'}`}</p>

let mk=null;
function parseAns(a){
  const s=String(a).trim();
  let m=s.match(/^1：(\d+)$/);if(m)return{t:'ratio',v:+m[1],u:''};
  m=s.match(/^((?:\d+\s+)?\d+\s*\/\s*\d+|\d+(?:\.\d+)?)\s*(.*)$/);
  if(m){const v=fracVal(m[1]);if(v!==null)return{t:m[1].includes('/')?'frac':'num',v,raw:m[1],u:m[2]||''}}
  return null;
}
const fmtN=v=>{const r=Math.round(v*100)/100;return String(r)};
function numDistract(a){
  const p=parseAns(a);if(!p)return null;
  const out=new Set(),add=x=>{if(x&&x!==a)out.add(x)};
  if(p.t==='ratio'){[p.v*10,p.v/10,p.v*2,p.v/2,p.v+1000].forEach(v=>{if(v>=1&&Number.isInteger(v))add('1：'+v)})}
  else if(p.t==='frac'){
    const m=p.raw.match(/(\d+)\s*\/\s*(\d+)$/);

  }else{

    const cands=[v*2,v/2,v+10,v-10,v+1,v-1,v*10,v/10,v+0.5*Math.round(v/10+1),v*1.5].filter(x=>x>0&&Math.abs(x-v)>1e-9);

    ".sp-say{font:14px/1 sans-serif;border:1px solid rgba(100,116,139,.45);background:transparent;border-radius:999px;padding:3px 7px;margin-left:6px;cursor:pointer;vertical-align:middle;color:inherit}" +

    ".sd-card{background:#fff;color:#0f172a;border-radius:20px;padding:18px;max-width:340px;width:100%;text-align:center;font:16px/1.5 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.35)}" +
    ".sd-card h3{margin:0 0 4px;font-size:20px}.sd-tag{margin:0;font-weight:800}.sd-msg{color:#475569;margin:6px 0 12px}" +
    ".sd-pic{width:150px;height:150px;margin:6px auto}.sd-bob{animation:sdb 1.1s ease-in-out infinite}.sd-shake{animation:sds .3s linear 3}.sd-got{animation:sdg .6s ease-out}.sd-run{animation:sdr .8s ease-in forwards}" +
    "@keyframes sdb{50%{transform:translateY(-10px)}}@keyframes sds{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}@keyframes sdg{0%{transform:scale(.6)}70%{transform:scale(1.15)}}@keyframes sdr{to{transform:translateX(220px);opacity:0}}" +

  document.head.appendChild(css);

  function qHtml() {
    var d = load(kid); qDay(d);
    return '<p style="text-align:left;font-size:14px;margin:-8px 0 14px">🎯 今天的任務：<br>' + QUESTS.map(function (q) {
      var v = Math.min(q.goal, d.q[q.f] || 0); return (d.q.done[q.id] ? "✅ " : "⬜ ") + q.name + "（" + v + "/" + q.goal + "）";
    }).join("<br>") + "</p>";
  }
  /* ---------------- 📚 小站 button ---------------- */
  if (!document.body || window.__siteHomeNoBtn) return;
  var b = document.createElement("button");
  b.id = "sh-btn"; b.type = "button";
  b.setAttribute("aria-label", "回到練習小站"); b.title = "回到練習小站";
  b.textContent = "📚 小站";
  b.addEventListener("click", function () {
    if (document.getElementById("sh-mask")) return;
    var m = document.createElement("div"); m.id = "sh-mask";
    var pts = kid ? "<p>目前集點：⭐ " + load(kid).points + " 點・🎒 圖鑑 " + DEX.filter(function (x) { return dxLoad(kid)[x[0]]; }).length + " / " + DEX.length + "</p>" + qHtml() : "";
    m.innerHTML = '<div id="sh-card" role="dialog" aria-modal="true"><h3>📚 回到練習小站？</h3>' +
      '<p>這一輪的作答不會保留（點數和最高分紀錄會留著）。</p>' + pts +
      '<button id="sh-go" type="button">回到練習小站</button><button id="sh-stay" type="button">繼續練習</button></div>';
    document.body.appendChild(m);
    function close() { m.remove(); }
    m.addEventListener("click", function (e) { if (e.target === m) close(); });
    document.getElementById("sh-stay").addEventListener("click", close);
    document.getElementById("sh-go").addEventListener("click", function () {
      try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
      location.href = homeUrl();
    });
    document.getElementById("sh-go").focus();
  });
  document.body.appendChild(b);
})();
